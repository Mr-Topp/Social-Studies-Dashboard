<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Social Studies</title>
<style>
:root{--navy:#19364b;--red:#a33d36;--paper:#f4efe4;--card:#fffdf8;--ink:#22313b;--muted:#536571;--line:#d8cfbd;--green:#1f5e2c;--greenbg:#dff0e2;--yellow:#7a5a00;--yellowbg:#fff1c9;--redbg:#f8dcd8;--blue:#1c3f78;--bluebg:#dbe8fb}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.5 system-ui,Segoe UI,Arial,sans-serif}
main{max-width:980px;margin:auto;padding:22px 16px 50px}
button,.btn{font:800 1rem system-ui,Segoe UI,Arial,sans-serif;border:0;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block;min-height:44px}
a.btn{display:inline-flex;align-items:center;justify-content:center}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #2b6cb0;outline-offset:2px}
.eyebrow{color:var(--red);font-weight:900;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;margin:0 0 2px}
h1{font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.1;color:var(--navy);margin:0}
h2{font-size:1.1rem;color:var(--navy);margin:0 0 8px}
.muted{color:var(--muted)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
/* --- picking class and name --- */
.pick{max-width:820px;margin:20px auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 26px 20px;box-shadow:0 6px 24px #19364b0d}
.pick h1{margin:2px 0 6px}
.pick p{margin:0 0 18px}
.pick .sub{color:var(--muted);font-size:1.05rem}
.pick .backrow{margin:18px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.choice{background:#fff;color:var(--navy);border:2px solid var(--line);padding:16px 14px;text-align:left;font-size:1.1rem}
.choice:hover{border-color:var(--navy)}
.choice small{display:block;font:600 .85rem system-ui;color:var(--muted);margin-top:2px}
.names{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.names .choice{text-align:center;padding:12px 8px;font-size:1.02rem;font-weight:700;border-width:1px}
.names .choice:hover{background:#f6f2ea}
.typerow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.typerow input{flex:1 1 240px;font:inherit;padding:11px 12px;border:2px solid var(--line);border-radius:10px}
.go{background:var(--navy);color:#fff;padding:11px 18px}
.light{background:#e7e0d1;color:var(--navy);padding:9px 14px}
.linkbtn{background:none;color:var(--navy);text-decoration:underline;padding:4px 2px;font-weight:700}
h1:focus{outline:none}
.err{color:var(--red);font-weight:700;margin:8px 0 0}.err:empty{display:none}
/* --- top bar --- */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.top .who{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tab{background:#e7e0d1;color:var(--navy);padding:9px 14px}
.tab[aria-selected=true]{background:var(--navy);color:#fff}
.addclass{background:none;border:2px dashed var(--line);color:var(--muted);padding:7px 12px}
.testbar{background:#dbe8fb;color:#1c3f78;border:1px solid #b6cdf0;border-radius:12px;padding:9px 14px;margin:0 0 14px;font-size:.95rem}
.testbar b{color:#1c3f78}.testbar .linkbtn{color:#1c3f78;font-size:.95rem}
.previewrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.pv{background:#fff;color:#1c3f78;border:1px solid #b6cdf0;padding:6px 12px;font-size:.92rem}
.pv[aria-pressed=true]{background:#1c3f78;color:#fff;border-color:#1c3f78}
.pvnote{margin:8px 0 0;font-weight:700}
.es{background:#1e4f8a;color:#fff;padding:9px 14px}
/* --- next up --- */
.next{background:var(--navy);color:#fff;border-radius:16px;padding:18px 20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.next .lbl{font-size:.8rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#ffd9a8}
.next .what{font-size:1.35rem;font-weight:800;line-height:1.2;margin:2px 0}
.next .why{color:#d6e2ea;font-size:.95rem}
.next .btn{background:#ffd9a8;color:var(--navy);padding:13px 22px;font-size:1.1rem}
.next.done{background:var(--greenbg);color:var(--green)}
.next.done .lbl{color:var(--green)}.next.done .why{color:var(--green)}
.next.done .btn{background:var(--green);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:1.3rem;color:var(--navy);line-height:1.2}
.bar{height:10px;background:#e7e0d1;border-radius:99px;overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:var(--green);border-radius:99px}
/* --- today's learning goal (Fynn's scale docs) --- */
.goalcard{background:#fff;border:2px solid var(--navy);border-radius:16px;padding:14px 18px;margin:0 0 10px}
.goalcard h2{font-size:1.2rem;margin:0 0 6px;color:var(--navy)}.goalcard .gday{font-size:.9rem;color:var(--muted);font-weight:700}
.goalhd{margin:0;font-weight:800}
.goallist{margin:4px 0 0;padding-left:22px}.goallist li{margin:2px 0;line-height:1.35}
.goal3{margin:10px 0 0;padding:8px 10px;background:#eef7f0;border-radius:10px;line-height:1.35}
.lv3{display:inline-block;background:#1f5e2c;color:#fff;border-radius:6px;padding:0 7px;font-size:.8rem;font-weight:900;margin-right:4px}
.dgoal{font-size:.92rem;margin:4px 0 6px;opacity:.95}.dgoal .goallist{margin-top:2px}
.slidebtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sbtn{background:var(--navy);color:#fff;padding:10px 18px}
.qrow.sliderow{background:#eef3f7}
/* --- status card: missing or all caught up --- */
.status{border-radius:16px;padding:18px 20px;margin:0 0 10px}
.status h2{font-size:1.45rem;margin:0 0 2px}
.status>p{margin:0 0 12px}.status>p:last-child{margin-bottom:0}
.status.miss{background:var(--navy);color:#fff}.status.miss h2{color:#fff}.status.miss>p{color:#d6e2ea}
.status.done{background:var(--greenbg);color:var(--green)}.status.done h2{color:var(--green)}
.qrow{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#fff;color:var(--ink);border-radius:12px;padding:10px 12px;margin-top:8px}
.qrow .qday{display:block;font-size:.85rem;font-weight:900;color:var(--red);text-transform:uppercase;letter-spacing:.05em}
.qrow .qtitle{display:block;font-weight:800;color:var(--navy);line-height:1.25}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.readbtn{background:#ffffff26;color:inherit;border:2px solid currentColor;padding:6px 14px;font-size:.95rem;min-height:40px}
.status.done .readbtn{background:#fff}
.dgroup{background:#ffffff14;border-radius:14px;padding:10px 12px 12px;margin-top:12px}
.dhead{font-size:1.05rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:#ffd9a8}
.drecap{margin:2px 0 4px;color:#e8eff4;font-size:.98rem;line-height:1.4}
.qrow .qkind{display:block;font-size:.88rem;color:var(--muted);font-weight:700}
.qrow.paperrow{background:#fff8ec}
.getit{background:#efe9dc;color:#5a4b2c;border-radius:8px;padding:6px 10px;font-weight:800;font-size:.92rem;text-align:center}
.qgo.soft{background:#e7e0d1!important;color:var(--navy)!important}
.qrow .qrecap{display:block;font-size:.88rem;color:var(--muted);margin-top:2px;line-height:1.35}
.testcard{background:var(--yellowbg);color:var(--yellow);border:1px solid #ecd58f;border-radius:16px;padding:16px 20px;margin:0 0 12px}
.testcard h2{color:#5c4300;font-size:1.25rem;margin:0 0 4px}.testcard p{margin:6px 0 0}
.qgo{background:var(--navy);color:#fff;padding:10px 18px;white-space:nowrap}
.status.miss .qgo{background:#ffd9a8;color:var(--navy)}
.qlabel{margin:14px 0 0;font-size:.8rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.testline{margin:4px 2px 16px;color:var(--muted)}
.testline b{color:var(--navy)}
details.allwork{margin-top:6px}
details.allwork>summary{cursor:pointer;font-weight:800;color:var(--navy);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.allwork[open]>summary{margin-bottom:10px}
.unitflat h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 2px 8px;font-size:1.05rem;color:var(--navy)}
.unitflat h3 .now{background:var(--red);color:#fff;font-size:.72rem;letter-spacing:.08em;border-radius:6px;padding:2px 7px}
.unitflat h3 .count{margin-left:auto;font-size:.9rem;color:var(--muted)}
.unitflat+.unitflat{margin-top:18px}
.dayblock{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--navy);border-radius:14px;padding:10px 12px 4px;margin:0 0 14px}
.dayblock.isToday{border-left-color:var(--green);background:#f3faf4}
.daybar{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:0 0 8px}
.daybar b{font-size:1.15rem;color:var(--navy);text-transform:uppercase;letter-spacing:.04em}
.daybar span{color:var(--muted);font-weight:700}
.daybar .dtag{border-radius:999px;padding:1px 10px;font-size:.82rem;font-weight:900}
.dtag.today{background:var(--green);color:#fff}.dtag.later{background:#eef1f3;color:var(--muted)}
.dayblock .row{margin-bottom:8px}
/* --- lists --- */
.section{margin:0 0 14px}
.section h2 .n{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:99px;padding:0 9px;font-size:.85rem;color:var(--muted);margin-left:4px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row .info{flex:1 1 300px;min-width:0}
.row .day{font-size:.85rem;font-weight:900;color:var(--red);text-transform:uppercase;letter-spacing:.06em}
.row .title{font-weight:800;color:var(--navy);line-height:1.25}
.row .fb{margin:6px 0 0;padding:8px 10px;background:#f6f2ea;border-radius:8px;font-size:.95rem}
.row .fb b{color:var(--navy)}
.row .ft{font-size:.88rem;color:var(--muted)}
.row .act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .open{background:var(--navy);color:#fff;padding:9px 16px}
.row .open.soft{background:#e7e0d1;color:var(--navy)}
.pill{display:inline-block;border-radius:8px;padding:3px 10px;font-weight:800;font-size:.9rem;white-space:nowrap}
.p-miss{background:var(--redbg);color:#8e2a20}
.p-wait{background:#eef1f3;color:var(--muted)}
.p-in{background:var(--greenbg);color:var(--green)}
.p-l1{background:var(--redbg);color:#8e2a20}.p-l2{background:var(--yellowbg);color:var(--yellow)}.p-l3{background:var(--greenbg);color:var(--green)}.p-l4{background:var(--bluebg);color:var(--blue)}
.p-talk{background:var(--yellowbg);color:var(--yellow)}
.p-class{background:#efe9dc;color:#5a4b2c}
.row.lite{padding:6px 12px;background:#faf7f0;border-style:dashed}.row.lite .title{font-weight:700;font-size:.95rem;color:#3d4f5c}.row.lite .open{padding:6px 12px;font-size:.9rem}
details.paper{margin:0 0 8px}details.paper>summary{cursor:pointer;color:var(--muted);font-weight:700;padding:6px 4px}
.row.summ{background:#fff8ec;border-color:#e8cf9f}
/* --- units --- */
details.unit{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.unit>summary{cursor:pointer;padding:13px 16px;font-weight:800;color:var(--navy);font-size:1.05rem;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.unit>summary::-webkit-details-marker{display:none}
details.unit>summary::before{content:"▸";color:var(--red);transition:transform .15s}
details.unit[open]>summary::before{transform:rotate(90deg)}
.unit .now{background:var(--red);color:#fff;font-size:.72rem;letter-spacing:.08em;border-radius:6px;padding:2px 7px}
.unit .count{margin-left:auto;font-size:.88rem;color:var(--muted);font-weight:700}
.unit .inner{padding:0 12px 6px}
.empty{color:var(--muted);padding:6px 4px 12px;margin:0}
.loading{color:var(--muted);font-style:italic}
.pick + footer{max-width:820px;margin-left:auto;margin-right:auto;padding:0 8px}
footer{margin-top:26px;font-size:.85rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
footer a{color:var(--muted)}
@media (max-width:600px){.next .btn{width:100%;text-align:center}.row .act{width:100%}}
</style>

<body>
<main id="app" aria-live="polite"></main>

<script>
"use strict";
// =====================================================================
//  STUDENT HOME PAGE
//  Each student picks their class and taps their name once. This Chromebook remembers it.
//  They see only their own class: what to do next, what they're missing, what's coming up,
//  and the teacher's feedback tips (no grades: those are in PowerSchool). Answer keys, tests, the teacher's Drive
//  alternatives, and teacher links are never shown here.
//
//  The list of activities comes from shared/assignments.js (same list as the teacher dashboard).
//  Class progress and feedback come from the Teacher Tools web app (shared/google-saver/TeacherTools.gs).
// =====================================================================
const REG = window.CLASS_ASSIGNMENTS || {}, COURSES = window.CLASS_COURSES || {};
const UNITS = window.CLASS_UNITS || {}, UNITS_P1 = window.CLASS_UNITS_PART1 || {};
const CAL = window.CLASS_CALENDAR || {};
const TOOLS = (typeof TEACHER_TOOLS_URL === "string" && TEACHER_TOOLS_URL) ? TEACHER_TOOLS_URL : "";
const CLASS_NOTE = {
  "us-history": "1920s to today", "world-history": "Empires, wars & the modern world",
  "sociology": "How groups shape people", "government": "How the U.S. government works", "civics": "Friday civics test practice"
};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shortName = n => (window.classShortName ? window.classShortName(n) : String(n || "").trim());
const todayIso = (() => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); })();
const niceDate = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });

// ---------- Saved on this Chromebook ----------
// me = { classes: { "us-history": "Jordan M.", ... }, current: "us-history" }
const ME_KEY = "hub-me";
function loadMe() { try { const m = JSON.parse(localStorage.getItem(ME_KEY)); if (m && m.classes) return m; } catch (e) {} return { classes: {}, current: "" }; }
function saveMe() {
  try {
    localStorage.setItem(ME_KEY, JSON.stringify(me));
    const name = me.classes[me.current];
    if (name) localStorage.setItem("site-student-name", name); // activities fill this in for them
    // Spanish stays on only for the student who turned it on from the Spanish page on this Chromebook.
    if (name && name !== localStorage.getItem("site-lang-es-name")) { localStorage.removeItem("site-lang-es-device"); localStorage.removeItem("site-lang"); }
  } catch (e) {}
}
// One-time carry-over: a Chromebook already set to Spanish (before names left the code) keeps it for the student signed in.
try { if (localStorage.getItem("site-lang-es-device") === "1" && !localStorage.getItem("site-lang-es-name") && localStorage.getItem("site-student-name")) localStorage.setItem("site-lang-es-name", localStorage.getItem("site-student-name")); } catch (e) {}
let me = loadMe();

// ---------- Teacher test student ----------
// Open the page once with ?teacher-test on the end and this device becomes "Test T." in every class,
// so the teacher sees exactly what a student sees without using a real student's name.
// Turn-ins from Test T. show on the teacher dashboard with a TEST tag (left out of Needs attention).
const TEST_NAME = "Test T.", TEST_KEY = "hub-test-student", PREVIEW_KEY = "hub-test-preview";
let testMode = false, preview = "real";   // preview: "real" or "caught" (pretend everything due is turned in)
try { preview = localStorage.getItem(PREVIEW_KEY) === "caught" ? "caught" : "real"; } catch (e) {}
try {
  if (/[?&]teacher-test\b/.test(location.search)) localStorage.setItem(TEST_KEY, "1");
  testMode = localStorage.getItem(TEST_KEY) === "1";
} catch (e) {}
if (testMode) {
  const keep = COURSES[me.current] ? me.current : "us-history";
  me = { classes: {}, current: keep };
  Object.keys(COURSES).forEach(k => { me.classes[k] = TEST_NAME; });
  saveMe();
  if (/[?&]teacher-test\b/.test(location.search)) history.replaceState(null, "", location.pathname + location.hash);
}
// Drop anything saved for a class that no longer exists.
Object.keys(me.classes).forEach(k => { if (!COURSES[k]) delete me.classes[k]; });

// ---------- Talking to the turn-in sheet ----------
async function tools(payload) {
  if (!TOOLS) throw new Error("no tools");
  const res = await fetch(TOOLS, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
  const d = await res.json();
  if (!d || !d.ok) throw new Error((d && d.error) || "failed");
  return d;
}
const infoCache = {};
const classInfo = course => infoCache[course] || (infoCache[course] = tools({ action: "class_list", course }).catch(() => ({})));
// Links the teacher added from the dashboard's To-do tab. They join the activity list on their day, the same as
// any other outside link (Teacher Tools never sends answer keys or summatives).
// Paper columns the teacher grades on the dashboard. If one matches a printed handout already listed that day,
// the grade shows on that row; otherwise it gets its own "Paper" row on its day.
const paperName = t => String(t || "").replace(/^Days? [\d–-]+ · /, "").replace(/\((Printed|Word|Paper)\)/gi, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
function addPaperCols(course, cols) {
  (cols || []).forEach(p => {
    if (!p || !p.id || !p.unit || !p.day) return;
    const same = Object.keys(REG).find(id => { const a = REG[id]; return a.course === course && a.unit === +p.unit && (a.part === 1) === (+p.part === 1) && a.day === +p.day && /\(printed\)/i.test(a.title || "") && paperName(a.title) === paperName(p.title); });
    if (same) { REG[same].paperId = p.id; return; }
    REG[p.id] = Object.assign({ course, unit: +p.unit, day: +p.day, title: "Day " + p.day + " · " + p.title + " (printed)", path: "", turnIn: false, paperCol: true, paperId: p.id }, +p.part === 1 ? { part: 1 } : {});
  });
}
async function addTeacherLinks(course) {
  const d = await classInfo(course);
  addPaperCols(course, d.paperCols);
  (d.links || []).forEach(l => {
    if (!l || !/^https:\/\//i.test(l.url || "") || /answer key|teacher key|summative/i.test(l.title || "")) return;
    REG["todo-link-" + l.id] = Object.assign({ course, unit: +l.unit, day: +l.day, title: "Day " + l.day + " · " + l.title, path: l.url, turnIn: false }, +l.part === 1 ? { part: 1 } : {});
  });
}

// ---------- What a student can see ----------
const isKey = (id, a) => /answer key|teacher key/i.test(a.title || "") || /-key$/.test(id);
const isTest = a => /summative/i.test(a.title || "") && !/review/i.test(a.title || "");
const isOnline = a => !/^https?:/.test(a.path || "") && a.turnIn !== false;
function studentItems(course) {
  return Object.entries(REG).filter(([id, a]) => a.course === course && (a.path || a.paperCol) && !a.alt && !isKey(id, a) && !isTest(a)
    && !/dashboard\.blooket\.com/.test(a.path)).map(([id, a]) => ({ id, ...a }));
}
const unitKey = a => (a.part === 1 ? "p1|" : "") + (a.unit || 0);
const spanOf = a => { const m = (a.title || "").match(/^Days (\d+)[–-](\d+)/); return m ? [+m[1], +m[2]] : null; };
const cleanTitle = t => String(t || "").replace(/^Days? [\d–-]+ · /, "").replace(/\s*\(printed\)/i, "").replace(/\s*\((Reading|Slides)\)\s*$/i, "").replace(/ — /g, " · ");
const kindWord = a => /\(Reading/i.test(a.title || "") ? "Reading" : /\(printed\)/i.test(a.title || "") ? "Paper" : /\(Slides\)/i.test(a.title || "") ? "Slides + exit ticket" : "";
function unitLabel(course, key) {
  const p1 = key.startsWith("p1|"), u = +key.split("|").pop();
  if (!u) return "More activities";
  if (course === "civics") return "Friday " + u + (UNITS.civics && UNITS.civics[u] ? " · " + UNITS.civics[u].replace(/\s*\(.*\)$/, "") : "");
  const name = p1 ? (UNITS_P1[course] || {})[u] : (UNITS[course] || {})[u];
  return (p1 ? "Part 1 · " : "") + "Unit " + u + (name ? " · " + name : "");
}
// The unit the class is on: the first unit on the green sheet whose test day hasn't passed yet.
// Weekdays after a (not counting a) up to and including b. Dates are "YYYY-MM-DD".
// School days only: skips weekends and the no-school stretches in CLASS_NO_SCHOOL (winter break).
const isoDay = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const schoolDay = d => !!(d.getDay() % 6) && !(window.CLASS_NO_SCHOOL || []).some(([a, z]) => { const i = isoDay(d); return i >= a && i <= z; });
function weekdaysBetween(a, b) {
  let n = 0; const d = new Date(a + "T12:00:00"), end = new Date(b + "T12:00:00");
  while (d < end) { d.setDate(d.getDate() + 1); if (schoolDay(d)) n++; }
  return n;
}
function nextWeekday(iso) {
  const d = new Date(iso + "T12:00:00");
  do d.setDate(d.getDate() + 1); while (!schoolDay(d));
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
// ---- Lesson-day calendar ----
// Core classes meet Monday–Thursday (Fridays are Civics), skipping no-school days. Day N of a unit is dated by
// counting class days from where Fynn pinned the class (CLASS_TODAY), then spreading the rest of the unit
// evenly up to its test date on the green sheet.
const classDay = d => d.getDay() >= 1 && d.getDay() <= 4 && schoolDay(d);
function classDaysBetween(a, b) {
  let n = 0; const d = new Date(a + "T12:00:00"), end = new Date(b + "T12:00:00");
  while (d < end) { d.setDate(d.getDate() + 1); if (classDay(d)) n++; }
  return n;
}
function stepClassDays(iso, n) {
  const d = new Date(iso + "T12:00:00"), dir = n < 0 ? -1 : 1;
  for (let k = Math.abs(n); k > 0;) { d.setDate(d.getDate() + dir); if (classDay(d)) k--; }
  return isoDay(d);
}
// { from, fromDay, days, test } for a Part 2 unit on the green sheet, or null.
function unitPlan(course, u) {
  const cal = CAL[course], c = cal && cal[u];
  if (!c || !c.summative || course === "civics") return null;
  const pin = (window.CLASS_TODAY || {})[course];
  if (pin && pin.unit === u) return { from: pin.date, fromDay: pin.day, days: c.days, test: c.summative };
  const prev = cal[u - 1];
  if (!prev || !prev.summative) return null;
  return { from: stepClassDays(prev.summative, 1), fromDay: 1, days: c.days, test: c.summative };
}
function dayOnDate(p, iso) {
  if (iso <= p.from) return Math.max(0, p.fromDay - classDaysBetween(iso, p.from));
  const total = classDaysBetween(p.from, p.test), gone = classDaysBetween(p.from, iso);
  if (!total) return p.days;
  return Math.min(p.days, p.fromDay + Math.floor(gone / total * (p.days - p.fromDay)));
}
function dateOfDay(p, n) {
  if (n <= p.fromDay) return stepClassDays(p.from, -(p.fromDay - n));
  let d = p.from;
  while (d < p.test) { d = stepClassDays(d, 1); if (dayOnDate(p, d) >= n) return d; }
  return p.test;
}
const longDate = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });
function currentUnit(course, keys, doneIds) {
  const cal = CAL[course], pin = (window.CLASS_TODAY || {})[course];
  // Fynn's pin wins until that unit's test day has passed.
  if (pin && keys.includes(String(pin.unit)) && (!cal || !cal[pin.unit] || !cal[pin.unit].summative || cal[pin.unit].summative >= todayIso)) return String(pin.unit);
  if (cal) {
    const u = Object.keys(cal).map(Number).sort((a, b) => a - b).find(n => cal[n].summative && cal[n].summative >= todayIso);
    if (u && keys.includes(String(u))) return String(u);
  }
  // No green sheet (Civics) or nothing listed for that unit: the latest unit anyone has turned in work for.
  let best = "";
  keys.forEach(k => { if ([...doneIds].some(id => REG[id] && unitKey(REG[id]) === k)) best = k; });
  return best || keys[0] || "";
}
const unitOrder = k => (k.startsWith("p1|") ? 0 : 1000) + (+k.split("|").pop() || 999);

// ---------- No grades here ----------
// Students see grades in PowerSchool, not on this site (Fynn's decision, 2026-11-02). A turned-in activity just
// shows "✓ Turned in", plus the teacher's feedback tip and a "Fix it" button when the work needs another try.
function gradeOf(w) {
  if (!w) return null;
  if (w.exempt) return { exempt: true };
  if (w.cleared) return { cleared: true, label: w.label || "" };
  if (w.flagged) return { talk: true };
  return { done: true, fix: !!w.fix };
}
function gradePill(g) {
  if (!g) return "";
  if (g.talk) return `<span class="pill p-talk">Talk with your teacher</span>`;
  if (g.exempt) return `<span class="pill p-in">Exempt · you don't need to do this</span>`;
  return `<span class="pill p-in">✓ ${g.cleared ? esc(g.label || "Done") : "Turned in"}</span>`;
}

// From the sheet when the Teacher Tools web app knows about student pages; otherwise from the
// receipts this Chromebook kept when the student turned work in (feedback tips come from the sheet; no grades).
function receipts() { try { return JSON.parse(localStorage.getItem("class-feedback-receipts")) || []; } catch (e) { return []; } }
// Exempt work (EX on the teacher dashboard): "Exempt everyone" comes with the class info, one student's EX with their own work.
async function loadWork(course, name) {
  const w = await loadWork0(course, name);
  try { const info = await classInfo(course); w.exemptAll = (info && info.exemptAll) || []; } catch (e) { w.exemptAll = []; }
  w.exempt = w.exempt || [];
  return w;
}
async function loadWork0(course, name) {
  // Which activities the class has turned in (ids only, no names) drives the to-do. What THIS student turned in
  // comes from the receipts kept on this Chromebook; nothing about one student is ever looked up.
  let classIds = null;
  try { const d = await tools({ action: "my_work", course, name }); classIds = d.classDone || []; } catch (e) {}
  const mine = {};
  const list = receipts().filter(r => REG[r.id] && REG[r.id].course === course && (!r.who || r.who.toLowerCase() === String(name || "").toLowerCase()));
  list.forEach(r => { if (!mine[r.id] || r.at > mine[r.id].atMs) mine[r.id] = { id: r.id, atMs: r.at, token: r.token }; });
  const tokens = Object.values(mine).map(w => w.token).filter(Boolean);
  if (tokens.length) {
    try {
      const d = await tools({ action: "feedback", tokens });
      const by = new Map((d.items || []).map(x => [x.token, x]));
      const me_ = String(name || "").toLowerCase();
      Object.values(mine).forEach(w => { const x = by.get(w.token); if (x && x.graded && String(x.who || "").toLowerCase() === me_) { w.flagged = x.flagged; w.feedback = x.feedback; w.fix = !x.flagged && (x.fix || (+x.level > 0 && +x.level <= 2)); } });
    } catch (e) {}
  }
  if (classIds) return { mine, classDone: new Set([...classIds, ...Object.keys(mine)]), full: true };
  return { mine, classDone: new Set(Object.keys(mine)), full: false };
}

// "Read it to me": reads the top card(s) out loud with the Chromebook's own voice.
function wireReadAloud() {
  const btn = document.querySelector(".readbtn");
  if (!btn) return;
  btn.onclick = () => {
    const synth = window.speechSynthesis;
    if (synth.speaking) { synth.cancel(); btn.textContent = "🔊 Read it to me"; btn.setAttribute("aria-pressed", "false"); return; }
    const parts = [];
    document.querySelectorAll("#body .goalcard, #body .testcard, #body .status").forEach(sec => {
      const c = sec.cloneNode(true);
      c.querySelectorAll(".readbtn, .qgo").forEach(x => x.remove());
      c.querySelectorAll("h2, p, li, .qday, .qtitle, .qkind, .dhead").forEach(x => x.append(". "));   // a pause after each line
      parts.push(c.innerText.replace(/[→↗📄📅🎉🎯]/g, "").replace(/\n+/g, ". "));
    });
    const u = new SpeechSynthesisUtterance(parts.join(". ").replace(/\.\s*\./g, ".").replace(/\s+/g, " "));
    u.rate = 0.95;
    u.onend = u.onerror = () => { btn.textContent = "🔊 Read it to me"; btn.setAttribute("aria-pressed", "false"); };
    synth.cancel(); synth.speak(u);
    btn.textContent = "⏹ Stop reading"; btn.setAttribute("aria-pressed", "true");
  };
}
// Test T.: the first time each class is opened in a browser session, show the feedback card students get.
function previewFeedback(course) {

const openUnits = {};
function homeBody(course, work) {
  const items = studentItems(course);
  if (!items.length) return `<div class="box"><h2>Nothing posted yet</h2><p class="muted">Your teacher hasn't put any ${esc(COURSES[course])} activities here yet. Check back soon.</p></div>`;
  const { mine, classDone } = work;
  const keys = [...new Set(items.map(unitKey))].sort((a, b) => unitOrder(a) - unitOrder(b));
  const nowKey = currentUnit(course, keys, new Set([...classDone, ...Object.keys(mine)]));
  const nowOrder = unitOrder(nowKey);
  // How far the class has gotten in each unit = the latest day anyone turned in work for.
  const reached = {};
  [...classDone, ...Object.keys(mine)].forEach(id => { const a = REG[id]; if (a && a.day) { const k = unitKey(a); reached[k] = Math.max(reached[k] || 0, (spanOf(a) || [a.day, a.day])[0]); } });
  // Today's lesson day in the current unit. Starts from where Fynn pinned the class (CLASS_TODAY in
  // shared/assignments.js) or, for a later unit, Day 1 right after the last unit's test. Then moves forward
  // evenly (weekdays only) to the test day on the green sheet.
  const nowPlan = !nowKey.startsWith("p1|") ? unitPlan(course, +nowKey.split("|").pop()) : null;
  // On a day with no class (Friday, weekend, no-school day), "today's" lesson is really the next class.
  const classToday = classDay(new Date(todayIso + "T12:00:00"));
  const nextClassIso = classToday ? todayIso : stepClassDays(todayIso, 1);
  const todayDay = nowPlan ? (nextClassIso <= nowPlan.from ? Math.min(nowPlan.fromDay, nowPlan.days) : dayOnDate(nowPlan, nextClassIso)) : 0;
  const isToday = a => unitKey(a) === nowKey && todayDay && a.day && (spanOf(a) ? a.day <= todayDay && todayDay <= spanOf(a)[1] : a.day === todayDay);
  const isDue = a => {
    const k = unitKey(a), o = unitOrder(k);
    if (o < nowOrder) return true;                    // earlier units are all due
    if (o > nowOrder) return false;                   // later units are coming up
    if (!a.day) return classDone.has(a.id);
    if (todayDay) return (spanOf(a) ? spanOf(a)[1] : a.day) < todayDay;   // everything before today's day
    return a.day <= (reached[k] || 0);                 // no day known: how far the class has gotten
  };
  const online = items.filter(isOnline);
  // Work the teacher counts as done for everyone (CLASS_CLEARED in shared/assignments.js).
  const clr = (window.CLASS_CLEARED || {})[course] || {};
  const isCleared = a => (clr.ids || []).includes(a.id) || (!!clr.unit && (a.part === 1 || (a.unit || 0) < clr.unit ||
    ((a.unit || 0) === clr.unit && !!a.day && (spanOf(a) ? spanOf(a)[1] : a.day) <= clr.throughDay)));
  online.forEach(a => { if (!mine[a.id] && isCleared(a)) mine[a.id] = { id: a.id, cleared: true, label: clr.label || "" }; });
  // Exempt (EX) from the teacher dashboard: not missing, not graded.
  const exempt = new Set([...(work.exemptAll || []), ...(work.exempt || [])]);
  // "Completed in class" (CLASS_CLEARED with a label) wins over EX, same as the teacher dashboard (Fynn, 11-03).
  online.forEach(a => { if (exempt.has(a.id) && !(clr.label && isCleared(a))) mine[a.id] = { id: a.id, exempt: true }; });
  // Test T. (the teacher) is always caught up: anything due before today counts as done unless really turned in.
  if (testMode) online.forEach(a => { if (!mine[a.id] && isDue(a)) mine[a.id] = { id: a.id, cleared: true }; });
  // Teacher preview: pretend this student turned in everything due (and today's work), with sample grades.
  if (work.preview) {
    const SAMPLE = [
      { ft: "9 of 9", written: 4, feedback: "Strong answer. You explained the cause and backed it up with a detail from the lesson." },
      { ft: "10 of 10", written: 3, feedback: "You explained it clearly and used a real example. Nice work." },
      { ft: "7 of 7", written: 3, feedback: "Good thinking. Next time, add one more specific fact to prove your point." }
    ];
    online.filter(a => isDue(a) || isToday(a)).forEach((a, i) => { mine[a.id] = Object.assign({ id: a.id, at: todayIso, teacher: false, flagged: false }, SAMPLE[i % SAMPLE.length]); });
  }
  const sortItems = list => list.slice().sort((a, b) => unitOrder(unitKey(a)) - unitOrder(unitKey(b)) || (a.day || 99) - (b.day || 99));
  const due = sortItems(online.filter(isDue));
  const paperOf = a => a.paperId ? (work.paper || {})[a.paperId] : null;
  // Paper work the teacher marked M (missing) counts as missing too. Exempt paper work never shows as missing.
  const missing = sortItems(due.filter(a => !mine[a.id]).concat(items.filter(a => !isOnline(a) && paperOf(a) && paperOf(a).mark === "M" && !exempt.has(a.paperId))));
  const turnedIn = online.filter(a => mine[a.id]);
  const fix = sortItems(turnedIn.filter(a => { const g = gradeOf(mine[a.id]); return g && g.fix; }));
  const ahead = sortItems(online.filter(a => !isDue(a) && !mine[a.id] && unitOrder(unitKey(a)) === nowOrder));
  const todays = ahead.filter(isToday);
  const href = a => esc(a.path);
  const ext = a => /^https?:/.test(a.path) ? ` target="_blank" rel="noopener"` : "";
  const dayText = a => { const s = spanOf(a); return s ? `Days ${s[0]}–${s[1]}` : a.day ? `Day ${a.day}` : ""; };
  // "Wed, Oct 28" for the day an activity happened (or will happen), from the class-day calendar.
  const plans = {};
  const planFor = k => (k in plans) ? plans[k] : (plans[k] = k.startsWith("p1|") ? null : unitPlan(course, +k.split("|").pop()));
  const dateText = (k, n) => { const p = n && planFor(k); return p ? niceDate(dateOfDay(p, n)) : ""; };
  const dayWithDate = a => { const s = spanOf(a), k = unitKey(a); if (!a.day) return ""; const d1 = dateText(k, s ? s[0] : a.day), d2 = s ? dateText(k, s[1]) : "";
    return (s ? `Days ${s[0]}–${s[1]}` : `Day ${a.day}`) + (d1 ? " · " + d1 + (d2 && d2 !== d1 ? " – " + d2 : "") : ""); };
  const where = a => [unitLabel(course, unitKey(a)).replace(/ · .*/, ""), dayText(a)].filter(Boolean).join(" · ");

  // --- The one thing a student needs to know: what am I missing, or am I caught up? ---
  // Kept short on purpose (Fynn: not overwhelming or complicated). Grades live in one closed dropdown below.
  const RECAP = (window.CLASS_RECAPS || {})[course] || {};
  const recapOf = a => { const u = RECAP[a.part === 1 ? -1 : a.unit] || {}; return u[(spanOf(a) || [a.day])[0]] || ""; };
  const shortWhere = a => (unitKey(a) === nowKey ? "" : unitLabel(course, unitKey(a)).replace(/ · .*/, "") + " · ") + dayWithDate(a);
  const quick = (a, btn, recap) => `<div class="qrow"><div><span class="qday">${esc(shortWhere(a))}</span><span class="qtitle">${esc(cleanTitle(a.title))}</span>${recap && recapOf(a) ? `<span class="qrecap">In class: ${esc(recapOf(a))}</span>` : ""}</div><a class="btn qgo" href="${href(a)}"${ext(a)}>${btn} →</a></div>`;
  // Welcome back: this Chromebook hasn't opened the page in 3+ school days.
  let away = 0;
  try { const last = localStorage.getItem("hub-last-seen:" + course); if (last && last < todayIso) away = weekdaysBetween(last, todayIso); localStorage.setItem("hub-last-seen:" + course, todayIso); } catch (e) {}
  const welcome = away >= 3 && !testMode;
  const todayRow = todays.length ? `<div class="qlabel">${classToday ? "Today's work" : "Next class · " + esc(longDate(nextClassIso))}</div>${todays.map(a => quick(a, "Start")).join("")}` : "";
  // Learning goals in Fynn's own kid-friendly words, from his scale docs (shared/targets.js): the day's "I can"
  // targets plus what a 3 (Proficient) looks like. Shown for today and for each day a student missed.
  const TARGETS = (window.CLASS_TARGETS || {})[course] || {};
  const goalOf = (unit, day) => TARGETS[unit + "|" + day] || null;
  const goalList = g => g && g.t && g.t.length ? `<ul class="goallist">${g.t.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  const goal3 = g => g && g.g3 ? `<p class="goal3"><span class="lv3">To get a 3</span> ${esc(g.g3)}</p>` : "";
  // Slides for a lesson day (teacher-submissions/presentations.js). Students get Google's "Publish to web" view:
  // slides only (never the speaker notes / Pear Deck answers), Linn-Mar accounts only, opened at that day's first slide.
  const slidesFor = (uKey, day) => {
    const p1 = uKey.startsWith("p1|"), u = +uKey.split("|").pop();
    const deck = (window.CLASS_PRESENTATIONS || []).find(p => p.course === course && p.url && !p.note && p.unit === u && (p1 ? p.part === 1 : p.part !== 1));
    if (!deck) return [];
    const google = /docs\.google\.com\/presentation/.test(deck.url);
    if (!google) return (deck.days || []).length || deck.plan ? [] : [{ url: deck.url, label: "Slides" }];   // Friday civics web presentations
    if (!deck.pub || !day) return [];   // never link the editor: it shows the speaker notes (Pear Deck answers)
    const pub = id => "https://docs.google.com/presentation/d/e/" + deck.pub + "/pub?start=false&loop=false&delayms=60000" + (id ? "&slide=id." + id : "");
    const deckDay = n => (deck.days || []).find(x => x.day === n);
    if (deck.plan) {
      const pl = deck.plan.find(x => x.day === day), list = (pl && pl.slides) || [];
      return list.map((s, i) => ({ url: pub(s.slide || (deckDay(s.day) || {}).slide), label: list.length > 1 ? "Slides, part " + (i + 1) : "Slides" }));
    }
    const d = deckDay(day);
    return d ? [{ url: pub(d.slide), label: "Slides" }] : [];
  };
  const tg = todayDay ? goalOf(nowKey, todayDay) : null;
  const todaySlides = todayDay ? slidesFor(nowKey, todayDay) : [];
  const slideBtns = !todaySlides.length ? "" : `<div class="slidebtns">${todaySlides.map(s => `<a class="btn sbtn" href="${esc(s.url)}" target="_blank" rel="noopener">📽 ${classToday ? "Today's" : "Next class"} ${esc(s.label.toLowerCase())} ↗</a>`).join("")}</div>`;
  const goalCard = !tg ? (slideBtns ? `<section class="goalcard" aria-label="Today's slides"><h2>📽 ${classToday ? "Today's slides" : "Next class slides"}</h2>${slideBtns}</section>` : "") : tg.test
    ? `<section class="goalcard" aria-label="Today's goal"><h2>🎯 ${classToday ? "Test today" : "Test next class (" + esc(niceDate(nextClassIso)) + ")"}: show what you know</h2>${tg.t && tg.t.length ? `<p class="gfirst"><b>First, a short lesson:</b></p>${goalList(tg)}` : ""}${goal3(tg)}${slideBtns}</section>`
    : `<section class="goalcard" aria-label="Today's goal"><h2>🎯 ${classToday ? "Today's goal" : "Next class goal"} <span class="gday">Day ${todayDay}${classToday ? "" : " · " + esc(niceDate(nextClassIso))}</span></h2>${goalList(tg)}${goal3(tg)}${slideBtns}</section>`;
  // Missed days: every day with missing online work, plus the days in between (a kid gone Day 3 and Day 5 missed Day 4 too).
  // Each day shows what happened in class, its online work (Start), and its paper work ("Get this from your teacher").
  const dayKey = a => unitKey(a) + "#" + ((spanOf(a) || [a.day])[0] || 0);
  const missedDays = new Map();
  missing.forEach(a => { const k = dayKey(a); if (!missedDays.has(k)) missedDays.set(k, { unit: unitKey(a), day: (spanOf(a) || [a.day])[0] || 0, ex: a }); });
  [...new Set(missing.map(unitKey))].forEach(u => {
    const ds = missing.filter(a => unitKey(a) === u && a.day).map(a => (spanOf(a) || [a.day])[0]);
    if (ds.length < 2) return;
    for (let d = Math.min(...ds) + 1; d < Math.max(...ds); d++) {
      const k = u + "#" + d, any = items.find(a => unitKey(a) === u && (spanOf(a) || [a.day])[0] === d && !isCleared(a));
      if (any && !missedDays.has(k)) missedDays.set(k, { unit: u, day: d, ex: any });
    }
  });
  const isPaper = a => /\(printed\)/i.test(a.title || "");
  const missRow = a => {
    if (isOnline(a)) return mine[a.id] ? "" : `<div class="qrow"><div><span class="qtitle">${esc(cleanTitle(a.title))}</span>${kindWord(a) ? `<span class="qkind">${esc(kindWord(a))} · online</span>` : `<span class="qkind">Online</span>`}</div><a class="btn qgo" href="${href(a)}"${ext(a)}>Start →</a></div>`;
    if (isPaper(a)) return `<div class="qrow paperrow"><div><span class="qtitle">📄 ${esc(cleanTitle(a.title))}</span><span class="qkind">Paper</span></div><span class="getit">Get this from your teacher</span></div>`;
    return `<div class="qrow"><div><span class="qtitle">${esc(cleanTitle(a.title))}</span><span class="qkind">Done in class · you can open it here</span></div><a class="btn qgo soft" href="${href(a)}"${ext(a)}>Open ↗</a></div>`;
  };
  const dayGroups = [...missedDays.values()].sort((x, y) => unitOrder(x.unit) - unitOrder(y.unit) || x.day - y.day).map(g => {
    const list = sortItems(items.filter(a => unitKey(a) === g.unit && ((spanOf(a) || [a.day])[0] || 0) === g.day && (!isCleared(a) || missing.includes(a))));
    const head = (g.unit === nowKey ? "" : unitLabel(course, g.unit).replace(/ · .*/, "") + " · ") + (g.day ? dayWithDate(g.ex) : "Other");
    const recap = recapOf(g.ex);
    const dg = goalOf(g.unit, g.day), dgoal = dg && dg.t && dg.t.length ? `<div class="dgoal"><b>🎯 Goal:</b>${goalList(dg)}</div>` : "";
    const sl = slidesFor(g.unit, g.day).map(s => `<div class="qrow sliderow"><div><span class="qtitle">📽 ${esc(s.label)} from this day</span><span class="qkind">See what the class learned</span></div><a class="btn qgo soft" href="${esc(s.url)}" target="_blank" rel="noopener">Open ↗</a></div>`).join("");
    return `<div class="dgroup"><div class="dhead">${esc(head)}</div>${recap ? `<p class="drecap">In class: ${esc(recap)}</p>` : ""}${dgoal}${sl}${list.map(missRow).join("")}</div>`;
  }).join("");
  const readBtn = "";   // read-aloud lives inside the activities (shared/turnin.js), not on this page
  let status;
  if (missing.length) {
    const nDays = missedDays.size;
    status = `<section class="status miss" aria-label="What to do"><div class="shead"><h2>${welcome ? "Welcome back! " : ""}You're missing work from ${nDays} ${nDays === 1 ? "day" : "days"}</h2>${readBtn}</div><p>${welcome ? "Here's what the class did while you were gone. " : ""}Start at the top and work down.</p>${dayGroups}${todayRow}</section>`;
  } else {
    // Near a test, the test card already lists what to redo, so don't repeat it here.
    const tc = (CAL[course] || {})[nowKey.split("|").pop()], td = !nowKey.startsWith("p1|") && tc && tc.summative;
    const nearTest = td && td >= todayIso && classDaysBetween(todayIso, td) <= 2;
    const fixRow = fix.length && !nearTest ? `<div class="qlabel">Optional: fix these up</div>${fix.map(a => quick(a, "Fix it")).join("")}` : "";
    status = `<section class="status done" aria-label="What to do"><div class="shead"><h2>${welcome ? "Welcome back! " : ""}You're all caught up! 🎉</h2>${readBtn}</div><p>${todays.length ? (classToday ? "Nothing missing. Here's today's work:" : "Nothing missing. Here's what's next:") : due.length ? "You've turned in everything so far." : "Nothing is due yet."}</p>${todayRow}${fixRow}</section>`;
  }
  const cal = (CAL[course] || {})[nowKey.split("|").pop()];
  const testDay = !nowKey.startsWith("p1|") && cal && cal.summative ? cal.summative : "";
  // Test countdown: within 2 school days of the unit test, a "get ready" card replaces the plain test line.
  const daysToTest = testDay && testDay >= todayIso ? classDaysBetween(todayIso, testDay) : -1;
  let testCard = "";
  if (daysToTest >= 0 && daysToTest <= 2) {
    const inUnit = online.filter(a => unitKey(a) === nowKey);
    const review = inUnit.filter(a => /review/i.test(a.title || ""));
    const graded = inUnit.filter(a => mine[a.id] && !mine[a.id].cleared).map(a => ({ a, g: gradeOf(mine[a.id]) })).filter(x => x.g && x.g.n).sort((x, y) => x.g.n - y.g.n);
    const weak = graded.filter(x => x.g.n <= 2).slice(0, 2);
    const when = daysToTest === 0 ? "today" : daysToTest === 1 ? "tomorrow" : new Date(testDay + "T12:00:00").toLocaleDateString("en-US", { weekday: "long" });
    testCard = `<section class="testcard" aria-label="Test coming up"><h2>📅 ${esc(unitLabel(course, nowKey).replace(/ · .*/, ""))} test ${esc(when)}${daysToTest === 0 ? "! Good luck." : ". Get ready!"}</h2>` +
      (review.length ? `<div class="qlabel">Review game</div>${review.map(a => quick(a, "Play")).join("")}` : "") +
      (weak.length ? `<div class="qlabel">Practice these first</div>${weak.map(x => quick(x.a, "Redo")).join("")}` : `<p>${graded.length ? "Your grades look solid. Look back over this unit's work and your notes." : "Look back over this unit's work and your notes."}</p>`) +
      `</section>`;
  }
  const testLine = testDay ? `<p class="testline">📅 ${esc(unitLabel(course, nowKey).replace(/ · .*/, ""))} test: <b>${esc(niceDate(testDay))}</b>${testDay === todayIso ? " (today!)" : ""} · on paper in class</p>` : "";

  // --- One activity row ---
  const row = (a, inUnit) => {
    const w = mine[a.id], g = gradeOf(w), on = isOnline(a), kw = kindWord(a);
    let pill = "", btn = "Open";
    const later = !isDue(a) && !isToday(a) && !isCleared(a);   // a day the class hasn't reached yet
    if (!on && /\(printed\)/i.test(a.title || "")) {
      const pg = paperOf(a);
      if (a.paperId && exempt.has(a.paperId)) return `<div class="row lite"><div class="info"><div class="day">Paper</div><div class="title">📄 ${esc(cleanTitle(a.title))}</div></div><div class="act"><span class="pill p-in">Exempt · you don't need to do this</span></div></div>`;
      if (pg && pg.level) return `<div class="row lite"><div class="info"><div class="day">Paper</div><div class="title">📄 ${esc(cleanTitle(a.title))}</div></div><div class="act"><span class="pill p-l${pg.level}">Level ${pg.level} · ${WORD[pg.level]}</span></div></div>`;
      if (pg && pg.mark === "M") return `<div class="row lite"><div class="info"><div class="day">Paper</div><div class="title">📄 ${esc(cleanTitle(a.title))}</div></div><div class="act"><span class="pill p-miss">Missing · get it from your teacher</span></div></div>`;
      return `<div class="row lite"><div class="info"><div class="day">Paper</div><div class="title">📄 ${esc(cleanTitle(a.title))}</div></div><div class="act"><span class="pill ${later ? "p-wait\">Coming up" : isToday(a) ? "p-in\">" + (classToday ? "Today · in class" : "Next class · in class") : "p-class\">Missed it? Get it from your teacher"}</span></div></div>`;
    }
    if (!on) { pill = later ? `<span class="pill p-wait">Coming up</span>` : isToday(a) ? `<span class="pill p-in">${classToday ? "Today · in class" : "Next class · in class"}</span>` : `<span class="pill p-class">Done in class</span>`; }
    else if (w) { pill = gradePill(g); btn = g && g.exempt ? "Open" : g && g.fix ? "Fix it" : "Look again"; }
    else if (isDue(a)) { pill = `<span class="pill p-miss">Missing</span>`; btn = "Start"; }
    else if (isToday(a)) { pill = `<span class="pill p-in">${classToday ? "Today" : "Next class"}</span>`; btn = "Start"; }
    else { pill = `<span class="pill p-wait">Coming up</span>`; btn = "Look ahead"; }
    const ft = g && g.ft ? `<div class="ft">${g.ft.right} of ${g.ft.total} right on the first try</div>` : "";
    const fb = w && (w.feedback || (g && g.talk)) ? `<p class="fb"><b>Feedback:</b> ${esc(g && g.talk ? "Your teacher wants to talk with you about this one." : w.feedback)}</p>` : "";
    const strong = on && (!w && (isDue(a) || isToday(a)) || (g && g.fix));
    return `<div class="row${on ? "" : " lite"}"><div class="info">${kw || on ? `<div class="day">${esc(kw || "Online")}</div>` : ""}<div class="title">${esc(cleanTitle(a.title))}</div>${ft}${fb}</div>
      <div class="act">${pill}<a class="btn open${strong ? "" : " soft"}" href="${href(a)}"${ext(a)}>${btn}${/^https?:/.test(a.path) ? " ↗" : ""}</a></div></div>`;
  };

  // --- Every unit, in day order. The class's current unit starts open. ---
  // Only this unit and earlier ones (future units would just be clutter).
  const units = keys.filter(k => unitOrder(k) <= nowOrder).map(k => {
    const list = sortItems(items.filter(a => unitKey(a) === k));
    const on = list.filter(isOnline), got = on.filter(a => mine[a.id]).length;
    const isNow = k === nowKey, future = unitOrder(k) > nowOrder;
    const owed = on.filter(a => mine[a.id] || isDue(a)).length;
    const paper = list.filter(a => !isOnline(a));
    const c = !k.startsWith("p1|") && (CAL[course] || {})[k];
    // One block per lesson day: "DAY 3 · Wednesday, Oct 28", then that day's work.
    const p = planFor(k), byDay = new Map();
    list.forEach(a => { const d = (spanOf(a) || [a.day])[0] || 0; if (!byDay.has(d)) byDay.set(d, []); byDay.get(d).push(a); });
    if (p && !byDay.has(p.days)) byDay.set(p.days, []);
    // Kids never look ahead (Fynn, 2026-11-02): days the class hasn't reached yet stay hidden until they're taught.
    // A day still shows if this student already turned something in from it, so their work never disappears.
    const notYet = d => {
      if (!d) return false;
      if (k === nowKey && todayDay) return d > todayDay;
      const iso = p ? dateOfDay(p, d) : "";
      return !!iso && iso > nextClassIso;
    };
    const dayBlocks = [...byDay.keys()].filter(d => !notYet(d) || byDay.get(d).some(a => mine[a.id])).sort((x, y) => (x || 999) - (y || 999)).map(d => {
      const acts = byDay.get(d), ex = acts[0] || { day: d, unit: +k.split("|").pop() };
      const span = acts.map(spanOf).find(Boolean);
      const label = d ? (span ? `Days ${span[0]}–${span[1]}` : `Day ${d}`) : (course === "civics" ? "Friday" : "Other");
      const iso = p && d ? dateOfDay(p, d) : "", isTest = p && d === p.days;
      const tag = k === nowKey && d && todayDay && (d === todayDay || (span && d <= todayDay && todayDay <= span[1])) ? `<span class="dtag today">${classToday ? "Today" : "Next class"}</span>` : (iso && iso > todayIso) || (!iso && unitOrder(k) > nowOrder) ? `<span class="dtag later">Coming up</span>` : "";
      const iso2 = p && span ? dateOfDay(p, span[1]) : "";
      const when = iso ? longDate(iso) + (iso2 && iso2 !== iso ? " – " + longDate(iso2) : "") : "";
      return `<div class="dayblock${tag.includes("today") ? " isToday" : ""}"><div class="daybar"><b>${esc(label)}</b>${when ? `<span>${esc(when)}</span>` : ""}${tag}</div>${acts.map(a => row(a, true)).join("")}${isTest ? `<div class="row summ"><div class="info"><div class="title">📅 Unit test · on paper in class</div></div></div>` : ""}</div>`;
    }).join("");
    const open = (course + "|" + k) in openUnits ? openUnits[course + "|" + k] : isNow;
    const past = unitOrder(k) < nowOrder;
    const countTxt = !on.length ? "" : future && !got ? "Coming up" : !owed ? "Nothing due yet" : `${got} of ${owed} turned in`;
    return `<section class="unitflat"><h3>${esc(unitLabel(course, k))}${isNow ? ` <span class="now">NOW</span>` : ""}<span class="count">${countTxt}${past && on.length && got === on.length ? " ✓" : ""}</span></h3>${dayBlocks}</section>`;
  }).join("");

  return goalCard + (testCard ? testCard + status : status + testLine) + `<details class="allwork"${allOpen[course] ? " open" : ""}><summary>📋 All my ${esc(COURSES[course])} work</summary><div class="allinner">${units}</div></details>`;
}
const allOpen = {};

function footer() {
  return `<footer><span>Your name fills in by itself on every activity on this Chromebook.</span></footer>`;
}
function focusFirst() { const el = document.querySelector("#app h1"); if (el) { el.setAttribute("tabindex", "-1"); el.focus({ preventScroll: true }); } }

// A link with a class on the end (like .../#us-history from Schoology) opens that class.
function fromLink() {
  const h = location.hash.slice(1);
  if (!COURSES[h]) return false;
  if (me.classes[h]) { me.current = h; saveMe(); screen = "home"; }
  else { pickCourse = h; screen = "name"; }
  return true;
}
fromLink();
window.addEventListener("hashchange", () => { if (fromLink()) draw(); });
draw();
</script>
</body>
