name: Unpack site update
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  unpack:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Unpack any site-update zip, save it, then republish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          zips=(.github/workflows/site-update*.zip site-update*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "Nothing to unpack."; exit 0; fi
          for z in "${zips[@]}"; do unzip -o "$z" -d . ; git rm -q "$z"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack site update"
          git push
          gh workflow run publish-pages.yml --ref main
