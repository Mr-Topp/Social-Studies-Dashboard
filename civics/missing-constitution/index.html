<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Power Grab: The Missing Constitution | Government Unit 1 Day 7</title>
<meta name="description" content="Someone stole the Constitution and a made-up Iowa governor says he makes the rules now. Play rule cards from the Constitution to stop his power grabs.">
<style>
:root{--ink:#17233a;--muted:#55627a;--navy:#14284f;--navy2:#1e3a6e;--gold:#f2b632;--gold2:#fff1c7;--red:#d23c2c;--red2:#fde3de;--green:#1f8a55;--green2:#ddf5e7;--amber:#8a5a00;--amber2:#fff1d6;--paper:#fffaf0}
*{box-sizing:border-box}
html{background:#0d1c39}
body{margin:0;min-height:100vh;color:#fff;font:17px/1.45 system-ui,Segoe UI,Arial,sans-serif;
  background:radial-gradient(1200px 500px at 50% -10%,#2b4f8f 0,transparent 70%),radial-gradient(circle at 15% 85%,#3a1f4a55 0,transparent 40%),linear-gradient(180deg,#14284f,#0d1c39);background-attachment:fixed}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #7fc1ff;outline-offset:2px}
.hide,[hidden]{display:none!important}
/* top bar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px max(14px,calc((100vw - 1200px)/2));background:#0a1630;border-bottom:3px solid var(--gold)}
.brand{font-weight:1000;letter-spacing:.08em;color:#fff;font-size:1.05rem}.brand small{display:block;font-size:.66rem;letter-spacing:.16em;color:var(--gold);font-weight:900}
.spacer{flex:1}.saved{font-size:.78rem;color:#b7c4dd}
.restart{border:2px solid #3a5285;background:#14284f;border-radius:10px;padding:6px 12px;font-weight:800;font-size:.85rem;min-height:38px;color:#fff}
/* HUD: you vs crane */
.hud{position:sticky;top:0;z-index:8;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:8px max(14px,calc((100vw - 1200px)/2));background:#0f2044ee;backdrop-filter:blur(4px);border-bottom:1px solid #2e4a80;box-shadow:0 4px 14px #0006}
.side{display:flex;align-items:center;gap:8px;font-weight:900;line-height:1.1}.side small{display:block;font-weight:700;color:#b7c4dd;font-size:.75rem}
.av{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;font-size:1.6rem;border:3px solid}
.you-av{background:#1e3a6e;border-color:#7fc1ff}
.crane-av{background:#3a1520;border-color:var(--red);transition:transform .2s}
.crane-av.hit{animation:hit .6s}.crane-av.grow{animation:grow .6s}
@keyframes hit{20%{transform:translateX(-6px) rotate(-8deg)}40%{transform:translateX(6px) rotate(8deg)}60%{transform:translateX(-3px)}}
@keyframes grow{40%{transform:scale(1.25)}}
.side.crane{flex-direction:row-reverse;text-align:right}
.tug{min-width:0}
.tug-lab{display:flex;justify-content:space-between;gap:8px;font-weight:900;font-size:.82rem;flex-wrap:wrap}
.step{background:var(--gold);color:#2a1c00;border-radius:20px;padding:1px 10px}
.pw{color:#ffb4a8;position:relative}
.bar{height:16px;background:#0a1630;border:2px solid #2e4a80;border-radius:10px;overflow:hidden;margin:4px 0}
.bar span{display:block;height:100%;background:linear-gradient(90deg,#ff8a6e,var(--red));transition:width .8s cubic-bezier(.3,1.4,.5,1)}
.bar span.hi{background:linear-gradient(90deg,var(--red),#8d1c12)}.bar span.lo{background:linear-gradient(90deg,#ffc6b8,#ff8a6e)}
.pop{position:absolute;right:-4px;top:-2px;font-weight:1000;opacity:0;pointer-events:none}.pop.up{color:#ff8a6e}.pop.down{color:#6ee7a8}
.pop.show{animation:popup 1.4s}@keyframes popup{0%{opacity:0;transform:translateY(8px)}20%{opacity:1;transform:translateY(-6px) scale(1.4)}80%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.hud-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.8rem;font-weight:800}
.box{background:#1a3264;border-radius:20px;padding:2px 9px;white-space:nowrap}.box.warn{background:#5a1a1a;color:#ffb4a8}
.pieces{display:inline-flex;gap:2px;vertical-align:middle}.pc{display:inline-grid;place-items:center;width:20px;height:22px;border-radius:4px;background:#0a1630;color:#55709f;font-size:.72rem}.pc.on{background:var(--gold2);color:var(--ink);animation:grow .6s}
.welcome{max-width:1200px;margin:10px auto 0;padding:9px 14px;background:var(--green2);border-radius:10px;font-weight:800;color:#145c39}
main{max-width:1200px;margin:auto;padding:16px 14px 60px;overflow-x:clip}
.kicker{font-size:.76rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0}
h1,h2,h3{line-height:1.12}
.table-h{color:#fff;margin:4px 0 12px;font-size:1.6rem;text-align:center}.table-h.small{font-size:1.1rem;margin-top:18px}
.go{display:block;width:100%;max-width:420px;margin:18px auto 0;background:linear-gradient(180deg,#ffd15c,var(--gold));color:#2a1c00;border:0;border-bottom:5px solid #a8770c;border-radius:14px;padding:13px 18px;font-weight:1000;font-size:1.12rem;min-height:54px;letter-spacing:.02em;box-shadow:0 6px 18px #0006}
.go:hover:not(:disabled){filter:brightness(1.08)}.go:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}.go:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.go.big{font-size:1.4rem;padding:16px;margin:16px 0 0;max-width:360px;animation:pulse 2.2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 8px #f2b63233,0 6px 18px #0006}}
.tip{color:#b7c4dd;margin:2px 0 8px;font-size:.9rem}
/* portraits + speech */
.says{display:flex;gap:10px;align-items:center;margin:12px 0;position:relative}
.portrait{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.portrait .face{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;font-size:2.1rem;background:#3a1520;border:3px solid var(--red);box-shadow:0 4px 10px #0007}
.portrait.big .face{width:84px;height:84px;font-size:3.1rem}
.portrait .nameplate{font-size:.62rem;font-weight:1000;letter-spacing:.08em;background:var(--red);color:#fff;border-radius:4px;padding:1px 6px;white-space:nowrap}
.portrait.lawyer .face{background:#2b2b3a;border-color:#9aa3b5}.portrait.lawyer .nameplate{background:#5a6275}
.portrait.judge .face{background:#203a2f;border-color:#6ee7a8}.portrait.judge .nameplate{background:var(--green)}
.speech{position:relative;margin:0;background:#fff;color:var(--ink);border-radius:16px;padding:10px 14px;font-weight:800;font-size:1.02rem;box-shadow:0 4px 12px #0005;animation:bubble .35s both}
.speech:before{content:"";position:absolute;left:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-left:0;border-right-color:#fff}
@keyframes bubble{from{opacity:0;transform:scale(.85) translateX(-8px)}}
/* stamps */
.stamp{position:absolute;font-weight:1000;letter-spacing:.1em;border:5px solid;border-radius:8px;padding:2px 14px;background:#fffd;transform:rotate(-12deg);white-space:nowrap;pointer-events:none;z-index:3}
.stamp.good{color:var(--green);border-color:var(--green)}.stamp.bad{color:var(--red);border-color:var(--red)}.stamp.meh{color:var(--amber);border-color:#c88a10}
.slam{animation:slam .45s cubic-bezier(.2,1.6,.4,1) both}@keyframes slam{0%{opacity:0;transform:rotate(-12deg) scale(2.6)}100%{opacity:1;transform:rotate(-12deg) scale(1)}}
/* title */
.title{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.title h1{font-size:clamp(2.8rem,6.5vw,4.8rem);margin:0;letter-spacing:.03em;color:#fff;text-shadow:0 4px 0 var(--red),0 8px 24px #000a}
.title .sub{margin:2px 0 6px;font-size:1.3rem;font-weight:900;color:var(--gold)}
.hook{font-size:1.15rem;font-weight:700;margin:6px 0}
.what{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.what span{background:#1a3264;border:1px solid #2e4a80;border-radius:20px;padding:4px 12px;font-size:.92rem}
.goal{display:flex;gap:8px;background:#ffffff12;border-left:4px solid var(--gold);border-radius:8px;padding:7px 11px;margin:8px 0 0;font-size:.95rem}
.fine{font-size:.78rem;color:#b7c4dd;margin:10px 0 0}
.title-art{position:relative;margin:0;border-radius:10px;overflow:hidden;border:8px solid #fff;box-shadow:0 14px 40px #000a;transform:rotate(2deg)}
.title-art img{display:block;width:100%;height:auto}.title-art figcaption{font-size:.72rem;background:#fff;color:var(--muted);padding:4px 8px}
.title-art .stamp{top:34%;left:22%;font-size:clamp(1.8rem,4vw,2.8rem);color:var(--red);border-color:var(--red)}
.title .says{margin:8px 0}
/* brief */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:#fff;color:var(--ink);border-radius:16px;padding:14px 12px;text-align:center;display:flex;flex-direction:column;gap:4px;box-shadow:0 6px 16px #0006;animation:deal .5s calc(var(--i)*.12s) both}
.tile-e{font-size:2.6rem}.tile b{font-size:1.05rem}.tile span:last-child{font-size:.86rem;color:var(--muted)}
@keyframes deal{from{opacity:0;transform:translateY(30px) rotate(-6deg)}}
/* round */
.round{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.15fr);gap:18px;align-items:start}
.flash{background:#fff;color:var(--ink);border-radius:16px;padding:12px 16px;box-shadow:0 6px 18px #0006;border-top:7px solid var(--red);animation:deal .4s both}
.flash-top{display:flex;justify-content:space-between;align-items:center}
.breaking{background:var(--red);color:#fff;font-weight:1000;letter-spacing:.14em;font-size:.75rem;padding:4px 10px;border-radius:4px;animation:blink 1.4s infinite}@keyframes blink{50%{opacity:.55}}
.flash-art{font-size:2.4rem;animation:wobble 2.5s infinite}@keyframes wobble{50%{transform:rotate(8deg) scale(1.08)}}
.flash h2{margin:2px 0 4px;font-size:1.45rem}.flashtext{margin:0;font-size:1.02rem}
.callback{background:var(--amber2);color:#5c3d00;border-radius:10px;padding:7px 11px;margin:8px 0 0;font-weight:700;font-size:.9rem;display:flex;gap:7px}
.doc{position:relative;background:var(--paper);color:var(--ink);border-radius:4px;padding:16px 16px 12px;margin:12px 6px 0;box-shadow:0 8px 20px #0007;background-image:repeating-linear-gradient(transparent 0 27px,#e9dfc6 27px 28px)}
.doc.tilt{transform:rotate(-1.2deg)}
.clip{position:absolute;top:-14px;left:18px;font-size:1.8rem;transform:rotate(-20deg)}
.doc .lab{margin:0 0 4px 22px;font-weight:900;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--amber)}
.doc .evtext{margin:0}.doc .src{margin:6px 0 0;font-size:.74rem;color:var(--muted)}
.handh{display:flex;justify-content:space-between;align-items:baseline;font-size:1.25rem}.left-n{font-size:.85rem;color:var(--gold);font-weight:900}
.hand{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;background:linear-gradient(180deg,#fff,#fbf3dc);color:var(--ink);border:3px solid var(--gold);border-radius:14px;padding:9px 6px 7px;min-height:136px;box-shadow:0 6px 14px #0006;transition:transform .15s,box-shadow .15s}
.pcard:hover:not(:disabled){transform:translateY(-5px) rotate(-1deg);box-shadow:0 12px 22px #0008}.pcard:hover:not(:disabled)::after,.pcard.sel::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px}
.pcard.sel{border-color:#7fc1ff;box-shadow:0 0 0 4px #7fc1ff88,0 12px 22px #0008;transform:translateY(-8px) scale(1.04)}
.pcard .ce{font-size:1.9rem}.pcard .cn{font-weight:1000;font-size:.92rem;line-height:1.1}.pcard .cl{font-size:.72rem;color:var(--muted);line-height:1.2}
.pcard .cp{margin-top:auto;font-size:.6rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--navy2);border-radius:6px;padding:1px 5px}
.pcard:disabled{cursor:default}.pcard.used{opacity:.35;filter:grayscale(1);box-shadow:none}
.usedtag{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);border:3px solid #444;color:#222;font-weight:1000;padding:0 7px;border-radius:5px;background:#fffd;font-size:.85rem}
.pcard.launch{animation:launch .45s forwards}@keyframes launch{to{transform:translateY(-60px) scale(1.25) rotate(6deg);opacity:0}}
.pcard.fizzle{animation:fizzle .55s forwards}@keyframes fizzle{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px);filter:grayscale(1)}100%{filter:grayscale(1) brightness(.6);opacity:.4}}
.hand.fan{grid-template-columns:repeat(8,minmax(0,1fr))}.hand.fan .pcard{min-height:0;padding:7px 4px;animation:deal .5s calc(.4s + var(--i)*.07s) both}.hand.fan .cl{display:none}.tile{padding:10px}.tile-e{font-size:2.1rem}
.miss{display:flex;gap:12px;align-items:center;background:#fff;color:var(--ink);border:3px solid #f0b54a;border-radius:14px;padding:10px 12px;margin:12px 0 0;animation:shake .5s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.miss-card{position:relative;flex:none;width:58px;height:74px;border-radius:10px;background:#ddd;display:grid;place-items:center;filter:grayscale(1)}.miss-card .ce{font-size:1.8rem}
.burn{position:absolute;bottom:6px;font-size:.55rem;font-weight:1000;background:#333;color:#fff;padding:1px 4px;border-radius:3px;transform:rotate(-10deg)}
.miss p{margin:2px 0}.miss-h{font-size:1rem}.crane-line{font-weight:800;color:var(--red)}
.fallback{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.alt{display:flex;gap:9px;align-items:center;text-align:left;border-radius:12px;padding:8px 10px;min-height:60px;color:#fff}
.alt .ae{font-size:1.5rem}.alt b{display:block;font-size:.9rem;line-height:1.15}.alt small{display:block;font-size:.74rem;opacity:.85;line-height:1.2}
.alt.cut{background:#5a1a1a;border:2px dashed #ff8a6e}.alt.cut:hover{background:#7a2020}
.alt.slide{background:#1a2a48;border:2px dashed #6b7fa8}.alt.slide:hover{background:#243a62}
/* result */
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;justify-items:center;margin:4px 0 6px}
.played{position:relative}
.bigcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;width:200px;min-height:230px;background:linear-gradient(180deg,#fff,#fbf3dc);color:var(--ink);border:4px solid var(--gold);border-radius:18px;padding:16px 10px;box-shadow:0 14px 30px #000a;animation:flip .6s both}
@keyframes flip{0%{transform:perspective(600px) rotateY(90deg) scale(.7)}100%{transform:perspective(600px) rotateY(0)}}
.bigcard .ce{font-size:3.4rem}.bigcard .cn{font-weight:1000;font-size:1.15rem}.bigcard .cl{font-size:.82rem;color:var(--muted)}.bigcard .cp{margin-top:auto;font-size:.66rem;font-weight:900;text-transform:uppercase;color:#fff;background:var(--navy2);border-radius:6px;padding:2px 6px}
.cutcard{background:linear-gradient(180deg,#ffe1da,#ffc3b6);border-color:var(--red);justify-content:center}.slidecard{background:linear-gradient(180deg,#eef1f7,#d7deeb);border-color:#6b7fa8;justify-content:center}
.played .stamp{top:60%;left:50%;margin-left:-90px;font-size:1.5rem;animation-delay:.45s}
.versus{font-size:2.2rem;font-weight:1000;color:var(--gold);text-shadow:0 3px 0 var(--red)}
.crane-side .says{flex-direction:column}.crane-side .speech:before{left:50%;top:-9px;margin:0 0 0 -9px;border:9px solid transparent;border-top:0;border-bottom-color:#fff}
.outcome{background:#fff;color:var(--ink);border-radius:16px;padding:12px 18px;max-width:820px;margin:8px auto 0;box-shadow:0 6px 18px #0006}
.outcome h2{margin:0 0 4px}.restext{font-size:1.06rem;margin:0}.restext.light{color:#fff}
.reveal{display:flex;gap:9px;background:#e8efff;color:var(--ink);border-left:7px solid var(--gold);border-radius:12px;padding:10px 14px;font-size:1.05rem;margin:12px auto;max-width:820px;animation:deal .5s .5s both}.reveal b{color:var(--navy2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.delta,.chip{margin:0;border-radius:20px;padding:4px 12px;font-size:.92rem;font-weight:900}
.delta.up{background:var(--red2);color:var(--red)}.delta.down{background:var(--green2);color:var(--green)}
.chip.piece{background:var(--gold2);color:var(--ink)}.chip.warn{background:var(--red2);color:var(--red)}
.fly{animation:flyin .7s .7s both}@keyframes flyin{from{opacity:0;transform:translateY(-30px) scale(1.4)}}
/* courtroom */
.bench{display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(180deg,#7a4a24,#5a3518);border:3px solid #a8703c;border-radius:14px 14px 4px 4px;padding:8px;font-size:1.2rem;letter-spacing:.2em;box-shadow:0 8px 18px #0007}
.bench .tagline{font-size:.75rem;letter-spacing:.08em;background:#0005;border-radius:10px;padding:2px 9px}
.gavel{font-size:1.8rem;display:inline-block;transform-origin:80% 80%}.gavel.bang{animation:bang .6s 2}@keyframes bang{40%{transform:rotate(-40deg)}70%{transform:rotate(10deg)}}
.court-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:12px}
.lawyer-says .stamp{left:-6px;top:22px;font-size:1.3rem}
.args{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.arg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;background:linear-gradient(180deg,#fff,#eef3ff);color:var(--ink);border:3px solid #7fa6e8;border-radius:14px;padding:10px 8px;min-height:112px;font-weight:800;line-height:1.25;box-shadow:0 6px 14px #0006;transition:transform .15s}
.arg:hover:not(:disabled){border-color:var(--navy2);box-shadow:0 0 0 3px #7fc1ff88,0 6px 14px #0006}.arg:disabled{opacity:.55;cursor:not-allowed}
.arg-e{font-size:1.8rem}.arg-t{font-size:.95rem}
.arg.shake{animation:shake .5s}
.arg.won{grid-column:1/-1;border-color:var(--green);background:linear-gradient(180deg,#fff,#ddf5e7);min-height:0;flex-direction:row;padding:12px 16px;animation:grow .5s}
.msg{min-height:1.3em;margin:10px 0 0;font-weight:800}.msg.wait{background:var(--amber2);border-radius:12px;padding:9px 13px;color:#5c3d00}.msg.good{background:var(--green2);border-radius:12px;padding:9px 13px;color:#145c39}
/* reward */
.found{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:center;max-width:860px;margin:0 auto 14px}
.found-doc{position:relative;margin:0;border:7px solid #fff;border-radius:8px;overflow:hidden;transform:rotate(-2deg);box-shadow:0 12px 30px #000a}.found-doc img{display:block;width:100%}.found-doc .stamp{top:30%;left:18%;font-size:1.8rem}
.found .table-h{text-align:left}.bonus{font-size:1.15rem;background:var(--gold);color:#2a1c00;border-radius:10px;padding:6px 12px;display:inline-block;margin:8px 0 4px}.tip.light{color:#dbe4f5}
.reward .hand{max-width:860px;margin:0 auto}
/* ending newspaper */
.paper{position:relative;background:#fbf7ec;color:var(--ink);border-radius:6px;padding:18px 22px;max-width:900px;margin:0 auto;box-shadow:0 16px 40px #000b;transform:rotate(-.6deg);animation:spin-in .7s both}
@keyframes spin-in{from{opacity:0;transform:rotate(-14deg) scale(.6)}}
.masthead{text-align:center;border-bottom:4px double var(--ink);padding-bottom:6px;margin-bottom:10px}.masthead span{display:block;font:900 clamp(1.3rem,3.4vw,2rem)/1 Georgia,serif;letter-spacing:.04em}.masthead small{font-size:.72rem;color:var(--muted)}
.paper-top{display:grid;grid-template-columns:1fr 200px;gap:14px;align-items:center}
.headline{font:900 clamp(1.8rem,4.4vw,2.8rem)/1.05 Georgia,serif;margin:2px 0 6px}
.paper .kicker{color:var(--red)}
.endtext{font-size:1.08rem;font-weight:700;margin:0 0 6px}.docline{display:flex;gap:7px;margin:4px 0}
.paper-art{position:relative;display:grid;place-items:center;height:170px;background:#e9e2cf;border:2px solid #cfc4a6}.paper-face{font-size:5rem;filter:sepia(.5)}
.paper-art .stamp{bottom:16px;left:6px;font-size:1.15rem;animation-delay:.6s}
.final-meters{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.final-meters p{margin:0;background:#efe8d5;border-radius:10px;padding:5px 12px}
.paper h3{margin:12px 0 6px;font-family:Georgia,serif}
.cause{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:7px}
.cause-card{display:flex;flex-direction:column;gap:2px;background:#fff;border:2px solid #ddd;border-left-width:6px;border-radius:9px;padding:6px 9px;font-size:.88rem;animation:deal .4s calc(.6s + var(--i)*.08s) both}
