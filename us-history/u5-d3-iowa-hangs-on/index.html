<script>window.RACE={"key": "ush-u5-d3-iowa-hangs-on-v1", "assignmentId": "ush-u5-d3-iowa-hangs-on", "title": "U.S. History · Unit 5 · Day 3 · Iowa Hangs On", "standard": "SS.9-12.US.47, SS.9-12.US.48", "kicker": "U.S. History · Unit 5 Day 3 · New Economy + End of the Cold War", "startYear": "1981", "lights": 12, "hook": "Four Iowans. Hard times are coming.<br>Who makes it through?", "recap": "Yesterday: Reagan cut taxes and fired striking air traffic controllers. The economy boomed, but not the same for everyone.", "how": ["① Guess who wins", "② Make your move", "③ Watch the lights", "④ Quick check"], "chips": "⏱️ About 30 minutes · 3 rounds + Part 2: the Wall · 6 quick checks · 2 short answers", "pickHead": "Pick who you'll play as.", "pickNote": "Made-up people. Real events in Iowa, 1981–1994.", "people": [{"id": "dale", "n": "Dale", "j": "Corn & hog farmer", "col": "#25e0c8", "skin": "#e8b48a", "shirt": "#ffffff", "start": 7}, {"id": "tasha", "n": "Tasha", "j": "Packing plant worker, Waterloo", "col": "#ffd23f", "skin": "#f1c9a5", "shirt": "#ff3fa4", "start": 6}, {"id": "ben", "n": "Ben", "j": "Sells tractors in a small town", "col": "#ff3fa4", "skin": "#c98b5e", "shirt": "#5d5d6e", "start": 7}, {"id": "jen", "n": "Jen", "j": "Office worker, Des Moines", "col": "#9b8cff", "skin": "#8d5a3b", "shirt": "#25e0c8", "start": 5}], "rounds": [{"yr": "1981–85", "head": "The farm crisis hits Iowa.", "sub": "Farmers borrowed big when crops sold high. Then interest (the extra money you owe on a loan) shot up, and crop prices fell. Iowa farmland lost more than half its value.", "ask": "Dale the farmer gets hit first. Who ELSE gets hurt the most?", "best": "ben", "fx": {"dale": -3, "tasha": 0, "ben": -2, "jen": 0}, "why": {"dale": "Can't pay his farm loans", "tasha": "Not hit yet", "ben": "Farmers stop buying tractors", "jen": "Not hit"}, "idea": "<b>Why it happened:</b> big loans + high interest + low crop prices. Thousands of Iowa families lost their farms. In 1985, the Farm Aid concert raised money to help.", "moves": {"dale": [{"t": "Sell some land", "s": "Pay down your loan", "fx": -1, "say": "Smaller farm, smaller debt.", "later": {"1": 1}, "laterSay": {"1": "With less debt, you kept the rest of your farm."}}, {"t": "Borrow more", "s": "Hope prices come back", "fx": 0, "say": "You owe even more now.", "later": {"1": -2, "2": 1}, "laterSay": {"1": "Prices didn't come back. The bank took part of your farm.", "2": "What's left of your farm sells to Mexico."}}], "tasha": [{"t": "Pick up overtime", "s": "Save up", "fx": 1, "say": "More hours, more savings."}, {"t": "Night class at Hawkeye Community College", "s": "Learn a new skill", "fx": -1, "say": "Tired, and paying for class.", "later": {"1": 2, "2": 1}, "laterSay": {"1": "Your training helped you land a new job fast.", "2": "Your training kept you out of factory work."}}], "ben": [{"t": "Start a repair shop", "s": "Farmers still need repairs", "fx": -1, "say": "It costs money to set up.", "later": {"1": 1, "2": 1}, "laterSay": {"1": "Repairs keep your doors open.", "2": "Repair work keeps growing."}}, {"t": "Wait for buyers", "s": "Hope sales come back", "fx": 0, "say": "No buyers yet.", "later": {"1": -1}, "laterSay": {"1": "Buyers never came. You cut your hours."}}], "jen": [{"t": "Buy cheap farmland", "s": "Land prices crashed", "fx": -1, "say": "That ties up your savings.", "later": {"2": 2}, "laterSay": {"2": "Land prices came back up."}}, {"t": "Keep saving", "s": "Stay safe", "fx": 1, "say": "Money's in the bank."}]}, "check": {"std": "US.47", "short": "What caused the farm crisis", "q": "Dale owes a big loan. Then interest jumps and corn sells for less. What happens to Dale?", "right": "He owes more each month but earns less.", "wrong": ["He owes less each month and earns more.", "The bank forgives his loan since times are hard.", "He is fine, because farmland keeps rising in value."], "hint": "Interest up means bigger payments. Cheaper corn means...", "why": "That squeeze cost thousands of Iowa families their farms. Then towns like Ben's lost customers too."}}, {"yr": "1985", "head": "The Waterloo packing plant closes.", "sub": "Rath Packing, open since 1891, shuts down. All over the Midwest, factories close or move. People call it the Rust Belt: closed, rusting factories.", "ask": "Tasha loses her job. Who ELSE gets hurt the most?", "best": "ben", "fx": {"dale": 0, "tasha": -3, "ben": -1, "jen": 0}, "why": {"dale": "His hogs go to other plants", "tasha": "Loses her job", "ben": "His town has less money to spend", "jen": "Her office keeps hiring"}, "idea": "<b>Why plants closed:</b> companies moved to places where workers cost less, like newer non-union plants in small towns or other countries, and machines replaced workers.", "moves": {"dale": [{"t": "Join a farmers' co-op", "s": "Share costs with neighbors", "fx": 0, "say": "Lower costs, more meetings.", "later": {"2": 1}, "laterSay": {"2": "Your co-op ships grain to Mexico."}}, {"t": "Go it alone", "s": "Keep control", "fx": 1, "say": "Every decision is yours... and every risk."}], "tasha": [{"t": "Move to another state for work", "s": "Leave Iowa", "fx": 1, "say": "Better pay, but far from family."}, {"t": "Stay and look nearby", "s": "Keep friends and family", "fx": -1, "say": "Jobs here pay less now.", "later": {"2": 1}, "laterSay": {"2": "A new job opened up close to home."}}], "ben": [{"t": "Cut your prices", "s": "Try to win buyers", "fx": 1, "say": "Sales up, profit down.", "later": {"2": -1}, "laterSay": {"2": "You can't raise prices back up."}}, {"t": "Close on Mondays", "s": "Save money", "fx": 0, "say": "Fewer costs, fewer sales."}], "jen": [{"t": "Ask for a promotion", "s": "Your company is growing", "fx": 1, "say": "You got it."}, {"t": "Go back to school at night", "s": "Bigger job later", "fx": -1, "say": "Tired, and paying tuition.", "later": {"2": 2}, "laterSay": {"2": "Your degree landed you a better job."}}]}, "check": {"std": "US.47", "short": "Why plants closed", "q": "Suppose a new meatpacking plant opens in a small town and pays much less than Rath did. Which 1980s trend does that show?", "right": "Companies chose places where workers cost less.", "wrong": ["Machines did the work, so few people were hired.", "The government ran the plant to save Iowa jobs.", "Workers moved to farms to grow their own food."], "hint": "Read the idea box: where did companies go?", "why": "Many Iowa packing jobs came back in the 1990s, but often at lower pay."}}, {"yr": "1994", "head": "NAFTA: a trade deal with Mexico and Canada.", "sub": "President Clinton signs it in 1993. The U.S., Canada, and Mexico agree to drop most taxes on goods crossing their borders, a little at a time. Iowa sells a lot more corn and pork to Mexico.", "ask": "Who gains the MOST?", "best": "dale", "fx": {"dale": 2, "tasha": -1, "ben": 1, "jen": 1}, "why": {"dale": "Sells more corn and pork to Mexico", "tasha": "Her new factory job (after Rath) moves to Mexico", "ben": "Farmers buy tractors again", "jen": "Cheaper stuff at the store"}, "idea": "<b>Globalization</b> (more trade between countries) has winners and losers: farmers and shoppers gained, and many factory workers lost. A similar deal, USMCA, replaced NAFTA in 2020, and Mexico is still Iowa's second-biggest foreign customer.", "moves": {"dale": [{"t": "Plant more for Mexico", "s": "Sell more", "fx": 1, "say": "Exports pay off."}, {"t": "Play it safe", "s": "Same as always", "fx": 0, "say": "Nothing new."}], "tasha": [{"t": "Take a warehouse job", "s": "Trucks full of trade goods", "fx": 1, "say": "Trade goods need people to move them."}, {"t": "Wait for a factory job", "s": "What you know", "fx": 0, "say": "Factory jobs are hard to find now."}], "ben": [{"t": "Hire a helper", "s": "Business is back", "fx": 1, "say": "Busy store again."}, {"t": "Play it safe", "s": "Stay small", "fx": 0, "say": "Steady, nothing new."}], "jen": [{"t": "Shop the cheaper stuff", "s": "Lower prices", "fx": 1, "say": "Your paycheck goes further."}, {"t": "Buy a new car on a loan", "s": "Treat yourself", "fx": 0, "say": "Nice car, big payments."}]}, "check": {"std": "US.47", "short": "NAFTA", "q": "After 1994, a grocery chain in Mexico starts buying lots of Iowa pork. Why did that get easier?", "right": "NAFTA dropped most taxes on goods crossing borders.", "wrong": ["NAFTA made Mexico start using U.S. dollars as money.", "NAFTA banned farmers in Mexico from raising pigs.", "NAFTA moved some Iowa farms across the border."], "hint": "What did NAFTA do to taxes on goods crossing borders?", "why": "Cheaper trade helped Iowa farmers and shoppers. Many factory workers lost jobs to plants in Mexico."}}], "credit": {"head": "Part 2: The Wall comes down", "sub": "Rewind to 1983. Iowa cared about the Cold War too: in 1980, a U.S. ban on grain sales to the Soviet Union hit Iowa farmers hard. (Reagan lifted it in 1981.) Now, three big moments. After each one, give a star to whoever you think deserves the most credit.", "how": "Three moments. One star each. You'll back up your pick at the end.", "who": [{"id": "reagan", "n": "Reagan", "j": "U.S. president"}, {"id": "gorby", "n": "Gorbachev", "j": "Soviet leader"}, {"id": "people", "n": "The people", "j": "Marchers in Eastern Europe"}], "events": [{"yr": "1983–85", "head": "Peace through strength.", "sub": "Reagan's motto: \"peace through strength.\" He builds up the military and plans a space missile shield called SDI (\"Star Wars\"). The Soviets can't afford to keep up. In 1985, Mikhail Gorbachev (gor-buh-CHOFF) takes over and allows more free speech, called <b>glasnost</b>.", "says": [["Some say", "Reagan's buildup pushed the struggling Soviets to change."], ["Others say", "Gorbachev chose to change on his own."]], "check": {"std": "US.48", "short": "Arms race pressure", "q": "The Soviet economy is already in trouble. Then Reagan spends big on the military and plans SDI. Why does that put pressure on the Soviets?", "right": "Keeping up would cost money they don't have.", "wrong": ["SDI had already shot down most Soviet missiles.", "The U.S. promised to cut its own military in half.", "The Soviets had far more money than the U.S."], "hint": "Read the news: can the Soviets afford to keep up?", "why": "That's \"peace through strength.\" Critics said SDI cost too much and might never work. (It was never finished.)"}}, {"yr": "1987", "head": "\"Tear down this wall!\"", "sub": "In Berlin, Reagan dares Gorbachev to open the Berlin Wall. After years of talks, they sign a missile deal called the <b>INF Treaty</b> in December 1987: for the first time, both sides destroy a whole type of nuclear missile. Reagan's motto: \"Trust, but verify.\"", "says": [["Some say", "Reagan's pressure got the deal done."], ["Others say", "Millions of Europeans marching against nuclear missiles pushed both leaders."]], "check": {"std": "US.48", "short": "INF Treaty", "q": "Reagan's motto for the INF Treaty was \"Trust, but verify.\" What did that mean for the deal?", "right": "Inspectors checked that missiles were really destroyed.", "wrong": ["Both sides kept their missiles but promised not to use them.", "The U.S. trusted the Soviets, so it skipped the checks.", "The U.S. had to destroy missiles, but the Soviets didn't."], "hint": "Verify means check.", "why": "Inspectors from each country watched the missiles get destroyed."}}, {"yr": "1989–91", "head": "The Wall comes down.", "sub": "People across Eastern Europe march against their communist governments. Gorbachev sends no tanks. Nov. 9, 1989: the Berlin Wall opens. 1991: the Soviet Union breaks into 15 countries.", "says": [["Some say", "Gorbachev's choice not to send tanks made it possible."], ["Others say", "Ordinary people won it by marching, risking jail."]], "check": {"std": "US.48", "short": "No tanks in 1989", "q": "In 1956 and 1968, Soviet tanks crushed protests in Hungary and Czechoslovakia. Why was 1989 different?", "right": "Gorbachev chose not to send in the tanks.", "wrong": ["The marchers had their own tanks this time.", "The U.S. Army was guarding the Berlin Wall.", "Eastern Europe had very few protests in 1989."], "hint": "Read the news: what did Gorbachev do (or not do)?", "why": "The Wall opened Nov. 9, 1989. Many historians say ending the Cold War took all three: Reagan, Gorbachev, and the people."}}], "years": "1983–91"}, "finalHead": "Final board: who made it through?", "finalIdea": "Same state, same years, very different stories. <b>Changes in the economy help some people and hurt others.</b> And the Cold War ended without a war.", "prompts": [{"id": "trade", "short": "Who gained and who lost", "label": "Globalization (more trade, like NAFTA) and the 1980s changes helped some Iowans and hurt others. Name one who gained and one who lost, and why.", "stem": "___ gained because ___. ___ lost because ___.", "min": 55, "newWords": 4, "mustAll": [["dale", "jen", "ben", "farmer", "farmers", "shopper", "shoppers", "store", "office", "corn", "pork", "mexico"], ["tasha", "dale", "ben", "factory", "worker", "workers", "plant", "rath", "job", "jobs", "farm", "farms"], ["gained", "gain", "gains", "helped", "better", "won"], ["lost", "lose", "loses", "hurt", "worse"], ["because", "since"]], "mustMsg": "Name one who gained AND one who lost, and use because to say why.", "std": "US.47"}, {"id": "credit", "short": "Who ended the Cold War", "label": "Who deserves the MOST credit for ending the Cold War: Reagan, Gorbachev, or the people? Use one fact.", "stem": "___ deserves the most credit because ___.", "min": 40, "newWords": 3, "mustAll": [["reagan", "gorbachev", "people", "marchers", "protesters", "all three"], ["because", "since"], ["military", "buildup", "built", "wall", "treaty", "inf", "missile", "missiles", "glasnost", "tanks", "march", "marched", "marching", "protest", "protests", "protested", "speech", "free", "freedom", "berlin", "evil", "pressure", "speak", "jail", "inspectors", "verify"]], "mustMsg": "Pick Reagan, Gorbachev, the people, or all three. Then use because and one fact, like the INF Treaty, glasnost, or no tanks.", "std": "US.48"}], "endYear": "1994"};</script>
