const editions=[{"year":"1803","title":"THE LAND DEAL","context":"News from Washington: President Jefferson has agreed to buy a huge territory from France. Your newspaper must explain what changed and what the deal meant.","mechanic":"sort","prompt":"Is each report true or false?","cards":[["Jefferson bought the Louisiana Territory from France.",true],["Native nations, like the Ioway, already lived on this land.",true],["France sold Alaska to the U.S. in 1803.",false]],"quiz":[0,1]},{"year":"1812–1861","title":"THE COUNTRY SPLITS","context":"Telegraph news is pouring in out of order. Put the stories in order to show how the country fought new wars, then split in two.","mechanic":"timeline","prompt":"Put the events in order, oldest first.","cards":["War of 1812 begins","Mexican-American War begins","Confederates attack Fort Sumter"],"quiz":[2,3]},{"year":"1863","title":"LINCOLN'S BIG DECISION","context":"The country is at war. A major proclamation has been issued, and your newsroom must report what it really did. Don't print anything false about slavery.","mechanic":"investigate","prompt":"Pick the two true claims before printing.","cards":[["Lincoln served as the 16th president.",true],["The Emancipation Proclamation freed enslaved people in the Confederate states.",true],["The Emancipation Proclamation instantly ended slavery everywhere in the United States.",false],["Lincoln was president during World War I.",false]],"quiz":[4,5]},{"year":"1861–1868","title":"THE WAR ENDS","context":"The Confederacy is collapsing. Then comes a new question: who counts as a citizen now? Rebuild the story before it goes to press.","mechanic":"timeline","prompt":"Put these moments in order, oldest first.","cards":["Emancipation Proclamation issued (1863)","13th Amendment ends slavery (Dec. 1865)","14th Amendment: people born in the U.S. are citizens (1868)"],"quiz":[6,7]},{"year":"1868–1872","title":"WHO HAS A VOICE?","context":"After the Civil War, new amendments changed who could vote. But a law on paper doesn't always work in real life. Print only what is true.","mechanic":"investigate","prompt":"Pick the two true statements about rights.","cards":[["The 15th Amendment (1870) says states can't deny the vote because of race.",true],["After 1870, no state ever kept Black men from voting again.",false],["Susan B. Anthony was arrested in 1872 for voting.",true],["The Civil War gave every American equal rights right away.",false]],"quiz":[8,9]}];const questions=[["What territory did the United States buy from France in 1803?",["Louisiana Territory","Oregon Territory","Alaska","Florida"],0],["Name one war fought by the United States in the 1800s.",["World War II","American Revolutionary War","Mexican-American War","Korean War"],2],["Name the U.S. war between the North and the South.",["Civil War","War of 1812","Spanish-American War","Revolutionary War"],0],["The Civil War had many important events. Name one.",["Boston Tea Party","Battle of Gettysburg","Pearl Harbor","Louisiana Purchase"],1],["Abraham Lincoln is famous for many things. Name one.",["First president","16th president","Writer of the Constitution","Led the British army"],1],["What did the Emancipation Proclamation do?",["Ended racism in every state for good","Freed slaves in the Confederate states","Gave women the right to vote","Created the U.S. Constitution"],1],["What U.S. war ended slavery?",["War of 1812","Mexican-American War","Civil War","Spanish-American War"],2],["What amendment says all persons born or naturalized in the United States, and subject to the jurisdiction thereof, are U.S. citizens?",["10th Amendment","14th Amendment","15th Amendment","19th Amendment"],1],["When did all men get the right to vote?",["1776","1803","1870","1920"],2],["Name one leader of the women's rights movement in the 1800s.",["Susan B. Anthony","George Washington","Abraham Lincoln","King George III"],0]];
const KEY='f5express_v2',API='https://fynn-class-assignment-submissions-20261024.neotboy.chatgpt.site/api/submit';
const fresh=()=>({view:'intro',issue:0,phase:0,done:[],card:0,selected:[],placed:[],qa:0,wrong:0,feedback:'',ft:{},order:[],qorder:[],name:'',turnedIn:false});

function render(){save();document.body.classList.toggle('compact',st.view!=='intro');const key=[st.view,st.issue,st.phase,st.qa,st.card,st.placed.length].join();if(key!==lastKey){lastKey=key;window.scrollTo(0,0)}draw();if(Date.now()<lockUntil)root.querySelectorAll('[data-action=sort],[data-action=place],[data-action=answer],[data-action=verify]').forEach(b=>b.disabled=true);if(st.view==='finish')wireTurnIn()}
function draw(){document.getElementById('counter').textContent=st.done.length+' / 5 EDITIONS PRINTED';

if(st.view==='desk'){root.innerHTML='<section class="page"><div class="label">CHOOSE AN EDITION</div><h2>NEWS DESK</h2><p class="story">Finish all 5 editions. Do them in any order.</p><div class="edition">'+editions.map((e,i)=>'<button class="issue '+(st.done.includes(i)?'done':'')+'" data-action="open" data-value="'+i+'"><strong>'+e.year+'</strong>'+e.title+(st.done.includes(i)?' ✓':'')+'</button>').join('')+'</div>'+(st.done.length===5?button('PRINT THE FINAL FRONT PAGE','finish','','btn'):'')+'</section>';return}
if(st.view==='finish'){const r=results();root.innerHTML='<section class="page"><div class="label">SPECIAL HISTORICAL EDITION</div><h2>ALL FIVE EDITIONS PUBLISHED! <span class="stamp" style="font-size:22px;padding:8px 12px;margin:0 0 0 10px;vertical-align:middle">PRESS VERIFIED</span></h2><p class="story"><b>You finished!</b> The presses are rolling and the 1800s story is set straight for every reader in town.'+(r.miss.length?'<br>Study these again: '+r.miss.join(', ')+'.':'')+'</p><div class="note"><label for="studentName"><b>Last step: turn it in.</b> Type your first name and last initial, like Jordan M.</label><br><input id="studentName" class="namebox" autocomplete="off" placeholder="First name + last initial (like Jordan M.)"><button class="btn" id="turnin">TURN IN TO MY TEACHER</button><div id="tistatus" aria-live="polite"></div></div>'+button(restartArmed?'TAP AGAIN TO START OVER':'PLAY AGAIN','restart','','btn ghost')+'</section>';return}

if(ed.mechanic==='investigate'){content+='<div class="grid">'+ed.cards.map((x,i)=>'<button class="card '+(st.selected.includes(i)?'selected':'')+'" data-action="pick" data-value="'+i+'">'+esc(x[0])+'</button>').join('')+'</div>'+button('SUBMIT VERIFIED REPORTS','verify','','btn')}
}
if(st.phase===2){const qix=ed.quiz[st.qa],q=questions[qix];if(st.qorder.length!==q[1].length)st.qorder=shuffle(q[1].map((x,i)=>i));content+='<div class="label">OFFICIAL CIVICS TEST · QUESTION '+(90+qix)+' · '+(st.qa+1)+' OF '+ed.quiz.length+'</div><h3>'+esc(q[0])+'</h3><div class="feedback" aria-live="polite">'+esc(st.feedback)+'</div><div class="grid">'+st.qorder.map(i=>button(q[1][i],'answer',i)).join('')+'</div><p>Get both right to unlock the printing press.</p>'}

content+='</section>';root.innerHTML=content}
function results(){const right=questions.filter((q,i)=>st.ft[i]===true).length,miss=questions.map((q,i)=>i).filter(i=>st.ft[i]!==true).map(i=>'Q'+(90+i));return{right,miss,pct:Math.round(right/10*100)}}
function miss(msg){st.wrong++;st.feedback=msg;lockUntil=Date.now()+1200;setTimeout(render,1250)}
function act(action,value){const ed=editions[st.issue];if(/^(sort|place|answer|verify)$/.test(action)&&Date.now()<lockUntil)return;st.feedback='';if(action!=='restart')restartArmed=false;

function wireTurnIn(){const tb=document.getElementById('turnin'),ts=document.getElementById('tistatus'),nb=document.getElementById('studentName');if(!tb)return;nb.value=st.name||'';nb.addEventListener('input',()=>{st.name=nb.value;try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}});nb.addEventListener('blur',()=>{const f=window.classShortName?classShortName(nb.value):nb.value.trim();if(f){nb.value=f;st.name=f;save()}});if(st.turnedIn){tb.textContent='TURNED IN';tb.disabled=true;ts.textContent='Your results were sent to your teacher.';ts.className='ok'}tb.onclick=async()=>{if(!window.classTurnIn){ts.textContent='Turn-in only works on the class website. Screenshot this screen instead.';return}const nm=window.classShortName?classShortName(nb.value):nb.value.trim();if(!/ [A-Z]\.$/.test(nm)){ts.className='';ts.textContent='Type your first name and last initial, like Jordan M.';nb.focus();return}nb.value=nm;st.name=nm;save();const r=results();const byStd=STD.map(([lab,ix])=>lab+': '+ix.filter(i=>st.ft[i]===true).length+' of '+ix.length).join(' · ');const answers={'Standard':'SS.9-12.Gov.14, SS.9-12.Gov.15, SS.9-12.Gov.3','First-try correct':r.right+' of 10 ('+r.pct+'%)','First-try by standard':byStd,'Editions printed':st.done.length+' of 5','Historical corrections made':String(st.wrong),'Test questions to review':r.miss.length?r.miss.join(', '):'None'};tb.disabled=true;ts.className='';ts.textContent='Sending...';try{const res=await window.classTurnIn(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({studentName:nm,assignmentId:'civics-f5-1800s-express',assignmentTitle:'Friday 5 · The 1800s Express',score:r.pct,answers:answers})});const d=await res.json().catch(()=>({}));if(!res.ok)throw new Error(d.error||'Could not send your results.');st.turnedIn=true;save();tb.textContent='TURNED IN';ts.className='ok';ts.textContent='Turned in! Your results were sent to your teacher.'}catch(e){tb.disabled=false;ts.className='';ts.textContent=
