<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thirteen Days: Crisis Room | U.S. History Unit 3 Day 3</title>
<meta name="description" content="Run the crisis room during the Cuban Missile Crisis, October 1962: read the spy photos, play your moves, and keep DEFCON from hitting 1.">
<style>
:root{--ink:#18202c;--muted:#5b6574;--navy:#0f2238;--navy2:#1b3a5c;--red:#c62f2f;--red2:#8f1d1d;--amber:#f2a516;--gold:#ffd166;--green:#23804f;--paper:#fffdf7;--line:#e4dccb;--try:#8a5a00;--sea:#2f79b8}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;color:var(--ink);font:17px/1.45 system-ui,"Segoe UI",Arial,sans-serif;background:#0f2238;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:34px 34px}
button{font:inherit;cursor:pointer;border-radius:14px;min-height:46px}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:30;background:linear-gradient(#162f4d,#0f2238);border-bottom:4px solid var(--red);box-shadow:0 4px 14px #0007;padding:6px max(10px,calc((100vw - 1020px)/2)) 4px;color:#fff}
.hud-in{display:grid;grid-template-columns:auto 1.25fr 1.1fr 1.1fr 1fr;gap:8px;align-items:stretch}
.cal{background:#fff;color:var(--navy);border-radius:10px;text-align:center;min-width:74px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 0 #0005}
.cal span{background:var(--red);color:#fff;font-weight:900;font-size:.72rem;letter-spacing:.08em;padding:1px 6px}
.cal b{font:900 1.35rem/1.1 "Arial Black",Impact,sans-serif}.cal small{font-size:.66rem;font-weight:900;letter-spacing:.04em;padding-bottom:2px}
.mt{position:relative;display:flex;gap:8px;align-items:center;background:#ffffff14;border:2px solid #ffffff2a;border-radius:12px;padding:4px 8px;min-width:0}
.mt-face{position:relative;font-size:1.55rem;line-height:1;flex:none}
.mt-face i{position:absolute;right:-8px;bottom:-6px;font-style:normal;font-size:1rem;background:#fff;border-radius:50%;box-shadow:0 1px 3px #0005}
.mt-r{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:6px}
.lab{grid-column:1/3;font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:#c9d6e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk{position:relative;height:10px;background:#ffffff26;border-radius:9px;overflow:hidden}
.trk span{display:block;height:100%;border-radius:9px;transition:width .7s cubic-bezier(.3,1.4,.5,1)}
#mRisk{background:linear-gradient(90deg,#3fbf6f,#f2a516 50%,#e8452c)}
#mReady{background:linear-gradient(90deg,#f2a516,#e8452c)}
#mFirm{background:linear-gradient(90deg,#6fb2ff,#2f79b8)}
.mt b{font-size:.92rem;color:#fff}
.dc{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:900 1.35rem "Arial Black",Impact,sans-serif;color:#fff;border:3px solid #fff;flex:none;box-shadow:0 0 0 2px #0006;transition:background .5s}
.dc.d5{background:#23804f}.dc.d4{background:#5c9e2e}.dc.d3{background:#d08a00}.dc.d2{background:#d9481f}.dc.d1{background:#9b0d0d}
.mt.rival{background:#3a1d1d;border-color:#c62f2f88}.mt.rival .mt-face{margin-right:8px}.mt.rival .lab{color:#ffb4a8}
.mt.warn{animation:warn 1.2s ease-in-out infinite}
@keyframes warn{50%{box-shadow:0 0 0 4px #ff5a3c99;border-color:#ff5a3c}}
.mt.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.08)}}
.pop{position:absolute;right:6px;bottom:-24px;font-weight:900;font-size:1rem;padding:2px 9px;border-radius:12px;pointer-events:none;animation:floatup 1.9s ease-out forwards;z-index:40;white-space:nowrap}
.pop.good{background:#23804f;color:#fff}.pop.bad{background:#c62f2f;color:#fff}
@keyframes floatup{0%{opacity:0;transform:translateY(14px) scale(.7)}15%{opacity:1;transform:translateY(0) scale(1.2)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.hud-step{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:.74rem;font-weight:900;color:#c9d6e8}
.sbar{flex:1;height:6px;background:#ffffff22;border-radius:6px;overflow:hidden}.sbar span{display:block;height:100%;background:var(--amber);transition:width .4s}
#dayText{color:var(--gold)}

main{max-width:1020px;margin:auto;padding:14px 12px 96px}
.welcome{background:#e3f1e8;color:var(--green);font-weight:800;border-radius:12px;padding:8px 12px;margin:0 0 10px;border:2px solid #b9d8c4;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.welcome[hidden]{display:none}
.notyou{min-height:36px;font:800 .9rem system-ui,Arial,sans-serif;background:#fff;color:var(--green);border:2px solid var(--green);border-radius:10px;padding:5px 12px}
.notyou:hover{background:var(--green);color:#fff}

/* ---------- 1950s newsreel opener ---------- */
.st-reel .stage{background:linear-gradient(180deg,#2b2b2b,#4a4a4a 72%,#1f1f1f 72%)}
.st-reel .stage-art{filter:grayscale(1) drop-shadow(0 4px 0 #0004)}
.fearbar{display:flex;align-items:center;gap:8px;max-width:520px;margin:0 auto 10px;background:#2a2a2a;color:#fff;border-radius:12px;padding:6px 12px;font-size:.9rem}
.fearbar>span{font-size:1.4rem}.fearbar b{white-space:nowrap;text-transform:uppercase;letter-spacing:.05em;font-size:.75rem}
.fearbar .trk{flex:1}.fearbar .trk span{background:linear-gradient(90deg,#f2a516,#e8452c)}
.reels{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:0 0 6px}
.reelc{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:150px;padding:18px 8px 12px;text-align:center;background:#1b1b1b;color:#fff;border:0;border-radius:12px;box-shadow:0 6px 0 #000;
  background-image:radial-gradient(circle,#ffffff22 30%,transparent 32%),radial-gradient(circle,#ffffff22 30%,transparent 32%);background-size:14px 14px;background-position:0 2px,0 calc(100% - 2px);background-repeat:repeat-x;transition:transform .12s}
.reelc:hover:not(:disabled){transform:translateY(-3px) rotate(-1deg)}
.reelc .r-yr{position:absolute;top:6px;left:8px;background:var(--amber);color:#1b1b1b;font:900 .75rem "Arial Black",Impact,sans-serif;border-radius:6px;padding:1px 6px}
.reelc .r-ic{font-size:2.6rem;line-height:1.1}
.reelc .r-tap{font:900 .9rem "Arial Black",Impact,sans-serif;color:var(--gold);letter-spacing:.08em;animation:blink 1.5s infinite}
.reelc.on{background-color:#f4f1e8;color:var(--ink);box-shadow:0 6px 0 #a8a08a;cursor:default;opacity:1;animation:flip .5s ease-out}
.reelc.on .r-ic{filter:grayscale(1)}
.reelc b{font-size:1.05rem;line-height:1.15;color:var(--navy)}.reelc .r-l{font-size:.9rem;font-weight:700;line-height:1.25;color:#3a3a3a}
.check.reelq{background:#f4f1e8;border-color:#1b1b1b}

/* ---------- scene ---------- */
.scene{background:var(--paper);border-radius:20px;overflow:clip;box-shadow:0 10px 30px #0008;border:3px solid #ffffff55}
.sc-top{background:var(--red);color:#fff;padding:8px 18px 9px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.chap{font-size:.74rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;background:#0003;border-radius:8px;padding:2px 8px}
.sc-top h2{margin:0;font-family:"Arial Black","Segoe UI Black",Impact,system-ui,sans-serif;font-size:clamp(1.25rem,2.6vw,1.75rem);text-transform:uppercase}
.black .sc-top{background:#1b1b1b}.black .sc-top .chap{background:var(--red)}
.stage{display:flex;gap:16px;align-items:center;padding:14px 18px;min-height:120px;position:relative;background:linear-gradient(180deg,#203b5c,#2b4d74 72%,#6b4a2f 72%,#5a3d26)}
.stage-art{font-size:4rem;line-height:1;flex:none;filter:drop-shadow(0 4px 0 #0004);min-width:84px;text-align:center}
.st-sea .stage{background:linear-gradient(180deg,#8fc7ef,#5aa4dc 60%,#2f79b8 60%,#245f93)}
.st-un .stage{background:linear-gradient(180deg,#d8e6f3,#bcd2e8 72%,#4a6f96 72%)}
.st-sub .stage{background:linear-gradient(180deg,#0d2e3a,#0f3d4d 70%,#082029 70%)}
.st-black .stage{background:linear-gradient(180deg,#2a2a2a,#3a3030 72%,#1d1515 72%)}
.st-dawn .stage{background:linear-gradient(180deg,#ffd9a0,#ffeccc 70%,#8fb7d8 70%)}
.st-boom .stage{background:radial-gradient(circle at 50% 120%,#ffcc66,#e8452c 40%,#3a0d0d 75%)}
.bubbles{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.bub{display:flex;gap:8px;align-items:flex-end;max-width:660px}
.bub .av{font-size:1.85rem;width:48px;height:48px;flex:none;display:grid;place-items:center;background:#fff;border-radius:50%;border:3px solid var(--navy);box-shadow:0 2px 0 #0004}
.bub .bt{position:relative;background:#fff;border-radius:16px;padding:7px 12px;box-shadow:0 3px 0 #0003;border:2px solid #0f223822}
.bub .bt::before{content:"";position:absolute;left:-9px;bottom:10px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.bub .bt b{display:block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.bub .bt p{margin:0;font-size:1.04rem;font-weight:650}
.bub.stone .av{background:#3a1d1d;border-color:var(--amber)}.bub.stone .bt{background:#3a1d1d;color:#fff;border-color:var(--amber)}.bub.stone .bt::before{border-right-color:#3a1d1d}.bub.stone .bt b{color:var(--gold)}
.bub.khr .bt,.bub.radio .bt{background:#fff4f0;border-color:#c62f2f55}.bub.khr .bt::before,.bub.radio .bt::before{border-right-color:#fff4f0}
.sc-body{padding:14px 18px 18px}

/* ---------- world objects ---------- */
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.howto div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.howto .hi{font-size:2rem}.howto b{color:var(--navy);font-size:1rem;line-height:1.25}
.board{position:relative;max-width:720px;margin:0 auto 8px;background:#fff;border-radius:6px;padding:8px;box-shadow:0 6px 18px #0004;transform:rotate(-.4deg)}
.board svg{display:block;width:100%;height:auto;border-radius:3px}
.board .photo{position:relative}.board .u2img{display:block;width:100%;height:auto;border-radius:3px}
.hot{position:absolute;width:15%;aspect-ratio:1;border-radius:50%;border:3px dashed #fff;background:#ffffff1f;transform:translate(-50%,-50%);min-height:0;padding:0;animation:pulse 1.6s ease-in-out infinite;box-shadow:0 0 0 2px #0008}
.hot:hover{background:#ffffff40}
.hot.found{animation:none;border:3px solid var(--gold);background:transparent;cursor:default}
.hot .tagl{position:absolute;left:50%;top:100%;transform:translateX(-50%);background:var(--gold);color:var(--navy);font:900 .72rem/1.15 "Arial Black",Impact,sans-serif;padding:3px 6px;border-radius:5px;white-space:nowrap;box-shadow:0 2px 0 #0006;animation:pop .35s}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.12);border-color:var(--gold)}}
.found-n{text-align:center;font-weight:900;color:var(--navy);margin:4px 0 0}
.draw-note{position:absolute;top:14px;right:14px;background:#000a;color:#fff;font-size:.68rem;font-weight:900;letter-spacing:.06em;border-radius:6px;padding:2px 7px}
.range{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;margin:8px 0;font-weight:800}
.range .city{background:#fde7e3;color:var(--red2);border-radius:999px;padding:2px 10px;font-size:.92rem}
.src{font-size:.75rem;color:var(--muted);margin:3px 0 0;font-weight:400}
.fict{font-size:.78rem;color:var(--muted);font-style:italic;margin:6px 0}
.real{background:#fff;border:2px dashed #d6c79c;border-radius:12px;padding:6px 12px;margin:10px 0;font-size:.98rem;font-weight:650}.real p{margin:2px 0}
.real-b{display:inline-block;background:#7a5a00;color:#fff;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;border-radius:6px;padding:1px 7px;margin-right:4px;vertical-align:1px}
.tv{max-width:560px;margin:0 auto 10px;background:#4a3524;border-radius:22px;padding:14px 16px 26px;box-shadow:0 8px 0 #2b1d12;position:relative}
.tv::after{content:"";position:absolute;bottom:8px;right:22px;width:14px;height:14px;border-radius:50%;background:#c9a46a;box-shadow:-26px 0 0 #c9a46a}
.screen{background:radial-gradient(circle,#e9eef2,#b9c3cb);border-radius:40px/24px;padding:18px 22px;filter:grayscale(1);font-family:Georgia,serif}
.screen .live{display:inline-block;background:#222;color:#fff;font:900 .7rem system-ui;letter-spacing:.1em;padding:1px 6px;border-radius:4px}
.screen .q{font-size:1.15rem;font-style:italic;margin:6px 0}
.gloss{font-size:.86rem;color:var(--muted);font-family:system-ui,Arial,sans-serif;margin:2px 0}
.sea{max-width:720px;margin:0 auto 8px;border-radius:14px;overflow:hidden;box-shadow:0 4px 0 #0002}
.sea svg{display:block;width:100%;height:auto}
.shipR{transform-box:fill-box}
.turned .shipR{animation:turnback 2.6s ease-in-out .3s forwards}
@keyframes turnback{to{transform:translateX(160px);opacity:.35}}
.fired .flash{animation:flash .9s 2}
@keyframes flash{50%{opacity:1}}
.flash{opacity:0}
.letters{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 8px}
.letters.one{grid-template-columns:1fr;max-width:620px;margin:0 auto 8px}
.tele{background:#fbf8ec;border:1px solid #d8cba6;border-radius:4px;padding:10px 14px;box-shadow:3px 4px 0 #0002;font-family:"Courier New",Courier,monospace;position:relative;background-image:repeating-linear-gradient(#fbf8ec 0 26px,#efe6cc 26px 27px)}
.tele .th{font-weight:900;letter-spacing:.06em;color:var(--red2);margin:0 0 4px;font-size:.85rem}
.tele p{margin:3px 0}.tele .q{font-style:italic;font-size:1.05rem}
.tele .ask{background:#fff3a8;font-weight:900;padding:1px 4px;border-radius:3px;font-family:system-ui,Arial,sans-serif}
.tele.new{border:3px solid var(--red)}
.sonar{width:200px;height:200px;margin:0 auto 8px;border-radius:50%;background:radial-gradient(circle,#0a3a2a 0 30%,#06281d 31% 60%,#041a13 61%);border:4px solid #2ecc71;position:relative;overflow:hidden;box-shadow:0 0 20px #2ecc7166}
.sonar::before,.sonar::after{content:"";position:absolute;inset:0;margin:auto;border:1px solid #2ecc7155;border-radius:50%}
.sonar::before{width:66%;height:66%}.sonar::after{width:33%;height:33%}
.sweep{position:absolute;inset:0;background:conic-gradient(#2ecc7188,transparent 25%);animation:spin 3s linear infinite;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
.blip{position:absolute;left:62%;top:34%;width:12px;height:12px;border-radius:50%;background:#7dffb0;box-shadow:0 0 10px #7dffb0;animation:blink 1.5s infinite}
@keyframes blink{50%{opacity:.2}}
.secret{background:#2a1212;color:#fff;border:3px solid var(--red);border-radius:12px;padding:10px 14px;margin:10px 0;position:relative}
.secret .sh{font:900 .78rem "Arial Black",Impact,sans-serif;letter-spacing:.1em;color:#ff9a8a;margin:0 0 4px}
.secret p{margin:3px 0;font-weight:650}.secret .src{color:#e5c3bd}
.deal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 8px}
.deal div{background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px 12px}
.deal h4{margin:0 0 4px;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.deal .us{border-color:#2f79b8}.deal .su{border-color:var(--red)}
.deal p{margin:3px 0;font-weight:700}
.after{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.after span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:800}
.inv{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.inv span{background:#fff3a8;border:2px solid #e2cf6b;border-radius:8px;padding:2px 10px;font-weight:800;font-size:.9rem;transform:rotate(-1deg)}

/* ---------- in-world checks ---------- */
.check{position:relative;margin:12px 0 6px;padding:12px;border:3px solid var(--navy);border-radius:18px;background:#eef4fb;box-shadow:0 5px 0 #0f223833}
.check.letter{background:#fbf8ec;border-color:#a8894f}
.check.un{background:#eef6ff;border-color:#2f79b8}
.qlabel{position:absolute;top:-16px;left:-12px;font-size:1.6rem;margin:0;background:#fff;border:3px solid var(--navy);border-radius:50%;width:46px;height:46px;display:grid;place-items:center;box-shadow:0 3px 0 #0f223833}
.check .bub{margin-bottom:6px}.check .msg{margin:0 0 6px;min-height:0}.check .bub .bt{border-color:var(--navy)}
.choices{display:grid;gap:8px}
@media(min-width:761px){.check .choices{grid-template-columns:1fr 1fr}}
.reply{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;color:var(--ink);border:3px solid #c9d6e6;padding:10px 12px;font-weight:750;line-height:1.3;border-radius:16px 16px 16px 4px;box-shadow:0 3px 0 #0f223822;transition:transform .12s}
.reply:hover:not(:disabled){transform:translateY(-2px);border-color:var(--navy)}
.reply:disabled{opacity:.55;cursor:not-allowed}
.r-ico{font-size:1.3rem;flex:none}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.msg{min-height:1.3em;font-weight:800;margin:8px 0 0}.msg.try{color:var(--try)}.msg.good{color:var(--green);font-size:1.1rem}
.check.done{background:#f1faf4;border-color:var(--green);box-shadow:none;padding:8px 14px;display:flex;justify-content:center}
.stamp{border:4px solid var(--red);color:var(--red);font:900 1rem/1 "Arial Black",Impact,sans-serif;padding:6px 10px;border-radius:8px;transform:rotate(-8deg);letter-spacing:.05em;background:#fff8;text-transform:uppercase;display:inline-block}
.check.done .stamp{font-size:1.15rem;border-color:var(--green);color:var(--green)}
.slam{animation:slam .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{0%{opacity:0;transform:rotate(-8deg) scale(2.6)}60%{opacity:1;transform:rotate(-8deg) scale(.92)}100%{transform:rotate(-8deg) scale(1)}}

/* ---------- decision cards ---------- */
.pick-h{font:900 1.05rem "Arial Black",Impact,sans-serif;text-transform:uppercase;color:var(--red);margin:14px 0 18px;letter-spacing:.04em}
.cards{display:grid;gap:12px}.cards.n2{grid-template-columns:1fr 1fr}.cards.n3{grid-template-columns:repeat(3,1fr)}.cards.n4{grid-template-columns:repeat(4,1fr)}
.dcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:#fff;border:3px solid var(--navy);border-radius:18px;padding:14px 10px 12px;color:var(--ink);box-shadow:0 6px 0 var(--navy);transition:transform .12s,box-shadow .12s}
.dcard:hover{transform:translateY(-4px) rotate(-.5deg);box-shadow:0 10px 0 var(--navy)}
.dcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--navy)}
.dcard.warred{opacity:.55;cursor:not-allowed;filter:grayscale(.6);transform:none!important}
.dcard.hawk{border-color:var(--red);box-shadow:0 6px 0 var(--red2);background:#fff6f4}
.hawk-tag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#3a1d1d;color:var(--gold);font-size:.66rem;font-weight:900;letter-spacing:.06em;border-radius:8px;padding:2px 8px;white-space:nowrap;border:2px solid var(--amber)}
.d-ico{font-size:2.8rem;line-height:1.1}.d-t{font-size:1.15rem;line-height:1.2;color:var(--navy)}.d-l{font-size:.84rem;color:var(--muted);line-height:1.3;font-weight:650}
.d-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:6px}
.chip{font-size:.8rem;font-weight:900;border-radius:10px;padding:2px 7px;white-space:nowrap}.chip.g{background:#e3f3e8;color:var(--green)}.chip.c{background:#fde7e3;color:var(--red2)}.chip.n{background:#ece7d8;color:var(--ink)}
.chip.doom{background:#9b0d0d;color:#fff;animation:warn 1.2s infinite}

/* ---------- results ---------- */
.result{display:flex;gap:14px;align-items:flex-start;background:#fff;border:3px solid var(--amber);border-radius:18px;padding:12px 14px;margin-top:4px;box-shadow:0 6px 0 #f2a51655}
.flip{animation:flip .6s ease-out}
@keyframes flip{0%{opacity:0;transform:perspective(700px) rotateX(-70deg)}100%{opacity:1;transform:none}}
.r-big{font-size:3.2rem;line-height:1;flex:none}
.r-main{flex:1;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.tag{display:inline-block;font-weight:900;font-size:.85rem;border-radius:12px;padding:3px 10px;white-space:nowrap}.tag.up{background:#dcefe2;color:var(--green)}.tag.down{background:#f9dcd7;color:#9a2f22}.tag.flat{background:#ece7d8;color:var(--ink)}
.whatif{display:inline-block;background:#3a1d1d;color:var(--gold);font-weight:900;font-size:.7rem;letter-spacing:.08em;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.reveal{background:var(--navy);color:#fff;border-radius:14px;padding:10px 14px;margin:10px 0 2px;box-shadow:0 4px 0 #0003}
.reveal .nw{display:inline-block;background:var(--gold);color:var(--navy);font-weight:900;font-size:.72rem;letter-spacing:.08em;border-radius:8px;padding:2px 8px;margin-bottom:4px}
.reveal p{margin:0;font-size:1.05rem}.reveal b{color:var(--gold)}
.go{margin-top:14px;background:var(--red);color:#fff;border:0;padding:13px 26px;font:900 1.1rem system-ui,Arial,sans-serif;box-shadow:0 5px 0 var(--red2)}
.go:hover{filter:brightness(1.08)}.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red2)}.go:disabled{opacity:.6}
.go.rew{background:var(--navy);box-shadow:0 5px 0 #000}

/* ---------- endings ---------- */
.front{background:#f7f1e1;border:1px solid #d8cba6;padding:12px 16px;box-shadow:4px 6px 0 #0002;font-family:Georgia,serif;position:relative}
.front .masthead{font:900 clamp(.85rem,2.2vw,1.2rem) Georgia,serif;text-align:center;border-bottom:4px double #222;margin:0 0 8px;letter-spacing:.04em}
.headline{display:flex;gap:12px;align-items:center}.e-big{font-size:3.2rem;line-height:1}
.headline h3{margin:0;font:900 clamp(1.5rem,4vw,2.3rem)/1.05 "Arial Black",Impact,sans-serif;text-transform:uppercase;color:var(--navy)}
.front.bad .headline h3{color:var(--red2)}
.front>p{font-size:1.08rem;margin:6px 0}
.front .stamp{position:absolute;right:14px;top:44px;font-size:.95rem}
.finalm{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;font-family:system-ui,Arial,sans-serif}.finalm span{background:#fff;border-radius:10px;padding:4px 10px;font-weight:700;border:1px solid var(--line)}
.cb{margin:10px 0 4px;font-family:system-ui,Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:.85rem}
.trail{list-style:none;padding:0;margin:0;display:grid;gap:5px;font-family:system-ui,Arial,sans-serif}.trail li{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:.92rem}
.trail .tags{margin:0}
.boom{text-align:center;background:#1b0b0b;color:#fff;border-radius:16px;padding:16px;border:3px solid var(--red)}
.boom h3{font:900 clamp(1.6rem,4vw,2.4rem) "Arial Black",Impact,sans-serif;margin:4px 0;color:#ff9a8a}
.boom p{margin:4px 0;font-weight:650}

/* ---------- memo ---------- */
.memo{background:#fffdf3;border:3px solid var(--navy);border-radius:6px;padding:12px 16px;box-shadow:0 6px 0 #0002;position:relative}
.memo-h{font:900 1rem "Arial Black",Impact,sans-serif;color:var(--red);margin:0 0 6px;letter-spacing:.06em;padding-right:120px}
.memo .ts{position:absolute;right:12px;top:8px;border:3px solid var(--red);color:var(--red);font:900 .8rem "Arial Black",Impact,sans-serif;padding:2px 6px;transform:rotate(6deg)}
label{display:block;font-weight:850;margin:12px 0 4px}.stem{margin:0 0 4px;color:var(--muted);font-size:.92rem}.stem::before{content:"✏️ "}
.vrow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.back{margin-top:14px;background:#fff;border:3px solid var(--navy);color:var(--navy);font-weight:900;padding:10px 18px}
input,textarea{width:100%;font:inherit;border:2px solid #cfc6af;border-radius:10px;padding:10px;background:#fff;color:var(--ink)}

/* ---------- title ---------- */
.title-card{background:var(--paper);border-radius:22px;padding:22px 26px;box-shadow:0 12px 36px #000a;border:4px solid var(--amber);position:relative;overflow:hidden}
.title-card::before{content:"";position:absolute;inset:0 0 auto 0;height:10px;background:repeating-linear-gradient(135deg,#18202c 0 18px,var(--amber) 18px 36px)}
.t-grid{display:grid;grid-template-columns:1.45fr 1fr;gap:20px;align-items:center}
.t-kick{font-size:.76rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin:6px 0 0}
h1{font-family:"Arial Black","Segoe UI Black",Impact,system-ui,sans-serif;font-size:clamp(2.3rem,5.6vw,3.8rem);line-height:.98;margin:4px 0 8px;color:var(--navy);text-transform:uppercase;text-shadow:3px 3px 0 var(--amber)}
.hook{font-size:1.2rem;font-weight:700;margin:0 0 10px}
.t-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.t-chips span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:750;font-size:.92rem}
.goal{background:#e7eef8;border-radius:12px;padding:6px 12px;margin:6px 0}
.t-row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}.t-row input{flex:1;min-width:200px}
.go.start{margin-top:0;font-size:1.3rem;padding:12px 34px}
.t-art{display:flex;flex-direction:column;align-items:center;gap:12px}
.dial{display:flex;gap:4px}.dial span{width:44px;height:58px;border-radius:8px;display:grid;place-items:center;font:900 1.6rem "Arial Black",Impact,sans-serif;color:#fff;box-shadow:0 4px 0 #0004}
.dial .d5{background:#23804f}.dial .d4{background:#5c9e2e}.dial .d3{background:#d08a00}.dial .d2{background:#d9481f}.dial .d1{background:#9b0d0d;animation:warn 1.4s infinite}
.dial-l{font:900 .8rem "Arial Black",Impact,sans-serif;letter-spacing:.2em;color:var(--navy)}
.t-cast{display:flex;align-items:center;gap:8px;font-size:2.6rem}.t-cast .vs{font:900 1rem "Arial Black",Impact,sans-serif;background:var(--red);color:#fff;border-radius:50%;width:40px;height:40px;display:grid;place-items:center}
.calbig{background:#fff;border-radius:10px;overflow:hidden;text-align:center;box-shadow:0 6px 0 #0003;border:2px solid var(--navy);transform:rotate(3deg)}
.calbig span{display:block;background:var(--red);color:#fff;font-weight:900;font-size:.8rem;letter-spacing:.1em;padding:2px 10px}.calbig b{display:block;font:900 2.4rem "Arial Black",Impact,sans-serif;color:var(--navy);padding:0 14px}.calbig small{display:block;font-weight:900;font-size:.7rem;padding-bottom:3px}

.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;color:#c9d3e2;font-size:.85rem}
.foot button{background:#ffffff22;border:2px solid #ffffff44;padding:8px 12px;font-weight:800;color:#fff;min-height:40px}

@media(max-width:760px){
  .hud{padding:5px 6px 3px}
  .hud-in{grid-template-columns:1fr 1fr;gap:5px}
  .cal{display:none}.dsuf{display:none}
  .mt{padding:3px 6px;gap:6px}.mt-face{font-size:1.2rem}.lab{font-size:.62rem}.mt b{font-size:.8rem}.dc{width:32px;height:32px;font-size:1.05rem;border-width:2px}
  .stage{flex-direction:column;align-items:stretch;gap:8px;padding:10px 12px;min-height:0}
  .stage-art{font-size:2.8rem;min-width:0}
  .bub .av{width:40px;height:40px;font-size:1.45rem}.bub .bt p{font-size:.98rem}
  .sc-body{padding:12px}
  .howto{grid-template-columns:1fr}.howto div{flex-direction:row;text-align:left;gap:10px}
  .letters,.deal{grid-template-columns:1fr}
  .reels{grid-template-columns:1fr 1fr}.reelc{min-height:120px}.reelc:last-child:nth-child(odd){grid-column:1/-1}
  .cards.n2,.cards.n3,.cards.n4{grid-template-columns:1fr}
  .dcard{flex-direction:row;flex-wrap:wrap;text-align:left;justify-content:flex-start;padding:12px 12px 10px;gap:2px 10px}
  .d-ico{font-size:2.1rem}.d-t{flex:1;min-width:150px}.d-l{width:100%}.d-chips{justify-content:flex-start;width:100%}
  .hawk-tag{left:auto;right:10px;transform:none}
  .t-grid{grid-template-columns:1fr}.t-art{display:none}
  .title-card{padding:18px 16px}
  .result{flex-direction:column;gap:6px}.r-big{font-size:2.4rem}
  .front .stamp{position:static;margin:6px 0}
  .hot{width:20%}
  }
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.hud,.foot,.go{display:none}}
