<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case File: Did They Get to Choose?</title>
<style>
:root{--ink:#1d2a44;--navy:#1d2f55;--gold:#d6a630;--paper:#f6f0e2;--card:#fffdf8;--line:#e2d8c3;--red:#b3261e;--green:#1f7a45;--blue:#2c64a8;--muted:#5d6676;--manila:#f3dfa8;--manila2:#e7cc85}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.45 system-ui,"Segoe UI",Arial,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #3f8fd1;outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px}
/* top bar */
.topbar{background:#fff;border-bottom:4px solid var(--gold)}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:48px}
.brand{font-weight:900;color:var(--navy);white-space:nowrap}
.stepbox{flex:1;min-width:0}
.steptext{font-size:.8rem;font-weight:800;color:var(--muted)}
.track{height:8px;background:#ece4d2;border-radius:99px;overflow:hidden;margin-top:3px}
.fill{height:100%;width:0;background:linear-gradient(90deg,#d6a630,#f2c94c);transition:width .4s}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:6px}
main{padding:14px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,2.6vw,24px);box-shadow:0 8px 24px #3b2f1412;margin-bottom:14px}
.kicker{font-size:.76rem;letter-spacing:.14em;font-weight:900;color:#9a6f12;text-transform:uppercase;margin:0 0 2px}
h1{font-size:clamp(2rem,5.4vw,3.2rem);line-height:1.02;margin:6px 0 8px;color:var(--navy)}
h2{font-size:clamp(1.35rem,3vw,1.85rem);line-height:1.15;margin:2px 0 8px;color:var(--navy)}
p{margin:6px 0}
.small{font-size:.85rem;color:var(--muted)}
.go{display:inline-block;background:var(--red);color:#fff;border:0;border-radius:12px;padding:13px 24px;font-weight:900;font-size:1.08rem;box-shadow:0 4px 0 #7d241b;margin-top:12px}
.go:hover{transform:translateY(-1px)}
.go.big{font-size:1.3rem;padding:16px 36px}
.go:disabled{background:#b8b0a2;box-shadow:none;cursor:not-allowed;transform:none}
.welcome{background:#e4f3e9;color:#14532d;border:1px solid #83b394;border-radius:10px;padding:9px 12px;margin:0 0 12px;font-weight:700}
/* title */
.title-card{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;align-items:center;background:linear-gradient(135deg,#fffdf8,#fbf0d4)}
.hook{font-size:1.18rem;font-weight:700}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.facts span{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.9rem;font-weight:800}
.goal{background:#eef4fb;border-left:5px solid var(--blue);border-radius:8px;padding:8px 11px;margin:8px 0}
.heads{font-size:.82rem;color:var(--muted);margin-top:10px}
.folder-art{position:relative;max-width:320px;margin:auto;aspect-ratio:1.25;background:var(--manila);border:2px solid #c9a855;border-radius:6px 16px 12px 12px;box-shadow:0 14px 26px #5a441a33;transform:rotate(-3deg);display:grid;place-items:center;text-align:center;padding:16px}
.folder-art::before{content:"";position:absolute;top:-22px;left:-2px;width:42%;height:24px;background:var(--manila2);border:2px solid #c9a855;border-bottom:0;border-radius:10px 10px 0 0}
.folder-art b{display:block;font:900 1.35rem/1.1 "Courier New",monospace;letter-spacing:.06em;color:#5b4310}
.folder-art small{display:block;font:800 .8rem/1.3 "Courier New",monospace;color:#7a5c1a;margin-top:6px}
.folder-art .stamp{position:absolute;right:-14px;top:-14px}
/* stamps */
.stamp{display:inline-block;border:4px solid var(--red);color:var(--red);background:#fffc;font:900 1rem/1 system-ui,Arial,sans-serif;letter-spacing:.12em;padding:7px 11px;border-radius:6px;transform:rotate(-10deg);animation:slam .45s cubic-bezier(.2,1.6,.4,1) both}
.stamp.green{border-color:var(--green);color:var(--green)}
@keyframes slam{0%{transform:rotate(-10deg) scale(3);opacity:0}100%{transform:rotate(-10deg) scale(1);opacity:1}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* case board */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 12px}
.pin{background:var(--manila);border:2px solid #d2b46a;border-radius:4px 10px 10px 10px;padding:6px 8px;text-align:center;font-weight:900;font-size:.9rem;position:relative;min-height:56px;display:grid;align-content:center;gap:2px}
.pin .pin-s{font-size:.7rem;letter-spacing:.06em;color:#7a5c1a}
.pin.now{outline:3px solid var(--red);outline-offset:1px}
.pin.kept{background:#e2f2e7;border-color:#8cc5a0}.pin.kept .pin-s{color:var(--green)}
.pin.broken{background:#fbe3df;border-color:#e3a79e}.pin.broken .pin-s{color:var(--red)}
.pin.locked{opacity:.55}
.tally{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.tally span{border-radius:10px;padding:6px 12px;font-weight:900}
.tally .k{background:#e2f2e7;color:var(--green)}.tally .b{background:#fbe3df;color:var(--red)}
/* source + file layout */
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:18px;align-items:start}
figure{margin:0}
.source{position:relative;background:#ece5d6;border:1px solid #cfc3aa;border-radius:12px;padding:8px}
.source img{width:100%;height:auto;display:block;border-radius:6px;background:#fff}
.source figcaption{font-size:.78rem;color:#55606e;padding:6px 2px 0;line-height:1.35}
.source .big-stamp{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-10deg);font-size:clamp(1.2rem,3.4vw,2rem);padding:10px 16px;border-width:5px;background:#fffd;animation:slam2 .45s cubic-bezier(.2,1.6,.4,1) both;white-space:nowrap}
@keyframes slam2{0%{transform:translate(-50%,-50%) rotate(-10deg) scale(3);opacity:0}100%{transform:translate(-50%,-50%) rotate(-10deg) scale(1);opacity:1}}
.zoom{position:absolute;right:14px;top:14px;background:#fffe;border:1px solid #cfc3aa;border-radius:8px;padding:4px 9px;font-size:.82rem;font-weight:800}
.look{background:#fff3cf;border:2px solid #ecd08a;border-radius:10px;padding:7px 11px;font-weight:800;margin:8px 0 0}
.notes{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px;counter-reset:n}
.notes li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 10px 7px 40px;position:relative;counter-increment:n}
.notes li::before{content:counter(n);position:absolute;left:9px;top:7px;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-weight:900;font-size:.8rem;display:grid;place-items:center}
.chief{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.chief .face{flex:none;width:44px;height:44px;border-radius:50%;background:#f4ead2;border:2px solid #d8c28c;display:grid;place-items:center;font-size:1.5rem}
.chief .say{background:#fff;border:2px solid var(--line);border-radius:4px 14px 14px 14px;padding:7px 11px;font-weight:650}
.chief .who{display:block;font-size:.72rem;font-weight:900;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.q{font-weight:900;font-size:1.1rem;margin:12px 0 6px;color:var(--navy)}
.stamps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stampbtn{background:#fff;border:3px solid #c9b48a;border-radius:12px;padding:9px 8px;text-align:center;box-shadow:0 4px 0 #e3d3ad;display:grid;gap:1px;justify-items:center;min-height:86px}
.stampbtn i{font-style:normal;font-size:1.6rem;line-height:1.1}
.stampbtn b{letter-spacing:.06em;font-size:.9rem;color:var(--navy)}
.stampbtn span{font-size:.8rem;color:#4c5361;line-height:1.25}
.stampbtn:hover:not(:disabled){border-color:var(--navy);transform:translateY(-2px)}
.stampbtn:disabled{opacity:.55;cursor:not-allowed}
.msg{min-height:1.3em;font-weight:700;margin-top:8px}
.msg.bad{color:#8a4b0c}.msg.good{color:var(--green)}
.result{border-left:6px solid var(--gold);background:#fff8e6;border-radius:12px;padding:14px 13px 10px;margin-top:10px}
.result .stamp{margin:4px 0 12px 6px}
.next{background:#eef4fb;border-radius:10px;padding:8px 11px;margin-top:8px}
.next img{width:100%;max-width:420px;display:block;border-radius:8px;margin:6px 0 2px}
/* doc + check */
.doc{background:#fffaf0;border:2px solid #b89a5a;border-radius:6px;padding:12px 16px;box-shadow:0 6px 18px #5a441a22}
.doc-h{font:800 .78rem/1.3 "Courier New",monospace;letter-spacing:.05em;text-transform:uppercase;color:#6b4a07;margin:0}
.doc-text{font:1.15rem/1.5 Georgia,"Times New Roman",serif;margin:6px 0 0}
.plain{background:#eef4fb;border-radius:8px;padding:6px 10px;margin-top:8px;font-weight:700}
.terms{margin:10px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.terms li{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:.95rem}
.check{background:#f4f8fc;border:2px solid #b9cfe6;border-radius:14px;padding:12px 14px;margin-top:12px}
.choices{display:grid;gap:8px;margin-top:8px}
.choice{text-align:left;background:#fff;border:2px solid #cdd8e6;border-radius:11px;padding:11px 13px;min-height:50px;font-weight:650}
.choice:hover:not(:disabled){border-color:var(--blue)}
.choice:disabled{opacity:.55;cursor:not-allowed}
.done-check{background:#e9f6ee;border:2px solid #9fcfb0;border-radius:12px;padding:10px 12px;margin-top:12px}
.kit{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.kit div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:.85rem}
.kit div.keep{border-color:#8cc5a0;background:#f1faf4}
.kit i{display:block;font-style:normal;font-size:1.5rem}
.kit b{display:block;letter-spacing:.05em;color:var(--navy)}
.namebar{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;font-weight:800;color:#4c5361;margin-top:6px}
/* hotspots */
.pic{position:relative;line-height:0;cursor:crosshair}
.hot{position:absolute;background:transparent;border:0;border-radius:10px;padding:0}
.hot.found{border:4px solid var(--gold);box-shadow:0 0 0 3px #fffc;cursor:default}
.hot.pulse{border:4px dashed var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px #b3261e44}}
.tag{position:absolute;left:50%;top:100%;transform:translate(-50%,4px);background:var(--navy);color:#fff;font:800 .74rem/1.2 system-ui,Arial,sans-serif;border-radius:6px;padding:3px 6px;white-space:nowrap;z-index:2}
.task{background:#fff3cf;border:2px solid #ecd08a;border-radius:12px;padding:9px 12px;font-weight:800}
.task.ok{background:#e2f2e7;border-color:#9fcfb0}
/* front page */
.paper{background:#fffdf6;border:2px solid #2a2a2a;border-radius:4px;padding:12px 16px;box-shadow:5px 5px 0 #2a2a2a22}
.mast{display:flex;justify-content:space-between;gap:8px;border-bottom:3px double #2a2a2a;font:900 .8rem/1.6 Georgia,serif;letter-spacing:.12em}
.headline{font:900 clamp(1.4rem,3.6vw,2.1rem)/1.1 Georgia,"Times New Roman",serif;margin:8px 0 4px;text-transform:uppercase;min-height:1.1em}
.byline{font:italic .9rem Georgia,serif;color:#444}
.heads3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.hbtn{background:#fff;border:2px solid #2a2a2a;border-radius:6px;padding:10px;font:900 .9rem/1.2 Georgia,serif;text-transform:uppercase;box-shadow:3px 3px 0 #2a2a2a33}
.hbtn.on{background:#1d2f55;color:#fff}
label{display:block;font-weight:850;color:var(--navy);margin:14px 0 4px}
.stem{font-size:.92rem;color:#4c5361;margin:0 0 5px}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);padding:10px 12px;border:2px solid #cbbf9f;border-radius:9px;background:#fff}
textarea{min-height:90px;resize:vertical}
.turned{background:#e2f2e7;border:2px solid #9fcfb0;border-radius:12px;padding:10px 12px;font-weight:900;color:var(--green);margin-top:10px}
.sources{font-size:.78rem;color:var(--muted);margin-top:12px}
.sources summary{cursor:pointer;font-weight:800}
/* zoom overlay */
.overlay{position:fixed;inset:0;background:#000d;z-index:50;display:grid;place-items:center;padding:12px;cursor:zoom-out}
.overlay img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}

/* round 2 */
.lines{margin:6px 0}.lines p{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 11px;margin:0 0 6px;font-size:1.02rem}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ynbtn{background:#fff;border:3px solid #c9b48a;border-radius:14px;padding:10px;display:grid;justify-items:center;gap:1px;box-shadow:0 4px 0 #e3d3ad}
.ynbtn i{font-style:normal;font-size:1.7rem}.ynbtn b{font-size:1.4rem;letter-spacing:.08em;color:var(--navy)}.ynbtn span{font-size:.85rem;color:#4c5361}
.ynbtn:hover:not(:disabled){border-color:var(--navy);transform:translateY(-2px)}.ynbtn:disabled{opacity:.55;cursor:not-allowed}
.bigpromise{font-size:1.3rem;background:#eef4fb;border-left:6px solid var(--blue);border-radius:10px;padding:10px 13px;margin:0 0 6px}
.howto{font-size:1.05rem;margin-top:12px}
.promise-photo img{max-height:250px}
.doc{padding:9px 13px}
.prove{margin:4px 0 6px}
.board{margin:0 0 8px}.pin{min-height:36px;padding:3px 6px;gap:0}
h2 .yr{font-size:.8rem;font-weight:800;color:#9a6f12;letter-spacing:.06em;vertical-align:middle;margin-left:6px;white-space:nowrap}
.source img{max-height:400px;object-fit:contain}
.cartoon-fit .pic img{max-height:400px;width:auto;max-width:100%;margin:auto}
.cartoon-fit .pic{display:table;margin:auto}
.notes{display:grid;gap:6px;margin:6px 0}
.note{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.95rem;line-height:1.35}
.note.pick{border:2px solid #c9b48a;box-shadow:0 3px 0 #e3d3ad;font-weight:600}
.note.pick:hover:not(:disabled){border-color:var(--navy);transform:translateY(-1px)}
.note.pick:disabled{opacity:.55;cursor:not-allowed}
.note.proved{border:2px solid #8cc5a0;background:#f1faf4}
.chief{margin:6px 0}.chief .say{padding:5px 10px}
.q{margin:8px 0 6px}
.stampbtn{min-height:60px;padding:4px 6px;gap:0}.stampbtn span{font-size:.76rem}
.stampbtn i{font-size:1.3rem}
.right{color:var(--green);font-weight:900;font-size:1.05rem;margin:0 0 4px}
.wwi{background:#fff8e6;border:2px solid #ecd08a;border-radius:10px;padding:8px 11px;margin-bottom:10px;font-size:.95rem}
.ideas{background:#eef4fb;border-radius:8px;padding:5px 9px;font-size:.88rem;font-weight:700;margin:0 0 5px}
.next img{max-width:280px}
.look{padding:5px 10px;margin:4px 0 0;font-size:.95rem}
@media (max-width:820px){
 .title-card,.split{grid-template-columns:1fr}
 .folder-art{max-width:240px;margin:24px auto 6px}
 .kit{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
 body{font-size:16px}
 .brand{display:none}
 .board{grid-template-columns:repeat(5,1fr);gap:4px}
 .pin{font-size:.72rem;padding:4px 3px;min-height:46px}.pin .pin-s{font-size:.6rem}
 .heads3,.terms{grid-template-columns:1fr}
}
@media print{.topbar,.go,.linkbtn{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
<script src="../shared/assignments.js?v=20261104notes1"></script><script src="../shared/turnin.js?v=20261103ttt"></script><script src="../shared/lang.js?v=20261103c"></script></head>
<body>
<div class="topbar"><div class="wrap">
  <span class="brand">📁 Did They Get to Choose?</span>
  <div class="stepbox" id="stepbox" hidden><div class="steptext" id="steptext"></div><div class="track"><div class="fill" id="fill"></div></div></div>
  <button type="button" class="linkbtn" id="restartBtn" hidden>Start over</button>
</div></div>
<main class="wrap"><div id="app"></div></main>
<script src="game.js?v=20261103choosett"></script>
</body>
</html>
