<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Who Do I Call? | Government Unit 6 Day 2</title>
<meta name="description" content="Real problems around Marion, Iowa. Send each call to the right government: the city, Linn County, the school board, the state of Iowa, or the Meskwaki Nation.">
<link rel="stylesheet" href="style.css?v=20261103gwc">
<script src="../../shared/assignments.js?v=20261103p12"></script>
<script src="../../shared/turnin.js?v=20261103d"></script>
</head><body class="on-title">
<div class="hud" id="hud" hidden aria-label="Your phone">
  <div class="hud-in">
    <div class="you"><span class="yface" aria-hidden="true">📱</span><span class="yt"><b>On call</b><small id="youName"></small></span></div>
    <div class="parts" id="parts" aria-label="Rounds"></div>
    <div class="m" id="mHold" title="Time your callers spent on hold"><span class="mi" aria-hidden="true">⏱️</span><span class="ml">On hold</span><span class="bar"><span id="holdFill"></span></span><span class="mn" id="holdNum">0 min</span></div>
    <div class="tray" id="tray" aria-label="Big problems fixed"></div>
  </div>
  <div class="goalrow"><span class="goalchip">🎯 Right office first try = no hold time</span><span class="stepn" id="stepN"></span></div>
</div>
<main id="wrap">
  <div class="welcome" id="welcome" role="status" hidden></div>
  <section id="app" aria-live="polite"></section>
  <div class="foot"><span>Progress saves on this device. Your teacher sees your work after you turn it in.</span><button type="button" id="restartBtn">Start over</button></div>
</main>
<script src="game.js?v=20261103gwc"></script>
</body></html>
