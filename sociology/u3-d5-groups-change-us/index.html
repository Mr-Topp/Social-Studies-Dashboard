<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="Run a summer camp for a week: split 12 campers with a coin flip, keep the rivalry from exploding, and find what really brings two groups together.">

<div class="hud" id="hud" hidden aria-label="Camp week">

      <div class="m" id="mVoice" title="Your voice"><span class="mi" aria-hidden="true">🗣️</span><span class="ml">Your voice</span><span class="pips" id="voicePips"></span></div>
    </div>

  </div>
  <div class="days" id="days" aria-label="Day"></div>
</div>
<main id="wrap">
  <div class="welcome" id="welcome" role="status" hidden></div>
