<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Front Page: A Nation Divided | U.S. History Unit 3 Day 4</title>
<meta name="description" content="Run an Iowa newspaper, 1964–1973. Pick what leads the front page while the White House pushes and readers split over Vietnam.">
<style>
:root{--ink:#1b1b1d;--muted:#5e5a52;--paper:#fffdf6;--news:#f4ecd8;--line:#d9ceb2;--red:#c4262e;--red2:#8c161c;--navy:#1d3557;--hawk:#b5562a;--dove:#2f7fbf;--gold:#ffd166;--green:#23804f;--try:#8a5a00}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;color:var(--ink);font:17px/1.45 system-ui,"Segoe UI",Arial,sans-serif;background:#efe4c9;background-image:radial-gradient(#d9c9a3 1px,transparent 1.4px);background-size:14px 14px}
button{font:inherit;cursor:pointer;border-radius:14px;min-height:46px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #2f7dbd;outline-offset:2px}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:30;background:#1b1b1d;border-bottom:4px solid var(--red);box-shadow:0 4px 14px #0005;padding:6px max(10px,calc((100vw - 1040px)/2)) 4px;color:#fff}
.hud-in{display:grid;grid-template-columns:auto 1fr 1.15fr 1.15fr 1.3fr;gap:8px;align-items:stretch}
.yr{background:var(--paper);color:var(--ink);border-radius:8px;text-align:center;min-width:72px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 0 #0006}
.yr span{background:var(--red);color:#fff;font-weight:900;font-size:.68rem;letter-spacing:.08em;padding:1px 6px}
.yr b{font:900 1.3rem/1.15 Georgia,"Times New Roman",serif}
.mt{position:relative;display:flex;gap:8px;align-items:center;background:#ffffff12;border:2px solid #ffffff26;border-radius:12px;padding:4px 8px;min-width:0}
.mt-face{position:relative;font-size:1.5rem;line-height:1;flex:none}
.mt-face i{position:absolute;right:-9px;bottom:-6px;font-style:normal;font-size:.95rem;background:#fff;border-radius:50%;box-shadow:0 1px 3px #0005}
.mt-r{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:6px}
.lab{grid-column:1/3;font-size:.66rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:#d9d2c3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk{position:relative;height:10px;background:#ffffff26;border-radius:9px;overflow:hidden}
.trk span{display:block;height:100%;border-radius:9px;transition:width .7s cubic-bezier(.3,1.4,.5,1)}
#mTrust{background:linear-gradient(90deg,#e8452c,#f2a516 40%,#3fbf6f)}
#mAccess{background:linear-gradient(90deg,#6f8fb8,#9ec1ff)}
.mt b{font-size:.9rem;color:#fff}
.mt.rival{background:#1d3557;border-color:#9ec1ff66}
.tug{position:relative;height:12px;border-radius:9px;background:linear-gradient(90deg,var(--hawk),#ffffff40 45% 55%,var(--dove));grid-column:1/3;margin:2px 0}
.tug i{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #1b1b1d;transform:translate(-50%,-50%);transition:left .7s cubic-bezier(.3,1.4,.5,1);box-shadow:0 0 0 2px #fff8}
.tug-ends{grid-column:1/3;display:flex;justify-content:space-between;font-size:.66rem;font-weight:900;color:#d9d2c3}
.gap{grid-column:1/3;display:flex;align-items:center;gap:4px;font-size:.62rem;font-weight:900}
.gap .said,.gap .seen{background:#fff;color:var(--ink);border-radius:5px;padding:0 5px;white-space:nowrap}
.gap .said{background:#9ec1ff}.gap .seen{background:#ffd166}
.gap .mid{flex:1;height:8px;position:relative}
.gap .mid span{position:absolute;left:50%;top:0;height:100%;transform:translateX(-50%);background:repeating-linear-gradient(90deg,#e8452c 0 5px,transparent 5px 8px);border-radius:4px;transition:width .8s}
.hide{font-size:.78rem;font-weight:900;background:#3a1d1d;border:2px solid #e8452c88;border-radius:8px;padding:0 6px;white-space:nowrap}
.mt.warn{animation:warn 1.2s ease-in-out infinite}
@keyframes warn{50%{box-shadow:0 0 0 4px #ff5a3c99;border-color:#ff5a3c}}
.mt.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.07)}}
.pop{position:absolute;right:6px;bottom:-24px;font-weight:900;font-size:.95rem;padding:2px 9px;border-radius:12px;pointer-events:none;animation:floatup 1.9s ease-out forwards;z-index:40;white-space:nowrap}
.pop.good{background:#23804f;color:#fff}.pop.bad{background:#c4262e;color:#fff}.pop.n{background:#fff;color:var(--ink)}
@keyframes floatup{0%{opacity:0;transform:translateY(14px) scale(.7)}15%{opacity:1;transform:translateY(0) scale(1.2)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.hud-step{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:.72rem;font-weight:900;color:#d9d2c3}
.sbar{flex:1;height:6px;background:#ffffff22;border-radius:6px;overflow:hidden}.sbar span{display:block;height:100%;background:var(--gold);transition:width .4s}

main{max-width:1040px;margin:auto;padding:14px 12px 96px}
.welcome{background:#e3f1e8;color:var(--green);font-weight:800;border-radius:12px;padding:8px 12px;margin:0 0 10px;border:2px solid #b9d8c4;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.welcome[hidden]{display:none}
.notyou{min-height:36px;font:800 .9rem system-ui,Arial,sans-serif;background:#fff;color:var(--green);border:2px solid var(--green);border-radius:10px;padding:5px 12px}
.notyou:hover{background:var(--green);color:#fff}

/* ---------- scene ---------- */
.scene{background:var(--paper);border-radius:18px;overflow:clip;box-shadow:0 10px 26px #5a4a2a55;border:3px solid #1b1b1d}
.sc-top{background:var(--ink);color:#fff;padding:7px 16px 8px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:4px solid var(--red)}
.chap{font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;background:var(--red);border-radius:6px;padding:2px 8px}
.sc-top h2{margin:0;font:900 clamp(1.25rem,2.6vw,1.75rem) Georgia,"Times New Roman",serif;letter-spacing:.01em}
.stage{display:flex;gap:16px;align-items:center;padding:10px 18px;position:relative;background:linear-gradient(180deg,#f7e7c4,#f1dcae 70%,#8a5f3c 70%,#6f4a2d)}
.stage-art{font-size:3.6rem;line-height:1;flex:none;filter:drop-shadow(0 4px 0 #0003);min-width:80px;text-align:center}
.st-file .stage{background:linear-gradient(180deg,#e3e7ea,#cfd6db 70%,#6b7b86 70%)}
.st-tv .stage{background:linear-gradient(180deg,#2b3440,#3b4656 70%,#1d232b 70%)}
.st-gray .stage{background:linear-gradient(180deg,#d6d6d6,#c2c2c2 70%,#5b5b5b 70%)}
.st-night .stage{background:linear-gradient(180deg,#1e2a44,#2b3b5e 70%,#141c2e 70%)}
.st-dawn .stage{background:linear-gradient(180deg,#ffe0ad,#fff0d4 70%,#9cc3e0 70%)}
.bubbles{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.bub{display:flex;gap:8px;align-items:flex-end;max-width:680px}
.bub .av{font-size:1.75rem;width:46px;height:46px;flex:none;display:grid;place-items:center;background:#fff;border-radius:50%;border:3px solid var(--ink);box-shadow:0 2px 0 #0004}
.bub .bt{position:relative;background:#fff;border-radius:16px;padding:6px 12px;box-shadow:0 3px 0 #0002;border:2px solid #1b1b1d22}
.bub .bt::before{content:"";position:absolute;left:-9px;bottom:10px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.bub .bt b{display:block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.bub .bt p{margin:0;font-size:1.03rem;font-weight:650}
.bub.hale .av{background:#1d3557;border-color:#9ec1ff}.bub.hale .bt{background:#1d3557;color:#fff;border-color:#9ec1ff}.bub.hale .bt::before{border-right-color:#1d3557}.bub.hale .bt b{color:#9ec1ff}
.bub.lou .av{background:#fff3c4;border-color:#c49a1d}
.sc-body{padding:14px 18px 18px}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.howto div{background:#fff;border:2px dashed var(--line);border-radius:12px;padding:5px 10px;display:flex;gap:8px;align-items:center}
.howto .hi{font-size:1.5rem}.howto b{font-size:.95rem;line-height:1.2}
.key{font-size:.82rem;font-weight:800;color:var(--muted);margin:10px 0 0;text-align:center}
.src{font-size:.74rem;color:var(--muted);margin:3px 0 0;font-weight:400}
.fict{font-size:.78rem;color:var(--muted);font-style:italic;margin:6px 0}

/* ---------- newsroom desk ---------- */
.desk{display:grid;grid-template-columns:1fr 1.15fr;gap:16px;align-items:start}
.wire h3,.pagecol h3{margin:0 0 8px;font:900 .82rem "Arial Black",Impact,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.cards{display:grid;gap:12px}
.scard{position:relative;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;color:var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .12s,box-shadow .12s,opacity .2s}
.scard:hover:not(:disabled){transform:translateY(-3px) rotate(-.4deg);box-shadow:0 8px 0 var(--ink)}
.scard:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.scard .s-ico{grid-row:1/4;font-size:2.4rem;line-height:1}
.scard .s-t{font:900 1.12rem/1.15 Georgia,"Times New Roman",serif}
.scard .s-l{font-size:.86rem;color:var(--muted);font-weight:650;line-height:1.25}
.scard.used{opacity:.4;transform:none;box-shadow:0 2px 0 var(--ink)}
.scard .slot-tag{position:absolute;top:-11px;right:10px;background:var(--ink);color:#fff;font-size:.66rem;font-weight:900;letter-spacing:.07em;border-radius:6px;padding:2px 8px}
.scard.off{border-color:#1d3557;box-shadow:0 5px 0 #1d3557;background:#f1f5fb}
.hale-tag{position:absolute;top:-11px;left:12px;background:#1d3557;color:#fff;font-size:.66rem;font-weight:900;letter-spacing:.06em;border-radius:6px;padding:2px 8px;white-space:nowrap;border:2px solid #9ec1ff}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:.78rem;font-weight:900;border-radius:9px;padding:1px 7px;white-space:nowrap}
.chip.g{background:#e3f3e8;color:var(--green)}.chip.c{background:#fde7e3;color:var(--red2)}.chip.h{background:#f8e3d6;color:var(--hawk)}.chip.d{background:#e0eefa;color:var(--dove)}.chip.x{background:#3a1d1d;color:#ffd0c4}

/* ---------- front page mockup ---------- */
.front{background:var(--news);border:1px solid #cdbf98;padding:10px 14px 12px;box-shadow:4px 6px 0 #0002;font-family:Georgia,"Times New Roman",serif;position:relative}
.mast{font:900 clamp(1.05rem,2.6vw,1.55rem)/1 "Old English Text MT",Georgia,serif;text-align:center;letter-spacing:.02em;margin:0}
.dline{display:flex;justify-content:space-between;font:700 .7rem system-ui,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;border-top:2px solid #222;border-bottom:4px double #222;margin:5px 0 8px;padding:2px 0;color:#333}
.slot{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:3px dashed #a99a72;border-radius:8px;background:#fffaf0;color:#8a7a52;padding:8px 10px;font:800 .95rem system-ui,Arial,sans-serif;min-height:70px}
.slot.lead{min-height:120px;margin-bottom:8px}
.slot.full{border:2px solid #222;background:#fffdf7;color:var(--ink);border-radius:2px}
.slot.full:hover:not(:disabled){outline:3px solid #e8452c55}
.slot .s-ico{font-size:2.2rem;filter:grayscale(1) contrast(1.2)}
.slot.lead.full .s-ico{font-size:3.4rem}
.slot .hl{display:block;font:900 1.1rem/1.1 Georgia,"Times New Roman",serif;text-transform:uppercase}
.slot.lead .hl{font-size:clamp(1.45rem,3.2vw,2.1rem)}
.slot .sl{display:block;font:600 .8rem system-ui,Arial,sans-serif;color:var(--muted);margin-top:3px}
.slot .tg{font:900 .62rem system-ui,Arial,sans-serif;letter-spacing:.08em;background:#222;color:#fff;border-radius:4px;padding:1px 6px;margin-bottom:2px;display:inline-block}
.slot .x{margin-left:auto;font-size:1rem;color:#a99a72}
.cutline{margin:8px 0 0;font:800 .86rem system-ui,Arial,sans-serif;color:var(--red2)}
.front .stamp{position:absolute;right:22px;top:66px;z-index:2}
.front.printed{animation:press .6s ease-out}
.front.printed .slot{min-height:0;padding:5px 10px}.front.printed .slot.lead{margin-bottom:6px}.front.printed .slot.lead.full .s-ico{font-size:2.6rem}
@keyframes press{0%{transform:scale(1.04);filter:brightness(1.3)}100%{transform:none;filter:none}}

.go{margin-top:14px;background:var(--red);color:#fff;border:0;padding:13px 26px;font:900 1.1rem system-ui,Arial,sans-serif;box-shadow:0 5px 0 var(--red2)}
.go:hover:not(:disabled){filter:brightness(1.08)}.go:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--red2)}
.go:disabled{opacity:.45;cursor:not-allowed}
.go.ink{background:var(--ink);box-shadow:0 5px 0 #000}

/* ---------- results ---------- */
.result{display:flex;gap:14px;align-items:flex-start;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;margin-top:12px;box-shadow:0 5px 0 #0002}
.flip{animation:flip .6s ease-out}
@keyframes flip{0%{opacity:0;transform:perspective(700px) rotateX(-70deg)}100%{opacity:1;transform:none}}
.r-main{flex:1;min-width:0}.r-main>p{margin:2px 0;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tag{display:inline-block;font-weight:900;font-size:.84rem;border-radius:12px;padding:3px 10px;white-space:nowrap}.tag.up{background:#dcefe2;color:var(--green)}.tag.down{background:#f9dcd7;color:#9a2f22}.tag.h{background:#f8e3d6;color:var(--hawk)}.tag.d{background:#e0eefa;color:var(--dove)}.tag.x{background:#3a1d1d;color:#ffd0c4}
.mail{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 0}
.letter{background:#fffdf3;border:1px solid #d8cba6;border-radius:4px;padding:6px 10px;box-shadow:2px 3px 0 #0001;font:italic 600 .95rem Georgia,serif;transform:rotate(-.6deg)}
.letter:nth-child(2){transform:rotate(.6deg)}
.mail.one{grid-template-columns:1fr;max-width:420px;margin-left:auto;margin-right:auto}
.letter b{display:block;font:900 .66rem system-ui,Arial,sans-serif;letter-spacing:.07em;text-transform:uppercase;font-style:normal}
.letter.h b{color:var(--hawk)}.letter.d b{color:var(--dove)}
.warnbox{background:#3a1d1d;color:#fff;border-radius:10px;padding:6px 12px;margin:8px 0 0;font-weight:800}
.reveal{background:var(--ink);color:#fff;border-radius:14px;padding:9px 14px;margin:12px 0 2px;box-shadow:0 4px 0 #0003}
.reveal .nw{display:inline-block;background:var(--gold);color:var(--ink);font-weight:900;font-size:.7rem;letter-spacing:.08em;border-radius:8px;padding:2px 8px;margin-bottom:3px}
.reveal p{margin:0;font-size:1.05rem}.reveal b{color:var(--gold)}
.real{background:#fff;border:2px dashed #d6c79c;border-radius:12px;padding:6px 12px;margin:10px 0;font-size:.97rem;font-weight:650}.real p{margin:2px 0}
.real-b{display:inline-block;background:#7a5a00;color:#fff;font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;border-radius:6px;padding:1px 7px;margin-right:4px;vertical-align:1px}
.stamp{border:4px solid var(--red);color:var(--red);font:900 1rem/1 "Arial Black",Impact,sans-serif;padding:6px 10px;border-radius:8px;transform:rotate(-8deg);letter-spacing:.05em;background:#fff8;text-transform:uppercase;display:inline-block}
.stamp.g{border-color:var(--green);color:var(--green)}
.stamp.q{border-color:#555;color:#555}
.slam{animation:slam .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{0%{opacity:0;transform:rotate(-8deg) scale(2.6)}60%{opacity:1;transform:rotate(-8deg) scale(.92)}100%{transform:rotate(-8deg) scale(1)}}

/* ---------- evidence objects ---------- */
.ev{max-width:720px;margin:12px auto 0}
.docx{background:#fbf8ec;border:1px solid #d8cba6;border-radius:4px;padding:10px 14px;box-shadow:3px 4px 0 #0002;font-family:"Courier New",Courier,monospace;background-image:repeating-linear-gradient(#fbf8ec 0 26px,#efe6cc 26px 27px)}
.docx .th{font-weight:900;letter-spacing:.06em;color:var(--red2);margin:0 0 4px;font-size:.85rem}
.docx p{margin:3px 0}.docx .q{font-style:italic;font-size:1.05rem}
.docx .hi{background:#fff3a8;font-weight:900;padding:0 3px}
.gloss{font:600 .85rem system-ui,Arial,sans-serif;color:#5e5a52;margin:2px 0}
.docx.secret{border:3px solid var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tv{background:#4a3524;border-radius:20px;padding:12px 14px 24px;box-shadow:0 6px 0 #2b1d12;position:relative}
.tv::after{content:"";position:absolute;bottom:7px;right:20px;width:12px;height:12px;border-radius:50%;background:#c9a46a;box-shadow:-22px 0 0 #c9a46a}
.screen{background:radial-gradient(circle,#e9eef2,#b9c3cb);border-radius:34px/20px;padding:14px 18px;filter:grayscale(1);font-family:Georgia,serif;min-height:120px}
.screen .live{display:inline-block;background:#222;color:#fff;font:900 .68rem system-ui;letter-spacing:.1em;padding:1px 6px;border-radius:4px}
.screen .q{font-size:1.08rem;font-style:italic;margin:6px 0}
.tv.said .screen{background:radial-gradient(circle,#eef3ff,#b7c6e6);filter:none}
.morgue{background:#e9dcc0;border:2px solid #b8a274;border-radius:4px 14px 4px 4px;padding:10px 12px 12px;position:relative;box-shadow:3px 4px 0 #0002}
.morgue::before{content:"FILE: INDOCHINA";position:absolute;top:-14px;left:12px;background:#e9dcc0;border:2px solid #b8a274;border-bottom:0;border-radius:6px 6px 0 0;padding:0 10px;font:900 .7rem system-ui;letter-spacing:.08em}
.flow{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;justify-content:center;margin:4px 0 10px}
.flow div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 10px;text-align:center;font-weight:800;font-size:.92rem;min-width:110px}
.flow div span{display:block;font-size:1.6rem}
.flow .arr{background:none;border:0;min-width:0;display:grid;place-items:center;font-size:1.4rem;padding:0}
.dominos{display:block;width:100%;max-width:660px;margin:0 auto;height:auto}
.dom{transform-box:fill-box;transform-origin:100% 100%;transition:transform .45s cubic-bezier(.5,0,.7,1)}
.fallen .dom{transform:rotate(62deg)}
.tapme{display:block;margin:6px auto 0}
.strip{display:grid;grid-template-columns:auto 1fr 1fr;gap:3px;font-size:.88rem;font-weight:700;margin:8px 0}
.strip div{background:#fff;padding:4px 8px;border-radius:6px}
.strip .hd{background:var(--ink);color:#fff;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
.strip .rl{background:#efe6cc}
.candles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 0}
.candles div{background:#2a2a2a;color:#fff;border-radius:12px;padding:8px 12px;font-size:.88rem}
.candles b{display:block;color:#ffd166;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase}
.exposed{display:grid;gap:8px;margin:10px 0}
.exposed div{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:800}
.lottery{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0 0}
.lottery span{background:#fff;border:2px solid #1b1b1d;border-radius:50%;width:54px;height:54px;display:grid;place-items:center;font:900 .7rem/1.05 system-ui;text-align:center;box-shadow:0 3px 0 #0003}
.lottery span:first-child{background:var(--gold)}

/* ---------- in-world checks ---------- */
.check{position:relative;margin:14px 0 6px;padding:12px;border:3px solid var(--ink);border-radius:18px;background:#fff8e6;box-shadow:0 5px 0 #0002}
.qlabel{position:absolute;top:-16px;left:-12px;font-size:1.5rem;margin:0;background:#fff;border:3px solid var(--ink);border-radius:50%;width:46px;height:46px;display:grid;place-items:center;box-shadow:0 3px 0 #0002}
.check .bub{margin-bottom:6px}
.choices{display:grid;gap:8px}
@media(min-width:761px){.check .choices{grid-template-columns:1fr 1fr}}
.reply{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;color:var(--ink);border:3px solid #d6c9a6;padding:10px 12px;font-weight:750;line-height:1.3;border-radius:16px 16px 16px 4px;box-shadow:0 3px 0 #0001;transition:transform .12s}
.reply:hover:not(:disabled){transform:translateY(-2px);border-color:var(--ink)}
.reply:disabled{opacity:.55;cursor:not-allowed}
.r-ico{font-size:1.2rem;flex:none}
.shake{animation:shake .45s}
