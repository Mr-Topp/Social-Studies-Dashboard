<script>
// Sociology Unit 3 Day 2 · Origin Story (SS.9-12.Soc.9) · Fynn picked this 11/14/26.
// More facts added 11/15/26: mom Gloria was 16 at his birth; Fab Four coached by Dru Joyce II; 3 state titles at SVSM;
// Christmas tree farm; named after James Taylor; "The Outside"; demo CDs on Music Row at 11; debut album at 16;
// adoption final 2003 (age 6); St. Sebastian; 2013 world all-around title at 16.
// Facts checked 11/14/26: LeBron missed 83 days of 4th grade, then lived with youth-coach Frankie Walker's family;
// the Fab Four; Sports Illustrated "The Chosen One" cover (Feb 2002) and ESPN2 games (Dec 2002).
// Taylor Swift: grandma Marjorie Finlay was an opera singer; left out by middle-school girls; family moved to
// Hendersonville, TN; signed a Sony/ATV songwriting deal at 14. Simone Biles: adopted by grandfather Ron and
// his wife Nellie; Catholic, carries a rosary; switched to homeschool in 2012 to train more.
// 11/21/26 (Fynn: more variety in the answers + students add their own famous person): Taylor's first card is now
// Media (she has said a TV show about Faith Hill at about age 10 made her want Nashville; CMT Insider 2008, TIME 2014),
// replacing the opera-grandma Family card, so Family is the right answer 2 times instead of 3. Added Origin Story 4 (kind "own").
// PLACE PHOTOS (Fynn chose place photos 11/15/26, not photos of the stars). Wikimedia Commons:
// Akron "Evening Downtown Akron Skyline" by Dillguy9 (CC0); Nashville "Nashville skyline 2009" by Kaldari (public domain);
// Houston "Houston Downtown Skyline 2010" by Ed Uthman (CC BY 3.0, credit shown on the card).
const WM = "https://upload.wikimedia.org/wikipedia/commons/thumb/";
const PLACE = {
  lebron: { src: WM + "5/5c/Evening_Downtown_Akron_Skyline.jpg/960px-Evening_Downtown_Akron_Skyline.jpg", cap: "📍 Akron, Ohio: where LeBron grew up", credit: "" },
  taylor: { src: WM + "0/08/Nashville_skyline_2009.jpg/960px-Nashville_skyline_2009.jpg", cap: "📍 Nashville, Tennessee: where Taylor's family moved for her music", credit: "" },
  simone: { src: WM + "8/85/Houston_Downtown_Skyline_2010.JPG/960px-Houston_Downtown_Skyline_2010.JPG", cap: "📍 Houston, Texas: Simone grew up just outside it", credit: "Photo: Ed Uthman, CC BY 3.0" }
};
const who = (k, icon, name, sub) => { const pl = PLACE[k]; return `<figure class="place"><img src="${pl.src}" alt="Skyline of ${pl.cap.replace(/^📍 /, "").split(":")[0]}" onerror="this.parentNode.remove()"><figcaption>${pl.cap}${pl.credit ? `<small>${pl.credit}</small>` : ""}</figcaption></figure><div class="who"><span class="icon">${icon}</span><div><b><span class="real">REAL</span>${name}</b><span>${sub}</span></div></div>`; };
const AG = { fam: "Family", sch: "School", peer: "Peers", media: "Mass media", rel: "Religion", work: "The workplace" };
window.U3GAME = {
  key: "soc-u3-d2-origin-story-v1",
  pace: 180,
  assignmentId: "soc-u3-d2-origin-story",
  title: "Sociology · Unit 3 · Day 2 · Origin Story",
  standard: "SS.9-12.Soc.9",
  stdText: [["SS.9-12.Soc.9", "Describe the process of socialization across the life course."]],
  brand: "ORIGIN STORY",
  eyebrow: "Sociology · Unit 3 · Day 2",
  titleHtml: "ORIGIN STORY<small>Every superstar was taught to be who they are.</small>",
  hook: "LeBron. Taylor. Simone. Nobody is born a legend. Flip their real backstories and find out who shaped them.",
  chips: ["🏀 LeBron James", "🎤 Taylor Swift", "🤸 Simone Biles", "⭐ Your pick"],
  tiles: ["🃏 <b>3</b> real origin stories", "⭐ <b>1</b> you build", "✓ <b>10</b> calls", "🔎 Prove every call", "🏆 Crown the agent that matters most", "✍️ <b>1</b> short answer", "⏱ <b>30</b> min"],
  goal: "Name the agents of socialization and show how they shape a person.",
  how: ["Read one real fact from a star's life.", "Tap the agent of socialization. Then prove it: tap the words in the card that show it.", "After each star, make your call. Then build your own star's story, write one answer, and turn it in."],
  startLabel: "Flip the first card",
  stepWord: "Card",
  steps: [
    { kind: "q", id: "l1", label: "LeBron: the Walker family", std: "Soc.9", kicker: "Origin Story 1 · LeBron James", title: "Missing school in Akron",
      left: `${who("lebron", "🏀", "LeBron James", "Grew up in Akron, Ohio")}
        <p class="fact">{{His mom, Gloria, was only 16 when he was born.}} {{She raised him alone, and they moved a lot.}} {{In 4th grade he <b>missed 83 days of school</b>.}}</p>
        <p class="fact">[[Then he moved in with his youth football coach's family, the Walkers. They gave him <b>chores, rules, and a wake-up time</b>.]] {{The next year he barely missed school.}}</p>`,
      proof: "Tap the words in the card that show the family teaching him habits.", proofHint: "Look for what the Walkers actually gave him.",
      tag: "Who's teaching?", q: "Which agent of socialization taught LeBron his new daily habits?",
      choices: [AG.fam, AG.sch, AG.peer, AG.media], answer: 0,
      why: "Family. The Walkers' home taught him daily habits. Family can be the people you live with, not just the people you're born to.",
      hint: "Whose house set the chores and the wake-up time?" },
    { kind: "q", id: "l2", label: "LeBron: the Fab Four", std: "Soc.9", kicker: "Origin Story 1 · LeBron James", title: "The Fab Four",
      left: `${who("lebron", "🏀", "LeBron James", "Age 11 to 18")}
        <p class="fact">[[At 11, LeBron joined a travel team with three close friends his age.]] {{They called themselves <b>the Fab Four</b>.}} {{Their coach was the dad of one of the boys.}}</p>
        <p class="fact">{{They pushed each other in every practice.}} {{Then they <b>picked the same high school</b> so they could keep playing together.}} {{There, they won three state titles.}}</p>`,
      proof: "Tap the words that show these people are his peers.", proofHint: "Peers are people about your age. Which words say how old his friends are?",
      tag: "Who's teaching?", q: "Which agent of socialization is shaping LeBron here?",
      choices: [AG.peer, AG.fam, AG.work, AG.sch], answer: 0,
      why: "Peers. A peer group is people about your age who share interests. His friends even helped decide where he went to school.",
      hint: "Look at who he is with. How old are they?" },
    { kind: "q", id: "l3", label: "LeBron: The Chosen One", std: "Soc.9", kicker: "Origin Story 1 · LeBron James", title: "The Chosen One",
      left: `${who("lebron", "🏀", "LeBron James", "Age 17, a high school junior")}
        <p class="fact">[[In 2002, LeBron was on the cover of <b>Sports Illustrated</b>. The headline called him <b>"The Chosen One."</b>]]</p>
        <p class="fact">{{He was only 17 and still in high school.}} {{Millions of people were told who he was before he could vote.}} {{That same year, ESPN2 showed one of his high school games on national TV.}}</p>`,
      proof: "Tap the words that show mass media at work.", proofHint: "Mass media means TV, magazines, music, and the internet. Which words name one?",
      tag: "Who's teaching?", q: "Which agent of socialization is sending LeBron a message about who he is?",
      choices: [AG.media, AG.peer, AG.sch, AG.rel], answer: 0,
      why: "Mass media. Magazines and TV told LeBron, and everyone else, that he was a future star.",
      hint: "Where did millions of people see him? Was it in person?" },
    { kind: "pick", id: "p1", label: "Top agent for LeBron", kicker: "Your call · LeBron James", title: "Who shaped LeBron the most?",
      left: `${who("lebron", "🏀", "LeBron James", "Three agents, one star")}<p class="fact">🏠 <b>Family:</b> the Walkers' chores and rules got him back to school.</p><p class="fact">🤝 <b>Peers:</b> the Fab Four pushed him and picked his high school.</p><p class="fact">📺 <b>Media:</b> a magazine and TV told the whole country he was "The Chosen One."</p>`,
      q: "Which agent shaped LeBron the most?", options: [AG.fam, AG.peer, AG.media],
      afterTitle: "Fun fact", after: "LeBron's foundation opened the I Promise School in Akron in 2018. It's for kids who are falling behind, like he once did." },

    { kind: "q", id: "t1m", label: "Taylor: Faith Hill on TV", std: "Soc.9", kicker: "Origin Story 2 · Taylor Swift", title: "The TV show that started it",
      left: `${who("taylor", "🎤", "Taylor Swift", "Grew up on a Christmas tree farm in Pennsylvania")}
        <p class="fact">{{Taylor grew up loving country music.}} [[When she was about 10, she <b>watched a TV show about the country star Faith Hill</b>.]]</p>
        <p class="fact">{{The show said Faith Hill moved to Nashville, and that's how she made it.}} {{After that, Taylor begged her parents <b>every day</b> to take her to Nashville.}}</p>`,
      proof: "Tap the words that show mass media at work.", proofHint: "Which words name something lots of people watch at the same time?",
      tag: "Who's teaching?", q: "Which agent of socialization gave Taylor the idea to go to Nashville?",
      choices: [AG.media, AG.fam, AG.peer, AG.sch], answer: 0,
      why: "Mass media. One TV show gave a 10-year-old in Pennsylvania a plan for her life. Media can show you what success looks like.",
      hint: "Where did she learn about Faith Hill? Did she meet her in person?" },
    { kind: "q", id: "t2", label: "Taylor: left out in middle school", std: "Soc.9", kicker: "Origin Story 2 · Taylor Swift", title: "The lunch table",
      left: `${who("taylor", "🎤", "Taylor Swift", "Middle school")}
        <p class="fact">{{Taylor has said that in middle school,}} [[the girls she sat with <b>left her out</b>. Liking country music made her seem weird to them.]]</p>
        <p class="fact">{{She felt alone,}} {{so she turned those feelings into songs.}} {{One early song, "The Outside," is about being the kid nobody lets in.}}</p>`,
      proof: "Tap the words that show her peers sending the message.", proofHint: "Find the words about the kids her age and what they did.",
      tag: "Who's teaching?", q: "Which agent of socialization sent Taylor the message that country music was not cool?",
      choices: [AG.peer, AG.sch, AG.fam, AG.rel], answer: 0,
      why: "Peers. Kids her own age decided what counted as cool, and they punished her for not fitting it.",
      hint: "Who left her out? Teachers, family, or kids her age?" },
    { kind: "q", id: "t3", label: "Taylor: agents in conflict", std: "Soc.9", kicker: "Origin Story 2 · Taylor Swift", title: "Two agents, two messages",
      left: `${who("taylor", "🎤", "Taylor Swift", "Age 14")}
        <p class="fact">[[Girls at school thought country music was weird.]]</p>
        <p class="fact">{{But when Taylor was 14,}} {{her parents <b>moved the whole family to Tennessee</b>,}} {{near Nashville, so she could chase country music.}}</p>
        <p class="fact">{{Even before the move, at 11, her mom drove her to Nashville to hand out her demo CDs.}}</p>`,
      proof: "One agent sent the opposite message from her family. Tap the words that show that other message.", proofHint: "Her family said go for country. Which words show someone saying the opposite?",
      tag: "Agents in conflict", q: "Which two agents of socialization sent Taylor different messages?",
      choices: ["Peers and family", "School and religion", "Media and the workplace", "Religion and family"], answer: 0,
      why: "Peers said country was weird. Family said go for it. When agents disagree, people sort the mixed messages and choose.",
      hint: "One message came from kids at school. Who moved her to Tennessee?" },
    { kind: "q", id: "t4", label: "Taylor: songwriting deal", std: "Soc.9", kicker: "Origin Story 2 · Taylor Swift", title: "A job at 14",
      left: `${who("taylor", "🎤", "Taylor Swift", "Age 14, Nashville")}
        <p class="fact">[[At 14, Taylor signed a deal to <b>write songs for a music company</b>.]] {{She was one of the youngest songwriters they ever signed.}}</p>
        <p class="fact">{{After school,}} {{she wrote with grown-up songwriters}} {{and learned how the music business works.}} {{Two years later, at 16, her first album came out.}}</p>`,
      proof: "Tap the words that show this is a job.", proofHint: "Which words show she signed on to work for a company?",
      tag: "Who's teaching?", q: "Which agent of socialization is teaching Taylor here?",
      choices: [AG.work, AG.sch, AG.peer, AG.media], answer: 0,
      why: "The workplace. A job teaches new rules: deadlines, working with adults, and how a business runs.",
      hint: "She signed a deal and got paid to write. What kind of place is that?" },
    { kind: "pick", id: "p2m", label: "Top agent for Taylor", kicker: "Your call · Taylor Swift", title: "Who shaped Taylor the most?",
      left: `${who("taylor", "🎤", "Taylor Swift", "Three agents, one star")}<p class="fact">📺 <b>Media:</b> a TV show about Faith Hill made her dream of Nashville.</p><p class="fact">🤝 <b>Peers:</b> girls at school left her out for liking country.</p><p class="fact">💼 <b>Workplace:</b> a songwriting job at 14 that taught her the music business.</p>`,
      q: "Which agent shaped Taylor the most?", options: [AG.media, AG.peer, AG.work],
      afterTitle: "Think about it", after: "Being left out hurt, but it also gave her the stories for her first songs. Even a bad message from an agent can shape who you become." },

    { kind: "q", id: "s1", label: "Simone: adopted by grandparents", std: "Soc.9", kicker: "Origin Story 3 · Simone Biles", title: "A new home",
      left: `${who("simone", "🤸", "Simone Biles", "Born in Ohio, grew up near Houston, Texas")}
        <p class="fact">{{When Simone was little,}} {{she and her sister went into foster care.}}</p>
        <p class="fact">[[Her grandfather Ron and his wife Nellie <b>adopted them</b>. Simone calls them <b>Mom and Dad</b>.]] {{The adoption was official when she was 6.}}</p>`,
      proof: "Tap the words that show Ron and Nellie are her family now.", proofHint: "What does Simone call them?",
      tag: "Who's teaching?", q: "Ron and Nellie raised Simone and taught her values. Which agent of socialization is that?",
      choices: [AG.fam, AG.sch, AG.rel, AG.peer], answer: 0,
      why: "Family, the first and most powerful agent. A family is the people who raise you, however you came to them.",
      hint: "She calls them Mom and Dad. What kind of agent is that?" },
    { kind: "q", id: "s2", label: "Simone: the rosary", std: "Soc.9", kicker: "Origin Story 3 · Simone Biles", title: "In her gym bag",
      left: `${who("simone", "🤸", "Simone Biles", "Olympic gymnast")}
        <p class="fact">{{Nellie is Simone's mom.}} [[She raised Simone <b>Catholic</b>.]]</p>
        <p class="fact">{{Simone has said she brings a <b>rosary</b> (prayer beads)}} {{to her meets.}} {{She has also said she prays to St. Sebastian, the patron saint of athletes.}}</p>`,
      proof: "Tap the words that show where the habit came from.", proofHint: "The rosary is the habit. Which words show the agent that taught it?",
      tag: "Who's teaching?", q: "Which agent of socialization gave Simone the habit of carrying a rosary?",
      choices: [AG.rel, AG.media, AG.work, AG.sch], answer: 0,
      why: "Religion. It teaches values, rituals, and gives people a community. Her family passed it on, and she carries it to every meet.",
      hint: "Think about where her rosary habit started. Was it a friend, a show, or something bigger?" },
    { kind: "q", id: "s3", label: "Simone: leaves regular school", std: "Soc.9", kicker: "Origin Story 3 · Simone Biles", title: "Trading the hallways for the gym",
      left: `${who("simone", "🤸", "Simone Biles", "Age 15")}
        <p class="fact">{{In 2012,}} [[Simone <b>left regular high school</b>]] {{and switched to homeschool}} {{so she could train more hours in the gym.}}</p>
        <p class="fact">{{She gave up hallways full of kids her age.}} {{The next year, at 16, she won her first world title.}}</p>`,
      proof: "Tap the words that show which agent she stepped away from.", proofHint: "Which words name the place she left?",
      tag: "Which agent got smaller?", q: "Simone stepped away from one agent of socialization to train. Which one?",
      choices: [AG.sch, AG.rel, AG.fam, AG.media], answer: 0,
      why: "School. Homeschool meant less of school's hidden curriculum, like bells and schedules, and less time with peers. The gym took its place.",
      hint: "What did she switch out of?" },
    { kind: "pick", id: "p3", label: "Top agent for Simone", kicker: "Your call · Simone Biles", title: "Who shaped Simone the most?",
      left: `${who("simone", "🤸", "Simone Biles", "Three agents, one star")}<p class="fact">🏠 <b>Family:</b> Ron and Nellie adopted her, and she calls them Mom and Dad.</p><p class="fact">⛪ <b>Religion:</b> raised Catholic, she brings a rosary to every meet.</p><p class="fact">🏫 <b>School:</b> she left regular high school to train more.</p>`,
      q: "Which agent shaped Simone the most?", options: [AG.fam, AG.rel, AG.sch],
      afterTitle: "Fun fact", after: "Simone has more Olympic and World medals than any gymnast in history." },

    // Origin Story 4: the student builds one for a famous person they pick (Fynn, 11/21/26).
    { kind: "own", id: "own", label: "Your own star", kicker: "Origin Story 4 · Your pick", title: "Build your own origin story",
      left: `<div class="who"><span class="icon">⭐</span><div><b>YOUR STAR</b><span>Anyone famous you know about</span></div></div>
        <p class="fact">Pick a famous person you know about: an athlete, singer, rapper, actor, or creator.</p>
        <p class="fact">Fill out their origin story, just like LeBron, Taylor, and Simone. Use real facts. You can look them up.</p>
        <div class="reveal"><span class="rt">Example</span><b>Simone Biles · Religion:</b> She was raised Catholic and brings a rosary to every meet.</div>`,
      namePlaceholder: "Like: Steph Curry", rows: 3, afterTitle: "Your star is saved" }
  ],
  end: {
    kicker: "Three origin stories", title: "Your picks",
    html: st => {
      const p = (id, opts) => st.picks[id] == null ? "—" : opts[st.picks[id]];
      const e = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const o = st.own, top = o && o.done && o.rows && o.rows[o.top];
      const own = top ? `<div class="mini"><b>⭐ ${e(o.name)}</b><span>Your pick: ${e(top.a)}</span></div>` : "";
      return `<div class="cards3">
        <div class="mini"><b>🏀 LeBron</b><span>Your pick: ${p("p1", [AG.fam, AG.peer, AG.media])}</span></div>
        <div class="mini"><b>🎤 Taylor</b><span>Your pick: ${p("p2m", [AG.media, AG.peer, AG.work])}</span></div>
        <div class="mini"><b>🤸 Simone</b><span>Your pick: ${p("p3", [AG.fam, AG.rel, AG.sch])}</span></div>${own}</div>
        <p class="bigidea">Family shows up in all three real stories. But in the teen years, <b>peers and media get louder.</b></p>
        <p class="callout">In a 2024 Pew survey, nearly half of U.S. teens said they are online <b>almost constantly</b>. So which agent wins for teens today?</p>`;
    }
  },
  write: {
    id: "w1", short: "Which agent shapes teens most today?", heading: "Crown the champion",
    label: "Which agent of socialization shapes teens the most today? Defend your pick with evidence.",
    help: "Use LeBron, Taylor, or Simone, or a teen you know. You never have to share anything private.",
    stem: "___ shapes teens the most because ___. For example, ___.",
    min: 80, more: "Name the agent and give a real example.",
    mustAll: [{ words: ["family", "parent", "school", "peer", "friend", "media", "social media", "tiktok", "youtube", "instagram", "religion", "church", "work", "job"], msg: "Name one agent of socialization (family, school, peers, media, religion, or work)." },
              { words: ["because", "since", "so "], msg: "Say why. Use the word \"because.\"" },
              { words: ["example", "lebron", "taylor", "simone", "like", "when", "instance"], msg: "Add an example: one of today's stars or a teen you know." }]
  }
};
</script>
