<style>

.gapb b{font-size:.78rem;padding:1px 5px;border-radius:6px;background:#ffffff26}.gapb b.g2,.gapb b.g1{background:#2f9a5e}.gapb b.g0{background:#6b7785}.gapb b.gm{background:#c0392b}.gapb b.gh{background:#c98a12}

.cap,.src{font-size:.78rem;color:var(--muted);margin:2px 0 4px!important}

@keyframes slam{0%{opacity:0;transform:translateY(-50%) rotate(-7deg) scale(2.6)}100%{opacity:1;transform:translateY(-50%) rotate(-7deg) scale(1)}}
.tags{margin:0 0 4px!important}
.tag{display:inline-block;font-weight:900;font-size:.8rem;border-radius:12px;padding:2px 9px;margin:0 6px 3px 0}.tag.up{background:#dcefe2;color:var(--green)}.tag.down{background:#f6dcd8;color:var(--bad)}.tag.flat{background:#e6e9ee;color:var(--ink)}.tag.push{background:#efe3f4;color:var(--rival)}.tag.coin{background:#fdf0cc;color:#80570a}
.why-line{font-size:.88rem;color:var(--muted)}

.qlabel{font-size:.75rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--main);margin:0 0 4px}
.choices{display:grid;gap:10px}
@media(min-width:700px){.q .choices{grid-template-columns:1fr 1fr}.event .choices{grid-template-columns:repeat(3,1fr)}}
button{font:inherit;cursor:pointer;border-radius:12px;min-height:46px}
.choice{text-align:left;background:#fff;color:var(--ink);border:2px solid #c3ccd6;border-bottom-width:5px;padding:10px 12px;font-weight:700;line-height:1.3;transition:transform .12s,border-color .12s}

.event .choice{display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:linear-gradient(#fff,#f7f3e6);border-color:#d6c48e;min-height:120px}
.choice .ci{font-size:1.9rem;line-height:1}.choice .ct{font-size:1.05rem;font-weight:900}.choice .cl{font-size:.88rem;font-weight:600;color:var(--muted)}
.choice .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}.choice .chips span{font-size:.8rem;font-weight:900;border-radius:9px;padding:1px 7px;background:#fdf0cc;color:#80570a}.choice .chips span.p{background:#efe3f4;color:var(--rival)}.choice .chips span.z{background:#e6e9ee;color:var(--ink)}
.go{margin-top:12px;background:linear-gradient(#ffd166,#f2b83b);color:#3b2600;border:0;border-bottom:4px solid #b07d12;padding:11px 22px;font-weight:900;font-size:1.05rem}
.go:hover{filter:brightness(1.05)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #2f7dbd;outline-offset:2px}
.answered{font-weight:800;color:var(--green);margin:4px 0}.why{margin:2px 0;color:var(--muted)}
.msg{min-height:1.3em;font-weight:750;margin:8px 0 0}.msg.bad{color:var(--bad)}.msg.good{color:var(--green)}
label{display:block;font-weight:850;margin:14px 0 4px}.stem{margin:0 0 4px;color:var(--muted);font-size:.92rem}
input,textarea{width:100%;font:inherit;border:2px solid #c9d0d8;border-radius:10px;padding:10px;background:#fff;color:var(--ink)}
/* ---------- Intro ---------- */
.intro{display:grid;grid-template-columns:1fr auto;column-gap:12px;align-items:end;background:linear-gradient(135deg,#fffdf6,#f6ecd2)}
.intro>*{grid-column:1/-1}
.intro>#nameBox{grid-column:1}
.intro>.go{grid-column:2;order:1;margin-top:0;font-size:1.2rem;padding:12px 28px}
.intro>#introMsg{order:2}
.intro>.src{order:3;margin:6px 0 0!important}
.intro .big{font-size:clamp(2.2rem,5vw,3.4rem);letter-spacing:.03em;margin:0;line-height:1.05;color:var(--night);text-shadow:3px 3px 0 var(--gold)}
.intro .hook{font-size:1.12rem;margin:6px 0 8px;font-weight:600}
.intro .stamp-in{display:inline-block;transform:rotate(-4deg);border:3px solid var(--bad);color:var(--bad);font-weight:900;font-size:.8rem;letter-spacing:.08em;padding:1px 8px;border-radius:6px;margin-left:8px;vertical-align:middle}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0}.pills span{background:var(--night2);color:#fff;border-radius:20px;padding:4px 12px;font-weight:800;font-size:.9rem}
.intro label{margin-top:10px}
/* ---------- Finale ---------- */
.finale .rep{display:grid;gap:6px;margin:8px 0;padding:0;list-style:none}.finale .rep li{display:flex;gap:10px;align-items:center;background:#f1f4f7;border-radius:10px;padding:8px 12px;font-weight:700}.finale .rep li i{font-style:normal;font-size:1.4rem}
.finale .rep li b{margin-left:auto;font-size:.8rem;padding:2px 8px;border-radius:8px;color:#fff;background:#6b7785;white-space:nowrap}.finale .rep li b.g2,.finale .rep li b.g1{background:var(--green)}.finale .rep li b.gm{background:var(--bad)}.finale .rep li b.gh{background:#a8740f}
.finale .alert{background:#fbeee9;border-left:6px solid var(--bad);border-radius:9px;padding:8px 12px;font-weight:700}
.welcome{background:#e6f1ea;color:var(--green);font-weight:800;border-radius:10px;padding:8px 12px;margin:0 0 10px}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;color:#b8c9da;font-size:.85rem}

@media(max-width:700px){
  .intro{grid-template-columns:1fr}.intro>.go{grid-column:1;margin-top:10px}
  .trio,.duo{grid-template-columns:1fr}.money .r{grid-template-columns:96px 1fr 70px;gap:6px}

}
@media print{.hud,.foot,.go{display:none}body{background:#fff}}

  <div class="hbox" title="Riverton gaps after your fixes"><span><span class="hlab">Gaps</span><span class="gapb" id="gapb"><span title="Schools">🏫<b id="g_e2">?</b></span><span title="Housing">🏠<b id="g_e4">?</b></span><span title="Courts">⚖️<b id="g_e6">?</b></span></span></span></div>

<script>
// ---------- Small helpers ----------
const T = (cls, txt) => `<span class="tag ${cls}">${txt}</span>`;
const tags = (...t) => `<p class="tags">${t.join("")}</p>`;
const card = (lab, body) => `<div class="src-card"><p class="lab">${lab}</p>${body}</div>`;
const stamp = (txt, kind) => `<div class="stamp ${kind || ""}" aria-hidden="true">${txt}</div>`;
const MOODS = ["😏", "😒", "😠", "🤬"];
const kessler = (line, mood) => `<div class="say"><div class="av" aria-hidden="true"><div class="f">🧔</div><small>KESSLER</small></div><div class="bub"><span class="sr" style="position:absolute;left:-9999px">Councilmember Kessler says: </span>"${line}"</div></div>`;
const bar = (label, pct, hi) => `<div class="row${hi ? " hi" : ""}"><span>${label}</span><div class="t"><span style="width:${pct}%"></span></div><b>${pct}%</b></div>`;
const fam = (cls, face, name, body) => `<div class="fam ${cls}"><span class="pf" aria-hidden="true">${face}</span><div><span class="lab">${name}</span>${body}</div></div>`;

// ---------- Gap results for each fix (index = the choice's place in its list) ----------
// g: 2 shrinks a lot · 1 shrinks · 0.5 shrinks a little · 0 stays · -1 grows
const GAP_TXT = { "2": "⬇⬇", "1": "⬇", "0.5": "↘", "0": "=", "-1": "⬆" };
const GAP_WORD = { "2": "gap shrinks a lot", "1": "gap shrinks", "0.5": "gap shrinks a little", "0": "gap stays", "-1": "gap grows" };
const FIXES = {
  e2: [{ g: 2, icon: "🏫", t: "State aid", end: "can shrink any year" }, { g: 0.5, icon: "🏫", t: "Shared classes", end: "fast, but no counselor" }, { g: -1, icon: "🏫", t: "Fundraisers", end: "rich schools raise more" }],
  e4: [{ g: 0.5, icon: "🏠", t: "Down-payment help", end: "only 12 families" }, { g: 1, icon: "🏠", t: "Bank testing", end: "protects every new applicant" }, { g: 0.5, icon: "🏠", t: "Credit union", end: "small loans, slow start" }],
  e6: [{ g: 2, icon: "⚖️", t: "End cash bail", end: "some may miss court" }, { g: 0.5, icon: "⚖️", t: "Court texts + plans", end: "$60 still can't pay" }, { g: 0.5, icon: "⚖️", t: "Bail fund", end: "fund can run dry" }]
};
const gapOf = (st, id) => { const p = st.picks[id]; if (p == null) return null; if (id === "e6" && st.fx.over) return "h"; return String(FIXES[id][p].g); };

// ---------- Choice cards: the engine draws plain buttons; this dresses them up ----------
// key = the exact choice label (that label is also what the teacher sees in the turn-in)
const DECOR = {
  "Cut AP classes (4 down to 1)": ["📚", "Cut AP classes", "College-credit classes drop from 4 to 1."],
  "Cut 1 of 2 counselors": ["🧑‍🏫", "Cut a counselor", "One counselor left for 450 kids."],
  "Cut the late bus": ["🚌", "Cut the late bus", "No ride home after sports."],
  "State aid (4 pts)": ["🏛️", "State aid", "Big help, but lawmakers reset it yearly.", 4, 3],
  "Share classes with Northridge (1 pt)": ["💻", "Share classes", "AP online next week. Counselor stays cut.", 1, 0],
  "School fundraisers (0 pts)": ["🍪", "Fundraisers", "No new taxes. Each school raises its own.", 0, 0],
  "Follow the map: approve only the Carlsons": ["🗺️", "Follow the map", "Approve the Carlsons only."],
  "Bend the rule: approve both": ["🤝", "Bend the rule", "Approve both families."],
  "Deny both families": ["🚫", "Deny both", "Same answer for both."],
  "Down-payment help (3 pts)": ["🔑", "Down-payment help", "12 families buy now. Hundreds still can't.", 3, 2],
  "Test the banks (2 pts)": ["🕵️", "Test the banks", "Fake buyers catch unfair banks. Old losses stay.", 2, 1],
  "Neighborhood credit union (0 pts)": ["🏦", "Credit union", "Neighbor-run tiny bank. No taxes, small loans.", 0, 0],

function dress(btn) {
  if (btn.dataset.dressed) return;
  const d = DECOR[btn.textContent.trim()]; if (!d) return;
  btn.dataset.dressed = "1"; btn.setAttribute("aria-label", d[1] + ". " + d[2] + (d[3] != null ? " Costs " + d[3] + " fix points." : ""));
  const chips = d[3] == null ? "" : `<span class="chips" aria-hidden="true"><span class="${d[3] ? "" : "z"}">🪙 ${d[3] ? "−" + d[3] : "0"}</span>${d[4] ? `<span class="p">😠 +${d[4]}</span>` : `<span class="z">😠 +0</span>`}</span>`;
  btn.innerHTML = `<span class="ci" aria-hidden="true">${d[0]}</span><span class="ct">${d[1]}</span><span class="cl">${d[2]}</span>${chips}`;
}

// ---------- HUD ----------
let lastPts = null, lastPush = null;
function hudDraw(st) {
  const p = st.fx.pts, u = st.fx.push || 0;
  const pn = document.getElementById("ptsNum"); pn.textContent = String(p); pn.className = p < 0 ? "neg" : "";
  const coins = document.getElementById("coins");
  coins.innerHTML = Array.from({ length: 10 }, (_, i) => `<i class="${i >= Math.max(p, 0) ? "spent" : ""}"></i>`).join("") + (p < 0 ? Array.from({ length: -p }, () => `<i class="debt"></i>`).join("") : "");
  document.getElementById("pushFill").style.width = (u * 10) + "%";
  document.getElementById("pushNum").textContent = u + "/10";
  document.getElementById("kMood").textContent = MOODS[u >= 9 ? 3 : u >= 6 ? 2 : u >= 3 ? 1 : 0];
  ["e2", "e4", "e6"].forEach(id => { const g = gapOf(st, id), el = document.getElementById("g_" + id); el.textContent = g == null ? "?" : g === "h" ? "⏸" : GAP_TXT[g]; el.className = g == null ? "" : g === "h" ? "gh" : g === "-1" ? "gm" : g === "0" ? "g0" : "g1"; });
  if (lastPts !== null && p !== lastPts) { coins.parentNode.parentNode.classList.remove("bump"); void coins.offsetWidth; coins.parentNode.parentNode.classList.add("bump"); }
  if (lastPush !== null && u > lastPush) { const f = document.getElementById("kFace"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); }
  lastPts = p; lastPush = u;
}
