<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hold the Home Front | U.S. History Unit 2 Day 4</title>
<meta name="description" content="Run an Iowa family's WWII ration book from 1943 to 1945: shop with points, face the black market, take a war job, buy bonds, and see who was treated unfairly.">
<style>
:root{--ink:#1b2433;--muted:#5a6472;--navy:#1b2f4d;--navy2:#26426b;--red:#c0392b;--red2:#8e2418;--gold:#f2b134;--cream:#fff7e6;--paper:#fffdf6;--green:#2a7a4b;--blue:#2c5d9e;--try:#8a5a00;--line:#e7dcc2}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;color:var(--ink);font:17px/1.45 system-ui,"Segoe UI",Arial,sans-serif;background:var(--navy);background-image:repeating-linear-gradient(135deg,#1b2f4d 0 22px,#1e3456 22px 44px)}
button{font:inherit;cursor:pointer;border-radius:14px;min-height:46px}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- game board HUD ---------- */
.hud{position:sticky;top:0;z-index:30;background:linear-gradient(#fff7e6,#fbeed2);border-bottom:4px solid var(--red);box-shadow:0 4px 14px #0005;padding:6px max(10px,calc((100vw - 1020px)/2)) 4px}
.hud-in{display:grid;grid-template-columns:auto 1.2fr 1.2fr 1.2fr .8fr;gap:8px;align-items:stretch}
.cal{background:#fff;border:2px solid var(--navy);border-radius:10px;text-align:center;min-width:64px;overflow:hidden;display:flex;flex-direction:column}
.cal span{background:var(--red);color:#fff;font-weight:900;font-size:.8rem;letter-spacing:.08em;padding:1px 6px}
.cal b{font-size:1.05rem;padding:2px 6px;color:var(--navy)}
.mt{position:relative;display:flex;gap:8px;align-items:center;background:#fff;border:2px solid #e2d3b0;border-radius:12px;padding:4px 8px;min-width:0}
.mt-face{position:relative;font-size:1.6rem;line-height:1;flex:none}
.mt-face i{position:absolute;right:-8px;bottom:-6px;font-style:normal;font-size:1.05rem;background:#fff;border-radius:50%;box-shadow:0 1px 3px #0003}
.fam-f{font-size:1.25rem;letter-spacing:-.25em}
.mt-r{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:6px}
.lab{grid-column:1/3;font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk{position:relative;height:10px;background:#ece3cf;border-radius:9px;overflow:hidden}
.trk span{display:block;height:100%;border-radius:9px;transition:width .7s cubic-bezier(.3,1.4,.5,1)}
#hudStrain .trk span{background:linear-gradient(90deg,#f0a35e,#c0392b)}
#hudEffort .trk span{background:linear-gradient(90deg,#f2b134,#e07b00)}
#hudEffort .trk em{position:absolute;left:60%;top:0;bottom:0;width:2px;background:var(--navy)}
#hudBm .trk span{background:linear-gradient(90deg,#555,#1b1b24)}
.mt b{font-size:.92rem;color:var(--navy)}.mt.cash b{font-size:1.15rem;grid-column:1/3}
.mt.rival{background:#2b2b36;border-color:#45455a;color:#fff}.mt.rival .lab{color:#ffd27a}.mt.rival b{color:#fff}.mt.rival .trk{background:#45455a}#hudBm .trk span{background:linear-gradient(90deg,#ffd27a,#ff7a59)}
.mt.rival.down{opacity:.75}.mt.rival.down .mt-face>span{filter:grayscale(1)}
.mt.warn{animation:warn 1.4s ease-in-out infinite}
@keyframes warn{50%{box-shadow:0 0 0 4px #ff7a5966}}
.mt.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.08)}}
.pop{position:absolute;right:6px;bottom:-24px;font-weight:900;font-size:1rem;padding:2px 9px;border-radius:12px;pointer-events:none;animation:floatup 1.9s ease-out forwards;z-index:40;white-space:nowrap}
.pop.good{background:#2a7a4b;color:#fff}.pop.bad{background:#c0392b;color:#fff}
@keyframes floatup{0%{opacity:0;transform:translateY(14px) scale(.7)}15%{opacity:1;transform:translateY(0) scale(1.2)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.hud-step{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:.75rem;font-weight:900;color:var(--navy)}
.sbar{flex:1;height:6px;background:#e7dcc2;border-radius:6px;overflow:hidden}.sbar span{display:block;height:100%;background:var(--red);transition:width .4s}

main{max-width:1020px;margin:auto;padding:14px 12px 96px}
.welcome{background:#e3f1e8;color:var(--green);font-weight:800;border-radius:12px;padding:8px 12px;margin:0 0 10px;border:2px solid #b9d8c4}

/* ---------- scene ---------- */
.scene{background:var(--paper);border-radius:20px;overflow:clip;box-shadow:0 10px 30px #0006;border:3px solid #fff3d6}
.sc-top{background:var(--red);color:#fff;padding:8px 18px 9px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.chap{font-size:.75rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;background:#0003;border-radius:8px;padding:2px 8px}
.sc-top h2{margin:0;font-family:"Arial Black","Segoe UI Black",Impact,system-ui,sans-serif;font-size:clamp(1.25rem,2.6vw,1.75rem);letter-spacing:.01em;text-transform:uppercase}
.stage{display:flex;gap:16px;align-items:center;padding:14px 18px;min-height:132px;background:linear-gradient(180deg,#bfe1f4,#e8f3f8 70%,#cfe3c1 70%,#b9d39e);position:relative}
.stage-art{font-size:4.2rem;line-height:1;flex:none;filter:drop-shadow(0 4px 0 #0002);min-width:84px;text-align:center}
.stage.bare{min-height:0;padding:8px 18px}.stage.bare .stage-art{font-size:3rem}
.st-home .stage{background:linear-gradient(180deg,#f7e2c0,#f3d6a8 72%,#b98a55 72%,#a87a48)}
.st-store .stage{background:linear-gradient(180deg,#fff0d0 0,#fff0d0 70%,#7a5230 70%);}
.st-office .stage{background:linear-gradient(180deg,#d9e2ea,#c7d3de 72%,#8a6a4a 72%)}
.st-factory .stage{background:linear-gradient(180deg,#c9ced6,#aeb6c2 70%,#6b7380 70%)}
.st-garage .stage{background:linear-gradient(180deg,#2b2b36,#3b3b4a 72%,#1f1f28 72%)}
.st-garage .stage-art{filter:drop-shadow(0 0 12px #ffd27a88)}
.st-rally .stage{background:linear-gradient(180deg,#bfe1f4,#e3f1fa 68%,#9aa6b2 68%)}
.st-school .stage{background:linear-gradient(180deg,#fde9b8,#fbe0a0 72%,#c58f4d 72%)}
.st-farm .stage{background:linear-gradient(180deg,#bfe1f4,#e6f4ff 62%,#e5c04f 62%,#c99b2c)}
.st-parade .stage{background:linear-gradient(180deg,#1b2f4d,#26426b 70%,#c0392b 70%)}
.bubbles{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.bub{display:flex;gap:8px;align-items:flex-end;max-width:640px}
.bub .av{font-size:1.9rem;width:48px;height:48px;flex:none;display:grid;place-items:center;background:#fff;border-radius:50%;border:3px solid var(--navy);box-shadow:0 2px 0 #0003}
.bub .bt{position:relative;background:#fff;border-radius:16px;padding:7px 12px;box-shadow:0 3px 0 #0002;border:2px solid #1b2f4d22}
.bub .bt::before{content:"";position:absolute;left:-9px;bottom:10px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.bub .bt b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.bub .bt p{margin:0;font-size:1.04rem;font-weight:600}
.bub.think .bt{background:#f4f4f8;border-style:dashed;font-style:italic}
.bub.earl .av{background:#2b2b36;border-color:#ffd27a}.bub.earl .bt{background:#2b2b36;color:#fff;border-color:#ffd27a}.bub.earl .bt::before{border-right-color:#2b2b36}.bub.earl .bt b{color:#ffd27a}
.bub.radio .av{background:var(--gold)}
.sc-body{padding:14px 18px 18px}

/* ---------- world objects ---------- */
.family{display:flex;gap:6px}.family span{display:flex;flex-direction:column;align-items:center;font-size:2.6rem}.family small{font-size:.7rem;font-weight:900;background:#fff;border-radius:8px;padding:0 6px;margin-top:2px;color:var(--navy)}.family .gone{opacity:.75}
.board-explain{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.board-explain div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.board-explain .be-i{font-size:2.2rem}.board-explain b{color:var(--navy);font-size:1.05rem}.board-explain small{color:var(--muted);font-size:.84rem;line-height:1.3}
.board-explain .rival{background:#2b2b36;border-color:#ffd27a;color:#fff}.board-explain .rival b{color:#ffd27a}.board-explain .rival small{color:#e6e0d0}
.mini-book{background:#d9cfb4;border:3px solid #7a6a45;border-radius:8px;padding:6px 8px;transform:rotate(-4deg);font:900 .6rem Georgia,serif;letter-spacing:.1em;color:#3b2f17;display:flex;flex-direction:column;align-items:center;gap:4px}
.mini-book div{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.mini-book i{font-style:normal;width:20px;height:20px;display:grid;place-items:center;color:#fff;font-size:.7rem;border:1px dashed #fff}.mini-book .r{background:var(--red)}.mini-book .b{background:var(--blue)}
.book{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}
.stamps{border-radius:12px;padding:10px;border:3px dashed;display:flex;flex-direction:column;gap:2px;font-size:.95rem;background:#fff}.stamps b{font-size:1.05rem}.stamps em{font-style:normal;font-weight:900}
.stamps.red{border-color:var(--red);background:#fdeeec}.stamps.blue{border-color:var(--blue);background:#ebf1fa}.stamps.free{border-color:var(--green);background:#e9f5ee}
.notice{position:relative;background:#fffbe9;border:1px solid #e6d9a8;border-radius:4px;padding:16px 14px 10px;margin:8px auto 10px;max-width:720px;transform:rotate(-.6deg);box-shadow:3px 5px 0 #0001,0 0 0 6px #c79a5a33}
.notice .pin{position:absolute;top:-12px;left:50%;font-size:1.4rem}
.cap{display:block;font-size:.72rem;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.notice p{margin:2px 0;font-size:1.05rem;font-family:Georgia,serif}
.real{background:#fff;border:2px dashed #d6c79c;border-radius:12px;padding:7px 12px;margin:10px 0;font-size:.98rem;font-weight:600}.real p{margin:2px 0}.real .src{font-weight:400}
.real-b{display:inline-block;background:#7a5a00;color:#fff;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;border-radius:6px;padding:1px 7px;margin-right:4px;vertical-align:1px}
.real-h{font-weight:900;color:#7a5a00;font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;margin:0 0 2px}
.src{font-size:.76rem;color:var(--muted);margin:3px 0 0}
.fict{font-size:.8rem;color:var(--muted);font-style:italic;margin:6px 0}
.poster{margin:0 auto 10px;max-width:300px;background:#fff;border-radius:6px;padding:8px;box-shadow:0 6px 18px #0003;transform:rotate(1deg)}
.poster.small{max-width:210px;float:right;margin:0 0 10px 16px;transform:rotate(-1.5deg)}
.poster img{display:block;width:100%;height:auto;max-height:360px;object-fit:contain;border-radius:4px}.poster figcaption{margin-top:4px;line-height:1.3}.poster figcaption b{display:block;font-size:.98rem;color:var(--navy)}.poster figcaption .src{display:block}.poster a{color:inherit}
.paper{background:#f7f1e1;border:1px solid #d8cba6;padding:10px 16px;margin:0 auto 10px;max-width:720px;box-shadow:3px 4px 0 #0002;font-family:Georgia,serif;transform:rotate(.4deg)}
.paper .masthead{font:900 1.2rem "Old English Text MT",Georgia,serif;text-align:center;border-bottom:3px double #333;margin:0 0 6px;letter-spacing:.04em}
.paper .quote{font-size:1.15rem;font-style:italic;margin:4px 0}.gloss{font-size:.88rem;color:var(--muted);font-family:system-ui,Arial,sans-serif}
.memorial{background:#1b2f4d;color:#fff;border-radius:14px;padding:12px 16px;margin:0 0 10px;border:3px solid var(--gold)}
.memorial .m-h{font-weight:900;color:var(--gold);margin:0 0 4px}.memorial p{margin:4px 0}.memorial .src{color:#c9d3e2}
.thermo-big{width:44px;height:120px;border:4px solid #fff;border-radius:22px;background:#fff8;position:relative;overflow:hidden;margin:auto;box-shadow:0 0 0 3px var(--navy)}
.thermo-big span{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,#c0392b,#f2b134);transition:height 1s}
.bond{border:4px double var(--green);border-radius:12px;background:linear-gradient(135deg,#eff8ea,#fffdf2);padding:10px 14px;margin:0 auto 10px;max-width:640px;text-align:center;box-shadow:0 4px 0 #0001}
.b-top{font-weight:900;letter-spacing:.12em;color:var(--green);margin:0 0 6px;font-size:.85rem}
.b-row{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}.b-row b{display:block;font-size:1.7rem;color:var(--green)}.b-row small{color:var(--muted);font-weight:700}
.b-arrow{font-weight:800;color:var(--muted)}.b-note{margin:6px 0 0;font-weight:700}
.files{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.folder{position:relative;background:#f4dfa7;border-radius:0 12px 12px 12px;padding:12px 12px 8px;margin-top:16px;box-shadow:0 4px 0 #0002;font-size:.95rem}
.folder .tab{position:absolute;top:-22px;left:0;background:#f4dfa7;border-radius:10px 10px 0 0;padding:2px 12px;font-size:.75rem;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.folder p{margin:2px 0;font-weight:650}.folder .src{font-weight:400}
.files.one{grid-template-columns:1fr;max-width:560px;margin:0 auto 6px}
.stat{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 14px;margin:10px 0}.st-big{font-size:2.6rem}.stat p{margin:2px 0}.st-n{font-weight:900;font-size:1.1rem;color:var(--navy)}

/* ---------- in-world checks ---------- */
.check{position:relative;margin:12px 0 6px;padding:12px;border:3px solid var(--navy);border-radius:18px;background:#eef4fb;box-shadow:0 5px 0 #1b2f4d33}
.check.form{background:#fffdf3;border-color:var(--green);background-image:repeating-linear-gradient(#fffdf3 0 30px,#e9e2c9 30px 31px)}
.check.notes{background:#fff6dc;border-color:#c79a5a}
.qlabel{position:absolute;top:-16px;left:-12px;font-size:1.7rem;margin:0;background:#fff;border:3px solid var(--navy);border-radius:50%;width:46px;height:46px;display:grid;place-items:center;box-shadow:0 3px 0 #1b2f4d33}
.check .bub{margin-bottom:6px}.check .msg{margin:0 0 6px;min-height:0}.check .bub .bt{border-color:var(--navy)}
.choices{display:grid;gap:8px}
@media(min-width:761px){.check .choices{grid-template-columns:1fr 1fr}}
.reply{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;color:var(--ink);border:3px solid #c9d6e6;padding:10px 12px;font-weight:750;line-height:1.3;border-radius:16px 16px 16px 4px;box-shadow:0 3px 0 #1b2f4d22;transition:transform .12s}
.reply:hover:not(:disabled){transform:translateY(-2px);border-color:var(--navy)}
.reply:disabled{opacity:.55;cursor:not-allowed}
.r-ico{font-size:1.3rem;flex:none}
.check.notes .reply{background:#fff3a8;border-color:#e2cf6b;border-radius:4px;transform:rotate(-.5deg)}.check.notes .reply:nth-child(2n){transform:rotate(.6deg)}
.check.form .reply{border-radius:8px;border-color:#b9d8c4}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.msg{min-height:1.3em;font-weight:800;margin:8px 0 0}.msg.try{color:var(--try)}.msg.good{color:var(--green);font-size:1.1rem}
.check.done{background:#f1faf4;border-color:var(--green);box-shadow:none;padding:8px 14px;min-height:0;display:flex;justify-content:center}.check.done .stamp{position:static;font-size:1.15rem}
.answered{font-weight:900;color:var(--green);margin:2px 0;padding-right:250px}.why{margin:2px 0;color:var(--muted);padding-right:250px}
.stamp{position:absolute;right:12px;top:10px;border:4px solid var(--red);color:var(--red);font:900 1rem/1 "Arial Black",Impact,sans-serif;padding:6px 10px;border-radius:8px;transform:rotate(-8deg);letter-spacing:.05em;background:#fff8;text-transform:uppercase}
.msg .stamp{position:static;display:inline-block;margin-right:8px}
.result .stamp.pick{position:static;display:inline-block;margin:2px 0 8px;font-size:1.05rem}
.slam{animation:slam .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{0%{opacity:0;transform:rotate(-8deg) scale(2.6)}60%{opacity:1;transform:rotate(-8deg) scale(.92)}100%{transform:rotate(-8deg) scale(1)}}

/* ---------- decision cards ---------- */
.pick-h{font:900 1.05rem "Arial Black",Impact,sans-serif;text-transform:uppercase;color:var(--red);margin:14px 0 6px;letter-spacing:.04em}
.cards{display:grid;gap:12px}.cards.n2{grid-template-columns:1fr 1fr}.cards.n3{grid-template-columns:repeat(3,1fr)}
.dcard{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:#fff;border:3px solid var(--navy);border-radius:18px;padding:14px 12px 12px;color:var(--ink);box-shadow:0 6px 0 var(--navy);transition:transform .12s,box-shadow .12s}
.dcard:hover{transform:translateY(-4px) rotate(-.5deg);box-shadow:0 10px 0 var(--navy)}
.dcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--navy)}
.d-ico{font-size:3rem;line-height:1.1}.d-t{font-size:1.2rem;line-height:1.2;color:var(--navy)}.d-l{font-size:.84rem;color:var(--muted);line-height:1.3}
.d-chips{display:flex;flex-direction:column;gap:4px;margin-top:6px;width:100%}
.chip{font-size:.8rem;font-weight:800;border-radius:10px;padding:3px 8px}.chip.g{background:#e3f3e8;color:var(--green)}.chip.c{background:#fde7e3;color:var(--red2)}

/* ---------- results ---------- */
.result{display:flex;gap:14px;align-items:flex-start;background:#fff;border:3px solid var(--gold);border-radius:18px;padding:12px 14px;margin-top:12px;box-shadow:0 6px 0 #f2b13455}
.flip{animation:flip .6s ease-out}
@keyframes flip{0%{opacity:0;transform:perspective(700px) rotateX(-70deg)}100%{opacity:1;transform:none}}
.r-big{font-size:3.2rem;line-height:1;flex:none}
.r-main{flex:1;min-width:0}.r-main .lines p{margin:4px 0;font-weight:600}
.you{margin:0 0 4px;color:var(--muted)}.you b{color:var(--navy)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
.tag{display:inline-block;font-weight:900;font-size:.85rem;border-radius:12px;padding:3px 10px;white-space:nowrap}.tag.up{background:#dcefe2;color:var(--green)}.tag.down{background:#f9dcd7;color:#9a2f22}.tag.flat{background:#ece7d8;color:var(--ink)}
.reveal{position:relative;background:var(--navy);color:#fff;border-radius:14px;padding:10px 14px 10px;margin:10px 0 2px;box-shadow:0 4px 0 #0003}
.reveal .nw{display:inline-block;background:var(--gold);color:var(--navy);font-weight:900;font-size:.72rem;letter-spacing:.08em;border-radius:8px;padding:2px 8px;margin-bottom:4px}
.reveal p{margin:0;font-size:1.05rem}.reveal b{color:var(--gold)}
.go{margin-top:14px;background:var(--red);color:#fff;border:0;padding:13px 26px;font:900 1.1rem system-ui,Arial,sans-serif;box-shadow:0 5px 0 var(--red2);text-transform:none}
.go:hover{filter:brightness(1.08)}.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red2)}.go:disabled{opacity:.6}

/* ---------- shop ---------- */
.till{position:sticky;top:calc(var(--hudH,96px) + 6px);z-index:5;background:var(--navy);color:#fff;border-radius:16px;padding:8px 12px;margin:0 0 12px;box-shadow:0 6px 16px #0004}
.pts{display:flex;gap:8px;flex-wrap:wrap}
.ptbig{font-weight:900;border-radius:10px;padding:4px 10px;font-size:.95rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.ptbig b{font-size:1.25rem}
.ptbig.red{background:#fdeeec;color:var(--red)}.ptbig.blue{background:#ebf1fa;color:var(--blue)}.ptbig.cash{background:#e9f5ee;color:var(--green)}
.stamprow{display:inline-grid;grid-template-columns:repeat(12,9px);gap:2px}.stamprow i{height:12px;border-radius:2px}.stamprow .r{background:var(--red)}.stamprow .b{background:var(--blue)}.stamprow .used{background:#0001;outline:1px dashed #0002}
.table{background:#7a5230;border-radius:12px;padding:6px 8px 4px;margin-top:8px;background-image:repeating-linear-gradient(90deg,#7a5230 0 40px,#6e4a2b 40px 42px)}
.plates{display:flex;gap:6px;flex-wrap:wrap}
.plate{width:46px;display:flex;flex-direction:column;align-items:center}
.plate i{width:42px;height:42px;border-radius:50%;border:3px dashed #ffffff88;background:#ffffff22;display:grid;place-items:center;font-size:1.35rem;font-style:normal}
.plate.full i{border:3px solid #fff;background:#fff;box-shadow:0 2px 0 #0004;animation:pop .3s}
.plate.extra i{border-color:#ff9a8a}
