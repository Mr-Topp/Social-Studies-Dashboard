<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1776 Files | Evidence Lab</title><style>
:root{--bg:#101c26;--paper:#f8efdd;--ink:#182a31;--red:#ab4236;--gold:#d2a55c;--green:#176456}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:18px/1.48 Arial,sans-serif;color:var(--ink)}button{cursor:pointer;font:inherit}button:focus-visible{outline:4px solid #f6c24e}.shell{max-width:1200px;margin:auto;padding:20px 24px 100px}.bar{display:flex;align-items:center;justify-content:space-between;color:#ffe3aa;font-weight:bold;letter-spacing:2px;gap:20px}.brand{font-size:23px}.meter{border:1px solid #af9d78;padding:8px 13px}.paper{background:var(--paper);border:7px solid #a88f6b;box-shadow:10px 12px 0 #0007;padding:clamp(20px,4vw,48px);margin-top:20px;min-height:450px}.tag{font-size:15px;font-weight:900;letter-spacing:3px;color:var(--red)}h1{font:700 clamp(38px,5vw,68px)/1.03 Georgia,serif;margin:16px 0 18px}h2{font:700 clamp(26px,3vw,36px)/1.2 Georgia,serif;margin:12px 0}p{font-size:clamp(18px,1.9vw,23px)}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.file{min-height:155px;background:#decba6;border:3px solid #776245;text-align:left;padding:15px;font-weight:bold;display:flex;flex-direction:column;justify-content:space-between}.file:hover,.choice:hover{background:#f1d496}.file strong{font:30px Georgia}.file.done{background:#bdd5c4;border-color:#176456}.file small{font-size:12px;letter-spacing:2px}.btn{padding:15px 20px;background:#efc675;color:#182a31;border:3px solid #6a4b2b;font-weight:900;box-shadow:4px 4px 0 #705a3f;margin:7px 8px 7px 0}.btn:disabled{opacity:.35;cursor:not-allowed}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.choice{padding:19px;text-align:left;border:2px solid #8b7055;background:#eee1c9;font-weight:700;min-height:70px}.clue{background:#e3d6bc;border-left:7px solid var(--gold);padding:18px 22px;margin:18px 0}.envelope{background:#fffcf3;border:2px dashed #976a46;padding:18px;margin:20px 0}.trail{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.piece{background:#c5dccc;border:2px solid #176456;padding:8px 12px;font-weight:bold}.feedback{min-height:46px;margin-top:14px;font-weight:bold;color:#8b342d}.hint{font-size:16px;color:#4d534e}.bottom{position:fixed;bottom:0;left:0;right:0;padding:12px;background:#101c26;color:white;border-top:3px solid #d2a55c;display:flex;justify-content:center;align-items:center;gap:20px}.bottom button{padding:10px 16px;background:#edc36d;border:0;font-weight:800}.stamp{display:inline-block;border:6px double var(--red);color:var(--red);font:900 35px Georgia;padding:16px;transform:rotate(-5deg)}
@media(max-height:720px){.shell{padding-top:8px}.paper{padding:16px 28px;margin-top:10px;min-height:0}h1{font-size:40px;margin:4px 0 6px}h2{font-size:26px;margin:6px 0}p{margin:8px 0}.choices{margin:10px 0}.choice{min-height:54px;padding:12px 16px}.clue,.envelope{margin:10px 0;padding:12px 16px}.feedback{min-height:0;margin-top:6px}}
@media(max-width:700px){.shell{padding:10px 9px 100px}.paper{padding:16px}.board,.choices{grid-template-columns:repeat(2,1fr)}.file{min-height:125px}.bottom{font-size:14px}h1{font-size:36px}}
</style></head><body><div class="shell"><div class="bar"><span class="brand">THE 1776 FILES // EVIDENCE LAB</span><span class="meter" id="score">0 / 8 CASES</span></div><main class="paper" id="app"></main></div><footer class="bottom"><button id="board">CASE BOARD</button><span id="status">INVESTIGATION IN PROGRESS</span></footer><script>
const rooms=[
{"label":"01 • ARRIVAL","title":"WHO WAS HERE FIRST","clue":"A map claims nobody lived in North America before European ships arrived. Find the lie.","learn":"Native Americans (also called American Indians) lived all over North America long before Europeans arrived. They had their own nations, governments, and ways of life. Later, colonists came from Europe for many reasons: freedom, religious freedom, and economic opportunity (a chance at land and jobs).","type":"sort","prompt":"Is each card TRUE or FALSE?","yes":"✓ TRUE","no":"✕ FALSE","entries":[["Native nations had their own governments before Europeans arrived","TRUE"],["European settlers found an empty continent","FALSE"],["Some settlers came for land and jobs","TRUE"],["All settlers came for exactly the same reason","FALSE"],["Native nations had different cultures and traditions","TRUE"]],"q":74,"test":"Who lived in America before the Europeans arrived?","choices":["British governors","French soldiers","Native Americans","Pilgrims"],"correctChoice":2},
{"label":"02 • HIDDEN CARGO","title":"THE FORCED JOURNEY","clue":"An old ship record lists human beings as cargo, as if they were property. What does it show?","learn":"Africans were taken from their homes, shipped across the ocean against their will, and sold as slaves in the colonies. Slavery was a big part of the colonial economy, and it took away people’s freedom.","type":"evidence","prompt":"Which label best describes the record?","options":["People moving for new jobs","Africans forced into slavery","A fair trade deal between nations"],"correct":1,"q":75,"test":"What group of people was taken and sold as slaves?","choices":["French soldiers","Africans","European nobles","British settlers"],"correctChoice":1},
{"label":"03 • TAX PROTEST","title":"TAXES WITHOUT A SAY","clue":"A colonist found this message: “You must pay taxes. You cannot vote for the people making the rules.”","learn":"Britain’s Parliament taxed the colonists, but the colonists had nobody they voted for in Parliament. That is “taxation without representation,” a big reason they declared independence. Other reasons on the test: high taxes, the Stamp Act, the Boston Tea Party, and British soldiers staying in colonists’ houses.","type":"evidence","prompt":"Which complaint best explains the colonists’ anger?","options":["Paying taxes with no vote","The colonies wrote their own tax laws","Britain gave the colonists free land"],"correct":0,"q":77,"test":"Name one reason why the Americans declared independence from Britain.","choices":["The Civil War","The Louisiana Purchase","The signing of the Constitution","Taxation without representation"],"correctChoice":3},
{"label":"04 • DOCUMENT LAB","title":"A DECLARATION IS MISSING","clue":"A torn page says: “We declare these colonies free and independent states.” Figure out what it is and who wrote it.","learn":"This is the Declaration of Independence. Thomas Jefferson wrote it. Congress adopted it (officially approved it) on July 4, 1776. It told Britain the colonies were done with British rule. It did not set up our government. The Constitution did that in 1787.","type":"assemble","prompt":"Put these events in order, first to last:","entries":["Colonists protest British taxes","Jefferson writes the Declaration","Congress adopts it on July 4, 1776"],"q":78,"test":"Who wrote the Declaration of Independence?","choices":["Thomas Jefferson","Alexander Hamilton","George Washington","John Jay"],"correctChoice":0},
{"label":"05 • BATTLE MAP","title":"THE REVOLUTION BEGINS","clue":"A message from Washington’s army lists battles and events. Which facts are real?","learn":"The American Revolution (also called the Revolutionary War) was fought from 1775 to 1783 to win independence from Britain. George Washington led the American army. Key events: Bunker Hill, the Declaration, Trenton, Saratoga (it got France to join), Valley Forge, and Yorktown, where the British army surrendered. Gettysburg and Antietam came much later, in the Civil War.","type":"sort","prompt":"Is each card TRUE or FALSE?","yes":"✓ TRUE","no":"✕ FALSE","entries":[["Saratoga helped get France to join the war","TRUE"],["Gettysburg was a Revolutionary War battle","FALSE"],["The British army surrendered at Yorktown","TRUE"],["The Declaration ended the war right away","FALSE"],["Washington led the American army","TRUE"]],"q":80,"test":"The American Revolution had many important events. Name one.","choices":["Battle of Antietam","Battle of Midway","Battle of Saratoga","Battle of Gettysburg"],"correctChoice":2},
{"label":"06 • COLONY VAULT","title":"THIRTEEN KEYS","clue":"A locked map opens with five of the original 13 states. Find the real ones.","learn":"The 13 original states started as 13 British colonies, all on the Atlantic coast. An easy five to remember: Virginia, Massachusetts, New York, Pennsylvania, and Georgia. States out west, like California and Texas, came much later. Iowa became a state in 1846.","type":"sort","prompt":"Was each state one of the original 13?","yes":"✓ ONE OF THE 13","no":"✕ NOT ONE OF THE 13","entries":[["Virginia","TRUE"],["California","FALSE"],["Georgia","TRUE"],["Pennsylvania","TRUE"],["Texas","FALSE"],["Massachusetts","TRUE"]],"q":81,"test":"There were 13 original states. Name five.","choices":["Virginia, Massachusetts, New York, Pennsylvania, Vermont","California, Texas, Florida, Iowa, Ohio","Pennsylvania, Georgia, Maine, Florida, New York","Virginia, Massachusetts, New York, Pennsylvania, Georgia"],"correctChoice":3},
{"label":"07 • FOUNDERS FILES","title":"THE FOUNDERS FILE","clue":"Four founders left notes behind. Match each one to what he is famous for.","learn":"George Washington led the army in the war and became the first president. Thomas Jefferson wrote the Declaration of Independence. James Madison is called the Father of the Constitution. Alexander Hamilton was the first Secretary of the Treasury (in charge of the country’s money). Benjamin Franklin was an inventor and a diplomat who got France to help.","type":"match","prompt":"Match each founder to what he is famous for.","entries":[["George Washington","First president"],["Thomas Jefferson","Wrote the Declaration"],["James Madison","Father of the Constitution"],["Alexander Hamilton","First Secretary of the Treasury"]],"q":88,"test":"James Madison is famous for many things. Name one.","choices":["General of the British army","Father of the Constitution","First Secretary of the Treasury","Inventor and diplomat"],"correctChoice":1},
{"label":"08 • FINAL ARCHIVE","title":"THE NEW GOVERNMENT","clue":"After independence, the country still needed a strong plan for government. Put the documents in order.","learn":"The first plan, the Articles of Confederation, was too weak. In 1787, leaders wrote the Constitution. The Federalist Papers were newspaper essays that explained the Constitution and argued for passing it. Alexander Hamilton, James Madison, and John Jay wrote them under one fake name, Publius.","type":"assemble","prompt":"Put the documents in order, earliest to latest.","entries":["Declaration of Independence adopted (1776)","Articles of Confederation approved (1781)","Constitution written (1787)","Bill of Rights added (1791)"],"q":83,"test":"The Federalist Papers supported passing the U.S. Constitution. Name one of the writers.","choices":["Patrick Henry","Thomas Jefferson","Alexander Hamilton","Benjamin Franklin"],"correctChoice":2}];
const extras=[
["73","The colonists came to America for many reasons. Name one.","",["To vote for the president","To fight in the Civil War","To sign the Constitution","Religious freedom"],3,"File 01: colonists came for freedom, religious freedom, and jobs or land."],
["76","What war did the Americans fight to win independence from Britain?","",["Mexican-American War","American Revolutionary War","Civil War","War of 1812"],1,"File 05: the American Revolution is also called the Revolutionary War."],
["79","When was the Declaration of Independence adopted?","",["July 4, 1789","December 15, 1791","July 4, 1776","September 17, 1787"],2,"File 04: Congress adopted it in 1776, on July 4."],
["82","What founding document was written in 1787?","",["U.S. Constitution","Bill of Rights","Declaration of Independence","Articles of Confederation"],0,"File 08: 1776 = Declaration. 1787 = Constitution."],
["84","Why were the Federalist Papers important?","",["They replaced the Declaration","They supported passing the Constitution","They declared war on Britain","They freed enslaved people"],1,"File 08: the Federalist Papers argued FOR the Constitution."],
["85","Benjamin Franklin is famous for many things. Name one.","",["First president","First Secretary of the Treasury","Inventor","Father of the Constitution"],2,"File 07: Franklin was an inventor and a diplomat."],
["86","George Washington is famous for many things. Name one.","",["Father of the Constitution","First Secretary of the Treasury","First president of the United States","Wrote the Declaration"],2,"File 07: Washington led the army, then became president."],
["87","Thomas Jefferson is famous for many things. Name one.","",["Wrote the Declaration of Independence","First Secretary of the Treasury","General of the Continental Army","Father of the Constitution"],0,"File 07: Jefferson is the Declaration guy (Question 78)."],
["89","Alexander Hamilton is famous for many things. Name one.","",["First president of the United States","Wrote the Declaration of Independence","First Secretary of the Treasury","Father of the Constitution"],2,"File 07: Hamilton ran the country’s money."]];
const s={view:'start',room:0,step:0,done:[],progress:0,wrong:0,feedback:'',final:0,selected:[],arranged:[]};
const root=document.getElementById('app');
const esc=t=>String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
const btn=(text,action,value='',cl='choice')=>'<button class="'+cl+'" data-a="'+action+'" data-v="'+esc(value)+'">'+esc(text)+'</button>';
function mix(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function paint(){
 document.getElementById('score').textContent=s.done.length+' / 8 CASES';
 if(s.view==='start'){root.innerHTML='<div class="tag">CLASSIFIED // FRIDAY 4</div><h1>THE 1776 FILES</h1><p>Eight history files have been tampered with. Examine the clues, repair each file, and pass the historian’s knowledge check. A wrong answer will not finish the case.</p><div class="clue">Unlike an ordinary quiz, you will sort real and false claims, reconstruct a timeline, and match historical people to their work. Every case must be cleared before the final vault opens.</div>'+btn('OPEN CASE BOARD','board','','btn');return}
 if(s.view==='board'){root.innerHTML='<div class="tag">YOUR INVESTIGATION</div><h1>THE CASE BOARD</h1><p>Choose an open case. Each requires an evidence investigation and a correct civics test answer.</p><div class="board">'+rooms.map((r,i)=>'<button class="file '+(s.done.includes(i)?'done':'')+'" data-a="enter" data-v="'+i+'"><strong>'+(s.done.includes(i)?'✓':String(i+1).padStart(2,'0'))+'</strong><span>'+esc(r.title)+'</span><small>'+(s.done.includes(i)?'SOLVED':'OPEN CASE')+'</small></button>').join('')+'</div>'+(s.done.length===8?'<p>'+btn('UNLOCK FINAL VAULT','vault','','btn')+'</p>':'');return}
 if(s.view==='vault'){const e=extras[s.final];root.innerHTML='<div class="tag">FINAL VAULT // LOCK '+(s.final+1)+' OF '+extras.length+'</div><h1>THE MASTER ARCHIVE</h1><p>'+esc(e[1])+'</p><div class="choices">'+mix(e[3].map((v,j)=>[v,j])).map(([v,j])=>btn(v,'vaultanswer',j)).join('')+'</div><div class="feedback" aria-live="polite">'+esc(s.feedback)+'</div>';const f=root.querySelector('.feedback');if(s.feedback&&f)f.scrollIntoView({block:'nearest'});return}
 if(s.view==='win'){root.innerHTML='<div class="tag">ALL EVIDENCE VERIFIED</div><h1>CASE CLOSED</h1><div class="stamp">ARCHIVE RESTORED</div><p>All eight investigations are complete, and every final civics question has been answered correctly.</p><p>Answers corrected along the way: '+s.wrong+'</p>'+btn('PLAY AGAIN','restart','','btn');return}
 const r=rooms[s.room];let view='<div class="tag">EVIDENCE FILE '+(s.room+1)+' / 8 · '+esc(r.label)+'</div><h1>'+esc(r.title)+'</h1><p>'+esc(r.clue)+'</p>';
 if(s.step===0){view+='<div class="clue"><strong>HISTORICAL BACKGROUND</strong><p>'+esc(r.learn)+'</p></div>'+btn('OPEN EVIDENCE ENVELOPE','next','','btn')}
 if(s.step===1){view+='<div class="envelope"><div class="tag">EVIDENCE TASK</div><h2>'+esc(r.prompt)+'</h2>';
 if(r.type==='sort'){const item=r.entries[s.progress];view+='<div class="hint">Evidence '+(s.progress+1)+' of '+r.entries.length+'</div><p><strong>'+esc(item[0])+'</strong></p><div class="choices">'+btn(r.yes||'TRUE','sort','TRUE')+btn(r.no||'FALSE','sort','FALSE')+'</div>'}
 if(r.type==='assemble'){view+='<p class="hint">Select the next event in chronological order.</p><div class="trail">'+s.arranged.map(x=>'<div class="piece">'+esc(x)+'</div>').join('')+'</div><div class="choices">'+mix(r.entries.filter(x=>!s.arranged.includes(x))).map(x=>btn(x,'arrange',x)).join('')+'</div>'}
 if(r.type==='match'){const item=r.entries[s.progress];view+='<div class="hint">Person '+(s.progress+1)+' of '+r.entries.length+'</div><h2>'+esc(item[0])+'</h2><div class="choices">'+mix(r.entries.map(x=>x[1])).map(x=>btn(x,'match',x)).join('')+'</div>'}
 if(r.type==='evidence'){view+='<p>Examine the choices. Which statement fits the source most accurately?</p><div class="choices">'+mix(r.options.map((x,i)=>[x,i])).map(([x,i])=>btn(x,'evidence',i)).join('')+'</div>'}
 view+='</div><div class="feedback" aria-live="polite">'+esc(s.feedback)+'</div>'}
 if(s.step===2){view+='<div class="envelope"><div class="tag">REQUIRED CIVICS CHECK</div><h2>'+esc(r.test)+'</h2><p>Choose the correct answer. This file cannot be completed without it.</p><div class="choices">'+mix(r.choices.map((x,i)=>[x,i])).map(([x,i])=>btn(x,'test',i)).join('')+'</div></div><div class="feedback" aria-live="polite">'+esc(s.feedback)+'</div>'}
 root.innerHTML=view;
 const f=root.querySelector('.feedback');if(s.feedback&&f)f.scrollIntoView({block:'nearest'});
}
function act(action,value){
 const r=rooms[s.room];s.feedback='';
 if(action==='board'){s.view='board';paint();return}
 if(action==='restart'){s.view='start';s.room=0;s.done=[];s.wrong=0;s.final=0;paint();return}
 if(action==='enter'){if(s.done.includes(Number(value)))return;s.room=Number(value);s.view='case';s.step=0;s.progress=0;s.arranged=[]}
 if(action==='next'){s.step=1}
 if(action==='sort'){if(value===r.entries[s.progress][1]){s.progress++;if(s.progress===r.entries.length)s.step=2}else{s.wrong++;s.feedback='That claim is in the wrong file. Review the evidence and try again.'}}
 if(action==='arrange'){if(value===r.entries[s.arranged.length]){s.arranged.push(value);if(s.arranged.length===r.entries.length)s.step=2}else{s.wrong++;s.feedback='That event does not come next. Rebuild the timeline in order.'}}
 if(action==='match'){if(value===r.entries[s.progress][1]){s.progress++;if(s.progress===r.entries.length)s.step=2}else{s.wrong++;s.feedback='Check that person’s actual historical role.'}}
 if(action==='evidence'){if(Number(value)===r.correct)s.step=2;else{s.wrong++;s.feedback='This reading does not match the document. Try again.'}}
 if(action==='test'){if(Number(value)===r.correctChoice){s.done.push(s.room);s.view='board'}else{s.wrong++;s.feedback='Incorrect. You must identify the right civics answer to seal this file.'}}
 if(action==='vault'){if(s.done.length!==8)return;s.view='vault';s.final=0}
 if(action==='vaultanswer'){const e=extras[s.final];if(Number(value)===e[4]){s.final++;if(s.final===extras.length)s.view='win'}else{s.wrong++;s.feedback='Not that one. Hint: '+e[5]}}
 paint();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v)});
document.getElementById('board').onclick=()=>act('board');
paint();
</script></body></html>
