<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Social Studies</title>
<style>
:root{--navy:#19364b;--red:#a33d36;--paper:#f4efe4;--card:#fffdf8;--ink:#22313b;--muted:#536571;--line:#d8cfbd;--green:#1f5e2c;--greenbg:#dff0e2;--yellow:#7a5a00;--yellowbg:#fff1c9;--redbg:#f8dcd8;--blue:#1c3f78;--bluebg:#dbe8fb}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 system-ui,Segoe UI,Arial,sans-serif}
main{max-width:980px;margin:auto;padding:22px 16px 50px}
button,.btn{font:800 1rem system-ui,Segoe UI,Arial,sans-serif;border:0;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #2b6cb0;outline-offset:2px}
.eyebrow{color:var(--red);font-weight:900;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;margin:0 0 2px}
h1{font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.1;color:var(--navy);margin:0}
h2{font-size:1.1rem;color:var(--navy);margin:0 0 8px}
.muted{color:var(--muted)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
/* --- picking class and name --- */
.pick{max-width:820px;margin:20px auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 26px 20px;box-shadow:0 6px 24px #19364b0d}
.pick h1{margin:2px 0 6px}
.pick p{margin:0 0 18px}
.pick .sub{color:var(--muted);font-size:1.05rem}
.pick .backrow{margin:18px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.choice{background:#fff;color:var(--navy);border:2px solid var(--line);padding:16px 14px;text-align:left;font-size:1.1rem}
.choice:hover{border-color:var(--navy)}
.choice small{display:block;font:600 .85rem system-ui;color:var(--muted);margin-top:2px}
.names{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.names .choice{text-align:center;padding:12px 8px;font-size:1.02rem;font-weight:700;border-width:1px}
.names .choice:hover{background:#f6f2ea}
.typerow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.typerow input{flex:1 1 240px;font:inherit;padding:11px 12px;border:2px solid var(--line);border-radius:10px}
.go{background:var(--navy);color:#fff;padding:11px 18px}
.light{background:#e7e0d1;color:var(--navy);padding:9px 14px}
.linkbtn{background:none;color:var(--navy);text-decoration:underline;padding:4px 2px;font-weight:700}
h1:focus{outline:none}
.err{color:var(--red);font-weight:700;margin:8px 0 0}.err:empty{display:none}
/* --- top bar --- */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.top .who{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tab{background:#e7e0d1;color:var(--navy);padding:9px 14px}
.tab[aria-selected=true]{background:var(--navy);color:#fff}
.addclass{background:none;border:2px dashed var(--line);color:var(--muted);padding:7px 12px}
.testbar{background:#dbe8fb;color:#1c3f78;border:1px solid #b6cdf0;border-radius:12px;padding:9px 14px;margin:0 0 14px;font-size:.95rem}
.testbar b{color:#1c3f78}.testbar .linkbtn{color:#1c3f78;font-size:.95rem}
.previewrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.pv{background:#fff;color:#1c3f78;border:1px solid #b6cdf0;padding:6px 12px;font-size:.92rem}
.pv[aria-pressed=true]{background:#1c3f78;color:#fff;border-color:#1c3f78}
.pvnote{margin:8px 0 0;font-weight:700}
.es{background:#1e4f8a;color:#fff;padding:9px 14px}
/* --- next up --- */
.next{background:var(--navy);color:#fff;border-radius:16px;padding:18px 20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.next .lbl{font-size:.8rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#ffd9a8}
.next .what{font-size:1.35rem;font-weight:800;line-height:1.2;margin:2px 0}
.next .why{color:#d6e2ea;font-size:.95rem}
.next .btn{background:#ffd9a8;color:var(--navy);padding:13px 22px;font-size:1.1rem}
.next.done{background:var(--greenbg);color:var(--green)}
.next.done .lbl{color:var(--green)}.next.done .why{color:var(--green)}
.next.done .btn{background:var(--green);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:1.3rem;color:var(--navy);line-height:1.2}
.bar{height:10px;background:#e7e0d1;border-radius:99px;overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:var(--green);border-radius:99px}
/* --- status card: missing or all caught up --- */
.status{border-radius:16px;padding:18px 20px;margin:0 0 10px}
.status h2{font-size:1.45rem;margin:0 0 2px}
.status>p{margin:0 0 12px}.status>p:last-child{margin-bottom:0}
.status.miss{background:var(--navy);color:#fff}.status.miss h2{color:#fff}.status.miss>p{color:#d6e2ea}
.status.done{background:var(--greenbg);color:var(--green)}.status.done h2{color:var(--green)}
.qrow{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#fff;color:var(--ink);border-radius:12px;padding:10px 12px;margin-top:8px}
.qrow .qday{display:block;font-size:.78rem;font-weight:900;color:var(--red);text-transform:uppercase;letter-spacing:.05em}
.qrow .qtitle{display:block;font-weight:800;color:var(--navy);line-height:1.25}
.qgo{background:var(--navy);color:#fff;padding:10px 18px;white-space:nowrap}
.status.miss .qgo{background:#ffd9a8;color:var(--navy)}
.qlabel{margin:14px 0 0;font-size:.8rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.testline{margin:4px 2px 16px;color:var(--muted)}
.testline b{color:var(--navy)}
details.allwork{margin-top:6px}
details.allwork>summary{cursor:pointer;font-weight:800;color:var(--navy);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.allwork[open]>summary{margin-bottom:10px}
/* --- lists --- */
.section{margin:0 0 14px}
.section h2 .n{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:99px;padding:0 9px;font-size:.85rem;color:var(--muted);margin-left:4px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row .info{flex:1 1 300px;min-width:0}
.row .day{font-size:.78rem;font-weight:900;color:var(--red);text-transform:uppercase;letter-spacing:.06em}
.row .title{font-weight:800;color:var(--navy);line-height:1.25}
.row .fb{margin:6px 0 0;padding:8px 10px;background:#f6f2ea;border-radius:8px;font-size:.95rem}
.row .fb b{color:var(--navy)}
.row .ft{font-size:.88rem;color:var(--muted)}
.row .act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .open{background:var(--navy);color:#fff;padding:9px 16px}
.row .open.soft{background:#e7e0d1;color:var(--navy)}
.pill{display:inline-block;border-radius:8px;padding:3px 10px;font-weight:800;font-size:.9rem;white-space:nowrap}
.p-miss{background:var(--redbg);color:#8e2a20}
.p-wait{background:#eef1f3;color:var(--muted)}
.p-in{background:var(--greenbg);color:var(--green)}
.p-l1{background:var(--redbg);color:#8e2a20}.p-l2{background:var(--yellowbg);color:var(--yellow)}.p-l3{background:var(--greenbg);color:var(--green)}.p-l4{background:var(--bluebg);color:var(--blue)}
.p-talk{background:var(--yellowbg);color:var(--yellow)}
.p-class{background:#efe9dc;color:#5a4b2c}
.row.lite{padding:6px 12px;background:#faf7f0;border-style:dashed}.row.lite .title{font-weight:700;font-size:.95rem;color:#3d4f5c}.row.lite .open{padding:6px 12px;font-size:.9rem}
details.paper{margin:0 0 8px}details.paper>summary{cursor:pointer;color:var(--muted);font-weight:700;padding:6px 4px}
.row.summ{background:#fff8ec;border-color:#e8cf9f}
/* --- units --- */
details.unit{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.unit>summary{cursor:pointer;padding:13px 16px;font-weight:800;color:var(--navy);font-size:1.05rem;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.unit>summary::-webkit-details-marker{display:none}
details.unit>summary::before{content:"▸";color:var(--red);transition:transform .15s}
details.unit[open]>summary::before{transform:rotate(90deg)}
.unit .now{background:var(--red);color:#fff;font-size:.72rem;letter-spacing:.08em;border-radius:6px;padding:2px 7px}
.unit .count{margin-left:auto;font-size:.88rem;color:var(--muted);font-weight:700}
.unit .inner{padding:0 12px 6px}
.empty{color:var(--muted);padding:6px 4px 12px;margin:0}
.loading{color:var(--muted);font-style:italic}
.pick + footer{max-width:820px;margin-left:auto;margin-right:auto;padding:0 8px}
footer{margin-top:26px;font-size:.85rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
footer a{color:var(--muted)}
@media (max-width:600px){.next .btn{width:100%;text-align:center}.row .act{width:100%}}
</style>

<body>
<main id="app" aria-live="polite"></main>

<script>
"use strict";
// =====================================================================
//  STUDENT HOME PAGE
//  Each student picks their class and taps their name once. This Chromebook remembers it.
//  They see only their own class: what to do next, what they're missing, what's coming up,
//  and their grades with the teacher's feedback. Answer keys, tests, the teacher's Drive
//  alternatives, and teacher links are never shown here.
//
//  The list of activities comes from shared/assignments.js (same list as the teacher dashboard).
//  Names and grades come from the Teacher Tools web app (shared/google-saver/TeacherTools.gs).
// =====================================================================
const REG = window.CLASS_ASSIGNMENTS || {}, COURSES = window.CLASS_COURSES || {};
const UNITS = window.CLASS_UNITS || {}, UNITS_P1 = window.CLASS_UNITS_PART1 || {};
const CAL = window.CLASS_CALENDAR || {};
const TOOLS = (typeof TEACHER_TOOLS_URL === "string" && TEACHER_TOOLS_URL) ? TEACHER_TOOLS_URL : "";
const CLASS_NOTE = {
  "us-history": "1920s to today", "world-history": "Empires, wars & the modern world",
  "sociology": "How groups shape people", "government": "How the U.S. government works", "civics": "Friday civics test practice"
};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shortName = n => (window.classShortName ? window.classShortName(n) : String(n || "").trim());
const todayIso = (() => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); })();
const niceDate = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });

// ---------- Saved on this Chromebook ----------
// me = { classes: { "us-history": "Jordan M.", ... }, current: "us-history" }
const ME_KEY = "hub-me";
function loadMe() { try { const m = JSON.parse(localStorage.getItem(ME_KEY)); if (m && m.classes) return m; } catch (e) {} return { classes: {}, current: "" }; }
function saveMe() {
  try {
    localStorage.setItem(ME_KEY, JSON.stringify(me));
    const name = me.classes[me.current];
    if (name) localStorage.setItem("site-student-name", name); // activities fill this in for them
  } catch (e) {}
}
let me = loadMe();

// ---------- Teacher test student ----------
// Open the page once with ?teacher-test on the end and this device becomes "Test T." in every class,
// so the teacher sees exactly what a student sees without using a real student's name.
// Turn-ins from Test T. show on the teacher dashboard with a TEST tag (left out of Needs attention).
const TEST_NAME = "Test T.", TEST_KEY = "hub-test-student", PREVIEW_KEY = "hub-test-preview";
let testMode = false, preview = "real";   // preview: "real" or "caught" (pretend everything due is turned in)
try { preview = localStorage.getItem(PREVIEW_KEY) === "caught" ? "caught" : "real"; } catch (e) {}
try {
  if (/[?&]teacher-test\b/.test(location.search)) localStorage.setItem(TEST_KEY, "1");
  testMode = localStorage.getItem(TEST_KEY) === "1";
} catch (e) {}
if (testMode) {
  const keep = COURSES[me.current] ? me.current : "us-history";
  me = { classes: {}, current: keep };
  Object.keys(COURSES).forEach(k => { me.classes[k] = TEST_NAME; });
  saveMe();
  if (/[?&]teacher-test\b/.test(location.search)) history.replaceState(null, "", location.pathname + location.hash);
}
// Drop anything saved for a class that no longer exists.
Object.keys(me.classes).forEach(k => { if (!COURSES[k]) delete me.classes[k]; });

// ---------- Talking to the turn-in sheet ----------
async function tools(payload) {
  if (!TOOLS) throw new Error("no tools");
  const res = await fetch(TOOLS, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
  const d = await res.json();
  if (!d || !d.ok) throw new Error((d && d.error) || "failed");
  return d;
}
const rosterCache = {};
function getRoster(course) {
  if (!rosterCache[course]) rosterCache[course] = tools({ action: "class_list", course }).then(d => (d.names || []).map(shortName).filter(Boolean)).catch(() => []);
  return rosterCache[course];
}

// ---------- What a student can see ----------
const isKey = (id, a) => /answer key|teacher key/i.test(a.title || "") || /-key$/.test(id);
const isTest = a => /summative/i.test(a.title || "") && !/review/i.test(a.title || "");
const isOnline = a => !/^https?:/.test(a.path || "") && a.turnIn !== false;
function studentItems(course) {
  return Object.entries(REG).filter(([id, a]) => a.course === course && a.path && !a.alt && !isKey(id, a) && !isTest(a)
    && !/dashboard\.blooket\.com/.test(a.path)).map(([id, a]) => ({ id, ...a }));
}
const unitKey = a => (a.part === 1 ? "p1|" : "") + (a.unit || 0);
const spanOf = a => { const m = (a.title || "").match(/^Days (\d+)[–-](\d+)/); return m ? [+m[1], +m[2]] : null; };
const cleanTitle = t => String(t || "").replace(/^Days? [\d–-]+ · /, "").replace(/\s*\(printed\)/i, "").replace(/\s*\((Reading|Slides)\)\s*$/i, "").replace(/ — /g, " · ");
const kindWord = a => /\(Reading/i.test(a.title || "") ? "Reading" : /\(printed\)/i.test(a.title || "") ? "Paper" : /\(Slides\)/i.test(a.title || "") ? "Slides + exit ticket" : "";
function unitLabel(course, key) {
  const p1 = key.startsWith("p1|"), u = +key.split("|").pop();
  if (!u) return "More activities";
  if (course === "civics") return "Friday " + u + (UNITS.civics && UNITS.civics[u] ? " · " + UNITS.civics[u].replace(/\s*\(.*\)$/, "") : "");
  const name = p1 ? (UNITS_P1[course] || {})[u] : (UNITS[course] || {})[u];
  return (p1 ? "Part 1 · " : "") + "Unit " + u + (name ? " · " + name : "");
}
// The unit the class is on: the first unit on the green sheet whose test day hasn't passed yet.
// Weekdays after a (not counting a) up to and including b. Dates are "YYYY-MM-DD".
function weekdaysBetween(a, b) {
  let n = 0; const d = new Date(a + "T12:00:00"), end = new Date(b + "T12:00:00");
  while (d < end) { d.setDate(d.getDate() + 1); if (d.getDay() % 6) n++; }
  return n;
}
function nextWeekday(iso) {
  const d = new Date(iso + "T12:00:00");
  do d.setDate(d.getDate() + 1); while (!(d.getDay() % 6));
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function currentUnit(course, keys, doneIds) {
  const cal = CAL[course], pin = (window.CLASS_TODAY || {})[course];
  // Fynn's pin wins until that unit's test day has passed.
  if (pin && keys.includes(String(pin.unit)) && (!cal || !cal[pin.unit] || !cal[pin.unit].summative || cal[pin.unit].summative >= todayIso)) return String(pin.unit);
  if (cal) {
    const u = Object.keys(cal).map(Number).sort((a, b) => a - b).find(n => cal[n].summative && cal[n].summative >= todayIso);
    if (u && keys.includes(String(u))) return String(u);
  }
  // No green sheet (Civics) or nothing listed for that unit: the latest unit anyone has turned in work for.
  let best = "";
  keys.forEach(k => { if ([...doneIds].some(id => REG[id] && unitKey(REG[id]) === k)) best = k; });
  return best || keys[0] || "";
}
const unitOrder = k => (k.startsWith("p1|") ? 0 : 1000) + (+k.split("|").pop() || 999);

// ---------- Grades (same rules as the teacher dashboard) ----------
const roundDown = x => Math.ceil(x - 0.5);
function gradeOf(w) {
  if (!w) return null;
  if (w.cleared) return { cleared: true };
  if (w.flagged) return { talk: true };
  const m = String(w.ft || "").match(/(\d+)\s*(?:of|\/)\s*(\d+)/);
  const ft = m && +m[2] ? { right: +m[1], total: +m[2] } : null;
  const pct = ft ? Math.round(ft.right / ft.total * 100) : null;
  const auto = ft ? (pct >= 90 ? 3 : pct >= 70 ? 2 : 1) : null;
  const written = +w.written || null;
  if (!auto && !written) return { pending: true, ft };
  const n = w.teacher && written ? written : roundDown([auto, written].filter(Boolean).reduce((a, b) => a + b, 0) / [auto, written].filter(Boolean).length);
  return { n, ft, onTrack: n >= 3 && !written };
}
const WORD = { 1: "Needs a redo", 2: "Almost there", 3: "Got it", 4: "Excellent" };
function gradePill(g) {
  if (!g) return "";
  if (g.talk) return `<span class="pill p-talk">Talk with your teacher</span>`;
  if (g.cleared) return `<span class="pill p-in">✓ Done</span>`;
  if (g.pending) return `<span class="pill p-in">✓ Turned in · grade coming soon</span>`;
  return `<span class="pill p-l${g.n}">${g.onTrack ? "On track for Level 3" : "Level " + g.n + " · " + WORD[g.n]}</span>`;
}

// ---------- My work ----------
// From the sheet when the Teacher Tools web app knows about student pages; otherwise from the
// receipts this Chromebook kept when the student turned work in (grades still come from the sheet).
function receipts() { try { return JSON.parse(localStorage.getItem("class-feedback-receipts")) || []; } catch (e) { return []; } }
async function loadWork(course, name) {
  try {
    const d = await tools({ action: "my_work", course, name });
    const mine = {};
    (d.items || []).forEach(w => { if (!mine[w.id] || String(w.at) > String(mine[w.id].at)) mine[w.id] = w; });
    return { mine, classDone: new Set(d.classDone || []), full: true };
  } catch (e) { /* fall back to this Chromebook */ }
  const mine = {};
  const list = receipts().filter(r => REG[r.id] && REG[r.id].course === course);
  list.forEach(r => { if (!mine[r.id] || r.at > mine[r.id].atMs) mine[r.id] = { id: r.id, atMs: r.at, ft: r.ft || "", token: r.token }; });
  const tokens = Object.values(mine).map(w => w.token).filter(Boolean);
  if (tokens.length) {
    try {
      const d = await tools({ action: "feedback", tokens });
      const by = new Map((d.items || []).map(x => [x.token, x]));
      Object.values(mine).forEach(w => { const x = by.get(w.token); if (x && x.graded) { w.flagged = x.flagged; w.feedback = x.feedback; if (!x.flagged) w.written = +x.level; } });
    } catch (e) {}
  }
  return { mine, classDone: new Set(Object.keys(mine)), full: false };
}

// ---------- Screens ----------
let screen = "home", pickCourse = "";

function draw() {
  const app = $("app");
  if (screen === "name" && COURSES[pickCourse]) return drawNamePick(app);
  if (screen === "class" || !me.current || !me.classes[me.current]) return drawClassPick(app);
  return drawHome(app);
}

function drawClassPick(app) {
  screen = "class";
  const have = Object.keys(me.classes);
  app.innerHTML = `<section class="pick">
    <p class="eyebrow">Social Studies</p><h1>${have.length ? "Add a class" : "Welcome! Which class are you in?"}</h1>
    <p class="sub">${have.length ? "Pick another class you take." : "Pick your class. You only have to do this once on this Chromebook."}</p>
    <div class="choices">${Object.keys(COURSES).map(k => `<button class="choice" data-c="${k}">${esc(COURSES[k])}${have.includes(k) ? " ✓" : ""}<small>${esc(CLASS_NOTE[k] || "")}</small></button>`).join("")}</div>
    ${have.length ? `<p class="backrow"><button class="linkbtn" id="back">← Back to my work</button></p>` : ""}
  </section>${footer()}`;
  app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
    const c = b.dataset.c;
    if (me.classes[c]) { me.current = c; saveMe(); screen = "home"; return draw(); }
    pickCourse = c; screen = "name"; draw();
  });
  if ($("back")) $("back").onclick = () => { screen = "home"; draw(); };
  focusFirst();
}

async function drawNamePick(app) {
  const c = pickCourse;
  const known = Object.values(me.classes)[0] || "";
  app.innerHTML = `<section class="pick">
    <p class="eyebrow">${esc(COURSES[c])}</p><h1 id="nameHead">Tap your name</h1>
    <p class="sub" id="nameSub">Find your name and tap it.</p>
    <div id="names"><p class="loading">Loading your class list…</p></div>
    <p class="err" id="err" role="alert"></p>
    <p class="backrow"><button class="linkbtn" id="back">← Pick a different class</button></p>
  </section>${footer()}`;
  $("back").onclick = () => { screen = "class"; draw(); };
  const names = await getRoster(c);
  if (screen !== "name" || pickCourse !== c) return;
  if (!names.length) { $("nameHead").textContent = "Type your name"; $("nameSub").hidden = true; }
  const typeBox = `<div class="typerow"><input id="typed" aria-label="Your first name and last initial" placeholder="First name + last initial, like Jordan M." autocomplete="off" value="${esc(known)}"><button class="go" id="useTyped">That's me</button></div>`;
  $("names").innerHTML = names.length
    ? `<div class="choices names">${names.map(n => `<button class="choice" data-n="${esc(n)}">${esc(n)}</button>`).join("")}</div>
       <p style="margin:12px 0 0"><button class="linkbtn" id="notListed">My name isn't here</button></p><div id="typeWrap" hidden>${typeBox}</div>`
    : `<p class="muted">Type your first name and the first letter of your last name.</p>${typeBox}`;
  const choose = n => {
    me.classes[c] = n; me.current = c; saveMe(); screen = "home"; draw();
  };
  // One quick check so a mis-tap doesn't open someone else's page.
  const confirmName = n => {
    $("names").innerHTML = `<div class="box"><h2 style="font-size:1.4rem">Are you ${esc(n)}?</h2><div class="typerow"><button class="go" id="yesMe">Yes, that's me</button><button class="light" id="noMe">No, go back</button></div></div>`;
    $("yesMe").onclick = () => choose(n);
    $("noMe").onclick = () => drawNamePick(app);
    $("yesMe").focus();
  };
  $("names").querySelectorAll("[data-n]").forEach(b => b.onclick = () => confirmName(b.dataset.n));
  if ($("notListed")) $("notListed").onclick = () => { $("typeWrap").hidden = false; $("typed").focus(); };
  const useTyped = () => {
    const n = shortName($("typed").value);
    if (!/ [A-Z]\.$/.test(n)) { $("err").textContent = n ? "Add the first letter of your last name. Example: " + n.split(" ")[0] + " M." : "Type your name first. Example: Jordan M."; $("typed").focus(); return; }
    confirmName(n);
  };
  $("useTyped").onclick = useTyped;
  $("typed").onkeydown = e => { if (e.key === "Enter") useTyped(); };
  focusFirst();
}

async function drawHome(app) {
  const course = me.current, name = me.classes[course], first = name.split(" ")[0];
  const myClasses = Object.keys(COURSES).filter(k => me.classes[k]);
  const spanish = course === "sociology" && (name === "the student" || (() => { try { return localStorage.getItem("site-lang-es-device") === "1"; } catch (e) { return false; } })());
  const testBar = testMode ? `<div class="testbar" role="note">🧪 <b>Test student mode.</b> You're seeing exactly what a student sees, as “${esc(TEST_NAME)}”. Your turn-ins show on your dashboard tagged TEST.
    <div class="previewrow"><span>Show me:</span><button class="pv" data-pv="real" aria-pressed="${preview === "real"}">My real test work</button><button class="pv" data-pv="caught" aria-pressed="${preview === "caught"}">A student who's all caught up</button><button class="linkbtn" id="testOff">Turn off test mode</button></div>
    ${preview === "caught" ? `<p class="pvnote">Pretend preview: grades and feedback below are samples. Nothing is saved.</p>` : ""}</div>` : "";
  app.innerHTML = testBar + `<div class="top">
      <div><p class="eyebrow">${esc(COURSES[course])}</p><h1>Hi, ${esc(first)}! 👋</h1></div>
      <div class="who">${spanish ? `<a class="btn es" href="sociology/espanol/">Ver en español →</a>` : ""}${testMode ? "" : `<span class="muted">Not ${esc(name)}?</span><button class="linkbtn" id="notMe">Change name</button>`}</div>
    </div>
    <div class="tabs" role="tablist">${myClasses.length > 1 ? myClasses.map(k => `<button class="tab" role="tab" aria-selected="${k === course}" data-k="${k}">${esc(COURSES[k])}</button>`).join("") : ""}${testMode ? "" : `<button class="addclass" id="addClass">+ Add a class</button>`}</div>
    <div id="body"><p class="loading">Loading your work…</p></div>${footer()}`;
  app.querySelectorAll(".tab").forEach(b => b.onclick = () => { me.current = b.dataset.k; saveMe(); draw(); });
  if ($("testOff")) $("testOff").onclick = () => {
    if (!confirm("Turn off test student mode on this device?")) return;
    try { localStorage.removeItem(TEST_KEY); localStorage.removeItem(ME_KEY); localStorage.removeItem("site-student-name"); } catch (e) {}
    testMode = false; me = { classes: {}, current: "" }; screen = "class"; draw();
  };
  app.querySelectorAll(".pv").forEach(b => b.onclick = () => {
    preview = b.dataset.pv;
    try { localStorage.setItem(PREVIEW_KEY, preview); } catch (e) {}
    draw();
  });
  if (testMode) return showWork(course, name);
  $("addClass").onclick = () => { screen = "class"; draw(); };
  $("notMe").onclick = () => {
    if (!confirm("Not " + name + "? This clears " + first + "'s name from this Chromebook so you can pick yours.")) return;
    me = { classes: {}, current: "" };
    try { localStorage.removeItem(ME_KEY); localStorage.removeItem("site-student-name"); } catch (e) {}
    screen = "class"; draw();
  };
  showWork(course, name);
}
async function showWork(course, name) {
  const work = await loadWork(course, name);
  if (me.current !== course || screen !== "home") return;
  if (testMode && preview === "caught") work.preview = true;
  $("body").innerHTML = homeBody(course, work);
  $("body").querySelectorAll("details.unit").forEach(d => d.addEventListener("toggle", () => { openUnits[course + "|" + d.dataset.k] = d.open; }));
  const all = $("body").querySelector("details.allwork"); if (all) all.addEventListener("toggle", () => { allOpen[course] = all.open; });
}

const openUnits = {};
function homeBody(course, work) {
  const items = studentItems(course);
  if (!items.length) return `<div class="box"><h2>Nothing posted yet</h2><p class="muted">Your teacher hasn't put any ${esc(COURSES[course])} activities here yet. Check back soon.</p></div>`;
  const { mine, classDone } = work;
  const keys = [...new Set(items.map(unitKey))].sort((a, b) => unitOrder(a) - unitOrder(b));
  const nowKey = currentUnit(course, keys, new Set([...classDone, ...Object.keys(mine)]));
  const nowOrder = unitOrder(nowKey);
  // How far the class has gotten in each unit = the latest day anyone turned in work for.
  const reached = {};
  [...classDone, ...Object.keys(mine)].forEach(id => { const a = REG[id]; if (a && a.day) { const k = unitKey(a); reached[k] = Math.max(reached[k] || 0, (spanOf(a) || [a.day, a.day])[0]); } });
  // Today's lesson day in the current unit. Starts from where Fynn pinned the class (CLASS_TODAY in
  // shared/assignments.js) or, for a later unit, Day 1 right after the last unit's test. Then moves forward
  // evenly (weekdays only) to the test day on the green sheet.
  const todayDay = (() => {
    const u = +nowKey.split("|").pop(), cal = !nowKey.startsWith("p1|") && CAL[course];
    const c = cal && cal[u];
    if (!c || !c.summative) return 0;
    const pin = (window.CLASS_TODAY || {})[course];
    let fromDate, fromDay;
    if (pin && pin.unit === u) { fromDate = pin.date; fromDay = pin.day; }
    else {
      const prev = cal[u - 1];
      if (!prev || !prev.summative) return 0;
      fromDate = nextWeekday(prev.summative); fromDay = 1;
    }
    if (todayIso <= fromDate) return Math.min(fromDay, c.days);
    const total = weekdaysBetween(fromDate, c.summative), gone = weekdaysBetween(fromDate, todayIso);
    if (!total) return c.days;
    return Math.min(c.days, fromDay + Math.floor(gone / total * (c.days - fromDay)));
  })();
  const isToday = a => unitKey(a) === nowKey && todayDay && a.day && (spanOf(a) ? a.day <= todayDay && todayDay <= spanOf(a)[1] : a.day === todayDay);
  const isDue = a => {
    const k = unitKey(a), o = unitOrder(k);
    if (o < nowOrder) return true;                    // earlier units are all due
    if (o > nowOrder) return false;                   // later units are coming up
    if (!a.day) return classDone.has(a.id);
    if (todayDay) return (spanOf(a) ? spanOf(a)[1] : a.day) < todayDay;   // everything before today's day
    return a.day <= (reached[k] || 0);                 // no day known: how far the class has gotten
  };
  const online = items.filter(isOnline);
  // Work the teacher counts as done for everyone (CLASS_CLEARED in shared/assignments.js).
  const clr = (window.CLASS_CLEARED || {})[course] || {};
  const isCleared = a => (clr.ids || []).includes(a.id) || (!!clr.unit && (a.part === 1 || (a.unit || 0) < clr.unit ||
    ((a.unit || 0) === clr.unit && !!a.day && (spanOf(a) ? spanOf(a)[1] : a.day) <= clr.throughDay)));
  online.forEach(a => { if (!mine[a.id] && isCleared(a)) mine[a.id] = { id: a.id, cleared: true }; });
  // Teacher preview: pretend this student turned in everything due (and today's work), with sample grades.
  if (work.preview) {
    const SAMPLE = [
      { ft: "9 of 9", written: 4, feedback: "Strong answer. You explained the cause and backed it up with a detail from the lesson." },
      { ft: "10 of 10", written: 3, feedback: "You explained it clearly and used a real example. Nice work." },
      { ft: "7 of 7", written: 3, feedback: "Good thinking. Next time, add one more specific fact to prove your point." }
    ];
    online.filter(a => isDue(a) || isToday(a)).forEach((a, i) => { mine[a.id] = Object.assign({ id: a.id, at: todayIso, teacher: false, flagged: false }, SAMPLE[i % SAMPLE.length]); });
  }
  const sortItems = list => list.slice().sort((a, b) => unitOrder(unitKey(a)) - unitOrder(unitKey(b)) || (a.day || 99) - (b.day || 99));
  const due = sortItems(online.filter(isDue));
  const missing = due.filter(a => !mine[a.id]);
  const turnedIn = online.filter(a => mine[a.id]);
  const fix = sortItems(turnedIn.filter(a => { const g = gradeOf(mine[a.id]); return g && g.n && g.n <= 2; }));
  const ahead = sortItems(online.filter(a => !isDue(a) && !mine[a.id] && unitOrder(unitKey(a)) === nowOrder));
  const todays = ahead.filter(isToday);
  const href = a => esc(a.path);
  const ext = a => /^https?:/.test(a.path) ? ` target="_blank" rel="noopener"` : "";
  const dayText = a => { const s = spanOf(a); return s ? `Days ${s[0]}–${s[1]}` : a.day ? `Day ${a.day}` : ""; };
  const where = a => [unitLabel(course, unitKey(a)).replace(/ · .*/, ""), dayText(a)].filter(Boolean).join(" · ");

  // --- The one thing a student needs to know: what am I missing, or am I caught up? ---
  // Kept short on purpose (Fynn: not overwhelming or complicated). Grades live in one closed dropdown below.
  const quick = (a, btn) => `<div class="qrow"><div><span class="qday">${esc(where(a))}</span><span class="qtitle">${esc(cleanTitle(a.title))}</span></div><a class="btn qgo" href="${href(a)}"${ext(a)}>${btn} →</a></div>`;
  const todayRow = todays.length ? `<div class="qlabel">Today's work</div>${todays.map(a => quick(a, "Start")).join("")}` : "";
  let status;
  if (missing.length) {
    status = `<section class="status miss" aria-label="What to do"><h2>You're missing ${missing.length} ${missing.length === 1 ? "thing" : "things"}</h2><p>Do ${missing.length === 1 ? "it" : "them"} in order, top to bottom.</p>${missing.map(a => quick(a, "Start")).join("")}${todayRow}</section>`;
  } else {
    const fixRow = fix.length ? `<div class="qlabel">Optional: raise your grade</div>${fix.map(a => quick(a, "Fix it")).join("")}` : "";
    status = `<section class="status done" aria-label="What to do"><h2>You're all caught up! 🎉</h2><p>${todays.length ? "Nothing missing. Here's today's work:" : due.length ? "You've turned in everything so far." : "Nothing is due yet."}</p>${todayRow}${fixRow}</section>`;
  }
  const cal = (CAL[course] || {})[nowKey.split("|").pop()];
  const testDay = !nowKey.startsWith("p1|") && cal && cal.summative ? cal.summative : "";
  const testLine = testDay ? `<p class="testline">📅 ${esc(unitLabel(course, nowKey).replace(/ · .*/, ""))} test: <b>${esc(niceDate(testDay))}</b>${testDay === todayIso ? " (today!)" : ""} · on paper in class</p>` : "";

  // --- One activity row ---
  const row = (a, inUnit) => {
    const w = mine[a.id], g = gradeOf(w), on = isOnline(a), kw = kindWord(a);
    let pill = "", btn = "Open";
    if (!on) { pill = `<span class="pill p-class">${/\(printed\)/i.test(a.title || "") ? "Paper · in class" : "Done in class"}</span>`; }
    else if (w) { pill = gradePill(g); btn = g && g.n && g.n <= 2 ? "Fix it" : "Look again"; }
    else if (isDue(a)) { pill = `<span class="pill p-miss">Missing</span>`; btn = "Start"; }
    else if (isToday(a)) { pill = `<span class="pill p-in">Today</span>`; btn = "Start"; }
    else { pill = `<span class="pill p-wait">Coming up</span>`; btn = "Look ahead"; }
    const ft = g && g.ft ? `<div class="ft">${g.ft.right} of ${g.ft.total} right on the first try</div>` : "";
    const fb = w && (w.feedback || (g && g.talk)) ? `<p class="fb"><b>Feedback:</b> ${esc(g && g.talk ? "Your teacher wants to talk with you about this one." : w.feedback)}</p>` : "";
    const strong = on && (!w && (isDue(a) || isToday(a)) || (g && g.n && g.n <= 2));
    return `<div class="row${on ? "" : " lite"}"><div class="info"><div class="day">${esc(dayText(a) || (course === "civics" ? "Friday" : ""))}${kw ? " · " + esc(kw) : ""}</div><div class="title">${esc(cleanTitle(a.title))}</div>${ft}${fb}</div>
      <div class="act">${pill}<a class="btn open${strong ? "" : " soft"}" href="${href(a)}"${ext(a)}>${btn}${/^https?:/.test(a.path) ? " ↗" : ""}</a></div></div>`;
  };

  // --- Every unit, in day order. The class's current unit starts open. ---
  // Only this unit and earlier ones (future units would just be clutter).
  const units = keys.filter(k => unitOrder(k) <= nowOrder).map(k => {
    const list = sortItems(items.filter(a => unitKey(a) === k));
    const on = list.filter(isOnline), got = on.filter(a => mine[a.id]).length;
    const isNow = k === nowKey, future = unitOrder(k) > nowOrder;
    const owed = on.filter(a => mine[a.id] || isDue(a)).length;
    const paper = list.filter(a => !isOnline(a));
    const c = !k.startsWith("p1|") && (CAL[course] || {})[k];
    const testRow = c && c.summative ? `<div class="row summ"><div class="info"><div class="day">Day ${c.days} · Unit test</div><div class="title">📅 ${esc(niceDate(c.summative))} · on paper in class</div></div></div>` : "";
    const open = (course + "|" + k) in openUnits ? openUnits[course + "|" + k] : isNow;
    const past = unitOrder(k) < nowOrder;
    const countTxt = !on.length ? "" : future && !got ? "Coming up" : !owed ? "Nothing due yet" : `${got} of ${owed} turned in`;
    return `<details class="unit" data-k="${esc(k)}"${open ? " open" : ""}><summary>${esc(unitLabel(course, k))}${isNow ? ` <span class="now">NOW</span>` : ""}<span class="count">${countTxt}${past && on.length && got === on.length ? " ✓" : ""}</span></summary>
      <div class="inner">${on.map(a => row(a, true)).join("")}${paper.length ? `<details class="paper"><summary>📄 Paper and in-class work (${paper.length})${!future ? " · missed class? Ask your teacher for these" : ""}</summary>${paper.map(a => row(a, true)).join("")}</details>` : ""}</div></details>`;
  }).join("");

  return status + testLine + `<details class="allwork"${allOpen[course] ? " open" : ""}><summary>📋 My grades and all my ${esc(COURSES[course])} work</summary><div class="allinner">${units}</div></details>`;
}
const allOpen = {};

function footer() {
  return `<footer><span>Your name fills in by itself on every activity on this Chromebook.</span></footer>`;
}
function focusFirst() { const el = document.querySelector("#app h1"); if (el) { el.setAttribute("tabindex", "-1"); el.focus({ preventScroll: true }); } }

// A link with a class on the end (like .../#us-history from Schoology) opens that class.
function fromLink() {
  const h = location.hash.slice(1);
  if (!COURSES[h]) return false;
  if (me.classes[h]) { me.current = h; saveMe(); screen = "home"; }
  else { pickCourse = h; screen = "name"; }
  return true;
}
fromLink();
window.addEventListener("hashchange", () => { if (fromLink()) draw(); });
draw();
</script>
</body>
