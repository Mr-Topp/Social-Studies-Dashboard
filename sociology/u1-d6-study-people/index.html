<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research Rivals | Sociology Unit 1 Day 6</title>
<meta name="description" content="Run a research agency: match the right research method to each client's question, and beat a rival that sells fast, cheap answers.">
<style>:root{--ink:#1d2a33;--muted:#56636c;--card:#fff;--line:#e0dccf;--teal:#0f7a67;--teal2:#e3f5ef;--orange:#e0602a;--red:#b8352a;--green:#1f7a47;--gold:#e0a21b;
--survey:#2f6fd0;--interview:#8a4fc4;--observe:#1f8a5b;--experiment:#d0533a;--content:#c48a10}
*{box-sizing:border-box}
html{min-height:100%;background:radial-gradient(circle at 15% 0%,#2bb39a 0,transparent 45%),radial-gradient(circle at 90% 6%,#ffb36b 0,transparent 35%),linear-gradient(160deg,#0f7a67 0%,#1b5f9e 100%)}
body{margin:0;color:var(--ink);font:17px/1.45 system-ui,"Segoe UI",Arial,sans-serif;min-height:100vh;background:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#ffffff22 1.5px,transparent 1.6px);background-size:22px 22px;z-index:0}
body>*{position:relative;z-index:1}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ffd34d;outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px max(14px,calc((100vw - 1040px)/2));font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#e6fff8;background:#0b4f45cc}
.top .agency{color:#fff}
/* ---------- versus HUD ---------- */
.hud{position:sticky;top:0;z-index:20;background:#102b3add;backdrop-filter:blur(6px);color:#fff;border-bottom:3px solid #ffd34d;padding:6px max(14px,calc((100vw - 1040px)/2));display:grid;grid-template-columns:1fr auto 1fr;gap:6px 14px;align-items:center;font-weight:800;font-size:.9rem;box-shadow:0 4px 14px #0004}
.team{display:flex;align-items:center;gap:8px}.team.rival{justify-content:flex-end}
.ava{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;background:#fff;box-shadow:0 0 0 3px #2bd1a8;flex:none}
.rivalava{background:linear-gradient(135deg,#ff9a4d,#d9302b);box-shadow:0 0 0 3px #ffb36b;font-size:1.5rem}
.tm{display:flex;flex-direction:column;line-height:1.05}.tm .sm{font-size:.72rem;opacity:.8;font-weight:700}
.center{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.hjob{display:flex;align-items:center;gap:6px}
.dots{display:flex;gap:4px}.dots i{width:11px;height:11px;border-radius:50%;background:#ffffff40;display:block}.dots i.done{background:#2bd1a8}.dots i.now{background:#ffd34d;box-shadow:0 0 0 3px #ffd34d55}
.tok{position:relative;background:#ffffff1f;border:1px solid #ffffff40;border-radius:999px;padding:3px 11px;white-space:nowrap}
.tok.neg,.tok:has(.neg){background:#b8352a}
.meter{position:relative;display:flex;align-items:center;gap:6px;white-space:nowrap}.meter .tr{width:78px;height:11px;border-radius:9px;background:#ffffff30;overflow:hidden;display:inline-block}.meter .tr i{display:block;height:100%;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.meter .lbl{font-size:.75rem;opacity:.85}
#repFill{background:linear-gradient(90deg,#ffd34d,#ffb000)}#hypeFill{background:linear-gradient(90deg,#ff9a4d,#ff3d2e)}
.float{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-weight:900;font-size:1rem;pointer-events:none;animation:floatUp 1.5s ease-out forwards;text-shadow:0 1px 3px #0008;white-space:nowrap}
.float.up{color:#7dffb5}.float.down{color:#ff9d8f}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-6px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,26px)}}
.bump{animation:bump .6s}@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(-6deg)}100%{transform:scale(1)}}
main{max-width:1040px;margin:auto;padding:12px 14px 40px}
.welcome{background:#e3f6ea;color:var(--green);font-weight:800;border-radius:12px;padding:8px 12px;margin:0 0 10px;box-shadow:0 3px 0 #0002}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;color:#e8fff9;font-size:.85rem;align-items:center}
.foot button{background:#ffffffd9;border:0;padding:8px 12px;font-weight:800;border-radius:9px;min-height:40px;color:var(--ink)}
.card{background:#fffdf8;border:3px solid #fff;border-radius:20px;padding:16px 18px;box-shadow:0 10px 30px #0003}
.kicker{display:inline-block;font-size:.78rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--orange);border-radius:999px;padding:3px 12px;margin:0 0 10px}
h2{font-size:1.35rem;margin:14px 0 8px;line-height:1.25}
.sub{margin:-4px 0 10px;color:var(--muted)}
.go{background:linear-gradient(180deg,#ffd34d,#ffb000);color:#3a2600;border:0;border-radius:14px;padding:12px 22px;font-weight:900;min-height:50px;font-size:1.05rem;box-shadow:0 4px 0 #b97d00,0 6px 14px #0003;letter-spacing:.01em}
.go:hover{filter:brightness(1.06)}.go:active{transform:translateY(3px);box-shadow:0 1px 0 #b97d00}
.go.next{margin-top:14px}
.msg{min-height:1.3em;font-weight:750;margin:8px 0 0}.msg.bad{color:var(--red)}.msg.good{color:var(--green)}
/* ---------- animations (only when a screen first appears) ---------- */
.anim .stamp{animation:slam .5s cubic-bezier(.2,1.6,.4,1) both .15s}
@keyframes slam{0%{opacity:0;transform:scale(2.6) rotate(-14deg)}70%{opacity:1;transform:scale(.92) rotate(-3deg)}100%{transform:scale(1) rotate(-3deg)}}
.anim .unlock{animation:pop .5s cubic-bezier(.2,1.5,.4,1) both .6s}
@keyframes pop{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
.anim .post{animation:slideIn .45s ease-out both .4s}
@keyframes slideIn{0%{opacity:0;transform:translateX(30px)}100%{opacity:1;transform:none}}
.anim .pp{animation:pop .35s both}.anim .pp:nth-child(2){animation-delay:.9s}.anim .pp:nth-child(3){animation-delay:1s}.anim .pp:nth-child(4){animation-delay:1.1s}.anim .pp:nth-child(1){animation-delay:.8s}
.anim .minicard{animation:flip .6s ease-out both}
@keyframes flip{0%{transform:rotateY(90deg) scale(.8)}100%{transform:rotateY(0) rotate(-6deg)}}
.anim .garbage .paper,.anim .bt i{animation:grow .7s ease-out both}
@keyframes grow{0%{width:0}}
.anim .garbage .paper{animation:crumple .5s ease-out both}
@keyframes crumple{0%{transform:scale(1.15) rotate(4deg);opacity:0}100%{transform:rotate(-1deg);opacity:1}}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- intro ---------- */
body.on-intro .hud{display:none}
.intro{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:center;background:linear-gradient(120deg,#fff 0%,#fff8ef 55%,#e8f5f0 100%);border:3px solid #fff;border-radius:22px;padding:18px 22px;box-shadow:0 10px 30px #0003}
.intro .kick{margin:0;font-size:.78rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.intro h1{margin:0;font-size:clamp(2.2rem,4.8vw,3.4rem);line-height:1.02;letter-spacing:-.02em;background:linear-gradient(90deg,#0f7a67,#1b5f9e 60%,#e0602a);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro .hook{font-size:1.12rem;font-weight:700;margin:6px 0 8px}
.chips{list-style:none;padding:0;margin:0 0 8px;display:flex;flex-wrap:wrap;gap:6px}.chips li{background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 11px;font-weight:750;font-size:.9rem}
.goal{margin:0 0 8px;background:var(--teal2);border-radius:10px;padding:7px 11px;font-size:.96rem}
.namelab{display:block;font-weight:800;font-size:.9rem;margin:0 0 4px}
.startrow{display:flex;gap:8px;flex-wrap:wrap}
.startrow input{flex:1 1 220px;font:inherit;border:2px solid #cfcab9;border-radius:12px;padding:10px;min-height:50px}
.go.big{font-size:1.15rem;padding:12px 24px}
.intro-art{display:flex;flex-direction:column;gap:12px;align-items:center}
.fan{position:relative;height:170px;width:300px}
.fcard{position:absolute;left:50%;top:10px;width:96px;height:136px;margin-left:-48px;background:#fff;border:3px solid var(--c);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 4px 12px #0003;font-size:.72rem;text-align:center;padding:4px;transition:transform .3s}
.fcard span{font-size:2rem}.fcard b{color:var(--c)}
.fcard:nth-child(1){transform:rotate(-24deg) translate(-70px,16px)}.fcard:nth-child(2){transform:rotate(-12deg) translate(-36px,4px)}.fcard:nth-child(3){transform:translateY(-4px)}.fcard:nth-child(4){transform:rotate(12deg) translate(36px,4px)}.fcard:nth-child(5){transform:rotate(24deg) translate(70px,16px)}
.m-survey{--c:var(--survey)}.m-interview{--c:var(--interview)}.m-observe{--c:var(--observe)}.m-experiment{--c:var(--experiment)}.m-content{--c:var(--content)}

/* ---------- people talking ---------- */
.how{background:#fff4d6;border:2px dashed #e7b84a;border-radius:14px;padding:8px 12px;margin:0 0 10px;font-size:.95rem}.how p{margin:3px 0}
.client{display:flex;gap:12px;align-items:flex-start}
.c-ava,.say-ava{font-size:2.2rem;line-height:1;background:#fff;border-radius:50%;width:60px;height:60px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 3px #9cc3ee,0 3px 8px #0002}
.c-body{flex:1;min-width:0}.c-body>p{margin:2px 0}.c-who{font-size:.9rem}.c-tag{font-weight:900;color:#2b5d9c;text-transform:uppercase;font-size:.74rem;letter-spacing:.06em;margin-right:4px}
.c-ask{position:relative;background:#eaf3ff;border:2px solid #9cc3ee;border-radius:4px 18px 18px 18px;padding:10px 14px;font-size:1.1rem;font-weight:700;line-height:1.35;margin:4px 0!important}
.c-pay{font-size:.92rem;font-weight:800}.c-pay b{color:var(--green);font-size:1.1rem}
.fict{margin-left:6px;font-size:.74rem;background:#ece8dc;border-radius:6px;padding:1px 6px;font-weight:700;color:var(--muted)}
.say{display:flex;gap:10px;align-items:flex-start;margin:10px 0 0}
.say-ava{width:48px;height:48px;font-size:1.7rem}
.say-b{background:#fff;border:2px solid #d9d3c3;border-radius:4px 16px 16px 16px;padding:7px 12px;max-width:640px}
.say-b p{margin:0;font-weight:700}.say-n{display:block;font-size:.74rem;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.say.angry .say-ava{box-shadow:0 0 0 3px #e9a99f}.say.angry .say-b{border-color:#e9a99f;background:#fff5f3}
.say.ask .say-ava{box-shadow:0 0 0 3px #ffd34d}.say.ask .say-b{border-color:#ffd34d;background:#fffbea;font-size:1.05rem}
/* ---------- cards ---------- */
.pickh{margin-top:16px}
.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;perspective:800px}
.mcard{position:relative;text-align:left;background:#fff;border:3px solid #ddd8c9;border-top:10px solid var(--c);border-radius:16px;padding:9px 10px;display:flex;flex-direction:column;gap:5px;font-size:.84rem;line-height:1.3;transition:transform .18s,box-shadow .18s;min-height:168px;box-shadow:0 4px 0 #0000001a}
.mcard:hover:not(:disabled){transform:translateY(-6px) rotate(-1deg);box-shadow:0 12px 20px #0003}
.mcard.sel{border-color:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 35%,transparent),0 12px 20px #0003;transform:translateY(-10px)}
.mcard.tried{cursor:not-allowed;background:#f4f2ec}.mcard.tried>:not(.stampmini){opacity:.35;filter:grayscale(.8)}
.mcard:disabled{cursor:not-allowed}
.mc-top{display:flex;align-items:center;gap:6px}.mc-icon{font-size:1.7rem}.mc-name{font-weight:900;font-size:1rem;color:var(--c);line-height:1.1}
.mc-q{background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:10px;padding:6px 8px;font-weight:900;font-size:1rem;line-height:1.2;color:var(--ink)}
.mc-pips{font-size:.78rem;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:0 5px;font-weight:700}.pv{color:var(--c);letter-spacing:1px;font-size:.95rem}.pv .off{color:#ddd}
.mc-cost{margin-top:auto;display:flex;justify-content:space-between;gap:4px;font-weight:900;font-size:.82rem;border-top:1px dashed #ddd;padding-top:5px}
.stampmini{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);background:#fff;border:3px solid var(--red);color:var(--red);font-weight:900;border-radius:8px;padding:2px 8px;font-size:1.05rem;z-index:2;white-space:nowrap;box-shadow:0 2px 6px #0003}
.playbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:14px;background:#102b3a;color:#fff;border-radius:16px;padding:10px 14px;min-height:70px}
.playbar p{margin:0}.pb-none{opacity:.85;font-weight:700}.pb-sel{font-size:1.05rem;flex:1}.pb-cost{margin-left:6px;font-weight:800;opacity:.85;white-space:nowrap}
.playbar .msg.bad{color:#ffb4a8}
.minicard{width:74px;height:100px;border:3px solid var(--c);border-top-width:9px;border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.66rem;text-align:center;transform:rotate(-6deg);box-shadow:0 4px 10px #0003;flex:none}
.minicard span{font-size:1.8rem}.minicard b{color:var(--c)}
.played{display:flex;gap:14px;align-items:center}.played p{margin:0}.played .say{margin-top:4px}
.setups{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.setup{position:relative;text-align:center;background:#fff;border:3px solid #d6d1c1;border-bottom-width:7px;border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:150px;transition:transform .15s}
.setup:hover{border-color:var(--teal);transform:translateY(-4px)}
.sc-ic{font-size:2.4rem;line-height:1}.sc-l{font-weight:900;font-size:1.15rem;line-height:1.2}.sc-s{color:var(--muted);font-size:.92rem}
.sc-cost{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.chip{background:#fbe3dd;color:var(--red);font-weight:900;border-radius:999px;padding:2px 10px;font-size:.88rem}
.sc-cost.free .chip{background:#e1f2e7;color:var(--green)}.chip.up{background:#e1f2e7;color:var(--green)}
/* ---------- reports ---------- */
.desk{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
.paper{background:#fff;border:1px solid #e3ddca;border-radius:6px;padding:12px 14px;box-shadow:0 1px 0 #e3ddca,0 6px 0 -2px #f3efe3,0 7px 0 -2px #e3ddca,0 10px 18px #0002;position:relative}
.report{transform:rotate(-.6deg)}
.report::before{content:"📎";position:absolute;top:-14px;left:18px;font-size:1.5rem;transform:rotate(-20deg)}
.garbage{margin:12px 0 0}
.garbage .paper{background:#fff6f4;border-color:#efc2b9;transform:rotate(-1deg)}
.garbage .paper p{margin:4px 0}
.stamp{display:inline-block;font-weight:900;letter-spacing:.08em;border:4px solid;border-radius:8px;padding:2px 12px;margin:0 0 6px;transform:rotate(-3deg);font-size:1.05rem;text-transform:uppercase}
.s-solid{color:var(--green);border-color:var(--green);background:#eaf6ef}.s-shaky{color:#a05a00;border-color:#d89b2b;background:#fff5e0}.s-ok{color:#806400;border-color:#d4b23c;background:#fffbe3}.s-garbage{color:var(--red);border-color:var(--red);background:#fff}
.payline{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}.pp{background:#efece3;border-radius:999px;padding:4px 12px;font-weight:900;font-size:.95rem}.pp.up{background:#d8f2e1;color:var(--green)}.pp.down{background:#f9ddd7;color:var(--red)}
.r-plan{margin:0 0 8px;font-size:.95rem}.r-sep{color:var(--muted)}.r-text{margin:8px 0 0;font-weight:800}
.bars{display:grid;gap:6px;margin:6px 0 2px}.brow{display:grid;grid-template-columns:minmax(100px,170px) 1fr 44px;gap:8px;align-items:center;font-size:.9rem}
.bt{height:18px;background:#ebe8de;border-radius:6px;overflow:hidden}.bt i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#3ac2a5)}.bv{text-align:right}
.madeup{margin:3px 0 0;font-size:.76rem;color:var(--muted)}
.quote{margin:6px 0;background:#f7f2ff;border-left:5px solid var(--interview);border-radius:8px;padding:6px 10px;font-style:italic}
.rivalh{margin:0 0 6px;font-size:.82rem;color:var(--muted);font-weight:700}
.post{display:flex;gap:10px;background:#fff;border:2px solid #f0d6cc;border-radius:16px;padding:10px 12px;box-shadow:0 4px 12px #0000001a;max-width:560px}
.post.quiet{background:#f3f9f1;border-color:#cfe6cf}
.p-ava{font-size:1.4rem;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#ff9a4d,#d9302b);display:flex;align-items:center;justify-content:center;flex:none}
.quiet .p-ava{background:#dfeedd}
.p-body p{margin:0}.p-head{font-size:.9rem}.handle{color:var(--muted);font-weight:500}.p-text{font-size:1rem;font-weight:700;margin:2px 0 4px!important}.p-meta{font-size:.78rem;color:var(--muted)}
.unlock{display:flex;gap:12px;align-items:center;margin:16px 0 0;background:linear-gradient(90deg,#fff6cf,#fffdf3);border:3px solid #ffd34d;border-radius:16px;padding:10px 14px;box-shadow:0 4px 0 #e6b800}
.u-ic{font-size:2rem;width:52px;height:52px;border-radius:50%;background:#ffd34d;display:flex;align-items:center;justify-content:center;flex:none}
.unlock p{margin:0}.u-tag{font-size:.74rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#9a6a00}.u-txt{font-size:1.04rem}.u-txt b{color:#0d5a4c}
/* ---------- evidence checks: a clue board ---------- */
.board{position:relative;margin:18px 0 0;border-radius:18px;padding:12px 14px 14px;background:#c99a5e;background-image:radial-gradient(#00000014 1px,transparent 1.5px),radial-gradient(#ffffff1c 1px,transparent 1.5px);background-size:9px 9px,13px 13px;border:6px solid #8b5a2b;box-shadow:inset 0 0 18px #0003,0 6px 16px #0003}
.board .ck-kick{display:inline-block;margin:0 0 10px;font-weight:900;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:#102b3a;border-radius:8px;padding:4px 10px}
.pins{display:grid;gap:10px}
.pins>*{position:relative;transform:rotate(-.7deg)}.pins>*:nth-child(2){transform:rotate(.8deg)}
.pins>*::after{content:"📌";position:absolute;top:-12px;right:14px;font-size:1.2rem}
.pins .bars{background:#fff;border-radius:6px;padding:8px 10px;margin:0}.pins .madeup{background:#fff;border-radius:6px;padding:2px 8px;display:inline-block;transform:none}
.pins .madeup::after{display:none}
.board .say-b{border-width:3px}
.replies{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.choice{position:relative;text-align:left;background:#fff;border:3px solid #fff;border-bottom:6px solid #d6d1c1;border-radius:14px;padding:10px 12px 10px 38px;font-weight:800;min-height:54px;line-height:1.3;transition:transform .12s}
.choice::before{content:"💬";position:absolute;left:10px;top:50%;transform:translateY(-50%)}
.choice:hover:not(:disabled){transform:translateY(-3px);border-color:#ffd34d}
.choice:disabled{opacity:.6;cursor:not-allowed}.choice.nope{border-color:var(--red);background:#fdeceb;opacity:1}
.board .msg{background:#fff;border-radius:10px;padding:0 10px;display:inline-block}.board .msg:empty{display:none}.board .msg.bad{padding:6px 10px}
.board .msg:not(.bad):not(:empty){padding:6px 10px}
.board.done{background:#e8f6ec;background-image:none;border-color:#7cc49a;padding-top:12px}
.board.done .ck-kick{background:var(--green)}
.unstamp{position:absolute;top:10px;right:14px;font-weight:900;letter-spacing:.1em;color:var(--green);border:3px solid var(--green);border-radius:8px;padding:0 8px;transform:rotate(6deg);background:#fff}
.solved .unstamp{animation:slam .5s cubic-bezier(.2,1.6,.4,1) both}
.answered{font-weight:900;color:var(--green);margin:10px 0 2px;font-size:1.05rem}.why{margin:2px 0}
.casefile{margin:0;background:#fbf6e9;border:1px solid #e1d3a8;border-radius:6px;padding:9px 12px;font-family:Georgia,"Times New Roman",serif;box-shadow:2px 3px 0 #0002}
.casefile p,.notes p{margin:4px 0}.cf-tag{font-family:system-ui,"Segoe UI",Arial,sans-serif;font-weight:900;font-size:.8rem;color:#7a5a10;text-transform:uppercase;letter-spacing:.04em}
.src{font-size:.76rem;color:var(--muted);font-family:system-ui,"Segoe UI",Arial,sans-serif}
