re gives small raises to stop the union talk."}}, {"t": "Ask for more hours", "s": "More money now", "fx": 1, "say": "More hours, less time with your kids."}]}, "check": {"std": "US.47", "short": "PATCO and unions", "q": "In 1983, a meatpacking company tells its union workers: take a big pay cut or be replaced. Why does it think it can do that?", "right": "After PATCO, bosses saw strikers could be replaced.", "wrong": ["A new law said union workers could never get raises.", "The union itself asked for everyone's pay to drop.", "Reagan ordered every meatpacker to lower its pay."], "hint": "Think about what bosses learned from the air traffic controller firings.", "why": "Meatpacking companies pushed big pay cuts on union workers in the 1980s. Supporters said Reagan enforced the law. Critics said he weakened every union."}}, {"yr": "1982", "head": "Hard times. Jobs disappear.", "sub": "To stop prices from rising, the government's bank (the Federal Reserve) makes borrowing money cost a LOT more. Businesses stop hiring. Factories lay people off.", "ask": "Who gets hurt the MOST?", "best": "mike", "fx": {"mike": -2, "lisa": -1, "carl": -1, "rosa": -1}, "cushion": "saved", "cushionSay": "Saving in 1981 helped you get through.", "why": {"mike": "Laid off from the plant", "lisa": "Fewer customers", "carl": "His stocks drop for a while", "rosa": "Her hours get cut"}, "idea": "<b>The trade-off:</b> prices finally stopped rising so fast, but millions lost their jobs along the way. In late 1982, about 1 in 10 workers had no job.", "moves": {"mike": [{"t": "Take any job", "s": "Even a low-pay one", "fx": 1, "say": "Not great pay, but it helps.", "later": {"3": -1}, "laterSay": {"3": "You're stuck in a low-pay job when the boom comes."}}, {"t": "Wait for a callback", "s": "Hope the plant calls", "fx": -1, "say": "Money is really tight.", "later": {"3": 2}, "laterSay": {"3": "The plant called you back."}}], "lisa": [{"t": "Lay off your helper", "s": "Save money now", "fx": 1, "say": "Your store survives. Your helper is out of work.", "later": {"3": -1}, "laterSay": {"3": "You're short-handed when customers come back."}}, {"t": "Borrow to hang on", "s": "Loans cost a LOT now", "fx": -1, "say": "That loan is expensive.", "later": {"3": 2}, "laterSay": {"3": "Your full store is ready for the boom."}}], "carl": [{"t": "Buy cheap stocks", "s": "Bet the drop ends", "fx": -1, "say": "They keep dropping... for now.", "later": {"3": 2}, "laterSay": {"3": "The stocks you bought cheap soared."}}, {"t": "Sell everything", "s": "Stop losing", "fx": 1, "say": "You stopped the losses.", "later": {"3": -1}, "laterSay": {"3": "You missed the big rise."}}], "rosa": [{"t": "Ask family for help", "s": "Swallow your pride", "fx": 1, "say": "Your sister helps out."}, {"t": "Skip a bill", "s": "Get by this month", "fx": 0, "say": "You get by this month.", "later": {"3": -1}, "laterSay": {"3": "Late fees and a hit to your credit."}}]}, "check": {"std": "US.47", "short": "Why expensive loans slowed prices", "q": "Prices were rising about 13% a year. How does making borrowing super expensive slow prices down?", "right": "People borrow and spend less, so prices cool down.", "wrong": ["Stores get paid more, so they lower all of their prices.", "The government prints more money to hand out to shoppers.", "Workers all get raises, so they stop buying so much stuff."], "hint": "If loans cost a lot, do people buy more stuff or less?", "why": "It worked: price rises fell from about 13% a year to about 4%. But millions lost jobs along the way."}}, {"yr": "1984", "head": "Boom! The economy takes off.", "sub": "Prices calm down. Lots of new jobs: about 16 million by 1989. Stock prices have climbed a lot since late 1982. But many factory jobs never come back.", "ask": "Who gains the MOST?", "best": "carl", "fx": {"mike": 1, "lisa": 1, "carl": 3, "rosa": 1}, "cushion": "bet", "cushionSay": "Buying cheap in 1982 paid off big.", "why": {"mike": "Back to work, but for less pay", "lisa": "Customers are back", "carl": "His stocks are way up", "rosa": "Groceries stop jumping in price, and she gets more hours"}, "idea": "<b>Big question:</b> the economy grew, but did it grow the same for everyone?", "moves": {"mike": [{"t": "Ask for a raise", "s": "Times are good", "fx": 1, "say": "You got a small raise."}, {"t": "Buy a new truck on a loan", "s": "Treat yourself", "fx": 0, "say": "Nice truck, big payments."}], "lisa": [{"t": "Open a second store", "s": "Ride the boom", "fx": 1, "say": "Sales are up. It paid off."}, {"t": "Play it safe", "s": "One store is enough", "fx": 0, "say": "Steady, nothing new."}], "carl": [{"t": "Buy more stocks", "s": "Ride the boom", "fx": 1, "say": "Your stocks keep climbing."}, {"t": "Cash out", "s": "Take the money", "fx": 0, "say": "Safe, and still rich."}], "rosa": [{"t": "Train for a better job", "s": "Night classes", "fx": 1, "say": "Hard work, better job."}, {"t": "Play it safe", "s": "Keep your job", "fx": 0, "say": "Nothing changes for you."}]}, "check": {"std": "US.49", "short": "Supporters vs. critics", "q": "Supporters and critics saw the boom differently. Which pair matches what each side said?", "right": "Supporters: jobs and calm prices. Critics: the rich gained most.", "wrong": ["Supporters: taxes went up a lot. Critics: prices kept rising fast.", "Supporters: unions got stronger. Critics: most jobs disappeared.", "Supporters: the debt went way down. Critics: only farms gained."], "hint": "Read the news for jobs and prices. Then look at who gained the most.", "why": "Both are true. Supporters pointed to jobs and calm prices. Critics pointed to the growing gap and a national debt that almost tripled."}}], "finalHead": "Final board: who ended up better off?", "finalIdea": "<b>On this board</b>, the person who started with the most gained the most. <b>Supporters</b> said Reagan's plan brought about 16 million new jobs and calmer prices for everyone. <b>Critics</b> said the rich-poor gap grew and the national debt almost tripled. (Congress passed those budgets too.)", "prompts": [{"id": "help", "short": "Did Reagan's policies help most Americans?", "label": "Did Reagan's policies help most Americans? Use a fact or a person from the game.", "stem": "Reagan's policies (did / did not) help most Americans because ___.", "min": 45, "newWords": 3, "mustAll": [["did", "didn't", "did not"], ["because", "since"], ["mike", "lisa", "carl", "rosa", "tax", "taxes", "job", "jobs", "union", "unions", "strike", "controller", "controllers", "boom", "recession", "rich", "poor", "gap", "debt", "price", "prices", "loan", "loans", "stock", "stocks", "pay", "food", "workers", "inflation"]], "mustMsg": "Say did or did not, then use because and one fact from the game (like the tax cut, the strike, or prices).", "std": "US.47, US.49"}], "endYear": "1984"};</script>
