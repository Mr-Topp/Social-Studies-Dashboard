<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hot Seat: Korea | World History Unit 2 Day 3</title>
<meta name="description" content="Sit in every seat of the Korean War: Kim, Stalin, Truman, Mao and Rhee. Watch the front line swing, then find other Cold War hot spots on a real world map.">
<style>
:root{--ink:#1d2430;--muted:#555f6b;--navy:#1d2b45;--olive:#1f4e5f;--olive2:#173a4a;--khaki:#eef3f6;--paper:#fffdf5;--red:#b8342a;--red2:#86231b;--gold:#e8b23a;--blue:#2f6fb3;--green:#2a7a4b;--try:#8a5a00;--line:#e2d8b8}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;color:var(--ink);font:17px/1.45 system-ui,"Segoe UI",Arial,sans-serif;background:var(--olive2);background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:36px 36px}
button{font:inherit;cursor:pointer;border-radius:14px;min-height:46px}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:30;background:linear-gradient(#f4f7f9,#e3eaef);border-bottom:4px solid var(--red);box-shadow:0 4px 14px #0005;padding:6px max(10px,calc((100vw - 1060px)/2)) 4px}
.hud-in{display:grid;grid-template-columns:auto 1fr 1fr 1.3fr;gap:8px;align-items:stretch}
.cal{background:#fff;border:2px solid var(--navy);border-radius:10px;text-align:center;min-width:64px;overflow:hidden;display:flex;flex-direction:column}
.cal span{background:var(--red);color:#fff;font-weight:900;font-size:.8rem;letter-spacing:.08em;padding:1px 6px}
.cal b{font-size:1.05rem;padding:2px 6px;color:var(--navy)}
.mt{position:relative;display:flex;gap:8px;align-items:center;background:#fff;border:2px solid #d9cca4;border-radius:12px;padding:4px 8px;min-width:0}
.mt-face{position:relative;font-size:1.6rem;line-height:1;flex:none}
.mt-face i{position:absolute;right:-8px;bottom:-6px;font-style:normal;font-size:1.05rem;background:#fff;border-radius:50%;box-shadow:0 1px 3px #0003}
.ls{display:none}
.mt-r{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:6px}
.lab{grid-column:1/3;font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk{position:relative;height:10px;background:#ece3cf;border-radius:9px;overflow:hidden}
.trk span{display:block;height:100%;border-radius:9px;transition:width .7s cubic-bezier(.3,1.4,.5,1)}
#hudRisk .trk span{background:linear-gradient(90deg,#f2b134,#b8342a)}
#hudCost .trk span{background:linear-gradient(90deg,#d9a26b,#7a4a2a)}
.mt b{font-size:.92rem;color:var(--navy)}
.mt.seat{background:#1d2b45;border-color:#e8b23a;color:#fff}.mt.seat .lab{color:#ffd27a}.seat-face{font-size:1.7rem;line-height:1;flex:none;width:38px;height:38px;display:grid;place-items:center;background:#fff;border-radius:50%}
.seat-face.ussr,.ussr-f{background:#c8433a;color:#ffd84a;font-weight:900;border-radius:50%;display:inline-grid;place-items:center}.ussr-f{width:1.3em;height:1.3em;font-size:.95em;line-height:1}
#seatName{display:block;font-weight:900;font-size:.95rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt.warn{animation:warn 1.4s ease-in-out infinite}
@keyframes warn{50%{box-shadow:0 0 0 4px #ff7a5966}}
.mt.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.08)}}
.pop{position:absolute;right:6px;bottom:-24px;font-weight:900;font-size:1rem;padding:2px 9px;border-radius:12px;pointer-events:none;animation:floatup 1.9s ease-out forwards;z-index:40;white-space:nowrap}
.pop.good{background:var(--green);color:#fff}.pop.bad{background:var(--red);color:#fff}
@keyframes floatup{0%{opacity:0;transform:translateY(14px) scale(.7)}15%{opacity:1;transform:translateY(0) scale(1.2)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.hud-step{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:.75rem;font-weight:900;color:var(--navy)}
.sbar{flex:1;height:6px;background:#ddd0aa;border-radius:6px;overflow:hidden}.sbar span{display:block;height:100%;background:var(--red);transition:width .4s}

main{max-width:1060px;margin:auto;padding:14px 12px 96px}
.welcome{background:#e3f1e8;color:var(--green);font-weight:800;border-radius:12px;padding:8px 12px;margin:0 0 10px;border:2px solid #b9d8c4;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.welcome[hidden]{display:none}
.notyou{min-height:36px;font:800 .9rem system-ui,Arial,sans-serif;background:#fff;color:var(--green);border:2px solid var(--green);border-radius:10px;padding:5px 12px}
.notyou:hover{background:var(--green);color:#fff}

/* ---------- scene: map board + side ---------- */
.scene{background:var(--paper);border-radius:20px;overflow:clip;box-shadow:0 10px 30px #0006;border:3px solid #f3ead0}
.sc-top{background:var(--navy);color:#fff;padding:8px 18px 9px;border-bottom:4px solid var(--red);display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.seat-tag{background:var(--gold);color:var(--navy);font:900 .78rem system-ui,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 10px}
.sc-top h2{margin:0;font-family:"Arial Black","Segoe UI Black",Impact,system-ui,sans-serif;font-size:clamp(1.2rem,2.6vw,1.7rem);letter-spacing:.01em;text-transform:uppercase}
.board{display:grid;grid-template-columns:250px 1fr;gap:16px;padding:14px 18px 18px;align-items:start}
.board.nomap{grid-template-columns:1fr}
.side{min-width:0;display:flex;flex-direction:column;gap:8px}
.map-wrap{position:sticky;top:calc(var(--hudH,96px) + 8px);background:#cfe3f2;border:3px solid var(--navy);border-radius:14px;padding:4px;box-shadow:0 5px 0 #1d2b4533}
.map-wrap.swing{animation:swing .9s}
@keyframes swing{20%{box-shadow:0 0 0 6px #e8b23a99}100%{box-shadow:0 5px 0 #1d2b4533}}
.kmap{display:block;width:100%;height:auto}
.kmap .sea{fill:#bcd8ee}.kmap .china{fill:#d9d2bf;stroke:#a89f86;stroke-width:1}.kmap .cn{font:900 15px system-ui,Arial;fill:#7d745c;letter-spacing:.15em}
.kmap .land{fill:#5d93cf;stroke:#1d2b45;stroke-width:2}
.kmap .nfill{fill:#c94a3c}
.kmap .p38{stroke:#fff;stroke-width:1.5;stroke-dasharray:3 4;opacity:.9}.kmap .p38t{font:800 12px system-ui,Arial;fill:#1d2b45}
.kmap .river{font:800 12px system-ui,Arial;fill:#1d2b45}
.kmap .front{fill:none;stroke:#111;stroke-width:5;stroke-linejoin:round}
.kmap .ghost{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:7 5}
.kmap .city{fill:#fff;stroke:#111;stroke-width:2}.kmap .ct{font:800 13px system-ui,Arial;fill:#111;paint-order:stroke;stroke:#fff;stroke-width:3px}
.kmap .hill{font-size:18px}.kmap .jp{font:800 11px system-ui,Arial;fill:#1d2b45}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.72rem;font-weight:800;padding:4px 4px 2px;color:var(--navy)}
.lg{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}.lg.n{background:#c94a3c}.lg.s{background:#5d93cf}.lg.g{background:repeating-linear-gradient(90deg,#fff 0 4px,#1d2b45 4px 6px);border:1px solid #1d2b45}
.bubbles{display:flex;flex-direction:column;gap:8px}
.bub{display:flex;gap:8px;align-items:flex-end;max-width:640px}
.bub .av{font-size:1.9rem;width:48px;height:48px;flex:none;display:grid;place-items:center;background:#fff;border-radius:50%;border:3px solid var(--navy);box-shadow:0 2px 0 #0003}
.bub .bt{position:relative;background:#fff;border-radius:16px;padding:7px 12px;box-shadow:0 3px 0 #0002;border:2px solid #1d2b4533}
.bub .bt::before{content:"";position:absolute;left:-9px;bottom:10px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.bub .bt b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.bub .bt p{margin:0;font-size:1.04rem;font-weight:650}
.bub.cable .bt{background:#fffbe6;font-family:"Courier New",Courier,monospace;border-color:#d9c98f}.bub.cable .bt::before{border-right-color:#fffbe6}.bub.cable .bt p{font-weight:800}
.bub.wire .bt{background:#fffbe6;font-family:"Courier New",Courier,monospace;border-color:#d9c98f}.bub.wire .bt::before{border-right-color:#fffbe6}.bub.wire .bt p{font-weight:800}
.bub.analyst .av{background:#1d2b45;border-color:#e8b23a}
.bub.kim .av,.bub.zhou .av{background:#fdecea}.bub.truman .av{background:#e7eef8}
.sc-body{min-width:0}

/* ---------- world objects ---------- */
.board-explain{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.board-explain div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.board-explain .be-i{font-size:2.2rem}.board-explain b{color:var(--navy);font-size:1rem;line-height:1.25}
.board-explain .rival{background:#1d2b45;border-color:#e8b23a}.board-explain .rival b{color:#ffd27a}
.paper{position:relative;background:#fbf6e4;border:1px solid #d8cba6;border-radius:4px;padding:10px 16px;margin:0 0 10px;box-shadow:3px 4px 0 #0002;font-family:Georgia,serif;transform:rotate(-.4deg)}
.paper .p-h{font:900 .8rem system-ui,Arial,sans-serif;letter-spacing:.08em;color:var(--red);margin:0 0 4px}
.paper p{margin:3px 0;font-size:1.08rem}
.paper.quote p:not(.p-h):not(.src){font-style:italic;font-size:1.12rem}
.paper.cable{background:#fffbe6;font-family:"Courier New",Courier,monospace;border-left:6px solid var(--gold);transform:none}.paper.cable p{font-weight:700}
.paper.parchment{background:linear-gradient(#f6ecd0,#efe0b8);border-color:#c9b27a}
.cables{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cables .paper{margin:0 0 10px}
.tide{display:flex;gap:12px;align-items:center;background:#e6f2fb;border:2px solid #9cc3e6;border-radius:14px;padding:8px 14px;margin:0 0 10px}.tide .t-ico{font-size:2.6rem}.tide p{margin:2px 0}
.real{background:#fff;border:2px dashed #d6c79c;border-radius:12px;padding:7px 12px;margin:8px 0;font-size:.98rem;font-weight:600}.real p{margin:2px 0}.real .src{font-weight:400}
.real-b{display:inline-block;background:#7a5a00;color:#fff;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;border-radius:6px;padding:1px 7px;margin-right:4px;vertical-align:1px}
.whatif{background:#f1eef6;border-left:5px solid #6b4fa0;border-radius:10px;padding:5px 10px;margin:8px 0;font-weight:700;font-size:.92rem;color:#4b3478}
.src{font-size:.76rem;color:var(--muted);margin:3px 0 0;font-family:system-ui,Arial,sans-serif;font-style:normal;font-weight:400}
.paper p.src{font-size:.76rem;font-weight:400}
.fict{font-size:.85rem;color:var(--muted);font-style:italic;margin:6px 0}
.hillrow{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}.hillrow span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:800}
.moved{display:grid;gap:6px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin:0 0 6px}
.moved div{display:grid;grid-template-columns:70px 1fr;align-items:center;column-gap:10px}.moved small{grid-column:2;font-weight:700;color:var(--muted)}
.mbar{display:block;height:16px;border-radius:8px;background:linear-gradient(90deg,#c94a3c,#5d93cf)}.mbar.big{width:100%}.mbar.tiny{width:6%;min-width:14px}
.memorial{background:var(--navy);color:#fff;border-radius:14px;padding:12px 16px;margin:0 0 10px;border:3px solid var(--gold)}
.memorial .m-h{font-weight:900;color:var(--gold);margin:0 0 4px;letter-spacing:.08em}.memorial p{margin:5px 0;font-size:1.06rem;font-weight:650}.memorial .src{color:#c9d3e2}

/* ---------- in-world checks ---------- */
.check{position:relative;margin:12px 0 6px;padding:12px;border:3px solid var(--navy);border-radius:18px;background:#eef4fb;box-shadow:0 5px 0 #1d2b4533}
.check.cable{background:#fffbe6;border-color:#c9a94a}
.check.doc{background:#f6ecd0;border-color:#a8894a}
.qlabel{position:absolute;top:-16px;left:-12px;font-size:1.5rem;margin:0;background:#fff;border:3px solid var(--navy);border-radius:50%;width:46px;height:46px;display:grid;place-items:center;box-shadow:0 3px 0 #1d2b4533}
.check .bub{margin-bottom:6px}.check .msg{margin:0 0 6px;min-height:0}.check .bub .bt{border-color:var(--navy)}
.choices{display:grid;gap:8px}
@media(min-width:900px){.check .choices{grid-template-columns:1fr 1fr}}
.reply{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;color:var(--ink);border:3px solid #c9d6e6;padding:10px 12px;font-weight:750;line-height:1.3;border-radius:16px 16px 16px 4px;box-shadow:0 3px 0 #1d2b4522;transition:transform .12s}
.reply:hover:not(:disabled){transform:translateY(-2px);border-color:var(--navy)}
.reply:disabled{opacity:.55;cursor:not-allowed}
.r-ico{font-size:1.2rem;flex:none}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.msg{min-height:1.3em;font-weight:800;margin:8px 0 0}.msg.try{color:var(--try)}.msg.good{color:var(--green);font-size:1.1rem}
.check.done{background:#f1faf4;border-color:var(--green);box-shadow:none;padding:8px 14px;min-height:0;display:flex;justify-content:center}.check.done .stamp{position:static;font-size:1.15rem}
.stamp{position:absolute;right:12px;top:10px;border:4px solid var(--red);color:var(--red);font:900 1rem/1 "Arial Black",Impact,sans-serif;padding:6px 10px;border-radius:8px;transform:rotate(-8deg);letter-spacing:.05em;background:#fff8;text-transform:uppercase}
.msg .stamp{position:static;display:inline-block;margin-right:8px}
.result .stamp.pick{position:static;display:inline-block;margin:2px 0 8px;font-size:1.05rem}
.slam{animation:slam .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{0%{opacity:0;transform:rotate(-8deg) scale(2.6)}60%{opacity:1;transform:rotate(-8deg) scale(.92)}100%{transform:rotate(-8deg) scale(1)}}

/* ---------- decision cards ---------- */
.pick-h{font:900 1.05rem "Arial Black",Impact,sans-serif;text-transform:uppercase;color:var(--red);margin:10px 0 6px;letter-spacing:.04em}
.cards{display:grid;gap:12px}.cards.n2{grid-template-columns:1fr 1fr}.cards.n3{grid-template-columns:repeat(3,1fr)}
.dcard{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:#fff;border:3px solid var(--navy);border-radius:18px;padding:12px 10px 10px;color:var(--ink);box-shadow:0 6px 0 var(--navy);transition:transform .12s,box-shadow .12s}
.dcard:hover{transform:translateY(-4px) rotate(-.5deg);box-shadow:0 10px 0 var(--navy)}
.dcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--navy)}
.d-ico{font-size:2.8rem;line-height:1.1}.d-t{font-size:1.15rem;line-height:1.2;color:var(--navy)}
.d-chips{display:flex;flex-direction:column;gap:4px;margin-top:6px;width:100%}
.chip{font-size:.8rem;font-weight:800;border-radius:10px;padding:3px 8px}.chip.g{background:#e3f3e8;color:var(--green)}.chip.c{background:#fde7e3;color:var(--red2)}

/* ---------- results ---------- */
.result{display:flex;gap:14px;align-items:flex-start;background:#fff;border:3px solid var(--gold);border-radius:18px;padding:12px 14px;box-shadow:0 6px 0 #e8b23a55}
.flip{animation:flip .6s ease-out}
@keyframes flip{0%{opacity:0;transform:perspective(700px) rotateX(-70deg)}100%{opacity:1;transform:none}}
.r-big{font-size:3rem;line-height:1;flex:none}
.r-main{flex:1;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
.tag{display:inline-block;font-weight:900;font-size:.85rem;border-radius:12px;padding:3px 10px;white-space:nowrap}.tag.up{background:#dcefe2;color:var(--green)}.tag.down{background:#f9dcd7;color:#9a2f22}
.reveal{position:relative;background:var(--navy);color:#fff;border-radius:14px;padding:10px 14px;margin:10px 0 2px;box-shadow:0 4px 0 #0003}
.reveal .nw{display:inline-block;background:var(--gold);color:var(--navy);font-weight:900;font-size:.72rem;letter-spacing:.08em;border-radius:8px;padding:2px 8px;margin-bottom:4px}
.reveal p{margin:0;font-size:1.05rem}.reveal b{color:var(--gold)}
.go{margin-top:12px;background:var(--red);color:#fff;border:0;padding:13px 26px;font:900 1.1rem system-ui,Arial,sans-serif;box-shadow:0 5px 0 var(--red2)}
.go:hover{filter:brightness(1.08)}.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red2)}.go:disabled{opacity:.6}

/* ---------- ending ---------- */
.front{background:#f7f1e1;border:1px solid #d8cba6;padding:12px 16px;box-shadow:4px 6px 0 #0002;font-family:Georgia,serif}
.front .masthead{font:900 clamp(.85rem,2vw,1.15rem) "Courier New",monospace;text-align:center;border-bottom:4px double #222;margin:0 0 8px;letter-spacing:.06em}
.front>p{font-size:1.1rem}
.headline{display:flex;gap:12px;align-items:center}.e-big{font-size:3.2rem;line-height:1}
.headline h3{margin:0;font:900 clamp(1.4rem,3.6vw,2.1rem)/1.05 "Arial Black",Impact,sans-serif;text-transform:uppercase;color:var(--navy)}
.front.brink .headline h3,.front.general .headline h3{color:var(--red)}
.finalm{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;font-family:system-ui,Arial,sans-serif}.finalm span{background:#fff;border-radius:10px;padding:4px 10px;font-weight:700;border:1px solid var(--line)}
.cb{margin:10px 0 4px;font-family:system-ui,Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:.85rem}
.trail{list-style:none;padding:0;margin:0;display:grid;gap:5px;font-family:system-ui,Arial,sans-serif}.trail li{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:.92rem}
.trail .tags{margin:0}

/* ---------- memo ---------- */
.memo{background:#fffdf3;border:3px solid var(--navy);border-radius:6px;padding:12px 16px;box-shadow:0 6px 0 #0002;background-image:repeating-linear-gradient(#fffdf3 0 32px,#e9e2c9 32px 33px)}
.vm-h{font:900 1rem "Courier New",monospace;color:var(--red);margin:0 0 4px;letter-spacing:.05em}
label{display:block;font-weight:850;margin:12px 0 4px}.stem{margin:0 0 4px;color:var(--muted);font-size:.92rem}.stem::before{content:"✏️ "}
.vrow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.back{margin-top:12px;background:#fff;border:3px solid var(--navy);color:var(--navy);font-weight:900;padding:10px 18px}
input,textarea{width:100%;font:inherit;border:2px solid #cfc6af;border-radius:10px;padding:10px;background:#fff;color:var(--ink)}
textarea{font-family:"Courier New",Courier,monospace;font-size:1.02rem}

/* ---------- title ---------- */
.title-card{background:var(--khaki);border-radius:22px;padding:22px 26px;box-shadow:0 12px 36px #0007;border:4px solid var(--gold);position:relative;overflow:hidden}
.title-card::before{content:"";position:absolute;inset:0 0 auto 0;height:10px;background:linear-gradient(90deg,var(--blue) 0 50%,var(--red) 50% 100%)}
.t-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:center}
.t-kick{font-size:.76rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin:6px 0 0}
h1{font-family:"Arial Black","Segoe UI Black",Impact,system-ui,sans-serif;font-size:clamp(2.2rem,5.4vw,3.6rem);line-height:.98;margin:4px 0 8px;color:var(--navy);text-transform:uppercase;letter-spacing:-.01em;text-shadow:3px 3px 0 var(--gold)}
.hook{font-size:1.2rem;font-weight:700;margin:0 0 10px}
.t-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.t-chips span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:750;font-size:.92rem}
.goal{background:#e7eef8;border-radius:12px;padding:6px 12px;margin:6px 0}
.t-start label{margin-top:8px}
.t-row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}.t-row input{flex:1;min-width:200px}
.go.start{margin-top:0;font-size:1.3rem;padding:12px 34px}
.t-art{display:flex;flex-direction:column;align-items:center}
.map-wrap.mini{position:static;width:190px;transform:rotate(2deg)}.map-wrap.mini .legend{display:none}
.t-cast{display:flex;justify-content:center;align-items:center;gap:4px;font-size:2.4rem;margin-top:10px}.t-cast .vs{font:900 1rem "Arial Black",Impact,sans-serif;background:var(--red);color:#fff;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;margin:0 6px}

.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;color:#e4edf2;font-size:.85rem}
.foot button{background:#ffffff22;border:2px solid #ffffff44;padding:8px 12px;font-weight:800;color:#fff;min-height:40px}


/* ---------- hot spot radar (world map) ---------- */
.wmap{display:block;width:100%;height:auto}
.wmap .w-sea{fill:#bcd8ee}
.wmap path{fill:#e6dcc3;stroke:#a89f86;stroke-width:.4}
.wmap .w-usa{fill:#3d7cc9;stroke:#2a5a96}
.wmap .w-ussr{fill:#c8433a;stroke:#c8433a;stroke-width:.6}
.wmap .w-china{fill:#eeb1aa;stroke:#c98a83}
.wmap .lit{fill:#e8b23a;stroke:#1d2b45;stroke-width:.8}
.wmap .wl{font:900 11px system-ui,Arial,sans-serif;fill:#1d2b45;letter-spacing:.06em;paint-order:stroke;stroke:#ffffffcc;stroke-width:3px}
.wmap .wl.big{font-size:17px;fill:#fff;stroke:#0005;stroke-width:3px}
.wmap .wl.sea{font-size:10px;fill:#4a6f8f;font-style:italic;stroke:none;letter-spacing:.2em}
.radar{position:relative;border:3px solid var(--navy);border-radius:14px;overflow:hidden;background:#bcd8ee;box-shadow:0 5px 0 #1d2b4533}
.sweep{position:absolute;inset:-60%;background:conic-gradient(from 0deg,#2a7a4b00 0deg,#2a7a4b22 40deg,#2a7a4b00 60deg);animation:sweep 6s linear infinite;pointer-events:none;z-index:1}
@keyframes sweep{to{transform:rotate(360deg)}}
.pin{position:absolute;z-index:2;transform:translate(-50%,-50%);min-height:0;width:44px;height:44px;padding:0;border-radius:50%;border:3px solid var(--navy);background:#fff;color:var(--navy);font:900 1.2rem system-ui,Arial,sans-serif;display:grid;place-items:center;box-shadow:0 3px 0 #1d2b4566}
button.pin{animation:ping 1.8s ease-out infinite}
button.pin:hover:not(:disabled){background:#fff6d6;transform:translate(-50%,-50%) scale(1.12)}
button.pin:disabled{opacity:.6;cursor:not-allowed}
button.pin.shake{animation:pshake .45s}
@keyframes pshake{20%,60%{transform:translate(calc(-50% - 6px),-50%)}40%,80%{transform:translate(calc(-50% + 6px),-50%)}}
@keyframes ping{0%{box-shadow:0 0 0 0 #e8b23acc,0 3px 0 #1d2b4566}80%,100%{box-shadow:0 0 0 14px #e8b23a00,0 3px 0 #1d2b4566}}
.pin.idle{opacity:.85}
.pin.found{background:var(--gold);width:30px;height:30px;font-size:1rem}
.pin-l{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:4px;background:var(--navy);color:#fff;font:900 .78rem system-ui,Arial,sans-serif;border-radius:8px;padding:2px 7px;white-space:nowrap;letter-spacing:.04em}
.pin[data-spot="cuba"] .pin-l,.pin[data-spot="vietnam"] .pin-l{left:auto;right:100%;margin:0 4px 0 0}
.wlegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;font-weight:800;color:var(--navy);margin:6px 2px 0}
.lg.us{background:#3d7cc9}.lg.su{background:#c8433a}.lg.cn{background:#eeb1aa}
.wsrc{font-weight:400;color:var(--muted);margin-left:auto}
.mission{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:#1d2b45;color:#fff;border-radius:14px;padding:10px 14px;border:3px solid var(--gold);margin:0 0 4px}
.mission p{margin:0;font-size:1.08rem;font-weight:700;flex:1 1 380px}
.mission b{color:var(--gold)}
.m-n{background:var(--gold);color:var(--navy);font-weight:900;border-radius:999px;padding:2px 10px;font-size:.85rem}
.m-k{flex-basis:100%;font-size:.85rem;font-weight:800;color:#ffd27a}
.r-msg{min-height:0;margin:4px 0}
.peek{background:#eef4fb;border:2px solid #c9d6e6;border-radius:10px;padding:4px 10px;margin:4px 0;font-family:system-ui,Arial,sans-serif}
.peek summary{cursor:pointer;font-weight:850;color:var(--navy);padding:4px 0}
.peek ul{margin:4px 0 6px;padding-left:18px;font-size:.92rem;display:grid;gap:3px}
.rad-h{font-size:1.1rem;margin:0 0 8px;font-weight:700}
.both{background:#fff;border:3px solid var(--gold);border-radius:16px;padding:10px 14px;margin:10px 0 0;box-shadow:0 5px 0 #e8b23a55}
.both-h{margin:0 0 6px;font:900 .82rem system-ui,Arial,sans-serif;letter-spacing:.07em;color:var(--red)}
.both-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bs{border-radius:12px;padding:8px 12px}.bs p{margin:3px 0 0;font-weight:650}
.bs.us{background:#e7eef8;border:2px solid #3d7cc9}.bs.su{background:#fbe7e4;border:2px solid #c8433a}
.radar.mini{width:100%;max-width:380px;box-shadow:0 6px 0 #1d2b4533;transform:rotate(-1deg)}
.blip{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid var(--navy);transform:translate(-50%,-50%);animation:ping 1.8s ease-out infinite}
.blip.b2{animation-delay:.6s}.blip.b3{animation-delay:1.2s}
.t-cast{font-size:2rem;gap:8px}
/* ---------- scoreboard ---------- */
.score{background:#fff;border:3px solid var(--navy);border-radius:16px;padding:10px 14px;margin:0 0 6px}
.score-h{margin:0 0 6px;font:900 .9rem system-ui,Arial,sans-serif;letter-spacing:.08em;color:var(--red)}
.score ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.score li{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:8px;background:#f6f8fa;border-radius:10px;padding:5px 10px}
.sb-f{font-size:1.5rem;text-align:center}.sb-s{font-size:1.02rem}
.sb-r{font-weight:900;border-radius:999px;padding:2px 10px;white-space:nowrap}.sb-r.no{background:#f1e4e2;color:#7a2a20}.sb-r.yes{background:#dcefe2;color:var(--green)}.sb-r.half{background:#fdf0cf;color:#7a5a00}
@media(max-width:1000px){.cards.n3{grid-template-columns:1fr}.cards.n3 .dcard{flex-direction:row;flex-wrap:wrap;text-align:left;justify-content:flex-start;padding:10px 12px}.cards.n3 .d-ico{font-size:2.2rem}.cards.n3 .d-t{flex:1;min-width:150px}.cards.n3 .d-chips{flex-direction:row;flex-wrap:wrap}}
@media(max-width:760px){
  .hud{padding:5px 6px 3px}
  .hud-in{grid-template-columns:1fr 1fr;gap:5px}
  .mt.seat{grid-column:1/-1}.seat-face{width:28px;height:28px;font-size:1.2rem}
  .both-g{grid-template-columns:1fr}
  .pin{width:34px;height:34px;font-size:1rem}.pin.found{width:22px;height:22px}.pin-l{font-size:.62rem;padding:1px 4px}
  .cal{display:none}
  .lf{display:none}.ls{display:inline}.mt{padding:3px 5px;gap:4px}.mt-face{font-size:1.15rem}.lab{font-size:.6rem}.mt b{font-size:.78rem}
  .board{grid-template-columns:118px 1fr;gap:10px;padding:10px 10px 14px}
  .board.nomap{grid-template-columns:1fr}
  .side{display:contents}
  .map-wrap{grid-row:1;grid-column:1;position:static;padding:2px;border-width:2px}
  .bubbles{grid-row:1;grid-column:2;align-self:center}
  .sc-body{grid-column:1/-1}
  .board.nomap .sc-body{grid-column:1}
  .legend{font-size:.58rem;gap:2px 6px}.lg{width:10px;height:8px}
  .bub .av{width:36px;height:36px;font-size:1.3rem}.bub .bt p{font-size:.95rem}.bub .bt{padding:5px 9px}
  .board-explain{grid-template-columns:1fr}.board-explain div{flex-direction:row;align-items:center;gap:10px;text-align:left}
  .cables{grid-template-columns:1fr}
  .cards.n2{grid-template-columns:1fr}
  .dcard{flex-direction:row;flex-wrap:wrap;text-align:left;justify-content:flex-start;padding:10px 12px}
  .d-ico{font-size:2.2rem}.d-t{flex:1;min-width:150px}.d-chips{flex-direction:row;flex-wrap:wrap}
  .t-grid{grid-template-columns:1fr}.t-art{display:none}
  .title-card{padding:18px 16px}
  .check.done .stamp{position:static;display:inline-block}
  .result{flex-direction:column;gap:6px}.r-big{font-size:2.2rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.hud,.foot,.go{display:none}}
