<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interest Groups – Pages 5 &amp; 6</title>
<script src="../../shared/assignments.js?v=20261119ig2"></script>
<script src="../../shared/turnin.js?v=20261119ig2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1d2b53; --ink:#1f2433; --muted:#5b6275; --bg:#f6f3ec; --line:#e3ddd0;
  --accent:#0f8b8d; --accent2:#e4572e; --gold:#f2b134; --green:#2e9d5b; --greenbg:#e5f6ec; --sel:#fff3c4;
  --big:clamp(16px, 1.2vw + 1.4vh, 22px);   /* main reading text */
  --mid:clamp(14px, .7vw + 1vh, 17px);      /* answer choices */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;min-height:100vh;line-height:1.35}
button{font-family:inherit;cursor:pointer;color:inherit}

/* ---------- header ---------- */
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:7px 16px;flex:0 0 auto}
header h1{font-size:18px;margin:0;font-weight:900;white-space:nowrap}
.steps{display:flex;gap:6px;margin-left:auto;flex-wrap:nowrap}
.step{font-size:13px;font-weight:800;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.12);color:#cfd6ea;white-space:nowrap}
.step.on{background:var(--gold);color:var(--navy)}
.step.done{background:var(--green);color:#fff}
@media (max-width:1050px){ .step .long{display:none} .step{padding:5px 10px} }

/* ---------- page frame ---------- */
main{flex:1 0 auto;padding:10px 16px 4px;display:flex;flex-direction:column;width:100%;max-width:1150px;margin:0 auto}
.dir{background:#fff;border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:10px;padding:7px 12px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.dir .tag{font-weight:900;font-size:20px;color:var(--accent);line-height:1.2}
.dir p{margin:0;font-size:15px;line-height:1.35}
.bar{display:flex;align-items:center;gap:10px;margin-top:8px;padding-right:180px;flex:0 0 auto}
.msg{font-size:15px;font-weight:700;flex:1}
.msg.good{color:var(--green)} .msg.try{color:#9a6a12}
.btn{border:0;border-radius:10px;padding:10px 22px;font-size:16px;font-weight:800;background:var(--accent);color:#fff;white-space:nowrap}
.btn:disabled{background:#b9c3c4;cursor:not-allowed}
.btn.next{background:var(--green)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.small{padding:8px 14px;font-size:14px}
footer{text-align:center;padding:4px 0 6px;font-size:11px;color:#8a8f9c;flex:0 0 auto}
footer a{color:#8a8f9c}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.icon{display:inline-flex;align-items:center;justify-content:center;border-radius:14px;background:#eef4f4;flex:0 0 auto}

/* ---------- item navigator (numbers across the top) ---------- */
.nav{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.nav .lbl{font-size:13px;font-weight:800;color:var(--muted);margin-right:4px}
.dot{min-width:38px;height:34px;padding:0 8px;border-radius:9px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.dot.ans{border-color:var(--accent);background:#eaf6f6}
.dot.lock{border-color:var(--green);background:var(--greenbg);color:var(--green)}
.dot.cur{box-shadow:0 0 0 3px var(--gold)}
.nav .count{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted)}

/* ---------- one-item-at-a-time stage ---------- */
.stage{flex:1 0 auto;display:flex;flex-direction:column;gap:10px}
.item{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;gap:14px;align-items:center}
.item.lock{border-color:var(--green);background:var(--greenbg)}
.item .icon{width:clamp(46px,7vh,64px);height:clamp(46px,7vh,64px);font-size:clamp(26px,4vh,36px)}
.item .num{font-size:13px;font-weight:900;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
.item .txt{font-size:var(--big);font-weight:700}
.item .txt.term{font-size:clamp(20px,1.6vw + 1.6vh,28px);font-weight:900;color:var(--navy)}
.ask{font-size:14px;font-weight:800;color:var(--muted);margin:0 2px}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{border:2px solid var(--line);background:#fff;border-radius:11px;padding:8px 12px;text-align:left;font-size:var(--mid);font-weight:600;display:flex;gap:10px;align-items:center;min-height:44px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .ltr{font-weight:900;color:var(--navy);min-width:22px}
.opt.sel{border-color:var(--accent);background:#eaf6f6;box-shadow:0 0 0 2px var(--accent) inset}
.opt.used{opacity:.5}
.opt .note{margin-left:auto;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.opt.right{border-color:var(--green);background:#c9ecd6;box-shadow:none}
.opt:disabled{cursor:default}
.opt.big{flex-direction:column;justify-content:center;text-align:center;gap:2px;padding:10px}
.opt.big .em{font-size:clamp(24px,4vh,34px);line-height:1.1}
.opt.big .k{font-size:var(--big);font-weight:900;color:var(--navy)}
.opt.big .d{font-size:13px;color:var(--muted);font-weight:600;line-height:1.25}
.opt.full{opacity:.55}

/* ---------- Part C ---------- */
.question{background:var(--navy);color:#fff;border-radius:12px;padding:8px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.question .big{font-size:28px}
.question p{margin:0;font-size:var(--mid);font-weight:800}
.question .lab{font-size:11px;text-transform:uppercase;letter-spacing:.8px;opacity:.7;font-weight:700}
.cWrap{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(50px,9vw,150px) minmax(0,1.25fr)}
.cCol{display:flex;flex-direction:column;gap:12px;justify-content:center}
.cCol h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.grp,.ans{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;font-size:var(--mid);line-height:1.35;display:flex;gap:10px;align-items:flex-start;position:relative}
.grp .icon{width:44px;height:44px;font-size:24px}
.grp b{display:block;font-size:calc(var(--mid) + 1px);color:var(--navy)}
.ans{background:#fffdf7}
.ans .q{font-size:26px;color:var(--gold);font-weight:900;line-height:1}
.grp.sel{border-color:var(--gold);background:var(--sel)}
.grp.linked,.ans.linked{border-color:var(--accent)}
.grp.locked,.ans.locked{border-color:var(--green);background:var(--greenbg);cursor:default}
.pin{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--accent);top:50%;margin-top:-8px;border:3px solid #fff;box-shadow:0 0 0 2px var(--accent)}
.grp .pin{right:-9px} .ans .pin{left:-9px}
.locked .pin{background:var(--green);box-shadow:0 0 0 2px var(--green)}
svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* ---------- start + finish ---------- */
.center{flex:1;display:flex;align-items:center;justify-content:center}
.startcard,.fcard{background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(29,43,83,.12);padding:22px 30px;max-width:680px;width:100%}
.startcard h2{margin:0 0 6px;font-size:clamp(22px,3vw,30px);font-weight:900;color:var(--navy)}
.startcard .hook{font-size:var(--mid);margin:0 0 10px}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:14px;margin:0 0 10px;padding:0;list-style:none}
.plan li{background:var(--bg);border-radius:8px;padding:6px 10px}
.plan b{color:var(--accent)}
.startcard label{font-weight:800;font-size:14px;display:block;margin-bottom:4px}
.startcard input{font:inherit;font-size:17px;padding:9px 12px;border:2px solid var(--line);border-radius:10px;width:100%;margin-bottom:10px}
.fcard{text-align:center;max-width:600px}
.fcard h2{margin:0;font-size:clamp(22px,3vw,28px);color:var(--navy);font-weight:900}
.fcard p{font-size:var(--mid);margin:8px 0}

/* very short screens: tighten everything */
@media (max-height:560px){
  .dir{padding:5px 10px;margin-bottom:6px} .dir p{font-size:14px}
  .nav{margin-bottom:6px} .dot{height:30px;min-width:34px}
  .item{padding:8px 12px} .opt{min-height:38px;padding:6px 10px}
  .stage{gap:7px} .opts{gap:6px}
}
@media (max-width:600px){ .opts.two{grid-template-columns:1fr} .plan{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <h1>Interest Groups</h1>
  <div class="steps" id="steps"></div>
</header>
<main id="main"></main>
<footer>Activity adapted from iCivics, “Interest Groups” (© 2023 iCivics, Inc.) &nbsp;·&nbsp; <a href="#" id="restart">Start over</a></footer>

<script>
/* ===================== CONTENT (from the worksheet, pages 5–6) ===================== */
const A_TERMS = [
  {t:"interest", ans:"B", ic:"👀"},
  {t:"advocate", ans:"C", ic:"📣"},
  {t:"political action committee", ans:"G", ic:"🏦"},
  {t:"interest group", ans:"H", ic:"👥"},
  {t:"bias", ans:"A", ic:"🧲"},
  {t:"campaign financing", ans:"F", ic:"💰"},
  {t:"lobbyist", ans:"E", ic:"🤝"},
  {t:"public opinion", ans:"D", ic:"💬"}
];
const A_DEFS = {
  A:"favoring one view or another",
  B:"attention paid to something",
  C:"to promote or support",
  D:"collection of opinions or attitudes",
  E:"represent interest groups and communicate with officials",
  F:"how money is earned to pay for political campaigns",
  G:"organizations that help interest groups raise money for campaigns",
  H:"a group of people who work to influence government about a set of issues"
};
const B_ITEMS = [
  {ic:"🎙️", ans:"E", t:"Representatives interview a candidate to see if he or she will support the group’s position on nuclear plants. If so, the group will back this candidate."},
  {ic:"🏫", ans:"I", t:"Volunteers from a teen health interest group go into schools and educate students about the dangers of underage drinking."},
  {ic:"📺", ans:"E", t:"An interest group runs an ad that supports a candidate running for office."},
  {ic:"🏛️", ans:"I", t:"Lobbyists visit with members of Congress and local officials to share their reasons for supporting or opposing an upcoming bill."},
  {ic:"🎉", ans:"D", t:"Once a candidate has been endorsed, members of an interest group help raise donations to help the candidate’s campaign."},
  {ic:"📻", ans:"I", t:"A group runs TV and radio ads about an issue in order to raise public concern and spur the public to action."}
];
const B_OPTS = [["I","📢","Inform","informing"],["D","💵","Donate","donating money"],["E","👍","Endorse","endorsing a candidate"]];
const C_GROUPS = [
  {id:"ev", ic:"🔋", name:"EV Drive Coalition", mission:"Mission: to encourage policy that would make the United States lead the world in use of electric vehicles.", ans:"y"},
  {id:"api", ic:"🛢️", name:"American Petroleum Institute", mission:"Mission: to encourage policy that supports U.S. production and sales of oil and natural gas.", ans:"x"}
];
const C_ANS = [
  {id:"x", t:"Most of the people buying electric cars are wealthier so tax credits are really just giving more money to rich people. Let people decide for themselves if they prefer an electric or gas-powered car."},
  {id:"y", t:"If we give people tax credits for buying electric vehicles, those who buy electric cars will pay less when they file their taxes. This will increase the public’s interest in buying electric cars which creates stable jobs and reduces air pollution."}
];
const D_GROUPS = [
  {id:"sc", ic:"🌲", name:"The Sierra Club", d:"America’s largest and most influential grassroots environmental organization."},
  {id:"aarp", ic:"🧓", name:"The AARP", d:"Works to improve the quality of life for people age 50 and older and help them with issues they face."},
  {id:"ama", ic:"🩺", name:"The American Medical Association", d:"Works to promote the art and science of medicine and to improve public health."}
];
const D_CARDS = [
  {id:1, ic:"🏞️", g:"sc", t:"The nation’s second national park, Yosemite, was created in 1905 after this group lobbied President Theodore Roosevelt and the California legislature."},
  {id:2, ic:"🔬", g:"ama", t:"This group encourages funding for research and educational programs about the health effects of abusing alcohol and tobacco."},
  {id:3, ic:"📬", g:"aarp", t:"Members of this organization lobby Congress to protect Social Security, Medicare, and other retirement programs."},
  {id:4, ic:"💼", g:"aarp", t:"This group supported the Age Discrimination in Employment Act (ADEA), which protects older Americans from being discriminated against in the workplace."},
  {id:5, ic:"☢️", g:"sc", t:"This organization works to stop the construction of nuclear power plants until the government passes more safety and environmental regulations."},
  {id:6, ic:"🚭", g:"ama", t:"This organization supported a 2009 law that bans tobacco ads within 1,000 feet of schools and playgrounds and also stops tobacco companies from sponsoring sports events."}
];
const ASSIGNMENT_ID = "gov-u2-d4-interest-groups-online";
const TITLE = "Day 4 · Interest Groups: Pages 5–6 (Online)";
const STANDARD = "SS.9-12.Gov.12";
const OLD_API = "https://fynn-class-assignment-submissions-20261024.neotboy.chatgpt.site/api/submit";
const PARTS = ["A","B","C","D"];
const TOTALS = {A:8,B:6,C:2,D:6};
const PART_NAMES = {A:"Vocabulary",B:"How Do You Lobby?",C:"Just the Facts?",D:"Who’s Interested?"};

/* ===================== STATE ===================== */
const KEY = "ig_p56_";
let S = null, sel = null, SOLVE = null;
function fresh(name){ return {name, part:"A", A:{ans:{},locked:{},first:{},tried:{},cur:0}, B:{ans:{},locked:{},first:{},tried:{},cur:0}, C:{link:{},locked:{},first:{},tried:{}}, D:{ans:{},locked:{},first:{},tried:{},cur:0}, done:{}, order:{D:shuffle(D_CARDS.map(c=>c.id))}}; }
function save(){ try{ localStorage.setItem(KEY+S.name.toLowerCase(), JSON.stringify(S)); }catch(e){} }
function load(name){ try{ const v=JSON.parse(localStorage.getItem(KEY+name.toLowerCase())); return v && v.A && v.A.ans ? v : null; }catch(e){ return null; } }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const $ = h=>{ const d=document.createElement("div"); d.innerHTML=h.trim(); return d.firstElementChild; };
const esc = s=>String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const main = document.getElementById("main");

function header(){
  const st=document.getElementById("steps"); st.innerHTML="";
  if(!S) return;
  PARTS.forEach(p=>{ const cls=S.done[p]?"done":(S.part===p?"on":""); st.appendChild($(`<span class="step ${cls}">${S.done[p]?"✓ ":""}${p}<span class="long"> · ${PART_NAMES[p]}</span></span>`)); });
}
function dirBox(tag, html){ return `<div class="dir"><div class="tag">${tag}.</div><p>${html}</p></div>`; }
function barHTML(){ return `<div class="bar"><div class="msg" id="msg"></div><button class="btn" id="check" disabled>Check</button></div>`; }
function setMsg(t,cls){ const m=document.getElementById("msg"); if(m){ m.textContent=t; m.className="msg "+(cls||""); } }
function record(p,k,right){ const P=S[p]; if(!P.tried[k]){ P.tried[k]=true; P.first[k]=right; } }
function firstScore(p){ return Object.values(S[p].first).filter(Boolean).length; }
function finishPart(p, text){
  S.done[p]=true; save(); header(); setMsg(text,"good");
  const c=document.getElementById("check"); c.textContent = p==="D" ? "Finish →" : "Next part →"; c.className="btn next"; c.disabled=false;
  c.onclick=()=>{ const i=PARTS.indexOf(p); S.part = i<3 ? PARTS[i+1] : "END"; sel=null; save(); render(); };
  SOLVE=null; if(window.classTestSkip) window.classTestSkip.refresh();
}
function wireSkip(fn){ SOLVE=fn; if(window.classTestSkip) window.classTestSkip.refresh(); }

/* ===================== ONE-ITEM-AT-A-TIME ENGINE (Parts A, B, D) =====================
   cfg: part, n, keyOf(i), right(i), label(i), drawItem(i), drawOpts(i, box), chipText(i) */
function itemPart(cfg){
  const P=S[cfg.part], n=cfg.n, keys=[...Array(n).keys()].map(cfg.keyOf);
  if(P.cur==null||P.cur>=n) P.cur=0;
  const answered=k=>P.ans[k]!=null;
  main.innerHTML="";
  main.insertAdjacentHTML("beforeend", dirBox(cfg.part, cfg.dir));
  const nav=$(`<div class="nav"><span class="lbl">${cfg.navLabel}</span></div>`);
  keys.forEach((k,i)=>{
    const d=$(`<button class="dot ${P.locked[k]?"lock":answered(k)?"ans":""} ${i===P.cur?"cur":""}" data-k="${k}" title="Go to ${cfg.label(i)}">${P.locked[k]?"✓":""}${cfg.label(i)}${answered(k)?" "+cfg.chipText(i):""}</button>`);
    d.onclick=()=>{ P.cur=i; save(); itemPart(cfg); };
    nav.appendChild(d);
  });
  const nAns=keys.filter(answered).length;
  nav.appendChild($(`<span class="count">${nAns} of ${n} answered</span>`));
  main.appendChild(nav);
  const stage=$(`<div class="stage"></div>`); main.appendChild(stage);
  const i=P.cur, k=keys[i], locked=!!P.locked[k];
  stage.appendChild($(cfg.drawItem(i, locked)));
  if(cfg.ask) stage.appendChild($(`<div class="ask">${cfg.ask}</div>`));
  const box=$(`<div class="opts ${cfg.cols}"></div>`); stage.appendChild(box);
  cfg.drawOpts(i, box, locked, (val)=>{
    if(locked) return;
    if(cfg.beforePick && cfg.beforePick(i,val)===false) return;
    P.ans[k]=val;
    // jump to the next item that still needs an answer
    let next=-1; for(let s=1;s<=n;s++){ const j=(i+s)%n; if(!P.locked[keys[j]] && !answered(keys[j])){ next=j; break; } }
    if(next>=0) P.cur=next;
    save(); itemPart(cfg);
  });
  main.insertAdjacentHTML("beforeend", barHTML());
  const allLocked=keys.every(x=>P.locked[x]);
  if(allLocked){ finishPart(cfg.part, `All ${n} right! ✔`); return; }
  const chk=document.getElementById("check");
  chk.disabled = nAns<n;
  if(nAns<n) setMsg(cfg.tip||"");
  else setMsg("All answered — press Check.");
  if(cfg.msgAfter){ setMsg(cfg.msgAfter.t, cfg.msgAfter.c); cfg.msgAfter=null; }
  chk.onclick=()=>{
    const wrong=[];
    keys.forEach((x,j)=>{ if(P.locked[x]) return; const ok=cfg.right(j); record(cfg.part,x,ok); if(ok) P.locked[x]=true; else wrong.push(j); });
    if(!wrong.length){ save(); itemPart(cfg); return; }
    document.querySelectorAll(".nav .dot").forEach((d,j)=>{ if(wrong.includes(j)) d.classList.add("shake"); });
    setTimeout(()=>{
      wrong.forEach(j=>delete P.ans[keys[j]]); P.cur=wrong[0]; save();
      cfg.msgAfter={t:`${n-wrong.length} right! Number${wrong.length>1?"s":""} ${wrong.map(j=>cfg.label(j)).join(", ")} went back — try ${wrong.length>1?"those":"that one"} again.`, c:"try"};
      itemPart(cfg);
    },450);
  };
  wireSkip(()=>{ keys.forEach((x,j)=>{ P.ans[x]=cfg.answerOf(j); P.locked[x]=true; }); save(); itemPart(cfg); });
}

/* ---------- Part A ---------- */
function renderA(){
  const P=S.A;
  itemPart({
    part:"A", n:8, keyOf:i=>i, label:i=>String(i+1), chipText:i=>P.ans[i],
    dir:"<b>Vocabulary.</b> Match the term to the correct definition.",
    navLabel:"Term", cols:"two", ask:"Pick its definition:",
    tip:"Click any number to go back and change it.",
    right:i=>P.ans[i]===A_TERMS[i].ans, answerOf:i=>A_TERMS[i].ans,
    drawItem:(i,locked)=>`<div class="item ${locked?"lock":""}"><span class="icon">${A_TERMS[i].ic}</span><div><div class="num">Term ${i+1} of 8</div><div class="txt term">${A_TERMS[i].t}</div></div></div>`,
    drawOpts:(i,box,locked,pick)=>{
      const usedBy={}; for(const k in P.ans) if(+k!==i) usedBy[P.ans[k]]=+k;
      Object.keys(A_DEFS).forEach(L=>{
        const on=P.ans[i]===L, used=L in usedBy;
        const b=$(`<button class="opt ${on?(locked?"right":"sel"):""} ${used&&!on?"used":""}" ${locked?"disabled":""}><span class="ltr">${L})</span><span>${A_DEFS[L]}</span>${used&&!on?`<span class="note">on #${usedBy[L]+1}</span>`:""}</button>`);
        b.onclick=()=>{ if(used && !P.locked[usedBy[L]]) delete P.ans[usedBy[L]]; else if(used) return; pick(L); };
        if(used && P.locked[usedBy[L]]) b.disabled=true;
        box.appendChild(b);
      });
    }
  });
}

/* ---------- Part B ---------- */
function renderB(){
  const P=S.B;
  itemPart({
    part:"B", n:6, keyOf:i=>i, label:i=>String(i+1), chipText:i=>P.ans[i],
    dir:"<b>How Do You Lobby?</b> Read each interest group lobby activity and decide if it is an example of informing (I), donating money (D), or endorsing a candidate running for office (E).",
    navLabel:"Activity", cols:"three", ask:"Is this informing, donating money, or endorsing a candidate?",
    tip:"Click any number to go back and change it.",
    right:i=>P.ans[i]===B_ITEMS[i].ans, answerOf:i=>B_ITEMS[i].ans,
    drawItem:(i,locked)=>`<div class="item ${locked?"lock":""}"><span class="icon">${B_ITEMS[i].ic}</span><div><div class="num">Activity ${i+1} of 6</div><div class="txt">${B_ITEMS[i].t}</div></div></div>`,
    drawOpts:(i,box,locked,pick)=>{
      B_OPTS.forEach(o=>{
        const on=P.ans[i]===o[0];
        const b=$(`<button class="opt big ${on?(locked?"right":"sel"):""}" ${locked?"disabled":""}><span class="em">${o[1]}</span><span class="k">${o[0]} · ${o[2]}</span><span class="d">${o[3]}</span></button>`);
        b.onclick=()=>pick(o[0]); box.appendChild(b);
      });
    }
  });
}

/* ---------- Part D ---------- */
function renderD(){
  const P=S.D, order=S.order.D, card=i=>D_CARDS.find(c=>c.id===order[i]);
  const grp=id=>D_GROUPS.find(g=>g.id===id);
  itemPart({
    part:"D", n:6, keyOf:i=>order[i], label:i=>String(i+1), chipText:i=>grp(P.ans[order[i]]).ic,
    dir:"<b>Who’s Interested?</b> Place the description of the law or action taken by the government beneath the interest group most likely to have supported the policy.",
    navLabel:"Card", cols:"three", ask:"Which interest group most likely supported this? (Each group gets 2 cards.)",
    tip:"Click any number to go back and change it.",
    right:i=>P.ans[order[i]]===card(i).g, answerOf:i=>card(i).g,
    beforePick:(i,g)=>{ const here=Object.keys(P.ans).filter(k=>P.ans[k]===g && +k!==order[i]).length; if(here>=2){ setMsg(`${grp(g).name} already has 2 cards. Change one of those first.`,"try"); return false; } },
    drawItem:(i,locked)=>`<div class="item ${locked?"lock":""}"><span class="icon">${card(i).ic}</span><div><div class="num">Card ${i+1} of 6</div><div class="txt">${card(i).t}</div></div></div>`,
    drawOpts:(i,box,locked,pick)=>{
      D_GROUPS.forEach(g=>{
        const on=P.ans[order[i]]===g.id, cnt=Object.keys(P.ans).filter(k=>P.ans[k]===g.id).length;
        const b=$(`<button class="opt big ${on?(locked?"right":"sel"):""} ${cnt>=2&&!on?"full":""}" ${locked?"disabled":""}><span class="em">${g.ic}</span><span class="k" style="font-size:var(--mid)">${g.name}</span><span class="d">${g.d}</span><span class="d"><b>${cnt} of 2 cards</b></span></button>`);
        b.onclick=()=>pick(g.id); box.appendChild(b);
      });
    }
  });
}

/* ---------- Part C (draw the lines) ---------- */
function renderC(){
  const P=S.C;
  main.innerHTML="";
  main.insertAdjacentHTML("beforeend", dirBox("C","<b>Just the Facts?</b> Look at how two different interest groups might address the same question. Draw a line matching each group to the answer it would give."));
  main.appendChild($(`<div class="question"><span class="big">⚡🚗</span><div><div class="lab">Question</div><p>Should the government give tax credits to encourage people to buy electric vehicles?</p></div></div>`));
  const wrap=$(`<div class="cWrap"><div class="cCol" id="gcol"><h3>The Groups</h3></div><div></div><div class="cCol" id="acol"><h3>The Answers</h3></div><svg class="lines" id="svg"></svg></div>`);
  main.appendChild(wrap);
  main.insertAdjacentHTML("beforeend", barHTML());
  const linked=new Set(Object.values(P.link));
  C_GROUPS.forEach(g=>{
    const locked=P.locked[g.id];
    const b=$(`<button class="grp ${sel===g.id?"sel":""} ${P.link[g.id]?"linked":""} ${locked?"locked":""}" data-g="${g.id}"><span class="icon">${g.ic}</span><span><b>${g.name}</b>${g.mission}</span><span class="pin"></span></button>`);
    b.onclick=()=>{ if(locked) return; if(P.link[g.id]){ delete P.link[g.id]; sel=null; } else sel = sel===g.id?null:g.id; save(); renderC(); };
    wrap.querySelector("#gcol").appendChild(b);
  });
  C_ANS.forEach(a=>{
    const lockedA=Object.keys(P.locked).some(g=>P.link[g]===a.id);
    const b=$(`<button class="ans ${linked.has(a.id)?"linked":""} ${lockedA?"locked":""}" data-a="${a.id}"><span class="q">“</span><span>${a.t}</span><span class="pin"></span></button>`);
    b.onclick=()=>{ if(lockedA) return; if(!sel){ setMsg("First tap a group on the left.","try"); return; } for(const k in P.link) if(P.link[k]===a.id) delete P.link[k]; P.link[sel]=a.id; sel=null; save(); renderC(); };
    wrap.querySelector("#acol").appendChild(b);
  });
  requestAnimationFrame(drawLines);
  if(Object.keys(P.locked).length===2){ finishPart("C","Both matched! ✔ Each group’s answer helps its own mission."); return; }
  const chk=document.getElementById("check");
  chk.disabled = Object.keys(P.link).length<2;
  setMsg(sel?"Now tap the answer this group would give.":(chk.disabled?"Tap a group, then tap its answer. Tap a group again to erase its line.":"Both lines drawn — press Check."));
  chk.onclick=()=>{
    const wrong=[];
    C_GROUPS.forEach(g=>{ if(P.locked[g.id]) return; const ok=P.link[g.id]===g.ans; record("C",g.id,ok); if(ok) P.locked[g.id]=true; else wrong.push(g.id); });
    if(!wrong.length){ save(); renderC(); return; }
    document.querySelectorAll(".grp").forEach(s=>{ if(wrong.includes(s.dataset.g)) s.classList.add("shake"); });
    setTimeout(()=>{ wrong.forEach(g=>delete P.link[g]); save(); renderC(); setMsg("Not quite — read each group’s mission. Which answer helps that group?","try"); },450);
  };
  wireSkip(()=>{ C_GROUPS.forEach(g=>{P.link[g.id]=g.ans;P.locked[g.id]=true;}); save(); renderC(); });
}
function drawLines(){
  const svg=document.getElementById("svg"); if(!svg||!S||S.part!=="C") return;
  const box=svg.getBoundingClientRect(); svg.innerHTML="";
  for(const g in S.C.link){
    const a=document.querySelector(`.grp[data-g="${g}"] .pin`), b=document.querySelector(`.ans[data-a="${S.C.link[g]}"] .pin`);
    if(!a||!b) continue;
    const r1=a.getBoundingClientRect(), r2=b.getBoundingClientRect();
    const x1=r1.left+r1.width/2-box.left, y1=r1.top+r1.height/2-box.top, x2=r2.left+r2.width/2-box.left, y2=r2.top+r2.height/2-box.top;
    const bend=Math.max(20,(x2-x1)/2);
    svg.insertAdjacentHTML("beforeend",`<path d="M${x1},${y1} C${x1+bend},${y1} ${x2-bend},${y2} ${x2},${y2}" stroke="${S.C.locked[g]?"#2e9d5b":"#0f8b8d"}" stroke-width="4" fill="none" stroke-linecap="round"/>`);
  }
}
window.addEventListener("resize", drawLines);

/* ===================== START ===================== */
function renderStart(){
  S=null; header();
  let last=""; try{ last=localStorage.getItem("site-student-name")||""; }catch(e){}
  main.innerHTML="";
  main.appendChild($(`<div class="center"><div class="startcard">
      <h2>🏛️ Who’s pulling the strings?</h2>
      <p class="hook">Groups spend big to sway the government. Today you figure out <b>how</b> they do it — and <b>who</b> wants what.</p>
      <ul class="plan">
        <li><b>A</b> Match 8 vocab words</li>
        <li><b>B</b> Inform, Donate, or Endorse? (6)</li>
        <li><b>C</b> Match 2 groups to their answers</li>
        <li><b>D</b> Sort 6 laws to the right group</li>
      </ul>
      <p style="margin:0 0 10px;font-size:14px;color:var(--muted)">About 20 minutes · each part opens after the one before it.</p>
      <label for="nm">Your name (first name + last initial)</label>
      <input id="nm" data-student-name="1" placeholder="Example: Jordan M." value="${esc(last)}" autocomplete="off">
      <button class="btn" id="go" style="width:100%;font-size:18px;padding:12px">Start ▶</button>
  </div></div>`));
  const go=()=>{
    const box=document.getElementById("nm"), n=box.value.trim().replace(/\s+/g," ");
    const ok = window.classNameState ? window.classNameState(n)==="ok" : n.length>=2;
    if(!ok){ box.focus(); box.classList.add("shake"); setTimeout(()=>box.classList.remove("shake"),400); return; }
    S = load(n) || fresh(n); S.name=n; try{ localStorage.setItem("site-student-name", n); }catch(e){} save(); render();
  };
  document.getElementById("go").onclick=go;
  document.getElementById("nm").onkeydown=e=>{ if(e.key==="Enter") go(); };
}

/* ===================== FINISH + TURN IN ===================== */
function renderEnd(){
  main.innerHTML="";
  main.appendChild($(`<div class="center"><div class="fcard">
    <div style="font-size:42px">🏛️✅</div>
    <h2>Pages 5 &amp; 6 — All Four Parts Done</h2>
    <p>Nice work, <b>${esc(S.name)}</b> — press the button to send your work to your teacher.</p>
    <button class="btn next" id="sendBtn" style="font-size:19px;padding:13px 30px;margin:8px 0">${S.turnedIn?"✓ Turned in":"Turn it in ▶"}</button>
    <p class="msg ${S.turnedIn?"good":""}" id="sendMsg" style="min-height:22px">${S.turnedIn?"✓ Turned in. Your teacher can see your work.":""}</p>
  </div></div>`));
  const btn=document.getElementById("sendBtn"), msg=document.getElementById("sendMsg");
  if(S.turnedIn){ btn.disabled=true; return; }
  btn.onclick=async()=>{
    if(typeof window.classTurnIn!=="function"){ msg.textContent="Turn-in isn't working right now. Keep this page open and tell your teacher."; msg.className="msg try"; return; }
    btn.disabled=true; btn.textContent="Sending…"; msg.textContent="";
    const tot=PARTS.reduce((t,p)=>t+firstScore(p),0);
    const answers={"Standard":STANDARD, "First-try correct": tot+" of 22"};
    answers["First-try by part"]=PARTS.map(p=>`${p} · ${PART_NAMES[p]}: ${firstScore(p)} of ${TOTALS[p]}`).join(" · ");
    const tag=(p,k)=>S[p].first[k]===false?" (fixed after a miss)":" (first try)";
    A_TERMS.forEach((x,i)=>{ answers[`A${i+1} · ${x.t}`]=`${x.ans}) ${A_DEFS[x.ans]}`+tag("A",i); });
    const full={I:"Inform",D:"Donate",E:"Endorse"};
    B_ITEMS.forEach((x,i)=>{ answers[`B${i+1}`]=`${x.ans} · ${full[x.ans]}`+tag("B",i); });
    C_GROUPS.forEach(g=>{ const a=C_ANS.find(z=>z.id===g.ans); answers[`C · ${g.name}`]=a.t.slice(0,60)+"…"+tag("C",g.id); });
    D_CARDS.forEach(c=>{ const g=D_GROUPS.find(z=>z.id===c.g); answers[`D${c.id} · ${c.t.slice(0,40)}…`]=g.name+tag("D",c.id); });
    try{
      const res=await window.classTurnIn(OLD_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({studentName:S.name,assignmentId:ASSIGNMENT_ID,assignmentTitle:TITLE,answers})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(data.error||"Your work did not save. Try again.");
      S.turnedIn=true; save();
      btn.textContent="✓ Turned in"; msg.textContent="✓ Turned in. Your teacher can see your work."; msg.className="msg good";
    }catch(err){ msg.textContent=err.message||"Could not turn in. Try again."; msg.className="msg try"; btn.disabled=false; btn.textContent="Turn it in ▶"; }
  };
}

/* ===================== ROUTER ===================== */
function render(){
  header();
  if(!S) return renderStart();
  ({A:renderA,B:renderB,C:renderC,D:renderD,END:renderEnd})[S.part]();
}
document.getElementById("restart").onclick=e=>{
  e.preventDefault(); if(!S) return;
  const box=$(`<div style="position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:9999"><div style="background:#fff;border-radius:14px;padding:20px 24px;max-width:380px;text-align:center"><p style="font-weight:800;font-size:17px;margin:0 0 12px">Erase your answers and start over?</p><button class="btn ghost" id="no">Keep my work</button> <button class="btn" id="yes" style="background:var(--accent2)">Start over</button></div></div>`);
  document.body.appendChild(box);
  box.querySelector("#no").onclick=()=>box.remove();
  box.querySelector("#yes").onclick=()=>{ try{ localStorage.removeItem(KEY+S.name.toLowerCase()); }catch(x){} S=null; sel=null; box.remove(); render(); };
};

/* ===================== TEST T. SKIP MODE (shared/turnin.js) ===================== */
try{
  const SCREENS=["A","B","C","D","END"], LABELS=["A · Vocabulary","B · How Do You Lobby?","C · Just the Facts?","D · Who’s Interested?","Turn in"];
  (window.classTestHooks = window.classTestHooks || []).push({
    count: () => SCREENS.length,
    index: () => S ? Math.max(0, SCREENS.indexOf(S.part)) : 0,
    label: i => LABELS[i],
    go: i => { if(!S) S=fresh("Test T."); S.part=SCREENS[i]; sel=null; save(); render(); },
    solve: () => { if(SOLVE) SOLVE(); }
  });
  if (window.classTestSkip) window.classTestSkip.refresh();
}catch(e){}
render();
</script>
