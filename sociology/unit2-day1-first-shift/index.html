<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>First Shift: The Unwritten Rules | Sociology Unit 2 Day 1</title>
<meta name="description" content="Survive your first Saturday shift at a diner. Read the unwritten rules before you get written up.">
<link rel="stylesheet" href="style.css?v=20261103b">
<script src="../../shared/assignments.js?v=20261103p4"></script>
<script src="../../shared/turnin.js?v=20261103d"></script>
<script src="../../shared/lang.js?v=20261103c"></script>
</head><body class="on-title">
<div class="checks" aria-hidden="true"></div>
<div class="hud" id="hud" hidden aria-label="Shift status">
  <div class="hud-in">
    <div class="clockbox"><span class="clock" aria-hidden="true"><span class="ch" id="clockH"></span><span class="cm" id="clockM"></span></span><span class="clock-txt"><b id="hudTime"></b><small><span id="hudStep">1</span> / <span id="hudTotal">18</span></small></span></div>
    <div class="who" id="danaPortrait" title="Dana (manager)"><span class="pf" aria-hidden="true">👩🏽‍💼</span><span class="pm" id="danaMood" aria-hidden="true">😐</span><span class="pw"><span class="lbl">Dana</span><b id="mTrust"></b></span></div>
    <div class="who rival" id="kaylaPortrait" title="Kayla (your rival)"><span class="pf" aria-hidden="true">💁🏼‍♀️</span><span class="pm" id="kaylaMood" aria-hidden="true">😐</span><span class="pw"><span class="lbl">Crew</span><b id="mCrew"></b></span><span class="rtag">Rival</span></div>
    <span class="meter" title="Tips"><span class="ic" aria-hidden="true">💵</span><b id="mTips">$0</b></span>
    <span class="meter stress" title="Stress"><span class="ic" aria-hidden="true">🔥</span><span class="lbl">Stress</span> <span class="sbar" aria-hidden="true"><span id="mStressFill"></span></span><b id="mStress" class="sr">0</b></span>
    <span class="meter wu" title="Write-ups"><span class="lbl">Write-ups</span> <b id="mWu"></b></span>
  </div>
  <div class="prog" aria-hidden="true"><span id="progFill"></span></div>
</div>
<main id="wrap">
  <p class="welcome" id="welcome" role="status" hidden></p>
  <div class="layout" id="layout">
    <section id="app" class="stage-wrap" aria-live="polite"></section>
    <aside id="side" class="side" hidden>
      <div class="panel lanyard">
        <p class="panel-h">Your status cards</p>
        <div id="cards" class="mini-cards"></div>
      </div>
      <div class="panel notebook">
        <p class="panel-h">Your rulebook</p>
        <ul id="rulebook" class="rulebook"></ul>
        <p id="rbEmpty" class="rb-empty">Rules you discover will show up here.</p>
      </div>
    </aside>
  </div>
  <div class="foot"><span>Progress saves on this device. Your teacher sees your work after you turn it in.</span><button type="button" id="restartBtn">Start over</button></div>
</main>
<script src="game.js?v=20261103b"></script>
</body></html>
