<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Principle Rush | Government Unit 1 Day 7</title>
<meta name="description" content="20 real moments from Day 7. Name the Constitution principle behind each one. Build a streak.">
<style>
:root{--ink:#17233a;--muted:#55627a;--navy:#14284f;--navy2:#1e3a6e;--gold:#f2b632;--gold2:#fff1c7;--red:#d23c2c;--red2:#fde3de;--green:#1f8a55;--green2:#ddf5e7;--amber2:#fff1d6;--paper:#fffaf0}
*{box-sizing:border-box}
html{background:#0d1c39}
body{margin:0;min-height:100vh;color:#fff;font:17px/1.45 system-ui,Segoe UI,Arial,sans-serif;background:radial-gradient(1200px 500px at 50% -10%,#2b4f8f 0,transparent 70%),linear-gradient(180deg,#14284f,#0d1c39);background-attachment:fixed}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #7fc1ff;outline-offset:2px}
.hide,[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px max(14px,calc((100vw - 1100px)/2));background:#0a1630;border-bottom:3px solid var(--gold)}
.brand{font-weight:1000;letter-spacing:.08em;font-size:1.05rem}.brand small{display:block;font-size:.66rem;letter-spacing:.16em;color:var(--gold);font-weight:900}
.spacer{flex:1}.saved{font-size:.78rem;color:#b7c4dd}
.restart{border:2px solid #3a5285;background:#14284f;border-radius:10px;padding:6px 12px;font-weight:800;font-size:.85rem;min-height:38px}
.hud{position:sticky;top:0;z-index:8;display:flex;gap:14px;align-items:center;padding:8px max(14px,calc((100vw - 1100px)/2));background:#0f2044ee;border-bottom:1px solid #2e4a80}
.prog{flex:1;min-width:0}.prog-lab{display:flex;justify-content:space-between;font-weight:900;font-size:.85rem}
.bar{height:14px;background:#0a1630;border:2px solid #2e4a80;border-radius:10px;overflow:hidden;margin-top:4px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#ffd15c,var(--gold));transition:width .5s}
.streak{display:flex;align-items:center;gap:6px;background:#1a3264;border-radius:20px;padding:4px 12px;font-weight:1000;white-space:nowrap}.streak.hot{background:#7a2d0c;animation:glow 1.2s infinite}@keyframes glow{50%{box-shadow:0 0 0 5px #ff8a3a44}}
.streak .n{font-size:1.2rem}
.welcome{max-width:1100px;margin:10px auto 0;padding:9px 14px;background:var(--green2);border-radius:10px;font-weight:800;color:#145c39}
main{max-width:1100px;margin:auto;padding:16px 16px 60px}
.kicker{font-size:.76rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0}
h1,h2,h3{line-height:1.12}
.go{display:block;width:100%;max-width:420px;margin:18px auto 0;background:linear-gradient(180deg,#ffd15c,var(--gold));color:#2a1c00;border:0;border-bottom:5px solid #a8770c;border-radius:14px;padding:13px 18px;font-weight:1000;font-size:1.12rem;min-height:54px;box-shadow:0 6px 18px #0006}
.go:disabled{opacity:.4;cursor:not-allowed}
.go:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
/* title */
.title{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center}
.title h1{font-size:clamp(2.6rem,6vw,4.4rem);margin:4px 0;letter-spacing:.03em;text-shadow:0 4px 0 var(--red),0 8px 24px #000a}
.hook{font-size:1.2rem;font-weight:800;margin:6px 0 10px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.step{background:#fff;color:var(--ink);border-radius:12px;padding:9px 8px;text-align:center;box-shadow:0 4px 12px #0005}.step b{display:block;font-size:.95rem}.step small{color:var(--muted);font-size:.8rem}.step .e{font-size:1.6rem;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chips span{background:#1a3264;border:1px solid #2e4a80;border-radius:20px;padding:4px 12px;font-size:.92rem}
.fine{font-size:.78rem;color:#b7c4dd;margin:10px 0 0}
.sample{background:#fff;color:var(--ink);border-radius:16px;padding:16px;box-shadow:0 14px 40px #000a;transform:rotate(1.5deg)}
.sample .tag{display:inline-block;background:var(--red);color:#fff;font-weight:1000;font-size:.72rem;letter-spacing:.1em;border-radius:4px;padding:2px 8px}
.sample p{font-weight:800;font-size:1.1rem;margin:8px 0}
.sample .opts{display:grid;gap:6px}.sample .opts span{border:2px solid #c9d6ef;border-radius:10px;padding:6px 10px;font-weight:800}.sample .opts span.ok{border-color:var(--green);background:var(--green2)}
/* question */
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.card{position:relative;background:#fff;color:var(--ink);border-radius:18px;padding:18px;box-shadow:0 10px 26px #0008;border-top:8px solid var(--gold);animation:deal .35s both}
@keyframes deal{from{opacity:0;transform:translateY(24px) rotate(-3deg)}}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tagreal{background:var(--red);color:#fff;font-weight:1000;font-size:.72rem;letter-spacing:.1em;border-radius:4px;padding:3px 8px}.tagreal.ex{background:#5a6275}
.card .e{font-size:2.6rem}
.card .scene{font-size:1.25rem;font-weight:800;margin:8px 0 0;line-height:1.35}
.card .src{font-size:.75rem;color:var(--muted);margin:10px 0 0}
.ask{font-size:1.25rem;font-weight:1000;margin:0 0 10px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:linear-gradient(180deg,#fff,#eef3ff);color:var(--ink);border:3px solid #7fa6e8;border-radius:14px;padding:12px 14px;min-height:64px;font-weight:900;font-size:1.05rem;box-shadow:0 5px 12px #0006;transition:transform .12s}
.opt:hover:not(:disabled){border-color:var(--navy2);box-shadow:0 0 0 3px #7fc1ff88,0 5px 12px #0006}
.opt .oe{font-size:1.6rem;flex:none}
.opt small{display:block;font-weight:700;font-size:.8rem;color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:linear-gradient(180deg,#fff,var(--green2))}
.opt.wrong{border-color:var(--red);background:linear-gradient(180deg,#fff,var(--red2));animation:shake .45s}
.opt.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.fb{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:1.02rem;animation:deal .3s both}
.fb.good{background:var(--green2);color:#0f4d2e}.fb.bad{background:var(--amber2);color:#5c3d00}
.fb b.h{display:block;font-size:1.1rem;margin-bottom:2px}
.fb .back{display:block;margin-top:6px;font-size:.88rem;font-weight:800}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:2.4rem;font-weight:1000;color:var(--gold);text-shadow:0 4px 0 #7a2d0c,0 8px 20px #000a;pointer-events:none;animation:popup 1.1s forwards;z-index:20}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
/* break + end */
.panel{background:#fff;color:var(--ink);border-radius:18px;padding:20px;max-width:820px;margin:0 auto;box-shadow:0 14px 36px #000a}
.panel h2{margin:0 0 6px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.stats p{margin:0;background:#eef3ff;border-radius:12px;padding:8px 14px;font-weight:800}.stats b{font-size:1.3rem}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:10px 0}
.pitem{border:2px solid #dbe3f2;border-left-width:7px;border-radius:10px;padding:7px 10px;font-weight:800}.pitem small{display:block;color:var(--muted);font-weight:700}
.pitem.g{border-left-color:var(--green)}.pitem.m{border-left-color:#e0a020}.pitem.b{border-left-color:var(--red)}
.sheet{background:#fffdf6;border:2px solid #e9dfc6;border-radius:10px;padding:12px 14px;margin:12px 0 0}
.sheet label{display:block;font-weight:900;margin:0 0 4px}.stem{margin:0 0 6px;color:var(--muted);font-size:.92rem}
textarea,input[type=text]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:8px;border:2px solid #c9b88f;background:#fff;color:var(--ink)}
textarea{resize:vertical}
.msg{min-height:1.3em;margin:10px 0 0;font-weight:800}.msg.wait{background:var(--amber2);border-radius:12px;padding:9px 13px;color:#5c3d00}.msg.good{background:var(--green2);border-radius:12px;padding:9px 13px;color:#145c39}
@media(max-width:860px){.title,.qwrap{grid-template-columns:1fr}.sample{max-width:420px;margin:0 auto}}
@media(max-width:620px){body{font-size:16px}.steps{grid-template-columns:1fr}.saved{display:none}.card .scene{font-size:1.12rem}.ask{font-size:1.1rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="../../shared/assignments.js?v=20261105fb1"></script>
<script src="../../shared/turnin.js?v=20261105fb1"></script>
<script src="../../shared/lang.js?v=20261103c"></script>
</head><body>
<header class="top"><div class="brand">PRINCIPLE RUSH<small>GOVERNMENT · DAY 7 · THE CONSTITUTION</small></div><div class="spacer"></div><span class="saved">Progress saves on this device.</span><button type="button" class="restart" id="restartBtn">↻ Start over</button></header>
<div class="hud" id="hud" hidden>
  <div class="prog"><div class="prog-lab"><span id="progTxt">0 of 20</span><span id="rightTxt">0 first-try</span></div><div class="bar" aria-hidden="true"><span id="progFill" style="width:0"></span></div></div>
  <div class="streak" id="streakBox" title="Right answers in a row">🔥 <span class="n" id="streakNum">0</span> <span>streak</span></div>
</div>
<p class="welcome" id="welcome" role="status" hidden></p>
<main id="app"></main>
<script src="rush.js?v=1"></script>
</body></html>
