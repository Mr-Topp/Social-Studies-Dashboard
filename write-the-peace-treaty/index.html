<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write the Peace: Treaty of Versailles</title>
<style>
:root{--ink:#1d2a44;--navy:#1d2f55;--gold:#d6a630;--gold2:#f6d77a;--paper:#f8f4ea;--card:#fffdf8;--line:#e2d8c3;--red:#c0392b;--green:#2f7d4f;--blue:#2c64a8;--purple:#6b4ca3;--muted:#5d6676}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.45 system-ui,"Segoe UI",Arial,sans-serif}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #3f8fd1;outline-offset:2px}
.wrap{max-width:1060px;margin:0 auto;padding:0 14px}
/* top bar */
.topbar{background:#fff;border-bottom:4px solid var(--gold);position:sticky;top:0;z-index:20}
.topbar>.wrap:first-child{display:flex;align-items:center;gap:12px;min-height:50px}
.brand{font-weight:900;color:var(--navy);white-space:nowrap}
.stepbox{flex:1;min-width:0}
.steptext{font-size:.78rem;font-weight:800;color:var(--muted);letter-spacing:.04em}
.track{height:8px;background:#ece4d2;border-radius:99px;overflow:hidden;margin-top:3px}
.fill{height:100%;width:0;background:linear-gradient(90deg,#d6a630,#f2c94c);transition:width .4s}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:6px}
/* meters */
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 0}
.meter{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 9px;position:relative}
.meter .mlabel{font-size:.8rem;font-weight:800;display:flex;justify-content:space-between;gap:4px}
.bar{height:10px;background:#eee7d8;border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .8s ease}
.m-A .bar i{background:linear-gradient(90deg,#f0a35e,#c0392b)}
.m-S .bar i{background:linear-gradient(90deg,#7fb0e6,#2c64a8)}
.m-E .bar i{background:linear-gradient(90deg,#8fd19e,#2f7d4f)}
.m-L .bar i{background:linear-gradient(90deg,#b9a2e3,#6b4ca3)}
.delta{font-size:.78rem;font-weight:900;border-radius:6px;padding:0 5px;animation:pop .5s}
.delta.up{background:#ffe9d6;color:#8a3b10}.delta.down{background:#e2eefc;color:#1f4c85}
.m-A .delta.up{background:#fde0dc;color:#9b2318}.m-A .delta.down{background:#dff3e6;color:#1d6a3d}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
/* cards */
main{padding:12px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,2.6vw,24px);box-shadow:0 8px 24px #3b2f1412;margin-bottom:14px}
.kicker{font-size:.74rem;letter-spacing:.14em;font-weight:900;color:#a0761a;text-transform:uppercase;margin:0 0 2px}
h1{font-size:clamp(2.2rem,6vw,3.6rem);line-height:1;margin:6px 0 8px;color:var(--navy)}
h2{font-size:clamp(1.35rem,3vw,1.9rem);line-height:1.15;margin:2px 0 8px;color:var(--navy)}
h3{margin:4px 0 6px;color:var(--navy);font-size:1.15rem}
p{margin:6px 0}
.small{font-size:.85rem;color:var(--muted)}
.go{display:inline-block;background:var(--red);color:#fff;border:0;border-radius:12px;padding:13px 22px;font-weight:900;font-size:1.05rem;box-shadow:0 4px 0 #7d241b;margin-top:10px}
.go:hover{transform:translateY(-1px)}
.go:disabled{background:#b8b0a2;box-shadow:none;cursor:not-allowed;transform:none}
.go.big{font-size:1.3rem;padding:16px 34px}
.welcome{background:#e4f3e9;color:#14532d;border:1px solid #83b394;border-radius:10px;padding:9px 12px;margin:10px 0 0;font-weight:700}
/* title */
.title-card{display:grid;grid-template-columns:1.25fr .75fr;gap:20px;align-items:center;background:linear-gradient(135deg,#fffdf8,#fbf0d4)}
.title-card .hook{font-size:1.15rem;font-weight:700}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.facts span{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:.88rem;font-weight:800}
.goal{background:#eef4fb;border-left:5px solid var(--blue);border-radius:8px;padding:8px 11px;margin:8px 0}
.seal{display:grid;place-items:center;aspect-ratio:1;max-width:250px;margin:auto;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff7dd,#efd38a);border:6px double #b98a1d;text-align:center;padding:18px;color:var(--navy)}
.seal b{font-size:3rem;line-height:1}.seal span{font-weight:900;letter-spacing:.08em;font-size:.82rem}
.heads{font-size:.82rem;color:var(--muted);margin-top:8px}
/* leaders */
.leaders{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.leader{background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px 10px;display:flex;gap:9px;align-items:flex-start;position:relative}
.leader.gone{opacity:.55;filter:grayscale(.8)}
.face{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:#f4ead2;border:2px solid #d8c28c}
.lname{font-weight:900;line-height:1.1}
.lcountry{font-size:.75rem;color:var(--muted);font-weight:800}
.pips{font-size:.8rem;letter-spacing:2px;color:#c0392b;white-space:nowrap}
.pips .off{color:#d9d0bf}
.bubble{margin-top:4px;font-size:.92rem;background:#f6f1e5;border-radius:10px;padding:6px 8px;position:relative}
.bubble.say::before{content:"“"}.bubble.say::after{content:"”"}
.react{margin-top:4px;font-size:.88rem;font-weight:800;border-radius:8px;padding:4px 7px}
.react.r2,.react.r1{background:#e2f2e7;color:#1d6a3d}.react.r0{background:#f1eee6;color:#4c5361}.react.rm1{background:#fdf0d7;color:#7a4b0c}.react.rm2{background:#fde0dc;color:#9b2318}
.germany{display:flex;gap:8px;align-items:center;background:#f3efe6;border:1px dashed #c9bda4;border-radius:10px;padding:6px 10px;font-size:.88rem}
/* situation + options */
.sit{font-size:1.05rem}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.opt{text-align:left;background:#fff;border:2px solid #d8cbb0;border-radius:14px;padding:12px;box-shadow:0 4px 0 #e2d6bd;color:var(--ink);transition:transform .12s,border-color .12s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--gold)}
.opt b{display:block;font-size:1.05rem;color:var(--navy);margin-bottom:3px}
.opt span{font-size:.92rem;color:#465063}
.opt.picked{border-color:var(--navy);background:#eef2fb}
.opt:disabled{cursor:default}
.result{border-left:6px solid var(--gold);background:#fff8e6;border-radius:12px;padding:10px 13px;margin-top:12px}
.concept{background:#eef4fb;border-radius:10px;padding:8px 11px;margin-top:8px}
.walkout{background:#fde0dc;border:2px solid #e49c92;border-radius:12px;padding:10px 12px;margin-top:10px}
.walkout b{color:#8a1f15}
/* checks */
.check{background:#f4f8fc;border:2px solid #b9cfe6;border-radius:14px;padding:12px 14px;margin-top:12px}
.check .qlabel{font-size:.72rem;letter-spacing:.13em;font-weight:900;color:#2c64a8;text-transform:uppercase;margin:0}
.check h3{font-size:1.1rem}
.choices{display:grid;gap:8px;margin-top:8px}
.choice{text-align:left;background:#fff;border:2px solid #cdd8e6;border-radius:11px;padding:11px 13px;color:var(--ink);min-height:50px}
.choice:hover:not(:disabled){border-color:#2c64a8}
.choice:disabled{opacity:.6;cursor:not-allowed}
.msg{min-height:1.2em;font-weight:700;margin-top:8px}
.msg.bad{color:#8a4b0c}
.msg.good{color:#1d6a3d}
.done-check{background:#e2f2e7;border:2px solid #9fcfb0;border-radius:12px;padding:10px 12px;margin-top:12px}
.quote{font-family:Georgia,"Times New Roman",serif;font-size:1.08rem;background:#fffaf0;border:1px solid var(--line);border-left:5px solid #8a6a1f;border-radius:8px;padding:10px 12px;margin:8px 0}
.quote cite{display:block;font-family:system-ui,"Segoe UI",Arial,sans-serif;font-style:normal;font-size:.8rem;color:var(--muted);margin-top:4px}
/* future + ending */
.future{display:grid;gap:10px;margin-top:10px}
.event{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;animation:rise .4s ease-out}
.event .year{flex:none;font-weight:900;font-size:1.1rem;color:#fff;background:var(--navy);border-radius:9px;padding:6px 9px;height:fit-content}
.event.real .year{background:#8a6a1f}
.cause{display:inline-block;font-size:.8rem;font-weight:800;background:#f1eadb;border-radius:6px;padding:2px 7px;margin-top:4px;color:#5b4a22}
.ending{border-radius:16px;padding:16px;margin-top:12px;color:#fff;animation:rise .5s ease-out}
.ending h2{color:#fff;margin:2px 0 6px}
.ending .kicker{color:#ffe7a3}
.end-1940{background:linear-gradient(135deg,#5b1d18,#a23a2c)}
.end-close{background:linear-gradient(135deg,#6a4b12,#b5832a)}
.end-unchecked{background:linear-gradient(135deg,#2e3346,#5b6480)}
.end-long{background:linear-gradient(135deg,#1d5a3a,#3f9a66)}
.trail{background:#ffffff22;border-radius:10px;padding:8px 10px;margin-top:8px}
.trail li{margin:3px 0}
.whatif{display:inline-block;background:#fff3cf;color:#6b4a07;border-radius:6px;padding:2px 8px;font-size:.78rem;font-weight:900;letter-spacing:.06em}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* compare */
table.compare{width:100%;border-collapse:collapse;margin-top:8px;font-size:.93rem}
.compare th,.compare td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.compare th{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.same{color:#1d6a3d;font-weight:900}.diff{color:#9b5a0c;font-weight:900}
.terms{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.term{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.93rem}
.term b{color:var(--navy)}
/* cartoons */
.cartoon-layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:16px;align-items:start}
.cartoon{position:relative;margin:0;background:#ece5d6;border:1px solid #cfc3aa;border-radius:12px;padding:8px}
.pic{position:relative;line-height:0;cursor:crosshair}
.pic img{width:100%;height:auto;display:block;border-radius:6px;background:#fff}
.hot{position:absolute;background:transparent;border:0;border-radius:10px;padding:0}
.hot.found{border:4px solid var(--gold);box-shadow:0 0 0 3px #ffffffcc;cursor:default}
.hot.pulse{border:4px dashed #c0392b;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px #c0392b44}}
.tag{position:absolute;left:50%;top:100%;transform:translate(-50%,4px);background:var(--navy);color:#fff;font:800 .72rem/1.2 system-ui,Arial,sans-serif;border-radius:6px;padding:3px 6px;white-space:nowrap;z-index:2}
.cartoon figcaption{font-size:.78rem;color:#55606e;padding:6px 2px 0;line-height:1.35}
.task{background:#fff3cf;border:2px solid #ecd08a;border-radius:12px;padding:9px 12px;font-weight:800}
.task.ok{background:#e2f2e7;border-color:#9fcfb0}
.missmsg{min-height:1.2em;font-weight:700;color:#8a4b0c;margin-top:6px}
/* chain */
.chain{display:grid;gap:0;margin-top:8px}
.link{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 11px;animation:rise .4s ease-out}
.link .year{flex:none;font-weight:900;background:#8a6a1f;color:#fff;border-radius:8px;padding:4px 8px}
.joint{height:16px;margin-left:30px;border-left:4px dotted #b9a06a}
/* writing */
label{display:block;font-weight:850;color:var(--navy);margin:14px 0 4px}
.stem{font-size:.9rem;color:#4c5361;margin:0 0 5px}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);padding:10px 12px;border:2px solid #cbbf9f;border-radius:9px;background:#fff}
textarea{min-height:88px;resize:vertical}
.turned{background:#e2f2e7;border:2px solid #9fcfb0;border-radius:12px;padding:10px 12px;font-weight:900;color:#1d6a3d;margin-top:10px}
.sources{font-size:.78rem;color:var(--muted);margin-top:10px}
.sources summary{cursor:pointer;font-weight:800}
.fictional{font-size:.78rem;color:var(--muted);font-style:italic}
@media (max-width:820px){
 .title-card{grid-template-columns:1fr}.seal{max-width:170px}
 .cartoon-layout{grid-template-columns:1fr}
 .terms{grid-template-columns:1fr}
}
@media (max-width:640px){
 body{font-size:16px}
 .meters{grid-template-columns:repeat(2,1fr);gap:5px;padding:5px 0}
 .meter{padding:4px 7px}.meter .mlabel{font-size:.74rem}
 .leaders{grid-template-columns:1fr;gap:6px}
 .leader{padding:7px 9px}.face{width:38px;height:38px;font-size:1.3rem}
 .opts{grid-template-columns:1fr}
 .brand{display:none}
 .topbar{position:static}
 .compare{font-size:.84rem}
}

/* ===== game look ===== */
body{background:#efe6d2 radial-gradient(circle at 20% 0,#fff8e6 0,#efe6d2 60%) fixed}
.topbar{background:linear-gradient(90deg,#14254a,#1d3a6e);border-bottom:4px solid var(--gold)}
.brand{color:#ffe08a}.steptext{color:#dbe5f5}.track{background:#ffffff2a}.linkbtn{color:#c9d6ee}
.meter{background:#ffffff;border:2px solid #ffffff55}
.micon{display:inline-block;font-size:1.05rem}
.meter.danger{box-shadow:0 0 0 3px #e0533f;animation:danger 1.2s infinite}
@keyframes danger{50%{box-shadow:0 0 0 6px #e0533f55}}
.opt{position:relative;text-align:center;padding:14px 12px}
.opt .opt-icon{display:block;font-size:2.4rem;line-height:1.1;margin-bottom:4px}
.opt .stamp{top:-12px;right:-10px;color:#b3261e;font-size:.95rem}
.opt b{font-size:1.12rem}
.opts.one{grid-template-columns:minmax(0,340px)}
.stamp{position:absolute;top:10px;right:10px;border:4px solid #b3261e;color:#b3261e;background:#fff8;font:900 .95rem/1 system-ui,Arial,sans-serif;letter-spacing:.14em;padding:6px 10px;border-radius:6px;transform:rotate(-12deg);animation:slam .4s cubic-bezier(.2,1.6,.4,1)}
.stamp.green{border-color:#1f7a45;color:#1f7a45}
@keyframes slam{0%{transform:rotate(-12deg) scale(3);opacity:0}100%{transform:rotate(-12deg) scale(1);opacity:1}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.face{position:relative}
.mood{position:absolute;right:-8px;bottom:-6px;font-size:1.15rem;animation:slam .4s}
.walkout{position:relative;padding-left:62px}
.door{position:absolute;left:12px;top:10px;font-size:2.2rem}
.bubble-lg{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-size:1.08rem;font-weight:650;position:relative;max-width:760px}
/* evidence file (checks) */
.check,.done-check{position:relative;background:#fffaf0 repeating-linear-gradient(0deg,transparent 0 27px,#efe3c8 27px 28px);border:2px solid #c9b48a;border-radius:4px 14px 14px 14px;padding:14px 16px;margin-top:22px;box-shadow:0 6px 0 #e3d3ad}
.done-check{background:#f3fbf5;border-color:#8cc5a0;box-shadow:0 6px 0 #c4e3cf}
.file-tab{position:absolute;top:-17px;left:-2px;background:#c9b48a;color:#3b2d10;font:800 .78rem/1 "Courier New",monospace;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:8px 8px 0 0;margin:0}
.done-check .file-tab{background:#8cc5a0;color:#0f3d22}
.file-q{font-weight:850;font-size:1.08rem;margin:6px 0 4px}
.choice{background:#fff;border:2px solid #d9c9a4;border-left:8px solid #c9b48a;border-radius:6px 12px 12px 6px;font-weight:650;box-shadow:0 3px 0 #e6d8b7}
.choice:hover:not(:disabled){border-color:#8a6a1f;transform:translateY(-1px)}
/* newspapers */
.paper{background:#fffdf6;border:2px solid #2a2a2a;border-radius:4px;padding:10px 14px;box-shadow:4px 4px 0 #2a2a2a22;animation:drop .45s ease-out;transform-origin:top}
@keyframes drop{0%{opacity:0;transform:rotate(-3deg) scale(1.08)}100%{opacity:1;transform:none}}
.mast{display:flex;justify-content:space-between;border-bottom:3px double #2a2a2a;font:900 .78rem/1.6 Georgia,serif;letter-spacing:.14em}
.headline{font:900 clamp(1.4rem,3.4vw,2rem)/1.1 Georgia,"Times New Roman",serif;margin:6px 0 2px;text-transform:uppercase}
/* title scene */
.table-scene{position:relative;width:100%;max-width:300px;aspect-ratio:1;margin:auto}
.tbl{position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#7a4e2a,#4b2d16);border:6px solid #2f1c0d;display:grid;place-items:center;box-shadow:0 10px 24px #0004}
.scroll{font-size:2.6rem;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
.seat{position:absolute;display:grid;justify-items:center;width:76px}
.seat span{font-size:2.1rem;background:#fff;border:3px solid #d6a630;border-radius:50%;width:58px;height:58px;display:grid;place-items:center}
.seat small{font-weight:900;font-size:.68rem;color:var(--navy);background:#fff;border-radius:6px;padding:1px 5px;margin-top:2px;white-space:nowrap}
.s1{left:0;top:38%}.s2{left:calc(50% - 38px);top:0}.s3{right:0;top:38%}.s4{left:calc(50% - 38px);bottom:0}
.seat.you span{border-color:#c0392b;animation:glow 1.4s infinite}
@keyframes glow{50%{box-shadow:0 0 0 8px #c0392b33}}
.seal-mini{position:absolute;left:0;right:0;bottom:-30px;text-align:center;font-weight:900;font-size:.78rem;letter-spacing:.12em;color:#8a6a1f}
/* briefing tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tile{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-weight:650;font-size:.95rem}
.tile b{display:block;font-size:1.8rem;color:#c0392b;letter-spacing:2px}
/* real treaty versus cards */
.scoreboard{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--navy);color:#fff;border-radius:14px;padding:10px 14px;margin:8px 0}
.scoreboard .big{font:900 2rem/1 system-ui,Arial,sans-serif;color:#ffe08a}
.scoreboard b{color:#ffe08a}
.vsgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vs{position:relative;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;animation:rise .5s ease-out both}
.vs-h{font-weight:900;color:var(--navy);margin:0 0 6px}
.vs-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vs-you,.vs-real{border-radius:10px;padding:6px;text-align:center;font-size:.86rem}
.vs-you{background:#eef2fb}.vs-real{background:#fbf1d8}
.vs-you small,.vs-real small{display:block;font-weight:900;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.vs-i{display:block;font-size:1.6rem}
.vs-fact{font-size:.8rem;color:#4c5361;margin:6px 0 0}
.vs .stamp{top:auto;bottom:auto;top:4px;right:6px;font-size:.7rem;padding:4px 6px;border-width:3px}
.doc{background:#fffaf0;border:2px solid #b89a5a;border-radius:6px;padding:12px 16px;margin-top:14px;box-shadow:0 6px 18px #5a441a22}
.doc-h{font:800 .8rem/1.2 "Courier New",monospace;letter-spacing:.06em;text-transform:uppercase;color:#6b4a07;margin:0}
.doc-text{font:1.12rem/1.5 Georgia,"Times New Roman",serif;margin:6px 0 0}
/* chain */
.link{align-items:center}
.link-i{font-size:1.8rem;flex:none}
/* memo */
.memo-head{display:flex;gap:12px;align-items:center}
.memo-icon{font-size:2.8rem}
.memo{background:#fffaf0;border:2px dashed #c9b48a;border-radius:14px;padding:4px 14px 14px;margin-top:10px}
@media (max-width:820px){.vsgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.vsgrid,.tiles{grid-template-columns:1fr}.opt{display:grid;grid-template-columns:auto 1fr;text-align:left;column-gap:10px;align-items:center}.opt .opt-icon{grid-row:span 2;font-size:2rem;margin:0}.opts.one{grid-template-columns:1fr}.table-scene{max-width:220px;margin-bottom:30px}.seat{width:64px}.seat span{width:48px;height:48px;font-size:1.7rem}.s2,.s4{left:calc(50% - 32px)}}
/* aftershocks */
.pins{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 4px}
.pin{background:#fff;border:2px dashed #cdbf9f;border-radius:12px;padding:3px 8px;text-align:center;display:grid;gap:1px;font-size:.9rem}
.pin-f{font-size:1.25rem;line-height:1.1}.pin-s{font-size:.72rem;font-weight:900;letter-spacing:.06em;color:var(--muted)}
.pin.done{border:2px solid #8cc5a0;background:#f3fbf5}.pin.done .pin-s{color:#1d6a3d}
.pin.now{border:3px solid var(--red);animation:glow 1.4s infinite}
.pic-frame{position:relative;background:#fff;border-radius:6px;line-height:0;min-height:120px}
.pic-frame img{width:100%;height:auto;max-height:520px;object-fit:contain;display:block;border-radius:6px}
.pdfframe{width:100%;height:440px;border:0;background:#fff;border-radius:6px}
.big-stamp{top:40%;left:50%;right:auto;transform:translate(-50%,-50%) rotate(-12deg);font-size:1.5rem;padding:10px 14px;background:#fffc;animation:slam2 .45s cubic-bezier(.2,1.6,.4,1);line-height:1}
@keyframes slam2{0%{transform:translate(-50%,-50%) rotate(-12deg) scale(3);opacity:0}100%{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:1}}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.stampbtn{background:#fff;border:3px solid #b3261e;border-radius:12px;padding:10px 6px;color:#7d1a14;text-align:center;box-shadow:0 4px 0 #e8c3bd;display:grid;gap:2px;justify-items:center}
.stampbtn b{letter-spacing:.08em;font-size:.92rem}.stampbtn span:last-child{font-size:.8rem;color:#4c5361}
.stampbtn .opt-icon{font-size:1.8rem;line-height:1.1}
.stampbtn:hover:not(:disabled){transform:translateY(-2px) rotate(-1deg)}
.stampbtn:disabled{opacity:.55;cursor:not-allowed}
.stamped{grid-column:1/-1;background:#f3fbf5;border:2px solid #8cc5a0;border-radius:12px;padding:12px}
.stamped .stamp{position:relative;display:inline-block;top:auto;right:auto;margin:4px 0 8px 4px}
@media (max-width:640px){.pins{grid-template-columns:repeat(2,1fr)}.stamps{grid-template-columns:1fr}.stampbtn{grid-template-columns:auto 1fr;text-align:left;justify-items:start;column-gap:10px}.stampbtn .opt-icon{grid-row:span 2}.pdfframe{height:340px}}
/* trimmed version: icons instead of words */
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.dchip{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:2px 9px 2px 7px;font-size:1.05rem;animation:pop .5s}
.dchip .delta{font-size:.9rem}
.fx{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;justify-content:center}
.fxi{display:inline-flex;align-items:center;gap:2px;background:#f6f1e5;border-radius:99px;padding:1px 8px;font-size:.95rem}
.fxi i{font-style:normal;color:#8a6a1f;font-size:.7rem;letter-spacing:1px}
.opt span.fx{font-size:inherit}
.pick{margin:12px 0 0;font-size:1.05rem}
.yearchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ychip{background:var(--navy);color:#fff;border-radius:99px;padding:4px 11px;font-size:.85rem;font-weight:700;animation:rise .4s ease-out}
.ychip b{color:#ffe08a}
.vtable{display:grid;gap:6px;margin-top:8px}
.vrow{display:grid;grid-template-columns:48px 56px 1fr 52px;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 10px;animation:rise .5s ease-out both}
.vrow.vhead{background:none;border:0;padding:0 10px;font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);animation:none}
.vr-c{font-size:1.6rem;text-align:center}
.vr-you{font-size:1.6rem;text-align:center;background:#eef2fb;border-radius:10px;padding:2px 0}
.vr-real{display:flex;align-items:center;gap:10px;background:#fbf1d8;border-radius:10px;padding:4px 10px}
.vr-real .vs-i{font-size:1.5rem}
.vr-real small{display:block;font-size:.8rem;color:#4c5361}
.vr-st{font:900 1.5rem/1 system-ui,Arial,sans-serif;text-align:center;border:3px solid;border-radius:8px;padding:4px 0;transform:rotate(-8deg);animation:slam .4s cubic-bezier(.2,1.6,.4,1) both}
.vr-st.same{color:#1f7a45;border-color:#1f7a45}.vr-st.diff{color:#b3261e;border-color:#b3261e}
.link.mini{padding:5px 10px;font-size:.92rem;animation:none}
.link.mini .link-i{font-size:1.2rem}
.doc-h.src{color:#7a6a4a;font-weight:700}
.heads .src{color:#8a8f99}
@media (max-width:640px){.vrow{grid-template-columns:26px 38px 1fr 34px;gap:6px;padding:5px 6px}.vrow.vhead{padding:0 6px}.vr-c,.vr-you{font-size:1.25rem}.vr-real{gap:6px;padding:4px 6px}.vr-real .vs-i{font-size:1.2rem}.vr-st{font-size:1.05rem;border-width:2px}.opt .fx{grid-column:2;justify-content:flex-start}}
@media print{.topbar,.go,.linkbtn{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
