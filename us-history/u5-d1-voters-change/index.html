<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="Fall 1980 newsroom game: check the facts, interview six Iowa voters, and write fair headlines about why voters chose Reagan, Carter, or Anderson.">

</head><body class="on-title">
<div class="hud" id="hud" hidden aria-label="Your newsroom">

    <div class="parts" id="parts" aria-label="Your three assignments"></div>

</div>
<main id="wrap">
  <div class="welcome" id="welcome" role="status" hidden></div>
  <section id="app" aria-live="polite"></section>
