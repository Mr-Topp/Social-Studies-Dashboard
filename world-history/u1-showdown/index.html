<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit Showdown | World History Unit 1 Review (Days 12–13)</title>
<meta name="description" content="World History Unit 1 review game for two class periods: 8 rounds, one for each part of the Unit 1 test. Bet on what you know, read real sources, build the evidence, and race your class.">
<link rel="stylesheet" href="showdown.css?v=20261114b">
<script src="../../shared/assignments.js?v=20261105fb1"></script>
<script src="../../shared/turnin.js?v=20261105fb1"></script>
<script src="../../shared/arena.js?v=20261103c"></script>
</head><body>
<header class="hud" id="hud" hidden aria-label="Your Showdown">
  <div class="hud-in">
    <span class="brand">UNIT SHOWDOWN</span>
    <span class="dots" id="dots" aria-label="Rounds"></span>
    <span class="steptxt" id="stepTxt"></span>
    <span class="betchip" id="betChip" hidden></span>
    <span class="scorebox" id="scoreBox"><small>Points</small><span id="score">0</span></span>
  </div>
</header>
<main id="wrap">
  <div class="welcome" id="welcome" role="status" hidden></div>
  <section id="app" aria-live="polite"></section>
  <aside class="race" id="race" hidden aria-label="Class race"></aside>
  <div class="foot"><span>Progress saves on this device. Your teacher sees your work after you turn it in.</span><br><button type="button" id="restartBtn">Start over</button></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="rounds.js?v=20261114b"></script>
<script src="showdown.js?v=20261114b"></script>
</body></html>
