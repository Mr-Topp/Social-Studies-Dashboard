<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Break — Swipe Lab</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#17293e;background:#eaf2f9}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid orange;outline-offset:2px}.page{max-width:1050px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;align-items:center;font-weight:900;letter-spacing:1px}.head b{font-size:24px}.head em{color:#1483b5;font-style:normal}.tiny{font-size:12px;color:#637d90}.layout{display:grid;grid-template-columns:1fr minmax(290px,385px) 1fr;gap:18px;margin-top:22px}.panel{background:white;border:1px solid #d0deea;border-radius:17px;padding:20px;box-shadow:0 8px 25px #1c42550e}.panel h1{font-size:29px;line-height:1.1}.panel p{line-height:1.5}.phone{background:white;border:9px solid #1c2b40;border-radius:40px;overflow:hidden;min-height:610px;box-shadow:0 20px 35px #153b5830;touch-action:pan-y}.notch{height:21px;width:95px;border-radius:0 0 15px 15px;background:#1c2b40;margin:auto}.phonehead{padding:13px;border-bottom:1px solid #e3eaf0;display:flex;justify-content:space-between;font-size:12px;font-weight:900}.author{padding:13px;display:flex;align-items:center;gap:10px;font-weight:800}.avatar{width:36px;height:36px;border-radius:50%;background:#d9eef9;display:grid;place-items:center}.photo{width:100%;height:260px;object-fit:cover;background:#dce9f2}.claim{padding:18px;font-weight:850;font-size:20px;line-height:1.35;min-height:122px}.reactions{display:flex;justify-content:space-between;color:#7b90a1;padding:13px;border-top:1px solid #e7edf2;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:13px}.actions button{border:0;border-radius:11px;padding:16px;font-weight:900}.left{background:#ffe2e2;color:#a92c40}.right{background:#dcf5e7;color:#14744d}.primary{background:#157baa;color:white;border:0;border-radius:10px;padding:15px;font-weight:900;width:100%}.primary:disabled{opacity:.4}.bot{display:flex;gap:10px;align-items:center;background:#f1f6fa;border-radius:11px;padding:12px;margin:10px 0}.bot small{display:block;color:#678092}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats div{background:#edf5fb;border-radius:10px;padding:12px}.stats strong{font-size:27px;display:block}.stats small{font-size:10px;font-weight:800;color:#658093}.progress{height:8px;background:#dce8f1;border-radius:8px;margin:16px 0}.progress div{height:100%;background:#1789bd}.intro{max-width:550px;margin:55px auto}.intro h1{font-size:clamp(38px,7vw,64px);line-height:1}.intro input{width:100%;padding:15px;border:2px solid #c2d8e7;border-radius:10px;margin:14px 0}.cat{width:100%;background:#f0f6fa;border:2px solid #c1d9e8;border-radius:10px;padding:12px;text-align:left;margin:6px 0;font-weight:900}.cat:hover{background:#dceffb}.result{padding:22px}.result h2{font-size:31px}.result p{line-height:1.5}.result a{color:#116f9f}.label{font-size:11px;letter-spacing:1px;font-weight:900;color:#37738d}.explain{background:#e9f5fb;padding:13px;border-radius:10px}.correct{color:#168456}.wrong{color:#b52e43}.report{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef5fa;padding:12px;border-radius:9px;font-size:12px}.foot{font-size:11px;color:#72899b;margin:22px 0;text-align:center}@media(max-width:850px){.layout{grid-template-columns:1fr}.phone{grid-row:1;max-width:385px;width:100%;margin:auto}.panel{max-width:500px;width:100%;margin:auto}}@media print{.head,.actions,.primary{display:none}.panel{box-shadow:none}}
</style></head><body><div id="app"></div><script>
"use strict";const POSTS=[{"category":"bias","claim":"A real city budget report highlights only the spending increases while ignoring cuts.","img":"https://commons.wikimedia.org/wiki/Special:FilePath/Apollo%2011%20liftoff.jpg?width=800","source":"https://commons.wikimedia.org/wiki/File:Apollo_11_liftoff.jpg","evidence":"A political page selectively reports one side of a budget.","explain":"The page selects true details to favor one interpretation. That is bias.","id":1},{"category":"misinformation","claim":"My friend said Iowa moved Election Day to Wednesday! Please tell everyone.","img":"https://commons.wikimedia.org/wiki/Special:FilePath/Earthrise%20-%20Apollo%208%20(9460163430).jpg?width=800","source":"https://commons.wikimedia.org/wiki/File:Earthrise_-_Apollo_8_(9460163430).jpg","evidence":"A student reposts an unverified rumor, thinking it is helpful.","explain":"The student appears to believe the false claim. That is misinformation.","id":2},{"category":"disinformation","claim":"OFFICIAL ALERT: Voting has been canceled. This fake county account was made to trick voters.","img":"https://commons.wikimedia.org/wiki/Special:FilePath/Apollo%2011%20liftoff.jpg?width=800","source":"https://commons.wikimedia.org/wiki/File:Apollo_11_liftoff.jpg","evidence":"An impersonator knowingly publishes a false election notice.","explain":"The fake account was created to deceive voters: disinformation.","id":3},{"category":"malinformation","claim":"A genuine private student address is leaked online to encourage harassment.","img":"https://commons.wikimedia.org/wiki/Special:FilePath/Earthrise%20-%20Apollo%208%20(9460163430).jpg?width=800","source":"https://commons.wikimedia.org/wiki/File:Earthrise_-_Apollo_8_(9460163430).jpg","evidence":"Someone shares accurate private information to target a student.","explain":"The information may be true, but sharing it to harm someone is malinformation.","id":4},{"category":"fake news","claim":"BREAKING: Scientists confirm the Moon is made of cheese, says a made-up news site.","img":"https://commons.wikimedia.org/wiki/Special:FilePath/Earthrise%20-%20Apollo%208%20(9460163430).jpg?width=800","source":"https://commons.wikimedia.org/wiki/File:Earthrise_-_Apollo_8_(9460163430).jpg","evidence":"A fabricated article imitates a legitimate news outlet.","explain":"The entire story is invented and presented as reporting: fake news.","id":5},{"category":"bias","claim":"The school newspaper praises a new phone policy but quotes only supporters.","img":"https://commons.wikimedia.org/wiki/Special:FilePath/Apollo%2011%20liftoff.jpg?width=800","source":"https://commons.wikimedia.org/wiki/File:Apollo_11_liftoff.jpg","evidence":"A real article interviews only people who agree with the policy.","explain":"One-sided selection of voices creates bias.","id":6},{"category":"misinformation","claim":"A student shares an old hurricane picture saying it shows today's Iowa weather.","img":"https://commons.wikimedia.org/wiki/Special:FilePath/Hurricane%20Katrina%20hits%20New%20Orleans.jpeg?width=800","source":"https://commons.wikimedia.org/wiki/File:Hurricane_Katrina_hits_New_Orleans.jpeg","evidence":"A student mistakenly labels a 2005 storm photo as today's Iowa weather.","explain":"An old authentic image was shared with a false caption, apparently by mistake.","id":7},{"category":"disinformation","claim":"A fake emergency account intentionally posts a fabricated tornado warning to cause panic.","img":"https://commons.wikimedia.org/wiki/Special:FilePath/Hurricane%20Katrina%20hits%20New%20Orleans.jpeg?width=800","source":"https://commons.wikimedia.org/wiki/File:Hurricane_Katrina_hits_New_Orleans.jpeg","evidence":"The account owner admits inventing the warning for attention.","explain":"The false warning was knowingly created to deceive.","id":8},{"category":"malinformation","claim":"A real, years-old embarrassing quote is posted to humiliate a classmate today.","img":"https://commons.wikimedia.org/wiki/Special:FilePath/Earthrise%20-%20Apollo%208%20(9460163430).jpg?width=800","source":"https://commons.wikimedia.org/wiki/File:Earthrise_-_Apollo_8_(9460163430).jpg","evidence":"The quote is authentic but is shared solely to encourage bullying.","explain":"True information weaponized to hurt someone is malinformation.","id":9},{"category":"fake news","claim":"LOCAL NEWS: Cedar Rapids installs a giant roller coaster on every highway.","img":"https://commons.wikimedia.org/wiki/Special:FilePath/Apollo%2011%20liftoff.jpg?width=800","source":"https://commons.wikimedia.org/wiki/File:Apollo_11_liftoff.jpg","evidence":"A fake-news page invents a city project and poses as a newsroom.","explain":"This is a completely fabricated story disguised as news.","id":10},{"category":"bias","claim":"A post says a mayor 'wasted money' without mentioning the project's benefits.","img":"https://commons.wikimedia.org/wiki/Special:FilePath/Apollo%2011%20liftoff.jpg?width=800","source":"https://commons.wikimedia.org/wiki/File:Apollo_11_liftoff.jpg","evidence":"The spending figure is real, but the post leaves out the reason for it.","explain":"Selective framing can influence opinions even when facts are real.","id":11},{"category":"misinformation","claim":"Someone forwards a screenshot with the wrong school start time, believing it is current.","img":"https://commons.wikimedia.org/wiki/Special:FilePath/Earthrise%20-%20Apollo%208%20(9460163430).jpg?width=800","source":"https://commons.wikimedia.org/wiki/File:Earthrise_-_Apollo_8_(9460163430).jpg","evidence":"The screenshot is from last year; the sender did not notice.","explain":"A mistaken share of outdated information is misinformation.","id":12},{"category":"disinformation","claim":"A student makes a fake principal announcement to trick classmates into skipping class.","img":"https://commons.wikimedia.org/wiki/Special:FilePath/Apollo%2011%20liftoff.jpg?width=800","source":"https://commons.wikimedia.org/wiki/File:Apollo_11_liftoff.jpg","evidence":"The student admits forging the message as a prank.","explain":"The deliberate deception makes this disinformation.","id":13},{"category":"malinformation","claim":"A genuine medical detail from a private message is published to shame someone.","img":"https://commons.wikimedia.org/wiki/Special:FilePath/Earthrise%20-%20Apollo%208%20(9460163430).jpg?width=800","source":"https://commons.wikimedia.org/wiki/File:Earthrise_-_Apollo_8_(9460163430).jpg","evidence":"The detail is real but was private and posted to cause harm.","explain":"Truthful private information used maliciously is malinformation.","id":14},{"category":"fake news","claim":"A made-up science article claims NASA found a shopping mall on the Moon.","img":"https://commons.wikimedia.org/wiki/Special:FilePath/Earthrise%20-%20Apollo%208%20(9460163430).jpg?width=800","source":"https://commons.wikimedia.org/wiki/File:Earthrise_-_Apollo_8_(9460163430).jpg","evidence":"The site invents the discovery and pretends it is a news report.","explain":"A fabricated report dressed up as journalism is fake news.","id":15},{"category":"bias","claim":"Two real candidates debate; a clip shows only one candidate's strongest moments.","img":"https://commons.wikimedia.org/wiki/Special:FilePath/Apollo%2011%20liftoff.jpg?width=800","source":"https://commons.wikimedia.org/wiki/File:Apollo_11_liftoff.jpg","evidence":"The clip is authentic but selectively edited to favor one candidate.","explain":"Selective presentation is a form of media bias.","id":16},{"category":"misinformation","claim":"A family group chat says a real 2005 flood picture was taken yesterday.","img":"https://commons.wikimedia.org/wiki/Special:FilePath/Hurricane%20Katrina%20hits%20New%20Orleans.jpeg?width=800","source":"https://commons.wikimedia.org/wiki/File:Hurricane_Katrina_hits_New_Orleans.jpeg","evidence":"A relative shares the wrong date after misunderstanding another post.","explain":"An accidental false caption is misinformation.","id":17},{"category":"disinformation","claim":"A fake news account knowingly edits an election graphic to show false results.","img":"https://commons.wikimedia.org/wiki/Special:FilePath/Apollo%2011%20liftoff.jpg?width=800","source":"https://commons.wikimedia.org/wiki/File:Apollo_11_liftoff.jpg","evidence":"The creator admits altering the results to fool viewers.","explain":"Deliberately falsifying election information is disinformation.","id":18},{"category":"malinformation","claim":"An authentic private message is leaked to intimidate a local volunteer.","img":"https://commons.wikimedia.org/wiki/Special:FilePath/Earthrise%20-%20Apollo%208%20(9460163430).jpg?width=800","source":"https://commons.wikimedia.org/wiki/File:Earthrise_-_Apollo_8_(9460163430).jpg","evidence":"The private message is real but released to threaten the volunteer.","explain":"Using true private information as a weapon is malinformation.","id":19},{"category":"fake news","claim":"A fabricated article says the president signed a law requiring every school to own a spaceship.","img":"https://commons.wikimedia.org/wiki/Special:FilePath/Apollo%2011%20liftoff.jpg?width=800","source":"https://commons.wikimedia.org/wiki/File:Apollo_11_liftoff.jpg","evidence":"A pretend news outlet publishes an invented law.","explain":"An entirely invented news report is fake news.","id":20}];
const defs={bias:"A slanted or one-sided presentation of information.",misinformation:"False information shared without clear intent to deceive.",disinformation:"False information deliberately created or spread to deceive.",malinformation:"True information shared to harm, often by exposing private details.", "fake news":"A fabricated story presented as legitimate news."};
let state={name:"",i:0,score:0,correct:0,bot:[0,0,0],results:[],phase:0,started:0};const root=document.getElementById("app");const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const head=()=>'<div class="head"><b>SIGNAL<em>//</em>BREAK</b><span class="tiny">20-POST SWIPE LAB · GOV.12</span></div>';function page(t){root.innerHTML='<main class="page">'+head()+t+'<p class="foot">Classroom simulations using archival photographs. Photos do not depict the fictional claims unless stated.</p></main>';}
function start(){page('<section class="panel intro"><div class="label">20 POSTS · 5 MEDIA CONCEPTS</div><h1>SCROLL. SWIPE. SPOT THE TRICK.</h1><p>You are scrolling a fake social-media feed. Swipe <b>right</b> when a post is trustworthy, or <b>left</b> when it has a problem. Then name the problem: bias, misinformation, disinformation, malinformation, or fake news.</p><p>Three student bots are trying to beat you.</p><input id="name" maxlength="35" placeholder="First name or nickname"><button id="go" class="primary">START SCROLLING →</button><p id="error" class="wrong"></p></section>');document.getElementById("go").onclick=()=>{let n=document.getElementById("name").value.trim();if(n.length<2){document.getElementById("error").textContent="Enter your name.";return;}state.name=n;state.started=Date.now();round();};}
function stats(){return '<div class="stats"><div><small>YOUR POINTS</small><strong>'+state.score+'</strong></div><div><small>POST</small><strong>'+(state.i+1)+'/20</strong></div></div><div class="progress"><div style="width:'+state.i*5+'%"></div></div>';}
function bots(){return '<aside class="panel"><div class="label">STUDENT BOT LEADERBOARD</div>'+["😲 MAYA","🧐 JAX","🤔 ZOE"].map((n,i)=>'<div class="bot"><span style="font-size:25px">'+n.split(" ")[0]+'</span><div><b>'+n.split(" ")[1]+'</b><small>'+state.bot[i]+' points</small></div></div>').join('')+'<p class="tiny">Maya guesses fast. Jax checks details. Zoe sometimes gets fooled.</p></aside>';}
function phone(p,content){return '<section class="phone"><div class="notch"></div><div class="phonehead"><span>9:41</span><span>◉ THE FEED</span><span>▰</span></div>'+content+'</section>';}
function feed(p){return '<div id="swipe"><div class="author"><span class="avatar">S</span><span>@viral_post_'+p.id+'</span></div><img class="photo" src="'+p.img+'" alt="Real archival photograph used in a simulated social media post"><div class="claim">'+esc(p.claim)+'</div><div class="reactions"><span>♡ '+(2+p.id)+'.1K</span><span>↗ SHARE</span><span>▢ COMMENT</span></div></div><div class="actions"><button class="left" id="left">← NOT TRUSTWORTHY</button><button class="right" id="right">TRUSTWORTHY →</button></div><p class="tiny" style="text-align:center">Swipe left/right or tap a button</p>';}
function round(){let p=POSTS[state.i];page('<div class="layout"><aside class="panel"><div class="label">ROUND '+p.id+' / 20</div><h1>WOULD YOU TRUST THIS POST?</h1><p>Look at the photo and the caption. A real photo does not make a false caption true.</p>'+stats()+'<p class="tiny">After your swipe, classify the media problem.</p></aside>'+phone(p,feed(p))+bots()+'</div>');document.getElementById("left").onclick=()=>judge(false);document.getElementById("right").onclick=()=>judge(true);let node=document.getElementById("swipe"),x=0,y=0;node.addEventListener("pointerdown",e=>{x=e.clientX;y=e.clientY});node.addEventListener("pointerup",e=>{let dx=e.clientX-x,dy=e.clientY-y;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.2)judge(dx>0);});}
function judge(trust){let p=POSTS[state.i];state.trust=trust;classify();}
function classify(msg=""){let p=POSTS[state.i];let labels=Object.keys(defs);page('<div class="layout"><aside class="panel"><div class="label">STEP 2 · IDENTIFY THE PROBLEM</div><h1>WHAT KIND OF MEDIA IS THIS?</h1><p>'+esc(p.evidence)+'</p><p class="tiny">Use the evidence about what was shared and why.</p>'+stats()+'</aside>'+phone(p,'<div class="result"><div class="label">PICK THE BEST LABEL</div><h2>NAME THE TRICK</h2>'+labels.map(k=>'<button class="cat" data-cat="'+k+'">'+k.toUpperCase()+'<small style="display:block;font-weight:400;margin-top:5px">'+defs[k]+'</small></button>').join('')+(msg?'<p class="wrong">'+esc(msg)+'</p>':'')+'</div>')+bots()+'</div>');document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{let good=b.dataset.cat===p.category;if(good){state.score+=100;state.correct++;}state.bot[0]+=state.i%4===0?100:0;state.bot[1]+=state.i%5===0?0:100;state.bot[2]+=state.i%3===0?0:100;state.results.push({claim:p.claim,category:p.category,correct:good,swipe:state.trust});reveal(good);});}
function reveal(good){let p=POSTS[state.i];page('<div class="layout"><aside class="panel"><div class="label">FACT CHECK</div><h1>'+ (good?"NICE CATCH!":"THE BOTS GOT A POINT")+'</h1>'+stats()+'<p><b>Correct label:</b> '+p.category.toUpperCase()+'</p></aside>'+phone(p,'<div class="result"><div class="label '+(good?"correct":"wrong")+'">'+(good?"✓ CORRECT":"✕ NOT QUITE")+'</div><h2>'+p.category.toUpperCase()+'</h2><p>'+esc(p.explain)+'</p><div class="explain"><b>Evidence:</b><p>'+esc(p.evidence)+'</p></div><p class="tiny">Archival image source: <a href="'+p.source+'" target="_blank" rel="noopener">View the original image</a></p><button class="primary" id="next">'+(state.i===19?"SEE FINAL RESULTS →":"NEXT POST →")+'</button></div>')+bots()+'</div>');document.getElementById("next").onclick=()=>{state.i++;state.i===20?finish():round();};}
function finish(){let report=["SIGNAL BREAK · 20-POST SWIPE LAB","Student: "+state.name,"Score: "+state.score+" / 2000","Correct categories: "+state.correct+" / 20","Minutes: "+Math.max(1,Math.round((Date.now()-state.started)/60000)),"","RESULTS",...state.results.map((r,i)=>(i+1)+". "+r.category+" | "+(r.correct?"Correct":"Incorrect")+" | "+r.claim)].join("\n");page('<section class="panel intro"><div class="label">20 / 20 COMPLETE</div><h1>YOU BROKE THE SIGNAL.</h1><p>'+esc(state.name)+', you correctly identified '+state.correct+' of 20 media examples.</p><pre class="report">'+esc(report)+'</pre><button class="primary" id="download">DOWNLOAD REPORT</button><button class="primary" style="margin-top:10px" id="again">PLAY AGAIN</button><p class="tiny">Submit your report through Schoology. This version does not send data to a teacher dashboard.</p></section>');document.getElementById("download").onclick=()=>{let b=new Blob([report],{type:"text/plain"}),url=URL.createObjectURL(b),a=document.createElement("a");a.href=url;a.download="Signal_Break_"+state.name.replace(/[^a-z0-9]/gi,"_")+".txt";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById("again").onclick=()=>{state={name:"",i:0,score:0,correct:0,bot:[0,0,0],results:[],phase:0,started:0};start();};}
start();
</script></body></html>
