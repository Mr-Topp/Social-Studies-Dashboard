{"label":"01 • ARRIVAL","title":"WHO WAS HERE FIRST","clue":"A map claims nobody lived in North America before European ships arrived. Find the lie.","learn":"Native Americans (also called American Indians) lived all over North America long before Europeans arrived. They had their own nations, governments, and ways of life. Later, colonists came from Europe for many reasons: freedom, religious freedom, and economic opportunity (a chance at land and jobs).","type":"sort","prompt":"Is each card TRUE or FALSE?","yes":"✓ TRUE","no":"✕ FALSE","entries":[["Native nations had their own governments before Europeans arrived","TRUE"],["European settlers found an empty continent","FALSE"],["Some settlers came for land and jobs","TRUE"],["All settlers came for exactly the same reason","FALSE"],["Native nations had different cultures and traditions","TRUE"]],"q":74,"test":"Who lived in America before the Europeans arrived?","choices":["British governors","French soldiers","Native Americans","Pilgrims"],"correctChoice":2},
{"label":"02 • HIDDEN CARGO","title":"THE FORCED JOURNEY","clue":"An old ship record lists human beings as cargo, as if they were property. What does it show?","learn":"Africans were taken from their homes, shipped across the ocean against their will, and sold as slaves in the colonies. Slavery was a big part of the colonial economy, and it took away people’s freedom.","type":"evidence","prompt":"Which label best describes the record?","options":["People moving for new jobs","Africans forced into slavery","A fair trade deal between nations"],"correct":1,"q":75,"test":"What group of people was taken and sold as slaves?","choices":["French soldiers","Africans","European nobles","British settlers"],"correctChoice":1},
{"label":"03 • TAX PROTEST","title":"TAXES WITHOUT A SAY","clue":"A colonist found this message: “You must pay taxes. You cannot vote for the people making the rules.”","learn":"Britain’s Parliament taxed the colonists, but the colonists had nobody they voted for in Parliament. That is “taxation without representation,” a big reason they declared independence. Other reasons on the test: high taxes, the Stamp Act, the Boston Tea Party, and British soldiers staying in colonists’ houses.","type":"evidence","prompt":"Which complaint best explains the colonists’ anger?","options":["Paying taxes with no vote","The colonies wrote their own tax laws","Britain gave the colonists free land"],"correct":0,"q":77,"test":"Name one reason why the Americans declared independence from Britain.","choices":["The Civil War","The Louisiana Purchase","The signing of the Constitution","Taxation without representation"],"correctChoice":3},
{"label":"04 • DOCUMENT LAB","title":"A DECLARATION IS MISSING","clue":"A torn page says: “We declare these colonies free and independent states.” Figure out what it is and who wrote it.","learn":"This is the Declaration of Independence. Thomas Jefferson wrote it. Congress adopted it (officially approved it) on July 4, 1776. It told Britain the colonies were done with British rule. It did not set up our government. The Constitution did that in 1787.","type":"assemble","prompt":"Put these events in order, first to last:","entries":["Colonists protest British taxes","Jefferson writes the Declaration","Congress adopts it on July 4, 1776"],"q":78,"test":"Who wrote the Declaration of Independence?","choices":["Thomas Jefferson","Alexander Hamilton","George Washington","John Jay"],"correctChoice":0},
{"label":"05 • BATTLE MAP","title":"THE REVOLUTION BEGINS","clue":"A message from Washington’s army lists battles and events. Which facts are real?","learn":"The American Revolution (also called the Revolutionary War) was fought from 1775 to 1783 to win independence from Britain. George Washington led the American army. Key events: Bunker Hill, the Declaration, Trenton, Saratoga (it got France to join), Valley Forge, and Yorktown, where the British army surrendered. Gettysburg and Antietam came much later, in the Civil War.","type":"sort","prompt":"Is each card TRUE or FALSE?","yes":"✓ TRUE","no":"✕ FALSE","entries":[["Saratoga helped get France to join the war","TRUE"],["Gettysburg was a Revolutionary War battle","FALSE"],["The British army surrendered at Yorktown","TRUE"],["The Declaration ended the war right away","FALSE"],["Washington led the American army","TRUE"]],"q":80,"test":"The American Revolution had many important events. Name one.","choices":["Battle of Antietam","Battle of Midway","Battle of Saratoga","Battle of Gettysburg"],"correctChoice":2},
{"label":"06 • COLONY VAULT","title":"THIRTEEN KEYS","clue":"A locked map opens with five of the original 13 states. Find the real ones.","learn":"The 13 original states started as 13 British colonies, all on the Atlantic coast. An easy five to remember: Virginia, Massachusetts, New York, Pennsylvania, and Georgia. States out west, like California and Texas, came much later. Iowa became a state in 1846.","type":"sort","prompt":"Was each state one of the original 13?","yes":"✓ ONE OF THE 13","no":"✕ NOT ONE OF THE 13","entries":[["Virginia","TRUE"],["California","FALSE"],["Georgia","TRUE"],["Pennsylvania","TRUE"],["Texas","FALSE"],["Massachusetts","TRUE"]],"q":81,"test":"There were 13 original states. Name five.","choices":["Virginia, Massachusetts, New York, Pennsylvania, Vermont","California, Texas, Florida, Iowa, Ohio","Pennsylvania, Georgia, Maine, Florida, New York","Virginia, Massachusetts, New York, Pennsylvania, Georgia"],"correctChoice":3},
{"label":"07 • FOUNDERS FILES","title":"THE FOUNDERS FILE","clue":"Four founders left notes behind. Match each one to what he is famous for.","learn":"George Washington led the army in the war and became the first president. Thomas Jefferson wrote the Declaration of Independence. James Madison is called the Father of the Constitution. Alexander Hamilton was the first Secretary of the Treasury (in charge of the country’s money). Benjamin Franklin was an inventor and a diplomat who got France to help.","type":"match","prompt":"Match each founder to what he is famous for.","entries":[["George Washington","First president"],["Thomas Jefferson","Wrote the Declaration"],["James Madison","Father of the Constitution"],["Alexander Hamilton","First Secretary of the Treasury"]],"q":88,"test":"James Madison is famous for many things. Name one.","choices":["General of the British army","Father of the Constitution","First Secretary of the Treasury","Inventor and diplomat"],"correctChoice":1},
{"label":"08 • FINAL ARCHIVE","title":"THE NEW GOVERNMENT","clue":"After independence, the country still needed a strong plan for government. Put the documents in order.","learn":"The first plan, the Articles of Confederation, was too weak. In 1787, leaders wrote the Constitution. The Federalist Papers were newspaper essays that explained the Constitution and argued for passing it. Alexander Hamilton, James Madison, and John Jay wrote them under one fake name, Publius.","type":"assemble","prompt":"Put the documents in order, earliest to latest.","entries":["Declaration of Independence adopted (1776)","Articles of Confederation approved (1781)","Constitution written (1787)","Bill of Rights added (1791)"],"q":83,"test":"The Federalist Papers supported passing the U.S. Constitution. Name one of the writers.","choices":["Patrick Henry","Thomas Jefferson","Alexander Hamilton","Benjamin Franklin"],"correctChoice":2}];

const KEY='f4-1776-files-v2';
function fresh(){return{phase:'intro',room:0,sub:'learn',done:[],sortIndex:0,assem:[],matchIndex:0,wrong:0,taskMiss:0,ft:{},extraIndex:0,feedback:'',perm:null,name:'',turnedIn:false,finishedAt:''}}
let state=fresh();try{const sv=JSON.parse(localStorage.getItem(KEY));if(sv&&sv.phase)state=Object.assign(fresh(),sv)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const $=s=>document.querySelector(s);const esc=t=>String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');const bt=(label,act,arg='',klass='btn')=>'<button class="'+klass+'" data-act="'+act+'" data-arg="'+esc(arg)+'">'+label+'</button>';
function order(n){if(!state.perm||state.perm.length!==n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}state.perm=a}return state.perm}
function fb(){return state.feedback?'<div class="note fbk" aria-live="polite">'+esc(state.feedback)+'</div>':'<div aria-live="polite"></div>'}
function firstTry(q,ok){if(!(q in state.ft))state.ft[q]=ok}
function score(){const qs=Object.keys(state.ft),right=qs.filter(q=>state.ft[q]).length;const by=g=>{const s=qs.filter(q=>g(+q)),r=s.filter(q=>state.ft[q]).length;return r+' of '+s.length};return{right,total:qs.length,pct:qs.length?Math.round(right/qs.length*100):0,gov3:by(q=>!GOV15.includes(q)),gov15:by(q=>GOV15.includes(q)),vault:extras.filter(e=>state.ft[e[0]]).length,review:qs.filter(q=>!state.ft[q]).map(Number).sort((a,b)=>a-b)}}
function layout(body){$('#screen').dataset.phase=state.phase;$('#screen').innerHTML='<div class="top"><div class="brand">TOP SECRET · AMERICAN HISTORY</div><div class="pill">EVIDENCE '+state.done.length+' / 8</div></div><div class="progress">'+rooms.map((r,i)=>'<span class="'+(state.done.includes(i)?'full':'')+'"></span>').join('')+'</div>'+body;$('#footprogress').textContent='FILES '+state.done.length+'/8';save()}
function render(){
if(state.phase==='intro'){layout('<div class="caption">CLASSIFIED FILE · OPEN 1776</div><h1 class="heading">THE 1776 FILES</h1><div class="page"><div class="big">History has been erased.</div><p class="lead">Travel through eight evidence rooms. Rebuild the story of how the United States began.</p><div class="note">HOW TO PLAY: Read a short case note, do its evidence task, then answer one real test question. Close all 8 files to open the Final Vault. <b>Your teacher sees your FIRST try</b>, so read before you click.</div></div>'+bt('OPEN INVESTIGATION →','board'));return}
if(state.phase==='board'){const fin=state.done.length===rooms.length;layout('<h1 class="heading">THE CASE BOARD</h1><p class="lead">Pick an unsolved file. Each one holds a different piece of American history.</p><div class="map">'+rooms.map((r,i)=>'<button class="pin '+(state.done.includes(i)?'solved':'')+'" data-act="enter" data-arg="'+i+'"><strong>'+(state.done.includes(i)?'✓':String(i+1).padStart(2,'0'))+'</strong>'+esc(r.title)+'</button>').join('')+'</div>'+(fin?bt(state.extraIndex>=extras.length?'SEE MY RESULTS →':state.extraIndex>0?'BACK TO THE FINAL VAULT →':'OPEN FINAL VAULT →','final'):''));return}
if(state.phase==='final'){const e=extras[state.extraIndex];layout('<div class="caption">ALL 8 FILES CLOSED · FINAL FACT '+(state.extraIndex+1)+' OF '+extras.length+'</div><h1 class="heading">THE FINAL VAULT</h1><section class="page"><div class="caption">CIVICS TEST FILE · QUESTION '+e[0]+'</div><h2>'+esc(e[1])+'</h2>'+fb()+'<div class="flex">'+order(e[3].length).map(j=>bt(esc(e[3][j]),'finalAnswer',String(j),'option')).join('')+'</div></section>');return}
if(state.phase==='end'){const s=score(),d=new Date(state.finishedAt||Date.now());layout('<h1 class="heading">ARCHIVE RESTORED</h1><div class="page"><div class="stamp">MISSION DONE</div><p class="lead"><b>You finished! All 8 files are closed and the archive is back.</b> The story of how the United States began is safe again.</p><p class="lead">'+(s.review.length?'<b>Questions to review:</b> '+s.review.join(', ')+'. Find them on your study sheet.':'Keep your study sheet handy for the real civics test.')+'</p><p class="small">USCIS civics questions 73–89 · Iowa standards SS.9-12.Gov.3 and Gov.15 · '+d.toLocaleDateString()+'</p><label for="nm" class="small"><b>Your name (first name + last initial, like Jordan M.)</b></label><div class="actions"><input id="nm" maxlength="30" autocomplete="off" placeholder="Example: Jordan M." value="'+esc(state.name)+'">'+bt(state.turnedIn?'TURNED IN ✓':'TURN IN TO MY TEACHER','turnin','','btn'+(state.turnedIn?' selected':''))+'</div><div id="tistatus" class="tistatus">'+(state.turnedIn?'Your results were sent to your teacher.':'')+'</div>'+bt('RESTART INVESTIGATION','restart','','btn secondary')+'</div>');if(state.turnedIn)$('[data-act=turnin]').disabled=true;return}
const r=rooms[state.room];let inner='<div class="caption">'+esc(r.label)+' · CASE '+(state.room+1)+' OF 8</div><h1 class="heading">'+esc(r.title)+'</h1><p class="lead">'+esc(r.clue)+'</p>';
const reread='<details class="reread"><summary>Reread the evidence note</summary><p>'+esc(r.learn)+'</p></details>';
if(state.sub==='learn'){inner+='<section class="page learn"><div class="caption">READ YOUR EVIDENCE FIRST</div><p>'+esc(r.learn)+'</p></section>'+bt('INVESTIGATE →','task')}
else if(state.sub==='task'){inner+='<section class="page"><div class="caption">EVIDENCE TASK</div><h2>'+esc(r.prompt)+'</h2>';
 if(r.type==='sort'){const e=r.entries[state.sortIndex];inner+='<div class="count">CARD '+(state.sortIndex+1)+' / '+r.entries.length+'</div><p class="big">'+esc(e[0])+'</p>'+fb()+'<div class="actions">'+bt(r.yes,'sort','TRUE')+bt(r.no,'sort','FALSE')+'</div>'}
 else if(r.type==='evidence'){inner+=fb()+'<div class="flex">'+order(r.options.length).map(j=>bt(esc(r.options[j]),'option',String(j),'option')).join('')+'</div>'}
 else if(r.type==='assemble'){inner+='<div class="caption">YOUR TIMELINE</div><div class="slots">'+state.assem.map(x=>'<span class="slot">'+esc(x)+'</span>').join('')+'</div>'+fb()+'<div class="flex">'+r.entries.filter(x=>!state.assem.includes(x)).sort().map(x=>bt(esc(x),'assembly',x,'option')).join('')+'</div>'}
 else if(r.type==='match'){const e=r.entries[state.matchIndex];inner+='<div class="count">FOUNDER '+(state.matchIndex+1)+' / '+r.entries.length+'</div><p class="big">'+esc(e[0])+'</p>'+fb()+'<div class="flex">'+order(r.entries.length).map(j=>bt(esc(r.entries[j][1]),'match',String(j),'option')).join('')+'</div>'}
 inner+=reread+'</section>'}
else if(state.sub==='test'){inner+='<section class="page"><div class="caption">CIVICS TEST FILE · QUESTION '+r.q+'</div><h2>'+esc(r.test)+'</h2>'+fb()+'<div class="flex">'+order(r.choices.length).map(j=>bt(esc(r.choices[j]),'testAnswer',String(j),'option')).join('')+'</div>'+reread+'</section>'}
layout(inner)}
function miss(msg){state.taskMiss++;state.wrong++;state.feedback=msg}
function react(act,arg){const r=rooms[state.room];
if(act==='board'){state.phase='board'}
if(act==='enter'){let j=Number(arg);if(state.done.includes(j))return;state.phase='room';state.room=j;state.sub='learn';state.sortIndex=0;state.assem=[];state.matchIndex=0;state.feedback='';state.perm=null}
if(act==='task'){state.sub='task';state.feedback='';state.perm=null}
if(act==='sort'){if(arg===r.entries[state.sortIndex][1]){state.feedback='';state.sortIndex++;if(state.sortIndex===r.entries.length){state.sub='test';state.perm=null}}else miss('Not that one. Check the evidence note below and try again.')}
if(act==='option'){if(Number(arg)===r.correct){state.sub='test';state.feedback='';state.perm=null}else miss('Not quite. Check the evidence note below and try again.')}
if(act==='assembly'){if(arg===r.entries[state.assem.length]){state.feedback='';state.assem.push(arg);if(state.assem.length===r.entries.length){state.sub='test';state.perm=null}}else miss('That’s not the next event. Think about what had to happen first.')}
if(act==='match'){if(Number(arg)===state.matchIndex){state.feedback='';state.matchIndex++;state.perm=null;if(state.matchIndex===r.entries.length)state.sub='test'}else miss('That’s another founder’s job. Check the evidence note below.')}
if(act==='testAnswer'){if(state.phase==='room'&&state.sub==='test'){const ok=Number(arg)===r.correctChoice;firstTry(r.q,ok);state.perm=null;if(ok){if(!state.done.includes(state.room))state.done.push(state.room);state.phase='board';state.feedback=''}else{state.wrong++;state.feedback='Not that one. This question no longer counts for your first-try score, but you still need it to close the file. The choices got shuffled.'}}}
if(act==='final'){if(state.done.length!==rooms.length)return;state.phase=state.extraIndex>=extras.length?'end':'final';state.feedback='';state.perm=null}
if(act==='finalAnswer'){if(state.phase==='final'){const e=extras[state.extraIndex],ok=Number(arg)===e[4];firstTry(e[0],ok);state.perm=null;if(ok){state.extraIndex++;state.feedback='';if(state.extraIndex>=extras.length){state.phase='end';state.finishedAt=new Date().toISOString()}}else{state.wrong++;state.feedback='Not that one. Hint: '+e[5]+' (Choices shuffled.)'}}}
if(act==='restart'){const b=document.querySelector('[data-act=restart]');if(b&&!b.dataset.armed){b.dataset.armed='1';b.textContent='TAP AGAIN TO ERASE YOUR GAME';return}state=fresh()}
if(act==='turnin'){turnIn();return}
render();if(['enter','task','board','final'].includes(act))window.scrollTo(0,0)}
async function turnIn(){const tb=$('[data-act=turnin]'),ts=$('#tistatus'),nm=$('#nm');let v=nm.value.trim();if(window.classShortName)v=window.classShortName(v);nm.value=v;
 if(!/^\S+ [A-Z]\.$/.test(v)){ts.textContent='Type your first name and last initial, like Jordan M.';ts.style.color='#8f3e2e';nm.focus();return}
