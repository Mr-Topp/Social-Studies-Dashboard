 citizen(){const pairs=[['BORN IN THE U.S.','Citizen at birth (14th Amendment)'],['NATURALIZE','Apply, live here for years, pass the civics test'],['DERIVE CITIZENSHIP','Become a citizen through a parent who is one'],['OATH OF ALLEGIANCE','Promise to obey U.S. laws and be loyal to the U.S.'],['JURY DUTY','Only citizens get called to serve'],['TAXES','Pay what the law requires']];let cards=[];pairs.forEach((p,i)=>{cards.push({id:i,t:p[0]},{id:i,t:p[1]})});cards=shuf(cards);let selected=[],solved=new Set();
